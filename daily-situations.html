<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#10131a">
<title>托福场景词汇 · 日常与校园</title>
<style>
:root{--bg:#10131a;--panel:#181d27;--panel2:#202735;--text:#eef2f7;--muted:#9aa6b5;--line:#303949;--blue:#79a9ff;--mint:#65d6ad;--orange:#ffb86b;--pink:#e9a4ff}
@media(prefers-color-scheme:light){:root{--bg:#f5f7fb;--panel:#fff;--panel2:#eef2f8;--text:#172033;--muted:#657084;--line:#dce2ed;--blue:#2868d7;--mint:#168c68;--orange:#b96713;--pink:#8c3da8}}
*{box-sizing:border-box}body{margin:0;background:radial-gradient(circle at 85% 0,rgba(87,133,255,.16),transparent 35%),var(--bg);color:var(--text);font:15px/1.6 -apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Microsoft YaHei",sans-serif}.shell{max-width:1080px;margin:auto;padding:30px 20px 56px}.back{color:var(--blue);text-decoration:none;font-size:13px}.hero{display:flex;justify-content:space-between;gap:24px;align-items:end;margin:22px 0 25px}.eyebrow{text-transform:uppercase;letter-spacing:.12em;color:var(--mint);font-size:12px;font-weight:700}.hero h1{font-size:clamp(28px,5vw,46px);line-height:1.15;margin:7px 0 10px;letter-spacing:-.03em}.hero p{margin:0;color:var(--muted);max-width:680px}.progress{min-width:150px;background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:14px}.progress strong{display:block;font-size:25px}.progress small{color:var(--muted)}.bar{height:5px;background:var(--panel2);border-radius:9px;margin-top:9px;overflow:hidden}.bar i{display:block;height:100%;width:0;background:linear-gradient(90deg,var(--blue),var(--mint));transition:width .2s}.controls{display:flex;gap:10px;flex-wrap:wrap;margin-bottom:17px}.search,.select{background:var(--panel);border:1px solid var(--line);color:var(--text);border-radius:11px;padding:11px 13px;font:inherit;outline:none}.search{flex:1;min-width:220px}.select{min-width:170px}.search:focus,.select:focus{border-color:var(--blue)}.stats{color:var(--muted);font-size:13px;margin-bottom:12px}.groups{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:18px}.group{background:var(--panel);border:1px solid var(--line);border-radius:18px;padding:18px}.group h2{margin:0 0 4px;font-size:19px}.group .intro{color:var(--muted);font-size:13px;margin-bottom:13px}.group[data-tone="blue"] h2{color:var(--blue)}.group[data-tone="mint"] h2{color:var(--mint)}.group[data-tone="orange"] h2{color:var(--orange)}.group[data-tone="pink"] h2{color:var(--pink)}.card{border-top:1px solid var(--line);padding:14px 0}.card:first-of-type{border-top:0;padding-top:4px}.term{display:flex;align-items:center;gap:8px;font-weight:750;font-size:16px}.pronounce{border:0;background:var(--panel2);color:var(--blue);border-radius:8px;cursor:pointer;padding:2px 8px;font-size:14px}.pronounce:hover{filter:brightness(1.15)}.meaning{margin-top:3px}.example{color:var(--muted);font-size:13px;margin-top:5px;padding-left:12px;border-left:2px solid var(--line)}.example b{color:var(--text)}.empty{display:none;text-align:center;color:var(--muted);padding:45px}.tip{margin-top:22px;background:var(--panel2);border-radius:14px;padding:13px 16px;color:var(--muted);font-size:13px}.tip strong{color:var(--text)}@media(max-width:720px){.hero{display:block}.progress{margin-top:17px;max-width:220px}.groups{grid-template-columns:1fr}.shell{padding-top:20px}}
</style>
</head>
<body><div class="shell">
<a class="back" href="index.html">↩ 返回 TOEFL 单词本</a>
<section class="hero"><div><div class="eyebrow">TOEFL speaking & listening</div><h1>场景词汇小册</h1><p>把高频词汇放进真实对话：购物、校园、租房、预约和活动安排。先记搭配，再用例句开口。</p></div><div class="progress"><strong><span id="learned">0</span> / <span id="total">0</span></strong><small>已标记掌握</small><div class="bar"><i id="bar"></i></div></div></section>
<div class="controls"><input class="search" id="search" placeholder="搜索英文、中文或例句…" autocomplete="off"><select class="select" id="filter"><option value="all">全部场景</option></select></div><div class="stats" id="stats"></div><div class="groups" id="groups"></div><div class="empty" id="empty">没有匹配的词汇，换个关键词试试。</div>
<div class="tip"><strong>背诵方法：</strong>每天选一个场景，先朗读英文搭配，再遮住中文复述例句。点击 ◉ 可听浏览器美式发音；点击词条可标记为“已掌握”。</div>
</div>
<script>
const DATA=[
['日常社交','购物 · 餐饮 · 交通 · 旅行 · 健身 · 维修 · 预约 · 活动安排','blue',[
['compare prices','比较价格','I like to compare prices before I make a purchase.'],['be out of stock','缺货','Sorry, this item is out of stock, but we can order it for you.'],['ask for a refund','要求退款','I would like to ask for a refund because the product is defective.'],['place an order','下单；订购','Can I place an order for pickup through the app?'],['dietary restriction','饮食禁忌；特殊饮食要求','Please let the waiter know about any dietary restrictions.'],['split the bill','分摊账单','Let’s split the bill evenly.'],['make a reservation','预订（座位、房间等）','I’d like to make a reservation for two at seven.'],['catch a connecting flight','赶上转机航班','We should leave early to catch our connecting flight.'],['traffic is backed up','交通拥堵','Traffic is backed up because of road construction.'],['get a tune-up','做车辆保养','My car needs a tune-up before the road trip.'],['sign up for a class','报名参加课程','I signed up for a beginner yoga class at the gym.'],['fit someone in','临时安排某人的预约','The dentist can fit you in tomorrow afternoon.'],['work around your schedule','配合你的时间安排','We can work around your schedule and meet on Friday.'],['run an errand','办事；跑腿','I need to run an errand before dinner.']]],
['校园事务','课程 · 作业 · 图书馆 · 社团 · 活动 · 设施维护','mint',[
['enroll in a course','选课；注册课程','You need to enroll in the course before the deadline.'],['drop a class','退课','I am thinking about dropping a class to balance my workload.'],['meet the deadline','按时完成；赶上截止日期','The professor reminded us to meet the assignment deadline.'],['request an extension','申请延期','Could I request an extension on the paper?'],['make up an exam','补考','Students who are sick may be allowed to make up the exam.'],['office hours','教师答疑时间','The professor holds office hours every Tuesday.'],['check out a book','借出图书','You can check out a book with your student ID.'],['renew a book','续借图书','I need to renew this book because my research is not finished.'],['study group','学习小组','Our study group meets in the library twice a week.'],['join a student organization','加入学生组织','She decided to join a student organization for volunteers.'],['student union','学生会；学生活动中心','The student union is hosting a welcome event.'],['campus facility','校园设施','The new campus facility includes a quiet study area.'],['report a maintenance issue','报告设施维修问题','Please report a maintenance issue through the housing portal.'],['be closed for renovation','因翻修关闭','The west entrance will be closed for renovation.']]],
['日常 / 职场短对话','超市 · 租房 · 维修 · 会议 · 预约','orange',[
['Could you point me to …?','你能告诉我……在哪里吗？','Could you point me to the dairy section?'],['I’m just browsing.','我只是随便看看。','Thanks, I’m just browsing for now.'],['How long will it take?','需要多长时间？','How long will it take to repair the washing machine?'],['give me a ballpark figure','给我一个大概估价','Could you give me a ballpark figure for the repair?'],['follow up on …','跟进……；询问进展','I’m calling to follow up on my maintenance request.'],['look over the lease','仔细查看租约','Please look over the lease before you sign it.'],['utilities are included','水电等杂费包含在内','Are utilities included in the monthly rent?'],['put something on the agenda','把某事列入议程','Let’s put the budget issue on the agenda.'],['run through the details','快速过一遍细节','Can we run through the details before the meeting?'],['take notes','做笔记','Could you take notes during the meeting?'],['reschedule an appointment','改预约时间','I need to reschedule my appointment for next week.'],['be available','有空；可预约','What times are you available on Thursday?']]],
['校园公告','课程 · 活动 · 作业 · 教室 · 图书馆','pink',[
['due by …','截止到……之前','The first draft is due by Friday at 5 p.m.'],['be postponed until …','推迟到……','The guest lecture has been postponed until next Monday.'],['be canceled due to …','因……取消','The outdoor event is canceled due to severe weather.'],['take place in …','在……举行','The workshop will take place in Room 204.'],['be relocated to …','改在……举行','Today’s class has been relocated to the science building.'],['temporarily unavailable','暂时无法使用','The online catalog is temporarily unavailable.'],['observe quiet hours','遵守安静时段','Please observe quiet hours in the library after 10 p.m.'],['extended hours','延长开放时间','The library will have extended hours during finals week.'],['a reminder that …','提醒……','This is a reminder that parking permits expire this Friday.'],['in response to …','作为对……的回应','In response to student feedback, the cafeteria added more options.'],['sign in at the front desk','在前台登记','Visitors must sign in at the front desk.'],['weather permitting','天气允许的话','The field trip will go ahead tomorrow, weather permitting.']]]
];
const all=DATA.flatMap(([scene,intro,tone,items])=>items.map(x=>({...x,scene,intro,tone})));let learned=new Set(JSON.parse(localStorage.getItem('toefl-scene-learned')||'[]'));
const $=id=>document.getElementById(id); all.forEach(x=>{if(!learned.has(x[0])){} });$('total').textContent=all.length;DATA.forEach(x=>{let o=document.createElement('option');o.value=x[0];o.textContent=x[0];$('filter').append(o)});
function speak(text){if(!('speechSynthesis'in window))return; speechSynthesis.cancel();let u=new SpeechSynthesisUtterance(text);u.lang='en-US';speechSynthesis.speak(u)}
function render(){let q=$('search').value.trim().toLowerCase(),f=$('filter').value,shown=0;let html='';DATA.forEach(([scene,intro,tone,items])=>{if(f!=='all'&&f!==scene)return;let cards=items.filter(x=>x.some(v=>String(v).toLowerCase().includes(q)));if(!cards.length)return;shown+=cards.length;html+=`<section class="group" data-tone="${tone}"><h2>${scene}</h2><div class="intro">${intro}</div>`;cards.forEach(([term,meaning,example])=>{let done=learned.has(term);html+=`<article class="card" data-term="${term}" title="点击标记掌握"><div class="term"><span>${term}</span><button class="pronounce" aria-label="朗读 ${term}">◉</button></div><div class="meaning">${meaning}</div><div class="example"><b>例：</b>${example}</div></article>`});html+='</section>'});$('groups').innerHTML=html;$('empty').style.display=shown?'none':'block';$('stats').textContent=`显示 ${shown} / ${all.length} 条 · 点击词条可记录学习进度`;$('learned').textContent=learned.size;$('bar').style.width=Math.min(100,learned.size/all.length*100)+'%';document.querySelectorAll('.card').forEach(card=>{let term=card.dataset.term;card.style.opacity=learned.has(term)?'.62':'1';card.addEventListener('click',e=>{if(e.target.closest('button')){let x=all.find(a=>a[0]===term);speak(x[0]+'. '+x[2]);return}learned.has(term)?learned.delete(term):learned.add(term);localStorage.setItem('toefl-scene-learned',JSON.stringify([...learned]));render()})})}
$('search').addEventListener('input',render);$('filter').addEventListener('change',render);render();
</script></body></html>

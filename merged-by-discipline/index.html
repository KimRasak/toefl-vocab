egulation / control（过度的惩罚/监管/控制）；\nexcessive overtime / paperwork / bureaucracy（过度的加班/文书工作/官僚作风）","s":["1791"]},{"w":"exchange","d":"兑换；交换","f":"v. n. 兑换；交换","s":["1791"]},{"w":"exclude","d":"把排除在外","f":"v. 把....排除在外","s":["1675","1791"]},{"w":"exclusion","d":"除外，拒绝社交、群体或机会中的排斥排挤（新闻社会议题绝对高频","f":"n. 除外，拒绝\n社交、群体或机会中的“排斥/排挤”（新闻/社会议题绝对高频）social exclusion（社会排斥）；exclusion from sth（被排除在……之外）；feel exclusion（感到被排斥）\nexclusion of + 被排除的对象 sb's exclusion from + 被禁止进入的地方/活动\tsb do sth. to the exclusion of + 被忽视的事物 不管不顾\n保险、法律或合同中的“免责/不予承保/除外条款”（商务/法律高频）exclusion clause（免责条款/除外条款）；exclusions apply（有除外/免责规定）；policy exclusions（保单免赔范围）\n为了A而排斥/牺牲B”的固定强搭配（书面/逻辑论述高频）to the exclusion of（把……排除在外；只顾……而不顾……）","s":["1675","1791"]},{"w":"exclusive","d":"排外的；独占的","f":"adj. 排外的；独占的","s":["1675","1791"]},{"w":"excuse","d":"借口","f":"n. 借口","s":["1791"]},{"w":"exemplify","d":"体现（精准覆盖本身就是典型范例的高频用法，同时兼顾举例说明的","f":"vt. 体现（精准覆盖“本身就是典型范例”的高频用法，同时兼顾“举例说明”的动作义）。\nexemplify the challenges / spirit / commitment / trend（体现挑战/精神/承诺/趋势）\nexemplify this point / approach（例证这个观点/方法）；let me exemplify（让我举例说明）；be exemplified by...（以……为例证）\nexemplify the style / era / approach（代表该风格/时代/方法）","s":["1791"]},{"w":"exert","d":"施加施加压力、影响或控制（新闻职场绝对高频，占日常出现率以上","f":"v. 施加\n施加压力、影响或控制（新闻/职场绝对高频，占日常出现率60%以上）exert pressure / influence / control on sb/sth（对……施加压力/影响/控制）\n运用权力、权威或武力（政治/法律/管理场景）exert power / authority / force（行使权力/运用权威/动用武力）\n努力、尽力（反身代词用法）——固定搭配，非常高频 exert oneself / exert every effort（尽最大努力/竭尽全力）","s":["1791"]},{"w":"exhale","d":"呼气（缓慢深呼吸）；（吸气和呼气）（呼出二氧化碳烟雾水汽）；","f":"v. 呼气\nexhale slowly / deeply（缓慢/深呼吸）；inhale and exhale（吸气和呼气）\nexhale carbon dioxide / smoke / vapor（呼出二氧化碳/烟雾/水汽）；exhale through the nose（用鼻子呼气）\nexhale a sigh of relief / exasperation（呼出松了一口气/恼怒的叹息）；exhale tension / stress（释放紧张/压力）","s":["1791"]},{"w":"exhaust","d":"使疲倦","f":"v. 使疲倦","s":["1791"]},{"w":"exhaustive","d":"五遗漏的，彻底的，广泛的某方面（这份报告对该问题的覆盖是全面","f":"adj. 五遗漏的，彻底的，广泛的\nbe exhaustive in + 某方面. The report was exhaustive in its coverage of the issue.（这份报告对该问题的覆盖是全面彻底的。）\nbe exhaustive of + 范围. This list is exhaustive of all the possibilities.（这份清单穷尽了所有可能性。）\nThis is not an exhaustive list.\nan exhaustive search / inquiry\nexhaustive details / coverage","s":["1791"]},{"w":"exhibit","d":"展示相比于，更适合稍正式点的场景展出画作雕塑作品表现出迹象症","f":"v.n. 展示。相比于show，更适合稍正式点的场景。\nexhibit paintings / sculptures / works 展出画作/雕塑/作品\nexhibit signs / symptoms 表现出迹象/症状（医学、心理学常用）\nexhibit behavior / traits 表现出行为/特征 She exhibited great courage during the crisis.（她在危机中表现出巨大勇气。）\nsb will exhibit at + 展会/画廊 sb exhibit in + 城市/国家\n名词搭配 an exhibit of + 作品/物品","s":["1791"]},{"w":"exist","d":"生存","f":"v. 生存","s":["1791"]},{"w":"exit","d":"出口；退出","f":"n. 出口；退出","s":["1791"]},{"w":"expansive","d":"物理抽象层面的广阔、全面指面积大、范围广，或涵盖内容多性格态","f":"adj. 物理/抽象层面的“广阔、全面”：指面积大、范围广，或涵盖内容多。性格/态度的“开朗、豪爽”：指人健谈、乐于分享，或者出手大方。","s":["1791"]},{"w":"expedient","d":"权宜的权宜之计","f":"adj. 权宜的\nn. 权宜之计","s":["1791"]},{"w":"expertise","d":"专门知识黄金动词搭配（最核心）别总用，试试这些更精准的词拥有","f":"n. 专门知识\n1. 黄金动词搭配（最核心）\n别总用“have”，试试这些更精准的词：\n\n· possess/have expertise in：拥有某领域专长（最通用）\n· bring expertise to：为某事带来专长（职场高频，强调贡献）\n· leverage expertise：利用专长（商务精英感，意为“发挥”）\n· apply expertise：应用专长（强调实践）\n· gain/develop expertise：获得/培养专长\n\n2. 必备介词（易错点）\n\n· expertise in + 领域/技能（绝大多数情况用这个）—— 正确：expertise in finance\n· expertise on + 具体话题/问题—— 例句：expertise on climate policy\n· expertise with + 工具/软件—— 例句：expertise with Excel\n\n3. 高频修饰词（让表达更精准）\n\n· technical/professional/medical/legal + expertise（技术/专业/医学/法律专长）\n· considerable/extensive/in-depth + expertise（大量的/广泛的/深入的专长）\n· unique/specialized + expertise（独特的/专门的专长）","s":["1675","1791"]},{"w":"explicit","d":"明确的；清楚的","f":"adj. 明确的；清楚的","s":["1791"]},{"w":"explore","d":"探险；探索","f":"v. 探险；探索","s":["1791"]},{"w":"exposure","d":"接触（精准对应暴露接触的核心义，最通用，尤其适用于接触风险、","f":"n. 接触（精准对应“暴露/接触”的核心义，最通用，尤其适用于“接触风险、信息或新事物”的高频场景）。\nexposure to + 危险源（接触/暴露于……）；occupational exposure（职业接触/暴露）\nexposure to + 新事物/文化/语言（接触……）；early exposure（早期接触）\nmedia / press coverage exposure（媒体曝光）；give / get exposure（给予/获得曝光）","s":["1791"]},{"w":"expound","d":"阐述比正式，通常长篇大论、详细展开详细阐述理论、观点或哲学思","f":"v. 阐述(比explain正式，通常长篇大论、详细展开)\n1. 详细阐述理论、观点或哲学思想（学术/政治/正式演讲绝对高频，占日常使用80%以上）\n短语搭配：expound a theory / idea / philosophy / views（阐述理论/想法/哲学/观点）；expound on / upon（就……加以详述\n例句：The professor expounded his theory of economic growth in his latest book.（教授在其新书中阐述了他的经济增长理论。）\n例句：He began to expound on the importance of personal responsibility in a free society.（他开始阐述个人责任在自由社会中的重要性。）\n\n2. 详细解读、解释法律条文或教义（法律/宗教/经典文本解读场景）\n短语搭配：expound the law / scripture / text（阐明法律/经文/文本）\n例句：The judge expounded the legal provisions governing contract disputes.（法官阐明了管辖合同纠纷的法律条款。）\n例句：The priest expounded the meaning of the ancient parable to the congregation.（牧师向会众阐明了那个古老寓言的深意。）\n\n3. “进一步展开/详细说明”的强调用法——常用于演讲或写作中的过渡\n短语搭配：allow me to expound（请允许我详细说明）；expound further / at length（进一步/详尽地阐述）\n例句：Let me expound further on the reasons behind this decision.（让我进一步阐述这一决定背后的原因。）\n例句：He expounded at length on the benefits of the new policy.（他详尽地阐述了新政策的好处。）","s":["1791"]},{"w":"extension","d":"延伸截止日期的延长这个项目是我们先前研究的延伸（固定短语，表","f":"n. 延伸\n1. extension of\nextension of the deadline\n截止日期的延长\nThe project is an extension of our previous research.\n这个项目是我们先前研究的延伸。\n2. by extension（固定短语，表示推论）\nShe is in charge of the department and, by extension, the entire region.\n她负责这个部门，进而也负责整个区域。\n逻辑：A成立 → 推而广之 B也成立。\n3. extension to\nThey built an extension to the house.\n他们给房子加盖了一个扩建部分。\nThe new policy is an extension to the existing framework.\n新政策是对现有框架的补充。\n二、接动词（常见搭配）\ngrant an extension — 批准延期\nrequest / ask for an extension — 申请延期\nget / receive an extension — 获得延期\nsign / agree to a contract extension — 签下/同意续约（体育、职场高频）","s":["1791"]},{"w":"extensive","d":"大量的，广泛的高频场景用法）广泛的大量的（修饰经历、研究、知","f":"adj. 大量的，广泛的\n高频场景用法\n1）广泛的/大量的（修饰经历、研究、知识）：She has extensive experience in project management. 她有丰富的项目管理经验；Extensive research has been done on the topic. 关于这个课题已做了大量的研究。\n2）广阔的/大面积的（修饰土地、损害）：The fire caused extensive damage to the building. 大火对建筑造成了大面积的毁坏；The estate has extensive grounds. 这处庄园拥有广阔的庭院。\n常见搭配：extensive collection 大量收藏；extensive use 广泛使用；extensive network 庞大的网络。\n最接近的中文单词：广泛（若修饰空间/面积则取“广阔”）","s":["1791"]},{"w":"external","d":"外部的","f":"adj. 外部的","s":["1675","1791"]},{"w":"extraneous","d":"外来的、无关的、非必要的名词（消除、移除、排除）强调去掉多余","f":"adj. 外来的、无关的、非必要的\nbe extraneous to + 名词\neliminate / remove / exclude（消除、移除、排除）：强调“去掉多余的”。\n\nWe need to eliminate extraneous noise from the data.（我们需要从数据中剔除无关的噪音。）\navoid / ignore（避免、忽略）：强调“不理会多余的”。\nPlease ignore extraneous factors and focus on the core issue.（请忽略无关因素，聚焦核心问题。）\nintroduce / add（引入、添加）——常带有贬义，表示“引入了不相干的东西”。\nDon't introduce extraneous elements into the debate.（不要把不相干的元素引入辩论中。）","s":["1675","1791"]},{"w":"extricate","d":"使摆脱、解救、脱身，指从困境、束缚或复杂局面中巧妙或费力地解","f":"vt. “使摆脱、解救、脱身”，指从困境、束缚或复杂局面中巧妙或费力地解脱出来。\nextricate 的核心意思是“使摆脱、解救、脱身”\nextricate oneself 使自己脱身\nextricate + 人/物 + from + 困境/束缚","s":["1791"]},{"w":"facet","d":"方面，平面复杂事物","f":"n. 方面，平面\nfacet + of + 复杂事物","s":["1675","1791"]},{"w":"facility","d":"设施；设备；便利；熟练或天赋","f":"n. 设施；设备；便利；熟练或天赋","s":["1675","1791"]},{"w":"faint","d":"情况微弱的、模糊的、不清晰的（感官、记忆、可能性），虚弱的、","f":"adj. 95%情况 ：“微弱的、模糊的、不清晰的”（感官、记忆、可能性），“虚弱的、快要晕倒的”。\nv. n. 它也可以作动词（昏厥）和名词（昏厥），但远不如形容词常用。\nbe faint with (hunger/relief) 因...发昏\n很万金油的单词，可以修饰感官(气味/声音)、思维记忆、可能性、生理(脉搏、微笑)。\nbe faint from 因...虚弱\na faint hope of （希望/可能性）微乎其微 There is a faint hope of success.","s":["1675","1791"]},{"w":"fallible","d":"会犯错的、可能出错的、不完美的名词在方面可能出错（人类记忆在","f":"adj. “会犯错的、可能出错的、不完美的”\nfallible in + 名词/doing\t在……方面可能出错\tHuman memory is highly fallible in recalling exact details.（人类记忆在回忆精确细节方面极其容易出错。）Even experts are fallible in their predictions.（即使是专家的预测也可能出错。）\nfallible + 人/思维/记忆/系统/方法","s":["1791"]},{"w":"familiarize","d":"使熟悉、使了解，它是一个及物动词在的高频场景中，它都搭配反身","f":"v. “使熟悉、使了解”，它是一个及物动词 (vt.)。在90%的高频场景中，它都搭配反身代词（myself / yourself / oneself）使用，表示“让自己去了解/熟悉某事物”。它是一个正式、书面的动词，比口语中的 get to know 或 learn about 更显专业。\nfamiliarize oneself with + 事物\t使自己熟悉（信息/环境/规则）\tYou should familiarize yourself with the new software before the meeting.（你应在会议前让自己熟悉新软件。）\nfamiliarize + 人 + with + 事物\t使某人熟悉某事物\tThe orientation program is designed to familiarize new employees with company policies.（入职培训旨在让新员工熟悉公司政策。）","s":["1791"]},{"w":"fascinate","d":"强烈吸引、迷住、使入迷，指某事物因极其有趣或迷人，让人完全被","f":"v. “强烈吸引、迷住、使入迷”，指某事物因极其有趣或迷人，让人完全被吸引住。它是一个及物动词 (vt.)，但在考试和写作中，被动语态 be fascinated by 的出现频率远高于主动语态（约 8:2）。","s":["1791"]},{"w":"fashionable","d":"流行的；时髦的","f":"adj. 流行的；时髦的","s":["1791"]},{"w":"feeble","d":"虚弱的、无力的、微弱的贬义情况用于批评借口、论点、尝试等抽象","f":"adj. “虚弱的、无力的、微弱的”(贬义)。95%情况用于批评借口、论点、尝试等抽象事物——“苍白无力的、软弱的、站不住脚的”。\nfeeble in + 名词/doing\t在……方面差劲/无力\tHe is feeble in argument and easily loses debates.（他在辩论中很无力，很容易输掉。）\nThe government was feeble in its response to the crisis.（政府应对危机时表现得软弱无力。）\nfeeble excuse/reason","s":["1791"]},{"w":"feign","d":"假装、佯装、伪装，指为了欺骗而故意装出某种（不真实的）感觉、","f":"v. “假装、佯装、伪装”，指为了欺骗而故意装出某种（不真实的）感觉、状态或情绪。\nfeign + 名词（绝对主流）\t假装（某种状态/情绪）\tShe feigned surprise when she saw the gift.（她看到礼物时装出惊讶的样子。）\nfeign + that 从句\t假装……\tHe feigned that he didn't hear me.（他假装没听见我。）—— 但不如 feign + 名词 地道。\n“Don't feign sleep. I know you're awake!”（别装睡，我知道你醒了！）\n“Don't feign ignorance.”（别装傻。）","s":["1791"]},{"w":"ferret","d":"搜寻、翻找（动）；雪貂（名）动词用法远重于名词，尤指彻底搜索","f":"v. 搜寻、翻找（动）；雪貂（名）。动词用法远重于名词，尤指彻底搜索（实物）或刺探调查（情报/秘密）。常用于侦探小说/悬疑小说。\nferret about / around + 地点：四处翻找（实物）。She ferreted around in her bag for the keys.（包里翻找钥匙。）\nferret out + 信息/人：（经努力）查出、搜出（极高频固定搭配）。Journalists ferreted out the truth.（记者挖出了真相。）He ferreted out the spy.（他揪出了间谍。）","s":["1791"]},{"w":"fervent","d":"热忱的、炽烈的形容情感、信仰或支持时极高频强调由内而外的真挚","f":"adj. 热忱的、炽烈的。形容情感、信仰或支持时极高频——强调由内而外的真挚狂热，比 passionate 更专一持久，比 enthusiastic 更深沉庄重。\nfervent about + 目标/事业：对……充满热忱。She is fervent about animal rights.（热忱于动物权益。）\nfervent in + 信仰/追求：在……方面炽烈。He is fervent in his beliefs.（信仰坚定。）\n① 政治/社会议题的议论文（最最常用）\n在讨论严肃话题（如环保、平权、枪支管控）时，fervent 是提升文章档次的“必备词”。“The protesters held a fervent belief in justice.”（抗议者对正义抱有炽热的信念。）“He is a fervent supporter of renewable energy.”（他是可再生能源的狂热支持者。）\n② 宗教/哲学/文学课的讨论（表达深度虔诚）\n描述信仰、祈祷或个人信条时，用 fervent 比用 strong 有力量得多。\n“She offered a fervent prayer for her family's safety.”（她为家人的安全做了虔诚的祈祷。）“The poet's fervent love for nature is evident in his work.”（诗人对自然炽热的爱在他的作品中显而易见。）fervent supporter/believer of（……的狂热支持者/信徒）","s":["1791"]},{"w":"fetter","d":"束缚、桎梏名词多用复数（枷锁羁绊）；动词限制阻碍（及物）比喻","f":"n. 束缚、桎梏。名词多用复数 fetters（枷锁/羁绊）；动词“限制/阻碍”（及物）。比喻义（传统/思想/制度）占 99%，远重于字面义（脚镣）。\nfetter + 人/物 + to + 事物：将……束缚于……。Tradition fettered him to the past.（传统将他束缚于过去。）\nbe fettered by + 束缚源：被……所困。Research is fettered by lack of funds.（因资金匮乏受阻。）\nfetters of + 抽象概念：……的枷锁（极高频固定搭配）。\nbreak the fetters of convention（打破传统的桎梏）。break/shake off fetters（挣脱桎梏）throw off fetters（摆脱枷锁）\tThey shook off the fetters of colonial rule.（挣脱殖民枷锁。）\nbe fettered by rules（被规则束缚）fettered imagination（受限的想象力）\tCreativity is often fettered by rigid rules.（创造力常被死板规则扼制。）","s":["1791"]},{"w":"feud","d":"世仇、宿怨（名）；长期争斗（动）核心特征跨代际、持续多年、常","f":"n. 世仇、宿怨（名）；长期争斗（动）。核心特征：跨代际、持续多年、常伴血腥暴力（家族/部落/帮派），比普通争吵（quarrel）深重百倍。\nfeud with + 人/团体：与……结仇（动）。The clans feuded with each other for centuries.（数百年世仇。）\nfeud between A and B：A 与 B 之间的世仇（名）。The feud between the two families ended in tragedy.（两家世仇以悲剧告终。）\n① 历史课/社会学课（最最常用！）\n这是美国学生第一次接触这个词的地方。他们一定会学到 “The Hatfield–McCoy Feud”（美国历史上最著名的家族世仇）。老师在讲解南北战争、边疆冲突或帮派历史时，这个词是必修术语。\n“The feud between the two families lasted for decades.”（这两个家族之间的世仇持续了几十年。）\n② 文学课（分析小说/戏剧冲突）\n在阅读莎士比亚（如《罗密欧与朱丽叶》里的蒙太古与凯普莱特家族）或《呼啸山庄》时，这个词会被反复提及。\n“The central conflict of the play is the feud between the two noble houses.”（该剧的核心冲突是两个贵族家族之间的世仇。）\n③ 娱乐八卦/体育新闻（描述名人或球队的长期不和）\n美国人看新闻时，这个词经常出现在“骂战”类报道中。但不同于普通的争吵，Feud 暗示这场冲突已经持续了好几周、好几个月，甚至好几年。\n“The feud between the two rappers has been going on for years.”（这两位说唱歌手之间的不和已经持续多年了。）\n“There's a long-standing feud between the two rival football teams.”（这两支宿敌足球队之间有着长期的积怨。）\nfeud over + 原因：因……而起世仇。a feud over land rights（土地权之争。）\nbe at feud with：与……处于世仇状态（极高频固定搭配）。The tribes are still at feud with one another.（部落间仍势同水火。）","s":["1791"]},{"w":"fidelity","d":"忠诚、忠实（人际关系婚姻）；精确、逼真（信息复制品极高频）强","f":"n. 忠诚、忠实（人际关系/婚姻）；精确、逼真（信息/复制品——极高频）。强调严格恪守承诺或一丝不差地还原，比 loyalty 更具“责任感”。\nswear fidelity to + 人/原则/原文：对……的忠诚/忠实（唯一介词）。\nHe swore fidelity to the king.（效忠国王。）\nThe translator paid great attention to fidelity to the original text.（注重忠实原文。）\nfidelity in + 领域：在某方面的忠实。fidelity in marriage（婚姻中的忠诚。）\nfidelity\t契约/细节的严格恪守\t强调“言出必行、不篡改”，用于婚姻忠诚或翻译/复制的精确。\nloyalty\t情感的站队/不离不弃\t强调“心之所向”，用于国家、政党、朋友（可转移对象）。","s":["1791"]},{"w":"figment","d":"虚构之事仅存于固定搭配（凭空想象出来的东西），单独使用几乎绝","f":"n. 虚构之事。99% 仅存于固定搭配 a figment of one's imagination（凭空想象出来的东西），单独使用几乎绝迹。\nThe monster is just a figment of his imagination.（怪物纯属他想象出来的。）\nHis fear of failure is nothing but a figment of his imagination; he's actually quite capable.（他对失败的恐惧纯属自己瞎想，其实他能力很强。）","s":["1791"]},{"w":"figure-head","d":"名义元首、傀儡领袖为比喻义有头衔地位，无实权（如君主立宪制的","f":"n. 名义元首、傀儡领袖。99%为比喻义——有头衔地位，无实权（如君主立宪制的国王、挂名董事长）\nbe appointed as a figurehead.\nthe figurehead of the party.\nThe CEO was reduced to a figurehead.（沦为傀儡。）","s":["1791"]},{"w":"final","d":"最后的","f":"adj. 最后的","s":["1791"]},{"w":"fine","d":"罚金；细微的","f":"n. 罚金；细微的","s":["1791"]},{"w":"fishy","d":"可疑的、值得怀疑的日常口语极高频，指某件事感觉不对劲、像有猫","f":"adj. 可疑的、值得怀疑的。日常口语极高频，指某件事感觉不对劲、像有猫腻，而非字面“鱼的”（除非你真在描述鱼腥味）。\nfishy about + 人/事：关于……觉得可疑。\nThere's something fishy about him.（他有点不对劲。）What's fishy about this deal?（这笔交易有什么猫腻？）\nsmell fishy（最最常用）：听起来/感觉有鬼。His excuse smells fishy to me.（他的借口我听着有鬼。）\nlook / sound fishy：看起来/听上去可疑。The numbers in this report look fishy.（报告里的数字看着不对劲。）\nfind something fishy：发觉某事可疑。I find his sudden friendliness a bit fishy.（他突然的友好让我觉得有点怪。）","s":["1791"]},{"w":"fitful","d":"断断续续的、一阵阵的专指睡眠呼吸努力雨势等不连贯、总被打断的","f":"adj. 断断续续的、一阵阵的。专指睡眠/呼吸/努力/雨势等不连贯、总被打断的状态（贬义/负面），强调“无法持续”和“不安定”。\nfitful sleep（时睡时醒）fitful breathing（不均匀的呼吸）\tHe spent a fitful night.（一夜断断续续没睡好。）\nfitful progress（曲折的进展）fitful efforts（三分钟热度）\tThe peace talks made fitful progress.（和谈进展反复。）\nfitful rain（一阵阵的雨）fitful wind（时有时无的风）\tA fitful wind blew all night.（风刮刮停停一整夜。）","s":["1791"]},{"w":"fixed","d":"固定的","f":"adj. 固定的","s":["1791"]},{"w":"flare","d":"突然烧旺闪光（火光）；突然爆发加剧（冲突疾病情绪）极高频；裙","f":"v. 突然烧旺/闪光（火/光）；突然爆发/加剧（冲突/疾病/情绪）——极高频；裙摆/喇叭裤向外展开。核心动词，\nn. 名词指“闪光信号/耀斑”。\nflare up：（冲突/争吵/疾病）突然爆发或加剧（极高频固定短语）。Violence flared up again.（暴力再度升级。）My allergies flare up in spring.（过敏在春天发作。）\nflare into + 名词：突然烧成/爆发成（某种状态）。The argument flared into a fight.（争论演变成打斗。）\nflare out：向外展开（裙摆/喇叭状）。名词 + flare over + 议题：因……突然爆发的争端。a flare-up over the budget（预算争端骤起。）","s":["1675","1791"]},{"w":"flaw","d":"缺点","f":"n. 缺点","s":["1791"]},{"w":"flicker","d":"动词闪烁（指光线或火焰忽明忽暗）；一闪而过（表情、感觉或动作","f":"动词：闪烁（指光线或火焰忽明忽暗）；一闪而过（表情、感觉或动作）。\n名词：闪烁\n描述光线/火焰（物理现象）→ 通常指“持续地、不规律地多次闪烁”\n描述表情/感觉/抽象事物（a flicker of...）→ 指“一闪而过、仅一次”\n描述屏幕/画面（动词）→ 既可一次也可多次，看语境","s":["1791"]},{"w":"flimsy","d":"单薄的形容具体物品质量差、不结实例（一个薄脆的纸袋）形容抽象","f":"adj. 单薄的\n形容具体物品——“质量差、不结实”。例：a flimsy paper bag（一个薄脆的纸袋）This bag is too flimsy.\n形容抽象事物——“站不住脚、很牵强”。例：a flimsy excuse（一个站不住脚的借口）","s":["1791"]},{"w":"flout","d":"藐视公开地、故意地无视或违抗（规则、法律、传统等），带有明显","f":"v. 藐视。公开地、故意地无视或违抗（规则、法律、传统等），带有明显的“不放在眼里”的挑衅意味。它比单纯的“忽视”（ignore）程度更重，是明知故犯。\nflout (something) by (doing something)：通过某种方式藐视/违抗某事。\n例：He flouted the rules by arriving late every day.（他通过每天迟到来藐视规则。）\nflout (something) in (some context/place)：在某场合/地方公然违抗。\n例：She flouted convention in her choice of clothing.（她在着装选择上公然藐视传统。）","s":["1791"]},{"w":"foil","d":"（挫败阴谋抢劫企图）铝箔纸","f":"vt. foil a plot/robbery/attempt（挫败阴谋/抢劫/企图）\nn. aluminum foil 铝箔纸","s":["1791"]},{"w":"foment","d":"煽动、挑起（负面情绪或事端）长期、蓄意地加剧已有不满骚乱、革","f":"v. 煽动、挑起（负面情绪或事端）长期、蓄意地“加剧”已有不满 骚乱、革命、战争（最正式）","s":["1791"]},{"w":"forbid","d":"禁止","f":"v. 禁止","s":["1791"]},{"w":"foremost","d":"最初的，第一流的黄金词组（首先且最重要的是）形容词名词（最顶","f":"adj. 最初的，第一流的\n黄金词组：First and foremost（首先且最重要的是）形容词：the foremost + 名词（最顶尖的/首要的）foremost among + 群体（在……中尤为突出）\n用于在列举多个事物时，特别指出其中最显眼的一个。\n副词搭配：foremost among + 群体（在……中尤为突出）Foremost among the reasons for his success is his discipline.（他成功的原因中，首当其冲的是自律。）","s":["1791"]},{"w":"forestall","d":"预先阻止后接坏事（为了抢先阻止）（公司发布声明，试图抢先阻止","f":"vt. 预先阻止(后接坏事)\nin an attempt / effort to forestall...（为了抢先阻止……）\nThe company released a statement in an attempt to forestall negative publicity.（公司发布声明，试图抢先阻止负面舆论。）\nto forestall any possible + 名词（为了杜绝任何可能的……）\nWe have double-checked the data to forestall any possible errors.（我们已复核数据，以杜绝任何可能的错误。）\nbe designed / aimed at forestalling...（旨在预先阻止……）\nThese regulations are aimed at forestalling another financial meltdown.（这些法规旨在预防另一场金融崩溃。）\nI forestalled his argument.（我抢先堵住了他的嘴。——针对的是“他”这个人可能发起的攻击）","s":["1791"]},{"w":"foretell","d":"预言意为预言、预告它只强调提前告知或透露未来信息这个动作，不","f":"vt. 预言。意为“预言、预告”。它只强调 “提前告知或透露未来信息” 这个动作，不涉及是否为此做了准备（那是 foresight）或采取了行动（那是 forestall）。\n美国人把 foretell 留给“命运、神谕和古典文学”——它不是一个普通的“预测”，而是一种“带有神秘色彩的、提前宣告结局”的文学动词。\nforetell the future / the outcome：预言未来/结果 foretell one's fate / destiny：预言某人的命运 foretell a victory / defeat / disaster：预言胜利/失败/灾难 foretell the arrival / return of sth.：预言某事的到来/回归\nas was foretold（正如所预言的）—— 很地道的书面插入语\nThe storm struck, as the elders had foretold.（暴风雨来袭，正如长辈们所预言的那样。）\nit is/was foretold that...（据预言……）—— 常用被动式\nIt was foretold that a great leader would be born in that village.（据预言，那个村庄将诞生一位伟大的领袖。）be able to foretell（能够预知）\nNo one can accurately foretell the stock market's movements.（没人能准确预知股市的走向。）\nforetell + wh- 从句（预言/预知是否/何时……）\nShe couldn't foretell whether the plan would succeed.（她无法预知这个计划是否会成功。）","s":["1791"]},{"w":"formal","d":"正式的；礼仪上的","f":"adj. 正式的；礼仪上的","s":["1791"]},{"w":"forsake","d":"舍弃背弃弃字本身不带褒贬，褒贬全由宾语和动机决定主动切断一段","f":"vt. (舍弃/背弃)弃。字本身不带褒贬，褒贬全由宾语和动机决定。主动切断一段本已存在的依附或情义关系，通常一去不返。\nforsake one's family / friends / children。forsake one's faith / religion / beliefs。forsake one's duties / responsibilities。","s":["1791"]},{"w":"forte","d":"意为特长、强项、拿手好戏指的是你特别擅长、做起来得心应手的事","f":"n. 意为 “特长、强项、拿手好戏”。指的是你特别擅长、做起来得心应手的事情或技能。\n直接背的用法(Something) is my forte. 或 My forte is (something).\nsth. is sb.'s forte：某事是某人的强项 Negotiation is her forte.（谈判是她的强项。✅）Math has never been my forte.（数学从来不是我的强项。✅——非常地道的口语）","s":["1791"]},{"w":"forth","d":"向前在现代英语中极少单独使用，它的情况都藏在这些固定短语里（","f":"adv. 向前。Forth 在现代英语中极少单独使用，它 99% 的情况都藏在这些固定短语里。\n1. back and forth（来回地，反复地）—— 最最最高频！He paced back and forth in the waiting room.（他在候诊室里来回踱步。）We exchanged emails back and forth.（我们反复往来邮件。）\n\n2. bring forth（产生，引起；提出）\nThe crisis brought forth the best in him.（危机激发了他最好的一面。）She brought forth a new proposal at the meeting.（她在会上提出了一项新提议。）\n\n3. set forth（出发；阐明，陈述）—— 书面语极高频\nThey set forth on their journey at dawn.（他们在黎明时出发了。）The president set forth his vision for the future.（总统阐述了他对未来的愿景。）\n\n4. put forth（提出；长出；付出努力）\nHe put forth a bold idea.（他提出了一个大胆的想法。）The trees put forth new leaves in spring.（春天树木长出新叶。）We need to put forth more effort.（我们需要付出更多努力。）\n\n5. go forth（出发；传播出去）\nGo forth and spread the good news!（去吧，去传播这个好消息！—— 很庄重/幽默的说法）\n8. hold forth（滔滔不绝地讲，长篇大论）—— 带点贬义\nHe held forth on the subject for over an hour.（他滔滔不绝地讲了这个话题一个多小时。）\n\n7. come forth（出来，涌现）\nSeveral volunteers came forth to help.（几名志愿者站出来帮忙。）","s":["1791"]},{"w":"forthright","d":"说话直截了当、坦率无隐瞒，尤指在需要勇气的场合肯把话说出来褒","f":"adj. 说话直截了当、坦率无隐瞒，尤指在需要勇气的场合肯把话说出来。褒义词。\n只能修饰人、人的态度、人的言语。不能用来表示\"简单易懂的东西\"。\n1. be forthright about + 事情（最高频）\n She was forthright about her own failures.\n2. be forthright in + 名词/动名词\n He was forthright in his criticism of the policy.\n3. 定语直接修饰人或言语\n a forthright and fearless journalist / a forthright answer","s":["1675","1791"]},{"w":"fortify","d":"从外部加入某种东西，使其变得更强、更能抵抗攻击或消耗军事（本","f":"v. 从外部加入某种东西，使其变得更强、更能抵抗攻击或消耗。\n① 军事（本义，最具体）\n\n▎ They fortified the town against attack.\n▎ fortified settlements / a heavily fortified border\n\n② 食品营养（考试高频，最容易漏）\n\n▎ Milk is often fortified with vitamin D.\n▎ breakfast cereals fortified with iron\n   \n这里有个必须单独记的搭配：fortified wine = 加烈酒（波特、雪莉、马德拉、味美思），指酿造中兑入蒸馏酒把酒精度提上去，不是\"味\n道浓烈的酒\"。翻译成\"强化葡萄酒\"或\"加强型葡萄酒\"。\n\n③ 抽象（论点、意志、身心）\n\n▎ The news fortified my resolve.\n▎ These findings fortify the argument that…\n▎ He fortified himself with a stiff drink before the meeting.\n\n最后那个 fortify oneself with（吃点喝点给自己壮胆/垫底）是地道用法，常带一点自嘲的幽默感，值得记住。","s":["1791"]},{"w":"fortitude","d":"在长期的痛苦、危险或逆境中不屈服、不抱怨地忍耐下去的精神力量","f":"n. 在长期的痛苦、危险或逆境中不屈服、不抱怨地忍耐下去的精神力量。\n1. show / display / demonstrate great fortitude（最高频）\nShe showed remarkable fortitude in the face of her illness.\n2. bear / endure / face sth with fortitude\nHe bore the pain with quiet fortitude.\n3. have / lack the fortitude to do sth\nFew politicians have the fortitude to admit a mistake.","s":["1791"]},{"w":"fortuitous","d":"意为偶然发生的、巧合的，中性它描述的是纯属意外、不是人为安排","f":"adj. 意为 “偶然发生的、巧合的”，中性。它描述的是纯属意外、不是人为安排或计划好的事情。\na fortuitous encounter / meeting：偶然的邂逅\na fortuitous discovery / finding：偶然的发现\nfortuitous circumstances / timing：巧合的境况/时机\n\nIt was (purely / entirely) fortuitous that...（……纯属巧合）It was purely fortuitous that we were on the same flight.（我们在同一架航班上纯属巧合。）\nby a fortuitous stroke of luck（凭着一次偶然的好运）—— 强调“运气”成分 By a fortuitous stroke of luck, I found the lost ring in the garden.（凭着一次偶然的好运，我在花园里找到了丢失的戒指。）","s":["1791"]},{"w":"fortunate","d":"幸运的","f":"adj. 幸运的","s":["1791"]},{"w":"fortune","d":"财富","f":"n. 财富","s":["1791"]},{"w":"foul","d":"垃圾、厕所、臭水沟恶心的、脏臭的体育犯规的形容天气、心情、行","f":"adj. 垃圾、厕所、臭水沟“恶心的、脏臭的”。体育“犯规的”。形容天气、心情、行为、语言，表示“糟糕透顶”。\nfoul play（最最最高频！）foul language / mouth（粗话/嘴臭）fall foul of sb/sth（触犯、与……发生冲突）cry foul（大声抗议/叫屈）","s":["1791"]},{"w":"fragment","d":"碎片","f":"n. 碎片","s":["1791"]},{"w":"fragmentary","d":"碎片的，不连续的形容信息、知识、证据零碎的、不完整的（最常见","f":"adj. 碎片的，不连续的\n形容信息、知识、证据：零碎的、不完整的（最常见）fragmentary information（零散信息）、fragmentary records（残缺的记录）。\n形容记忆、梦境：断断续续的、模糊不清的 I have only a fragmentary memory of my childhood home.（我对儿时的家只有残缺不全的记忆。）","s":["1791"]},{"w":"fragrant","d":"香的；芬芳的","f":"adj. 香的；芬芳的","s":["1791"]},{"w":"frail","d":"脆弱的和虚弱的可形容身体单薄虚弱、物体结构不坚固、性格脆弱相","f":"adj. “脆弱的”和“虚弱的”。可形容身体单薄虚弱、物体/结构不坚固、性格脆弱。相比于Fragile更形容内在无力。","s":["1791"]},{"w":"framework","d":"框架，构架，结构","f":"n.框架，构架，结构","s":["1675"]},{"w":"fraught","d":"本义是装载货物，但现代偏抽象用法充满（不愉快事物的）或令人焦","f":"adj. 本义是“装载货物”，但现代偏抽象用法。“充满（不愉快事物的）”或“令人焦虑紧张的”。\n充满（危险、困难、风险等负面事物）fraught with difficulties（困难重重）、fraught with risk（风险极高）、fraught with tension（充满紧张气氛）。\n令人焦虑的、忧心忡忡的、神经紧张的 a fraught relationship（令人焦虑/如履薄冰的关系）、a fraught situation（棘手的局面）、feel fraught（感到焦虑不安）。","s":["1791"]},{"w":"fray","d":"使磨损，磨损；争吵，小冲突","f":"v./n. 使磨损，磨损；争吵，小冲突 [st]The edges of the old book cover began to fray, revealing the worn pages beneath.","s":["1925"]},{"w":"functional","d":"功能性的，能运转的形容物品机器正常运转的、可使用的（能用）强","f":"adj. 功能性的，能运转的\n1. 形容物品/机器：正常运转的、可使用的（能用）\n强调东西没坏，能完成它该干的事。这是反义词 broken（坏了） 的直接对应。\n例句：The old printer is still functional, though it's very slow.（那台旧打印机还能用，虽然很慢。）\n2. 形容设计/建筑/布局：实用性的、注重功能的（好用 > 好看）\n强调“实用至上”，不追求华丽或装饰，只为满足实际需求。\n例句：The furniture is cheap and functional rather than stylish.（这些家具便宜又实用，但并不时髦。）\n常见搭配：functional design（功能性设计）、functional clothing（实用服装）。","s":["1791"]},{"w":"fund","d":"资金；基金；投资","f":"n. 资金；基金；投资","s":["1791"]},{"w":"fundamental","d":"基础的；基本的","f":"adj. 基础的；基本的","s":["1791"]},{"w":"further","d":"促进；增进；更多的","f":"v. 促进；增进；更多的","s":["1791"]},{"w":"futile","d":"无意的，徒劳的（跟他喝醉了争论是没用的）","f":"adj. 无意的，徒劳的\nIt is futile to argue with him when he's drunk.（跟他喝醉了争论是没用的。）","s":["1791"]},{"w":"fuzz","d":"物理层面的细毛、绒毛、起毛球（我不喜欢桃子皮上的绒毛）（她有","f":"n.a.\n物理层面的 “细毛、绒毛、起毛球” I don't like the fuzz on peaches.”（我不喜欢桃子皮上的绒毛。） She has a soft fuzz of blonde hair.”（她有一头柔软的金色细发。）\n声音/视觉层面的 “模糊、杂音、失真、雪花点” “He loves the fuzz on that guitar riff.”\n偶尔作动词（低频）\nfuzz 也可以作动词，意思是 “变得模糊” 或 “起毛”，但使用频率远低于名词。“The photo fuzzed out when I zoomed in.”（当我放大时，照片变模糊了。）“This fabric tends to fuzz after washing.”（这种布料洗后容易起毛。）","s":["1791"]},{"w":"gainful","d":"核心意思是有报酬的、能赚到钱的它强调付出劳动后能获得经济收益","f":"adj. 核心意思是“有报酬的”、“能赚到钱的”。它强调付出劳动后能获得经济收益，与“无偿”或“志愿”相对。它源自名词 gain（收益、获利）。\n它几乎只和 employment（职业）、work（工作）、occupation（职业）、pursuit（事业）等词搭配，构成固定短语。\n最经典的搭配：gainful employment（有酬职业/能挣钱的工作）\n例句：The program helps disabled people find gainful employment.（这个项目帮助残疾人找到有报酬的工作。）\n常见于法律/官方文件：这个词带有正式的书面语色彩，经常出现在移民、社保或签证相关的条款中，用以区分“合法有薪工作”和“志愿者”或“黑工”。\n例句：He must prove he is engaged in gainful activity to renew his visa.（他必须证明自己从事有酬活动才能续签签证。）","s":["1791"]},{"w":"gainsay","d":"反驳或否认，字面即反着说之后一般跟事实，不跟人会显得奇怪含义","f":"v. “反驳” 或 “否认”，字面即 “反着说”。gainsay之后一般跟事实，不跟人(会显得奇怪)。\n含义一（正式）：否认（某事是真的）\n指坚决声明某件事不是真的。例句：There is no gainsaying the fact that he is a genius.（无可否认，他是个天才。——注意 gainsaying 是动名词形式）\n含义二（正式）：反驳、反对（某人的话/观点）\n指不同意并试图推翻对方的言论。例句：He is the most honest man I know; no one can gainsay his integrity.（他是我认识的最诚实的人；没人能否认他的正直。）","s":["1791"]},{"w":"gap","d":"裂口；差距","f":"n. 裂口；差距","s":["1791"]},{"w":"garnish","d":"加装饰第一高频（你每天都能看到）烹饪里的装饰配菜这是最日常、","f":"v. 加装饰\n1. 第一高频（你每天都能看到）：烹饪里的 “装饰/配菜”\n这是 garnish 最日常、最无害的意思。指在菜肴上放一小片香草、柠檬角或酱汁，为了好看（不是为了吃饱）。\n动词（及物）：“Garnish the fish with lemon slices and parsley.”\n（用柠檬片和欧芹装饰这条鱼。）\n名词（指配菜本身）：“The cocktail came with a cherry as a garnish.”\n（这杯鸡尾酒配了一颗樱桃作为装饰。）\n固定公式：garnish + 食物 + with + 装饰物\n这是你点餐、看菜谱、看美食节目时必见的搭配。\n美国人的画面感：高档餐厅里，牛排旁边那朵西兰花或那根迷迭香——你从来不吃它，因为它是 garnish（装饰品）。\n\n2. 第二高频（成年人最怕的）：法律/财务里的 “扣押（工资）”\n这是 garnish 在新闻和法律文书里的高频用法，意思是法院强制从你的工资里扣钱来还债。\n动词：“The court garnished his wages to pay off the debt.”\n（法院扣押了他的工资来偿还债务。）\n名词（往往用 garnishment）：“He received a notice of wage garnishment.”\n（他收到了工资扣押通知。）\n固定公式：garnish wages / salary（扣押工资）\n你绝不会说 “garnish money”，一定是 garnish wages。\n美国人的画面感：每月发工资时，发现到账金额突然少了三分之一，心里一凉——被 garnish 了。","s":["1791"]},{"w":"gauge","d":"测量标准；判定","f":"测量标准：measurement standard；判定：determine","s":["1675","1791"]},{"w":"general","d":"普通的","f":"n. 普通的","s":["1791"]},{"w":"generalize","d":"归纳；概括","f":"v. 归纳；概括","s":["1675","1791"]},{"w":"generally","d":"广泛的；一般的","f":"adv. 广泛的；一般的","s":["1791"]},{"w":"generate","d":"造成","f":"v. 造成","s":["1791"]},{"w":"gibe","d":"嘲讽、讥笑，指带有挖苦或轻蔑意味的言语或表情","f":"v. “嘲讽”、“讥笑”，指带有挖苦或轻蔑意味的言语或表情。\ngibe at sb/sth","s":["1791"]},{"w":"gist","d":"主旨、要点、核心意思（弄懂大意）（我没听清每个词，但我明白大","f":"n. 主旨、要点、核心意思\nGet the gist（弄懂大意）：I didn't catch every word, but I got the gist.（我没听清每个词，但我明白大意了。）\nGive sb the gist（告诉某人要点）：Just give me the gist of the meeting.（就告诉我会议要点就行。）\nThe general/basic gist（总体梗概）：用于概括长文或冗长的发言。","s":["1791"]},{"w":"glamorous","d":"充满浮华魅力的、光鲜亮丽的、散发着昂贵明星气息的美国学生的语","f":"adj. “充满浮华魅力的、光鲜亮丽的、散发着昂贵/明星气息的”\n美国学生的语感中，这个词只能修饰三类东西，绝不会乱用：\n人（的外表/气场）：a glamorous actress（光鲜的女演员）。注意，如果说 a glamorous mom，暗指这位妈妈打扮精致、不像普通家庭主妇，隐含“她很有钱或有时间捯饬自己”。\n职业/生活方式：a glamorous job（光鲜的工作），特指时尚编辑、空乘、电影明星这类外人看着羡慕的职业，而不是程序员或会计。\n地点/场合：a glamorous party/hotel（奢华的派对/酒店），必须带水晶灯、晚礼服、香槟塔那种场景。","s":["1791"]},{"w":"glamour","d":"（金钱、名流、时尚带来的）浮华魅力光鲜亮丽的诱惑力一句话拿捏","f":"n. （金钱、名流、时尚带来的）浮华魅力/光鲜亮丽的诱惑力\n1. 一句话拿捏核心（别再译成“美丽”）\nGlamour ≠ Beautiful（漂亮）；Glamour = 闪闪发光、昂贵精致、带点“明星红毯感”的吸引力。\n比如：the glamour of Hollywood（好莱坞的纸醉金迷），the glamour of New York（纽约的繁华霓虹）。它永远带着“人造、舞台、镜头、奢侈品”的滤镜。\n2. 三个高频固定搭配（背下直接得分）\nOld Hollywood glamour（老派好莱坞风情）：指复古大波浪、红唇、晚礼服那种经典华丽感。\nGlamour and glitz（浮华与炫目）：这两个词常绑定出现，指“喧闹奢华的排场”，含轻微贬义（虚有其表）。\nChase/pursue glamour（追逐浮华）：暗指这人追求虚荣的名利场。","s":["1791"]},{"w":"glaring","d":"高频第一义（王牌考点）扎眼的、触目惊心的（通常指错误、缺陷或","f":"adj. 高频第一义（王牌考点）：“扎眼的”、“触目惊心的”（通常指错误、缺陷或不公平）。\na glaring mistake/error（极其明显的错误）——比 obvious mistake 语气重得多，暗指“这种低级错误居然没人发现”。\na glaring omission（赤裸裸的遗漏）——指写报告或计划时，漏掉了最关键、最不该漏的那部分。\nglaring inequality/contradiction（触目惊心的不平等/自相矛盾）——常用于社会评论，指贫富差距等问题大得刺眼。\n高频第二义（字面意思）：刺眼的（指光线过强，让人睁不开眼）。\nthe glaring headlights（刺眼的汽车远光灯），glaring sunshine（白花花的烈日）。","s":["1791"]},{"w":"glaze","d":"上釉使光滑在表面糊上一层光滑东西（糖霜甜甜圈）表面那层亮晶晶","f":"v. 上釉使光滑。“在表面糊上一层光滑东西”。\nGlazed donut（糖霜甜甜圈）——表面那层亮晶晶、黏糊糊的糖皮就是 glaze。\nHis eyes glazed over during the lecture.（他在讲座中眼神呆滞，目光涣散。）\nn. 釉料","s":["1675","1791"]},{"w":"gleam","d":"柔和的、反射出的、短暂闪现的光物理上，它是光滑表面反射的微光","f":"v. 柔和的、反射出的、短暂闪现的光。物理上，它是光滑表面反射的微光。眼神上，它是指眼神里的光。\n物理场景——“微光/反光”（柔和、干净、不刺眼）the gleam of polished wood（抛光木面的光泽），the gleam of moonlight on the lake（湖面上的月光）。\n眼神/表情场景——“眼里有光”（特指情绪的短暂流露）a gleam of hope（一线希望）：指绝望中突然闪现的微弱转机。a mischievous gleam in his eye（他眼中闪过一丝狡黠/调皮）：通常表示这人要搞恶作剧或憋了个鬼点子。Her eyes gleamed with pride.（她眼中闪烁着骄傲的光芒。）","s":["1675","1791"]},{"w":"glean","d":"收集或搜集原始意思拾（落穗）引伸意思费力地、一点一点地搜集（","f":"v. 收集或搜集\n原始意思：拾（落穗）。引伸意思：费力地、一点一点地搜集（信息、知识等）。glean information / knowledge / facts (搜集信息/知识/事实) glean evidence / suggestions (收集证据/建议)","s":["1791"]},{"w":"gloom","d":"昏暗的光线压抑的情绪心理氛围场景（出现概率）愁云惨淡悲观沮丧","f":"n. 昏暗的光线 + 压抑的情绪。\n1. 心理/氛围场景（80%出现概率）——“愁云惨淡/悲观沮丧”\n这是当代新闻、文学和美剧里的绝对高频。它描述的是一种弥漫在空气中、让人喘不过气的压抑感。\n必背黄金搭配（考试选项里看到直接选）：\neconomic gloom（经济萧条/悲观）：外刊标题高频词，指大家对钱景普遍不看好。\ndoom and gloom（悲观绝望/一片灰暗）：极其高频的固定词组，美国人口语里常说，指“前途无亮、全是坏消息”。\ncast a gloom over...（给……蒙上阴影）：指某件坏事让整个场合的气氛瞬间变沉重。\n例句：The bad news cast a gloom over the whole office.（这个坏消息给整个办公室蒙上了一层阴霾。）\n2. 物理场景（20%出现概率）——“昏暗/幽暗”\n只用来形容光线极差、看不清东西的环境，且一定带有压抑、阴森的色彩（绝不指浪漫的烛光）。\n例句：He could barely see her face in the gathering gloom.（在渐浓的暮色/昏暗里，他几乎看不清她的脸。）\n禁区：绝对不能用来形容“明亮的月光”或“温馨的台灯下”，它只能形容快天黑时、地下室、浓雾里那种让人不太舒服的暗。","s":["1675","1791"]},{"w":"gloomy","d":"阴郁的、悲观的、阴沉沉的形容人的情绪表情满脸愁容、郁郁寡欢（","f":"adj. 阴郁的、悲观的、阴沉沉的\n1. 形容人的情绪/表情——“满脸愁容、郁郁寡欢”（80%出现率）\n形容一个人 gloomy，绝不是“他没买到奶茶有点不爽”，而是长期笼罩在低气压里，沉默寡言，对未来不抱希望。\n必背搭配：a gloomy expression/face（阴郁的表情/脸色）；feel gloomy（感到沮丧）。\n母语者直觉：如果美国同事说 “He's been gloomy all week.”，潜台词是“他家里可能出大事了”或“他抑郁了”，绝不仅仅是“心情不好”。这个词带有沉重的分量。\n2. 形容天气/环境——“阴暗的、黑压压的”（20%出现率）\n只形容让人不舒服的暗：乌云密布、黄昏将至、没开灯的地下室。\n例句：a gloomy winter morning（阴沉沉的冬日早晨）；a gloomy basement（昏暗压抑的地下室）。\n禁区：绝对不用来形容“浪漫的夜色”或“舒适的暗光”，必须带“冷、湿、压抑”的体感。","s":["1675","1791"]},{"w":"glossy","d":"表面光滑得能反光物理场景光滑反光的表面（照片纸秀发）特指相片","f":"adj. “表面光滑得能反光”。\n物理场景——“光滑反光的表面”（照片纸/秀发）glossy paper/photo 特指相片纸那种滑溜溜、反光的质地。glossy hair（有光泽的秀发）\n比喻场景——“光鲜的包装/浮华的表面” a glossy image（光鲜的形象）——通常指政客或明星刻意营造的完美人设。glossy brochures（精美的宣传册）——指开发商印得天花乱坠的楼书，但房子实际可能不咋地。the glossy world of advertising（光鲜浮华的广告界）——表面光鲜亮丽，背后可能压力山大或欺骗消费者。","s":["1675","1791"]},{"w":"gorgeous","d":"极其美丽的、令人惊艳的很万金油，但必须用在眼睛能看到的事情上","f":"adj. 极其美丽的、令人惊艳的。很万金油，但必须用在眼睛能看到的事情上，不能形容抽象的东西(比如个人成就)。\n形容人——“美炸了/帅翻了”\n形容景色/物品——“令人叹为观止的美”\n形容天气/感受——“爽翻了/美极了”","s":["1791"]},{"w":"grievance","d":"不满委屈申诉（认为受到不公正对待而产生的）不满、委屈、怨气提","f":"n. 「不满」「委屈」「申诉」\n（认为受到不公正对待而产生的）不满、委屈、怨气 She has a grievance against her boss\nfile a grievance with HR 提出申诉/投诉","s":["1791"]},{"w":"grotty","d":"邋遢的（现在没什么美国人用了）（地方物品）邋遢的、脏乱的、破","f":"adj. 邋遢的（现在没什么美国人用了）\n（地方/物品）邋遢的、脏乱的、破旧的 The hotel was really grotty.（那家旅馆又脏又破。）\n（天气/情况）糟糕的、令人难受的 The weather's been grotty all week.\n（人）邋遢的、衣衫不整的 look grotty","s":["1791"]},{"w":"guarantee","d":"确保","f":"v. 确保","s":["1791"]},{"w":"guileless","d":"天真无邪的纯真的微笑毫无心机的诚实（坦诚的供认坦白）以天真朴","f":"adj. 天真无邪的\na guileless smile 纯真的微笑\nguileless honesty 毫无心机的诚实\na guileless confession（坦诚的供认/坦白）\nwith guileless simplicity\t以天真朴实的姿态","s":["1791"]},{"w":"habituate","d":"使习惯于（相比于，前者更强调结果，后者更强调过程，前者更用于","f":"v. 使习惯于（habituate相比于get used to，前者更强调结果，后者更强调过程，前者更用于中性或负面语义，后者偏中性）\nhabituate oneself to sth / doing sth（vt.）使习惯于、使适应（通过反复经历而适应）\nbecome habituated to （vi. / 被动式）习惯于\nhabituate oneself to sth\t使自己习惯于\nbe / become habituated to sth\t习惯于……（被动式，最高频）\nhabituate to sth\t逐渐习惯（不及物用法）","s":["1791"]},{"w":"haggle","d":"砍价美国人只在车行、跳蚤市场和出国旅游时才用某人或某物某目标","f":"v.n. 砍价。美国人只在车行、跳蚤市场和出国旅游时才用。\nhaggle with 某人 / over 或 about 某物 / for 某目标。\nCan you haggle the price down?（你能把价砍下来吗？） No haggling — fixed prices here.（这里不议价，明码标价。）","s":["1791"]},{"w":"hamper","d":"阻碍的意思是碍事、添麻烦、拖慢，但不是停止，这是与，的区别（","f":"v. 阻碍。hamper 的意思是\"碍事、添麻烦、拖慢\"，但不是\"停止\"，这是与stop，prevent的区别。\n（vt.）阻碍、妨碍（使进展变慢或受阻）The heavy snow hampered traffic.（大雪阻碍了交通。）\n（vt.）束缚、牵制（限制某人行动/自由）The tight dress hampered her movements.（紧身裙妨碍了她的行动。）\n（n.）篮子（美式：洗衣篮；英式：食品/野餐篮）\na clothes hamper（洗衣篮）a picnic hamper（野餐篮）a Christmas hamper（圣诞礼盒/食品篮）","s":["1791"]},{"w":"handicap","d":"名词不利条件、障碍（最常见）（不会说当地语言是找工作时的一大","f":"名词：不利条件、障碍（最常见）Not speaking the local language is a serious handicap when looking for a job.（不会说当地语言是找工作时的一大障碍。）\n名词：残疾（身体或智力上的缺陷）He was born with a physical handicap.（他天生有身体残疾。）\n名词：体育中的\"让分/差点\"（如高尔夫）She has a handicap of 10.（她的差点是10。）\n动词：妨碍、使处于不利地位 Poor eyesight handicapped him in sports.（视力差使他在运动中处于劣势。）","s":["1791"]},{"w":"handy","d":"方便的；灵巧的","f":"adj. 方便的；灵巧的","s":["1791"]},{"w":"haphazard","d":"杂乱无章的、随意的、没有计划的（书杂乱无章地堆在地板上）（杂","f":"adj. 杂乱无章的、随意的、没有计划的\nThe books were piled on the floor in a haphazard way.（书杂乱无章地堆在地板上。）\nhaphazard manner / way（杂乱的方式）\nhaphazard growth（无序发展）\nhaphazard arrangement（随意安排）","s":["1791"]},{"w":"hardly","d":"几乎不","f":"adv. 几乎不","s":["1791"]},{"w":"harry","d":"不断烦扰、骚扰；（军事上）不断袭扰和的词义几乎重合反复烦扰、","f":"v. 不断烦扰、骚扰；（军事上）不断袭扰。和harass的词义几乎重合。\n反复烦扰、不断打扰 —— 使人不得安宁\n例句：Reporters harried the politician with questions.（记者们用问题不断烦扰那位政客。）\n（军事）不断袭扰、骚扰（敌军） —— 通过频繁小规模攻击削弱敌人\n例句：The cavalry harried the enemy's supply lines.（骑兵不断袭扰敌人的补给线。）\nharry sb. with sth.（用某事不断烦扰某人）\nharry the enemy / retreating troops（袭扰敌人/撤退的部队）\nbe harried by（被……所烦扰）","s":["1791"]},{"w":"hatch","d":"本义孵化、破壳（动物）（蛋三周后孵化）（小鸡刚开始出壳）比喻","f":"1. 本义：孵化、破壳（动物）\nThe eggs hatched in three weeks.（蛋三周后孵化。） The chicks are just beginning to hatch.（小鸡刚开始出壳。）\n2. 比喻义：策划、酝酿（阴谋/计划）——最常用的就是这个\nThey hatched a plan to escape.（他们密谋了一个逃跑计划。） The thieves hatched a scheme to rob the bank.（窃贼策划了一起抢银行的阴谋。）\n注意：这个用法几乎总是带\"秘密、不光明正大\"的意味。说某人 hatch a plan，暗示这计划是偷偷摸摸酝酿出来的，多半不是什么好事。\n3. 名词：舱口、开口（飞机/船上的 hatch）\nThe cargo hatch was sealed.（货舱舱口被密封了。）","s":["1791"]},{"w":"haunt","d":"（鬼魂）经常出没于、缠着例句（人们说那座老房子闹鬼）例句（据","f":"v. （鬼魂）经常出没于、缠着\n例句：People say the old house is haunted.（人们说那座老房子闹鬼。）\n例句：A ghost is said to haunt the castle.（据说有鬼魂经常出没于这座城堡。）\n（回忆、想法等）萦绕心头、困扰\n指某事持续在脑海中挥之不去，使人不安。\n例句：The memory of the accident still haunts her.（那次事故的记忆仍萦绕在她心头。）\n例句：He was haunted by the fear of failure.（他被失败的恐惧所困扰。）\n经常光顾（某地）\n例句：This café is haunted by local artists.（这家咖啡馆是当地艺术家常去的地方。）\n二、名词义项：\n常去的地方、出没之处\n例句：The old library was a favorite haunt of students.（那座老图书馆曾是学生们最喜欢去的地方。）","s":["1791"]},{"w":"haven","d":"安全的地方、避难所指让人感到安全、可以躲避危险或麻烦的地方例","f":"安全的地方、避难所 —— 指让人感到安全、可以躲避危险或麻烦的地方\n例句：The small island was a haven for shipwrecked sailors.（这座小岛是遭遇海难的船员们的避难所。）\n例句：The garden is a haven of peace in the middle of the noisy city.（这座花园是喧闹城市中心一片宁静的乐土。）\n（动物的）栖息庇护地、保护区\n例句：The wetland is a haven for migratory birds.（这片湿地是候鸟的栖息庇护地。）港口、港湾（较古旧/文学用法）\n与 harbor（港口、庇护所） 意思相通。","s":["1791"]},{"w":"hazard","d":"危险；公害","f":"v. 危险；公害","s":["1791"]},{"w":"hazardous","d":"危险的、有害的、有风险的相比于（有明确可识别风险），更正式、","f":"adj. 危险的、有害的、有风险的\n相比于dangerous（有明确可识别风险），更正式、更技术化，常出现在科学、工业、环境、职业安全语境\n例句：Working in a coal mine is a hazardous job.（在煤矿工作是一项危险的工作。）\n例句：The mountain road is hazardous in winter.（这条山路冬天很危险。）\n有害的（健康/环境） —— 指对健康或环境有害\n例句：Smoking is hazardous to your health.（吸烟危害健康。）—— 经典例句，记住这个搭配\n例句：The factory releases hazardous chemicals into the river.（工厂向河里排放有害化学物质。）","s":["1791"]},{"w":"head","d":"头；向某处走去","f":"n. 头；v.向某处走去","s":["1791"]},{"w":"headstrong","d":"任性固执的、刚愎自用的贬义（任性的年轻人孩子），往往暗示年轻","f":"adj. 任性固执的、刚愎自用的。贬义。\nheadstrong youth / young man / child（任性的年轻人/孩子），往往暗示年轻气盛、缺乏经验。","s":["1791"]},{"w":"heedless","d":"不注意的、掉以轻心的、不顾（后果）的危险警告后果危险风险","f":"adj. 不注意的、掉以轻心的、不顾（后果）的\nbe heedless of + 危险/警告/后果/危险/风险","s":["1791"]},{"w":"helpless","d":"无助的","f":"adj. 无助的","s":["1791"]},{"w":"hence","d":"因此；所以；从今以后；从此","f":"adv. 因此；所以；从今以后；从此","s":["1675","1791"]},{"w":"heritage","d":"遗产，不可数（文化遗产）最常用，指历史文物、建筑、艺术、习俗","f":"n. 遗产，不可数。\ncultural heritage（文化遗产）：最常用，指历史文物、建筑、艺术、习俗等。\ninherit heritage（继承遗产）：虽然可搭配，但更侧重“继承”这个动作，常用于比喻，比如继承家族传统。\nprotect / preserve / conserve heritage（保护遗产）：三者都常用，preserve 侧重“保存原样”，conserve 侧重“合理利用地保护”。","s":["1791"]},{"w":"heyday","d":"全盛期","f":"n. 全盛期","s":["1925"]},{"w":"highlight","d":"突出显示；强调","f":"v. 突出显示；强调","s":["1925","1791"]},{"w":"hinder","d":"妨碍","f":"v. 妨碍","s":["1791"]},{"w":"homogeneous","d":"同质的；均匀的","f":"adj. 同质的；均匀的","s":["1675","1791"]},{"w":"hubbub","d":"人声鼎沸形容公共场所的人声嘈杂（最高频）媒体头条或政论中的舆","f":"n. 人声鼎沸\n形容公共场所的“人声嘈杂”（最高频）I couldn't hear the announcement over the hubbub of the airport terminal.\n媒体头条或政论中的“舆论哗然 / 争议骚动”（比喻义）Cause / Create a hubbub The CEO's controversial tweet caused quite a hubbub online. \n动物或自然界的群体鸣叫（比喻义）A hubbub of birds erupted from the trees when the cat approached.","s":["1791"]},{"w":"human","d":"人类的；人性的","f":"adj. 人类的；人性的","s":["1791"]},{"w":"hypersensitive","d":"非常敏感的","f":"非常敏感的","s":["1925"]},{"w":"hypothesis","d":"假设；假说","f":"n. 假设；假说","s":["1675","1925","1791"]},{"w":"i agree to some extent","d":"我在一定程度上同意","f":"phr. 我在一定程度上同意","s":["scenario"]},{"w":"i see your point but","d":"我明白你的观点，但是","f":"phr. 我明白你的观点，但是……","s":["scenario"]},{"w":"identical","d":"同一的","f":"adj. 同一的","s":["1675","1791"]},{"w":"identify","d":"认出","f":"v. 认出","s":["1791"]},{"w":"idiosyncrasy","d":"（个人独有的）特质、习性或怪癖（个人的小小的习性）最常用的温","f":"n.（个人独有的）特质、习性或怪癖\nPersonal / Little idiosyncrasy（个人的/小小的习性）：最常用的温和搭配。\nIdiosyncrasies of + 某人/某物：表示“……所特有的那些东西”。\n“She knows all the idiosyncrasies of her old car.”（她了解她那辆旧车所有的“小脾气”。）","s":["1791"]},{"w":"ignite","d":"使燃着","f":"v. 使...燃着","s":["1791"]},{"w":"ignoble","d":"不光彩的、卑鄙的、可耻的书卷气极重的贬义词（卑鄙的动机）最常","f":"adj. 不光彩的、卑鄙的、可耻的。书卷气极重的贬义词。\nIgnoble motives（卑鄙的动机）：最常用的组合，强调“出发点就不正”。\nIgnoble act / deed（不光彩的行为/事迹）。\nAn ignoble end / failure（不光彩的结局/失败）——形容虎头蛇尾、晚节不保。","s":["1791"]},{"w":"ignore","d":"忽视","f":"v. 忽视","s":["1791"]},{"w":"illegible","d":"难以辨认的（用于手写场景）眼睛看不清字母笔画比如字太草、墨水","f":"adj. 难以辨认的（90%用于手写场景）。眼睛看不清字母/笔画。比如字太草、墨水晕开。重点是“生理上”看不清。\nIllegible handwriting / signature（难以辨认的笔迹/签名）\nIllegible text / copy（无法阅读的文本/复印件）\nBecome / render something illegible（变得模糊不清 / 使……无法辨认）\n“The coffee stain rendered the address illegible.”（咖啡渍让地址变得无法辨认了。）","s":["1791"]},{"w":"illuminate","d":"照亮；照明；说明","f":"v. 照亮；照明；说明","s":["1791"]},{"w":"illusion","d":"幻觉","f":"n. 幻觉\nsb have the illusion that ...\nsth is an illusion","s":["1791"]},{"w":"illustrate","d":"说明","f":"v. 说明","s":["1791"]},{"w":"imaginary","d":"虚构的","f":"adj. 虚构的","s":["1791"]},{"w":"imbibe","d":"字面义喝液体，比喻义吸收文学描写小口品酒（书面语）","f":"v. 字面义喝液体，比喻义吸收。\n文学描写“小口品酒”（书面语）。","s":["1675","1791"]},{"w":"imitate","d":"模仿","f":"v. 模仿","s":["1675","1791"]},{"w":"immense","d":"巨大的；无限的","f":"adj. 巨大的；无限的","s":["1791"]},{"w":"immerse","d":"沉浸；给施洗礼","f":"v. 沉浸；给...施洗礼","s":["1675","1791"]},{"w":"immobile","d":"不能移动的描述的是一个客观的物理状态不是因为不想动，而是因为","f":"adj . 不能移动的。\n描述的是一个客观的物理状态——不是因为不想动，而是因为没有能力动或被牢牢固定住了。","s":["1791"]},{"w":"impact","d":"影响；作用；冲击","f":"v. 影响；作用；冲击","s":["1791"]},{"w":"impair","d":"损害","f":"v. 损害","s":["1791"]},{"w":"impale","d":"用尖物刺穿是穿个孔，是穿成串后卡住，像是串烧宾语刺穿的表面物","f":"v. 用尖物刺穿。Pierce 是\"穿个孔\"，Impale 是\"穿成串后卡住，像是串烧\"。\nImpale + 宾语 + on + 刺穿的表面/物体（强调“被固定在哪里”）\nget / be impaled on + 尖锐物体(fence（篱笆）、railing（栏杆）、handlebar（自行车把）)\nThe butterfly was impaled on a pin.（蝴蝶被钉在标本针上。——强调它在针上）\nImpale + 宾语 + with + 作案工具（强调“用什么刺的”）\nHe impaled his opponent with a spear.（他用长矛刺穿了对手。——强调武器是矛）","s":["1791"]},{"w":"impart","d":"传授把自己有的（知识、信息、特质），分给出去，让别人也拥有结","f":"v. 传授。把自己有的（知识、信息、特质），分给出去，让别人也拥有。\n结构一：impart + 内容 + to + 接收者（最核心，介词必须是 to）\nShe imparted her secret to her best friend.（她把秘密告诉了闺蜜。）\nThe program aims to impart practical skills to young adults.（这个项目旨在向年轻人传授实用技能。）\n结构二：impart + 内容 + 直接宾语（不说给谁听，只谈内容）\nThe book imparts a great deal of wisdom.（这本书传递了大量智慧。）\n结构三：被动语态（常用）：The information was imparted to...\nThe instructions were imparted to all staff members.（指示已传达给所有员工。）","s":["1791"]},{"w":"impartial","d":"公正的，无偏见的强调不带私心黄金搭档一（公平且公正）法律政治","f":"adj. 公正的，无偏见的。强调不带私心。\n黄金搭档一：Fair and impartial（公平且公正）—— 法律政治文本里的“固定连体婴”，就跟中文里的“公平公正”一样密不可分。\nEveryone is entitled to a fair and impartial trial.（人人有权获得公平公正的审判。）\n黄金搭档二：Impartial + 名词（修饰性极强）\nimpartial observer（公正的旁观者/观察员）\nimpartial advice（中肯的建议）","s":["1791"]},{"w":"impassioned","d":"充满激情的、慷慨激昂的带有悲壮感和道德重量，相比于和，更适用","f":"adj. 充满激情的、慷慨激昂的。\n带有悲壮感和道德重量，相比于Passionate和Enthusiastic，更适用于法庭正义辩护场景。\nImpassioned + speech / address（激昂的演讲）\nImpassioned + plea / appeal（恳切的请求/呼吁）\nImpassioned + defense / argument（激烈的辩护/论点）\nImpassioned + debate / discussion（热烈的辩论 —— 注意这里通常指面红耳赤的争论，而不是和平的聊天）","s":["1791"]},{"w":"impassive","d":"面无表情的、冷漠淡然的、无动于衷的不代表内心没有感情，但是表","f":"adj. “面无表情的”、“冷漠淡然的”、“无动于衷的”。(不代表内心没有感情，但是表面上看不出来)。\nRemained impassive（保持面无表情）—— 新闻标题最爱的用法\nImpassive face / expression（冷漠的脸/表情）—— 小说描写常用\nImpassive silence（冷漠的沉默）—— 指对方毫无反应，让你心里发毛","s":["1791"]},{"w":"impel","d":"驱使强调的是一种内在的、强烈的动力（比如良心、欲望、情感、责","f":"v. 驱使。强调的是一种内在的、强烈的动力（比如良心、欲望、情感、责任感），像一股无形的力量在后面推着你，让你不得不行动起来。\n主语（往往是抽象名词）+ impel + 人 + to do（动词不定式）Necessity impelled him to take the job.","s":["1791"]},{"w":"imperative","d":"当务之急的、必须服从的、不容置疑的结构一（满分句型）主语动词","f":"adj. 当务之急的、必须服从的、不容置疑的。\n结构一（满分句型）：It is imperative + that + 主语 + (should) + 动词原形\n⚠️ 重大警告：这个句型必须用虚拟语气！动词要用原形（不加 s，不加 ed）。\nIt is imperative that every employee be (注意不是 is) present at the meeting.（每位员工都必须出席会议。）\nIt is imperative that we act (不是 acts) now.（我们必须立刻行动。）\n结构二（简单实用）：It is imperative + to + 动词原形\nIt is imperative to maintain strict confidentiality.（严格保密是至关重要的。）","s":["1791"]},{"w":"impertinent","d":"以前指无关的，现在指冒失的（冒失的问题无礼的评论）（某人做某","f":"adj. 以前指\"无关的\"，现在指\"冒失的\"\nImpertinent + question / remark / comment（冒失的问题/无礼的评论）\nIt is impertinent of someone + to do...（某人做某事太冒失了）\nIt was impertinent of you to interrupt the chairman.（你打断主席讲话，太没分寸了。）","s":["1675","1791"]},{"w":"impervious","d":"刀枪不入、油盐不进、滴水不漏可用于物理和抽象层面主语攻击物刺","f":"adj. \"刀枪不入、油盐不进、滴水不漏\"。可用于物理和抽象层面。\n主语 + be impervious to + 攻击物/刺激物\nThe material is impervious to water.（这种材料防水。）\nHe is impervious to flattery.（他对奉承话无动于衷。——油盐不进）\nTeenagers often think they are impervious to danger.（青少年常觉得自己对危险免疫。——迷之自信）","s":["1791"]},{"w":"imposing","d":"宏伟壮观的可用于建筑、人物描写、旅游文学（威严的形象强大的气","f":"adj. 宏伟壮观的。可用于建筑、人物描写、旅游文学。\nImposing + figure / presence（威严的形象/强大的气场）\nImposing + building / structure / mansion（宏伟的建筑/宅邸）\nImposing + stature / height（高大的身材）\nImposing + list / task / challenge（庞大的清单/艰巨的任务）","s":["1791"]},{"w":"impressively","d":"令人难忘的","f":"adv. 令人难忘的","s":["1791"]},{"w":"impropriety","d":"不当行为（对不当行为的指控）政客新闻必背词组（财务性政治上的","f":"n. 不当行为。\nAllegations of impropriety（对不当行为的指控）—— 政客新闻必背词组\nFinancial / sexual / political impropriety（财务/性/政治上的不当行为）\nAny appearance of impropriety（任何看起来像不检点的苗头）—— 这是美式政治里的“避嫌金句”：We must avoid any appearance of impropriety.（我们必须避免任何可能引起不检点嫌疑的举动。）","s":["1791"]},{"w":"impure","d":"脏的；不纯洁的","f":"adj. 脏的；不纯洁的","s":["1791"]},{"w":"in other words","d":"换句话说","f":"phr. 换句话说","s":["scenario"]},{"w":"inborn","d":"天生的；先天的","f":"adj. 天生的；先天的","s":["1675","1791"]},{"w":"incandescent","d":"遇热发光的白炽的","f":"遇热发光的, 白炽的[mean]incandescent 是一个形容词，指的是发光的、白热化的或炽热的，特指物体因高温而发出明亮的光。[ph]incandescent light bulb[ph]glowed incandescent[ph]an incandescent performance","s":["1925"]},{"w":"incapacitate","d":"使丧失能力、使瘫痪、使无法运作美国人在日常闲聊（比如聊天气、","f":"v. “使丧失能力”、“使瘫痪”、“使无法运作”。美国人在日常闲聊（比如聊天气、聊晚饭）中几乎不用。但在看新闻、读报告、玩射击游戏、或者处理法律/医疗事务时，这个词出现的频率极高。\nBe incapacitated by + 原因（被……搞垮了）\nThe soldiers were incapacitated by the tear gas.（士兵们被催泪瓦斯搞得失去了行动力。）\nBe incapacitated from + doing（失去了做某事的资格/能力）\nHis age does not incapacitate him from running the company.（他的年龄并不妨碍他管理公司。——注意这里用否定，表示“虽老但能力尚在”）","s":["1791"]},{"w":"incessant","d":"没完没了的烦人名词（雨不停）、（噪音不断）、（投诉没完）、（","f":"adj. “没完没了的”\nIncessant + 烦人名词：incessant rain（雨不停）、incessant noise（噪音不断）、incessant complaints（投诉没完）、incessant questions（十万个为什么）\nThe incessant + 名词 + (动词短语)\nThe incessant barking of the dog kept me awake.（狗没完没了的叫声让我睡不着。）","s":["1791"]},{"w":"incipient","d":"初期的、刚刚开始的选它不是因为词汇炫耀，而是因为只有它能同时","f":"adj. 初期的、刚刚开始的\n选它不是因为词汇炫耀，而是因为只有它能同时表达“刚发生”+“不可逆地推进”+“通常不妙”。如果你只说 initial，听者只会问“然后呢？”；但你说 incipient，听者立刻会问“那该怎么办？”，这就是它的核心价值。\n· Incipient problem / crisis（初现端倪的问题/危机）\n· Incipient disease / infection（早期疾病/感染）\n· Incipient stage / phase（初始阶段）","s":["1791"]},{"w":"incisive","d":"尖锐的；深刻的","f":"adj. 尖锐的；深刻的","s":["1675","1791"]},{"w":"incite","d":"煽动（煽动暴力暴乱）新闻标题高频词（煽动仇恨叛乱）（煽动人群","f":"v. 煽动\n· Incite violence / riots（煽动暴力/暴乱）——新闻标题高频词\n· Incite hatred / rebellion（煽动仇恨/叛乱）\n· Incite a crowd / mob（煽动人群/暴民）","s":["1791"]},{"w":"inclined","d":"倾向的","f":"adj. 倾向的","s":["1791"]},{"w":"incoherent","d":"不连贯的（语无伦次的讲话）（前后矛盾的政策）（神志不清的病人","f":"adj. 不连贯的\n· Incoherent speech / rambling（语无伦次的讲话）\n· Incoherent policy / strategy（前后矛盾的政策）\n· Incoherent patient / witness（神志不清的病人/证人）","s":["1791"]},{"w":"incompetent","d":"不称职的","f":"adj. 不称职的","s":["1791"]},{"w":"incongruity","d":"不和谐母语者选它，是因为它描述的不是错误，而是审美或认知上的","f":"n. 不和谐。母语者选它，是因为它描述的不是“错误”，而是“审美或认知上的违和感”。\n· Incongruity between A and B（A与B之间的不协调）\n· Sense / element of incongruity（违和感/不协调元素）\n· Cultural / social incongruity（文化/社会层面的格格不入）","s":["1791"]},{"w":"incorruptible","d":"刚正不阿的，经得住考验的（刚正不阿的法官官员领袖）（坚不可摧","f":"adj. 刚正不阿的，经得住考验的\n· Incorruptible judge / official / leader（刚正不阿的法官/官员/领袖）\n· Incorruptible integrity / honesty（坚不可摧的正直/诚信）","s":["1791"]},{"w":"incredulity","d":"震惊的不可置信（难以置信地盯着某人）（怀疑地挑起眉毛）（震惊","f":"n. 震惊的不可置信\n· Stare / look at someone in incredulity（难以置信地盯着某人）\n· Raise one’s eyebrows in incredulity（怀疑地挑起眉毛）\n· A mixture of shock and incredulity（震惊与不可置信交织）","s":["1791"]},{"w":"indefinite","d":"无限期的，或者定义模糊的，不清晰的（无限期拘留暂停）（模糊的","f":"adj. 无限期的，或者定义模糊的，不清晰的\n· Indefinite detention / suspension（无限期拘留/暂停）\n· Indefinite outline / notion（模糊的轮廓/概念）","s":["1791"]},{"w":"indent","d":"缩排；订合同","f":"v./n. 缩排；订合同","s":["1791"]},{"w":"independent variable","d":"自变量","f":"n. 自变量","s":["scenario"]},{"w":"indicate","d":"指示；表示","f":"v. 指示；表示","s":["1791"]},{"w":"indignity","d":"侮辱（遭受屈辱）（使某人遭受屈辱）（做某事的屈辱）（他无法忍","f":"cn. 侮辱\nSuffer / endure / undergo an indignity（遭受屈辱）\nSubject someone to an indignity（使某人遭受屈辱）\nThe indignity of + doing something（做某事的屈辱）\nHe couldn't bear the indignity of asking his parents for money again.（他无法忍受再次向父母要钱的屈辱。）","s":["1791"]},{"w":"indomitable","d":"百折不挠的（不屈的精神）最经典（不屈的意志决心）（无畏的勇气","f":"adj. 百折不挠的。\nIndomitable + spirit（不屈的精神）—— 最经典\nIndomitable + will / determination（不屈的意志/决心）\nIndomitable + courage（无畏的勇气）\nIndomitable + fighter / warrior（不屈的斗士）","s":["1791"]},{"w":"induce","d":"诱发主语是人的时候，表达诱使某人做某事主语是客观事物时，表达","f":"v. 诱发。主语是人的时候，表达诱使某人做某事。主语是客观事物时，表达诱发了什么事情。\nsb. Induce + sb. + to do（诱导某人做某事）\nA reward may induce children to behave well.（奖励可能会诱导孩子们表现良好。）\nInduce + 客观结果（引发某种反应/状态）\nThis chemical induces a chemical reaction.（这种化学物质会引发化学反应。）","s":["1791"]},{"w":"induction","d":"归纳法感应就职入门","f":"n.归纳法,感应,就职,入门","s":["1675"]},{"w":"ineligible","d":"无资格的结构一（最常见）名词动名词（他没有资格申请奖学金）结","f":"adj. 无资格的\n结构一（最常见）：ineligible for + 名词/动名词\nHe is ineligible for the scholarship.（他没有资格申请奖学金。）\n结构二（第二高频）：ineligible to + 动词原形\nShe is ineligible to apply for citizenship.（她没有资格申请公民身份。）","s":["1791"]},{"w":"inertial","d":"惯性的特指与惯性（）物理原理相关的属性惯性导航系统惯性参考系","f":"adj. 惯性的。特指“与惯性（Inertia）物理原理相关”的属性。\nInertial navigation system (INS) —— 惯性导航系统\nInertial reference frame / Inertial frame of reference —— 惯性参考系","s":["1791"]},{"w":"inevitable","d":"不可避免的；必然的","f":"adj. 不可避免的；必然的","s":["1791"]},{"w":"infallible","d":"绝无差错的，永不出错的一般不用于形容人除非是教皇，否则会有反","f":"adj. “绝无差错的”，永不出错的。\n一般不用于形容人(除非是教皇)，否则会有反讽的意味。\nInstinct / Judgment / Eye（直觉/判断力/眼光）：指在某件事上，这个人准得离谱。\nInfallible + method / system / formula（万无一失的方法/系统/公式）\nInfallible + guide / test / proof（绝对可靠的指南/测试/证据）\nInfallible + memory / instinct（过目不忘的记忆力/从不出错的直觉）","s":["1791"]},{"w":"inference","d":"推论","f":"n.推论","s":["1675"]},{"w":"inflict","d":"把（不愉快、痛苦或沉重的东西）强行施加给某人（施加者）痛苦伤","f":"v. 把（不愉快、痛苦或沉重的东西）强行施加给某人。\nA（施加者） + inflict + 痛苦/伤害/惩罚 + on/upon + B（承受者）\n① 身体/战争暴力（最经典）\t“予以（重击/创伤）”\tThe bomb inflicted severe damage on the building.（炸弹对大楼造成了严重破坏。）\nHe inflicted a fatal wound on his opponent.（他给对手造成了致命伤。）\n② 心理/法律/行政（第二高频）\t“强加（痛苦、惩罚、税金）”\tThe judge inflicted a heavy fine on the company.（法官对公司处以巨额罚款。）\nDon't inflict your problems on others.（别把你的问题强加给别人。）\n③ 尴尬/社交（口语幽默用法）\t“硬要打扰、赖着不走”\tI won't inflict myself on you any longer.（我就不再打扰你了。——这是非常礼貌且地道的客套话，直译是“我不再把我自己强加给你了”）","s":["1791"]},{"w":"influential","d":"有影响的；有权势的","f":"adj. 有影响的；有权势的","s":["1791"]},{"w":"informal","d":"第一含义是非正式的，其次是随意的、不拘礼节的它描述的是一种不","f":"adj. 第一含义是“非正式的”，其次是随意的、不拘礼节的。它描述的是：一种不穿西装、不打领带、不按官方流程走的“放松状态”。\n① 服装/场合（最最经典）\t“休闲的”、“便装的”——指不用穿西装、不用打领带的场合。\tThe dress code is informal; feel free to wear jeans.（着装要求是非正式的，随意穿牛仔裤就行。）\nWe're having an informal gathering at my place.（我们在我家搞一个非正式的小聚。）\n② 语言/风格（写作口语必考）\t“口语化的”、“随意的”——指日常聊天用的词语，不用高大上的书面语。\t\"Gonna\" and \"wanna\" are informal expressions.（“Gonna”和“Wanna”是非正式表达。）\nThe tone of his email is too informal for a business proposal.（他的邮件语气对于商业提案来说太随意了。）\n③ 流程/制度（正式语境）\t“非官方的”、“不走程序的”——指没有通过正规会议或文件的讨论、协议。\tThey reached an informal agreement before signing the contract.（他们在签合同前达成了一项非正式协议。）\nLet's have an informal chat about your career plans.（咱们非正式地聊聊你的职业规划吧。）","s":["1791"]},{"w":"inherent","d":"固有的","f":"adj. 固有的","s":["1675","1791"]},{"w":"inherently","d":"内在地；固有地；天性地","f":"adv. 内在地；固有地；天性地","s":["1675"]},{"w":"initial","d":"初始的","f":"adj. 初始的","s":["1791"]},{"w":"inject","d":"注射；注入","f":"v. 注射；注入","s":["1791"]},{"w":"injure","d":"伤害；损害；损伤","f":"v. 伤害；损害；损伤","s":["1791"]},{"w":"injurious","d":"有害的，诽谤的造成实际损害不公（正式、偏法律道德，强调过错方","f":"adj. 有害的，诽谤的。“造成实际损害/不公”（正式、偏法律/道德，强调“过错方”造成了恶果）。\nBe injurious to + 名词（对...有害/有损）—— 绝对用 to！\n① 健康/生活方式（最常用）\t“对健康有害的”（比 unhealthy 更正式、更书面化）\tSmoking is injurious to health.（吸烟有害健康。——这是世界卫生组织经典用语！）\nA sedentary lifestyle is injurious to the spine.（久坐不动的生活方式对脊柱有害。）\n② 法律/言论（正式/新闻高频）\t“诽谤性的”、“损害名誉的”（指言论或报道对他人声誉造成法律层面的损害）\tThe article contained injurious accusations against the politician.（那篇文章包含了对该政客的诽谤性指控。）\nThe comments were highly injurious to his reputation.（这些评论对他的名誉造成了极大损害。）\n③ 社会/政治（严肃语境）\t“对社会/国家利益有害的”（指政策或行为损害了公共福祉）\tSuch policies are injurious to the public interest.（此类政策有损公共利益。）","s":["1791"]},{"w":"innate","d":"天生的才能天赋（最最常用）天生的才能本能不需要学，就是比别人","f":"adj. 天生的\n① 才能/天赋（最最常用）\t“天生的才能/本能”——不需要学，就是比别人敏锐。\tShe has an innate talent for music.（她有音乐天赋。——生来就会）\nHe possesses innate leadership qualities.（他具备天生的领导特质。）\n② 性格/感知（高级用法）\t“天生的感觉/恐惧/直觉”——写进基因里的反应。\tHumans have an innate fear of heights.（人类对高度有一种天生的恐惧。）\nHer innate sense of justice prevented her from staying silent.（她天生的正义感让她无法保持沉默。）\n③ 生物/医学（学术用法）\t“先天的（与后天相对）”——指生理上生来就有的特征或免疫。\tThis is an innate immune response, not an acquired one.（这是一种先天性免疫反应，而非后天获得的。）","s":["1675","1791"]},{"w":"innovation","d":"改革；革新","f":"n. 改革；革新","s":["1791"]},{"w":"innumerable","d":"不计其数的自然宇宙（最经典画面）无数的（星星沙粒生物）（银河","f":"adj. 不计其数的\n① 自然/宇宙（最经典画面）\t“无数的（星星/沙粒/生物）”\tThere are innumerable stars in the Milky Way.（银河系里有数不清的星星。）\nThe beach was covered in innumerable grains of sand.（海滩上覆盖着数不清的沙粒。）\n② 抽象/人生经历（文学最爱）\t“数不清的（理由/机会/回忆）”\tI have innumerable reasons to thank him.（我有数不清的理由要感谢他。）\nShe has faced innumerable challenges throughout her career.（她的职业生涯中面对过数不清的挑战。）\n③ 重复/频率（口语夸张）\t“无数次（强调次数极多）”\tI've told you innumerable times to clean your room.（我告诉过你无数次了，要打扫房间！）","s":["1791"]},{"w":"inordinate","d":"过度的它描述的是某事物的大小、数量或强度，已经远远超过了正常","f":"adj. 过度的。它描述的是：某事物的大小、数量或强度，已经远远超过了正常、合理或预期的范围，甚至到了“违规”或“有害”的程度。Inordinate 永远带着“不应该这样、这太过分了”的负面或批判色彩。你用它的时候，心里一定在皱眉。\n① 时间/等待（最最常用）\t“过长的、超出常理的（时间）”\tWe had to wait an inordinate amount of time for the results.（我们不得不等了极其漫长的时间才拿到结果。——潜台词：等得离谱了！）\nHe spends an inordinate amount of time on social media.（他在社交媒体上花了过多的时间。）\n② 金钱/数量（经济高频）\t“过高的、巨额到失当的（花费/利润）”\tThe project consumed an inordinate share of the budget.（这个项目占用了预算中过高的一部分。）\nShe paid an inordinate price for that handbag.（她为那个手提包付了高得离谱的价格。）\n③ 情绪/欲望（心理描写）\t“过度的、极端的（骄傲/愤怒/食欲）”\tHe took an inordinate pride in his appearance.（他对自己的外表有一种过度的骄傲。——潜台词：自恋得有点病态了。）\nShe displayed an inordinate amount of anger over a minor issue.（她对一件小事表现出了过度的愤怒。）","s":["1791"]},{"w":"inquiry","d":"调查；研究","f":"n. 调查；研究","s":["1791"]},{"w":"insert","d":"插入","f":"v. 插入","s":["1791"]},{"w":"insignificant","d":"无关紧要的可忽略的无意义的","f":"无关紧要的, 可忽略的, 无意义的","s":["1925"]},{"w":"insinuate","d":"迂回进入，暗示拐弯抹角地暗示（通常指负面或不好明说的事），以","f":"v. 迂回进入，暗示\n “拐弯抹角地暗示”（通常指负面或不好明说的事），以及 “巧妙地潜入/插入”（物理或社交层面）。\n含沙射影、旁敲侧击（负面暗示）insinuate (that) + 从句（暗示某事）insinuate + 名词 + into + 某处（把某种观点悄悄植入）","s":["1791"]},{"w":"inspect","d":"检查；视察","f":"v. 检查；视察","s":["1791"]},{"w":"install","d":"安装；设置","f":"v. 安装；设置","s":["1791"]},{"w":"instigate","d":"煽动、挑起、发起事件行为（煽动某人去做某事）考试高频结构（头","f":"v. “煽动、挑起、发起”\nInstigate + 事件/行为 instigate violence / a strike / legal proceedings\nInstigate sb to do sth（煽动某人去做某事）—— 考试高频结构 The ringleader instigated the crowd to attack the police.（头目煽动人群去攻击警察。）","s":["1791"]},{"w":"instinctive","d":"天生的；本能的","f":"adj. 天生的；本能的","s":["1675","1791"]},{"w":"instrument","d":"仪器；工具；乐器","f":"n. 仪器；工具；乐器","s":["1791"]},{"w":"instrumental","d":"有帮助的；仪器的；机械的","f":"adj. 有帮助的；仪器的；机械的","s":["1791"]},{"w":"insubordinate","d":"不服从的；桀骜不驯的","f":"adj. 不服从的；桀骜不驯的","s":["1791"]},{"w":"insufferable","d":"难以忍受的","f":"adj. 难以忍受的","s":["1791"]},{"w":"insufficient","d":"不足的，不够的","f":"不足的，不够的","s":["1925"]},{"w":"insult","d":"侮辱；凌辱","f":"v. n. 侮辱；凌辱","s":["1791"]},{"w":"insurmountable","d":"不能克服的不能超越的","f":"不能克服的, 不能超越的","s":["1925"]},{"w":"intellectual","d":"智力的","f":"adj. 智力的","s":["1791"]},{"w":"intelligible","d":"可理解的可理解的、能听懂的、清晰易懂的强调的不是内容简单，而","f":"adj. 可理解的\nIntelligible = “可理解的、能听懂的、清晰易懂的”\n强调的不是“内容简单”，而是信号或表达足够清晰，让听者/读者能够抓取到意思。\n例句：She was so upset that her speech was barely intelligible.（她太激动了，说话几乎听不清。）\n例句：The doctor's handwriting is not intelligible to anyone.（这位医生的字谁都看不懂。）","s":["1791"]},{"w":"intense","d":"非常的；紧张的","f":"adj. 非常的；紧张的","s":["1925","1791"]},{"w":"intensify","d":"加强（使）变得更强烈、更剧烈、更尖锐（程度上的加剧，而不是数","f":"v. 加强\nIntensify = （使）变得更强烈、更剧烈、更尖锐（程度上的加剧，而不是数量上的增多）\n它描述的永远是强度、力度、烈度的变化，而不是数量或尺寸。\n例句：The fighting intensified overnight.（战斗在夜间加剧了。）\n例句：His anger intensified when he heard the news.（听到消息后，他的愤怒加剧了。）","s":["1791"]},{"w":"intensive","d":"集中的密集的、集约的、需要高度投入的它强调的是在短时间内集中","f":"adj. 集中的\nIntensive = “密集的、集约的、需要高度投入的”\n它强调的是在短时间内集中大量精力、资源或活动，而不是指情感或物理上的“强烈”。\n例句：She took an intensive course in Spanish.（她上了一个西班牙语强化课程。）\n例句：The job is very intensive and requires long hours.（这份工作强度很大，需要长时间投入。）","s":["1791"]},{"w":"intercede","d":"调停，调解为某人说情求情最常用，强调受益对象向某人（当权者）","f":"v.调停，调解\nintercede for sb.\t为某人说情/求情\t最常用，强调受益对象\nintercede with sb.\t向某人（当权者）求情\t强调求情的对象是谁\nintercede on behalf of sb.\t代表某人说情\t正式用法，等于 intercede for\nintercede in sth.\t介入/调解某事\t强调介入的事务或争端","s":["1791"]},{"w":"intercept","d":"中途拦截；阻止","f":"v. 中途拦截；阻止","s":["1791"]},{"w":"interest","d":"兴趣；利息","f":"n. 兴趣；利息","s":["1791"]},{"w":"interfere","d":"干涉；干预；妨碍","f":"v. 干涉；干预；妨碍","s":["1791"]},{"w":"interior","d":"内部","f":"adj. 内部","s":["1675","1791"]},{"w":"interject","d":"突然插入","f":"v. 突然插入","s":["1791"]},{"w":"intermediate","d":"中级的中间的、居中的；中级水平的核心概念就是在两端之间，可以","f":"adj. 中级的\nIntermediate = “中间的、居中的；中级水平的”\n核心概念就是“在两端之间”，可以作形容词、名词、动词。\n例句（形容词）：She has an intermediate level of English.（她的英语是中级水平。）\n例句（名词）：I'm an intermediate in Chinese chess.（我中国象棋是中级水平。）\n例句（动词）：The teacher intermediated the dispute between the two students.（老师调停了两个学生之间的争执——正式用法，等于 mediate）","s":["1675","1791"]},{"w":"internal","d":"内在的","f":"adj. 内在的","s":["1675","1791"]},{"w":"intervene","d":"干涉","f":"v. 干涉","s":["1791"]},{"w":"intricate","d":"错综复杂的；难懂的","f":"adj. 错综复杂的；难懂的","s":["1791"]},{"w":"intrinsic","d":"本质的；本身的","f":"adj. 本质的；本身的","s":["1675","1791"]},{"w":"inure","d":"使习惯（）","f":"v. 使习惯（inure to）","s":["1791"]},{"w":"invade","d":"侵入；侵犯","f":"v. 侵入；侵犯","s":["1791"]},{"w":"inverse","d":"相反的反数","f":"adj. 相反的 / n. 反数","s":["1675","1791"]},{"w":"invert","d":"倒转","f":"v. 倒转","s":["1675","1791"]},{"w":"investigate","d":"调查；研究","f":"v. 调查；研究","s":["1791"]},{"w":"involuntary","d":"自然而然的，无意的","f":"自然而然的，无意的","s":["1925"]},{"w":"irradiate","d":"照射","f":"照射 [ph] ~ sth. with sth. [syn] 区别: \"irradiate\"、\"shine\"、\"illuminate\"、\"beam\" 都表示照射或照明物体或区域。然而，它们在用法和强调上有所不同。\"irradiate\" 强调使用光、辐射或能量对物体进行照射，通常用于科学、医学或技术上的研究和应用。\"shine\" 指物体表面反射光线或发出光亮，可以是自然光、人工光或物体自身的光。\"illuminate\" 意味着用光线或照明设备照亮某个区域，以提供光线或清晰度。\"beam\" 强调光线以集中、明亮或有力的方式照射，可以指激光束、聚光灯束等。","s":["1925"]},{"w":"irreconcilable","d":"不可调和的","f":"adj. 不可调和的","s":["1791"]},{"w":"irrelevant","d":"离题的；无关的","f":"adj. 离题的；无关的","s":["1675","1925","1791"]},{"w":"irrepressible","d":"抑制不住的","f":"adj. 抑制不住的","s":["1791"]},{"w":"irreproachable","d":"无可指责的","f":"adj. 无可指责的","s":["1791"]},{"w":"irresistible","d":"不可抗拒的","f":"adj. 不可抗拒的","s":["1925","1791"]},{"w":"irresolute","d":"犹豫不决的","f":"adj. 犹豫不决的","s":["1791"]},{"w":"irreverence","d":"不尊敬","f":"不尊敬[ph]show irreverence towards sth.","s":["1925"]},{"w":"irreverent","d":"不敬的；无礼的","f":"adj. 不敬的；无礼的","s":["1925","1791"]},{"w":"irreversible","d":"不能撤回的，不能取消的","f":"不能撤回的，不能取消的[ph]the action is irreversible","s":["1925"]},{"w":"irrevocable","d":"不可撤销的","f":"adj. 不可撤销的","s":["1791"]},{"w":"isolate","d":"使隔离","f":"v. 使隔离","s":["1791"]},{"w":"issue","d":"问题；出版；发行；期；发行","f":"n. 问 o make maple syrup.[st]She woke up feeling full of sap[syn]\"sap\" 和 \"juice\" 都可以指树液或液体，但 \"sap\" 通常用于指树木流出的液体，而 \"juice\" 更广泛地用于液体的含义，可以指果汁等。\"sap\" 和 \"vitality\" 都可以指精力或活力，但 \"sap\" 带有逐渐消耗的含义，而 \"vitality\" 更强调生命力或活力的程度。\"sap\" 和 \"weaken\"、\"drain\" 都可以表示削弱或耗尽，但 \"sap\" 强调逐渐削弱或耗尽。","s":["1925"]},{"w":"sapphire","d":"蓝宝石","f":"蓝宝石[ph]a beautiful sapphire ring[st]The sky turned sapphire as the sun set over the horizon[st]The necklace was adorned with sapphire and diamond gemstones.","s":["1925"]},{"w":"sarcastic","d":"讽刺的，挖苦的","f":"讽刺的，挖苦的[ph]make a sarcastic comment about[st]Her sarcastic tone made it clear that she didn't believe a word he said[ph]The sarcastic remarks from the audience[syn]\"sarcastic\"、\"mocking\"和\"sardonic\" 都可以形容讽刺的特点。\"sarcastic\" 强调以嘲讽和挖苦的方式表达，通常带有一种尖刻的幽默感。\"mocking\" 更强调嘲笑或嘲弄的态度，可能没有\"sarcastic\" 那么尖酸刻薄。\"sardonic\" 更强调嘲讽的冷嘲热讽，带有一种冷峻、嘲弄的特点。","s":["1925"]},{"w":"satisfactory","d":"令人满意的，符合要求的","f":"令人满意的，符合要求的","s":["1925"]},{"w":"saturated","d":"饱和的；浸透的","f":"adj. 饱和的；浸透的","s":["1925"]},{"w":"save","d":"拯救；保留","f":"拯救；保留","s":["1925"]},{"w":"savings","d":"储蓄，存款","f":"储蓄，存款","s":["1925"]},{"w":"scan","d":"扫描；细看，审视","f":"扫描；细看，审视","s":["1925"]},{"w":"scarce","d":"缺乏的，稀有的，罕见的","f":"缺乏的，稀有的，罕见的","s":["1925"]},{"w":"scarcely","d":"是一个副词，表示几乎不、几乎没有，用来强调某事非常少或接近不","f":"scarcely 是一个副词，表示几乎不、几乎没有，用来强调某事非常少或接近不存在。[st]The weather was so hot that there was scarcely any shade to find[st]She had scarcely started her new job[st]The book was so engaging that he could scarcely put it down[syn]\"Scarcely\"、\"hardly\"、\"barely\" 和 \"almost not\" 都有关于几乎不或几乎没有的意思，它们在使用上非常接近。\"Scarcely\" 和 \"hardly\" 通常可以互换使用，都表示几乎不或几乎没有。\"Barely\" 表示几乎不或刚刚够，强调程度更接近几乎不及格的程度。\"Almost not\" 表示几乎不，与 \"scarcely\" 和 \"hardly\" 的意思相同，但相对较口语化。总的来说，\"scarcely\"、\"hardly\"、\"barely\" 和 \"almost not\" 都表示几乎不或几乎没有，可根据语境和个人喜好选择使用。这些词汇用于强调某事物极少或接近不存在的情况。","s":["1925"]},{"w":"scare","d":"惊吓，使受惊","f":"惊吓，使受惊","s":["1925"]},{"w":"scarlet","d":"猩红的，鲜红的","f":"猩红的，鲜红的[ph]a scarlet dress[ph]the :["1675","1791"]},{"w":"extemporaneous","d":"即席的即兴演讲致辞（最核心用法）她发表了一篇即兴演讲，感动了","f":"adj. 即席的\n1. 即兴演讲/致辞（最核心用法）\nShe delivered an extemporaneous speech that moved the entire audience.\n她发表了一篇即兴演讲，感动了全场。\n区别于 impromptu（毫无准备），extemporaneous 通常指有准备但不照稿念。\n2. 即兴表演/音乐\nHis extemporaneous guitar solo stole the show.\n他即兴的吉他独奏抢尽了风头。\n3. 临场发挥/应付\nIt was an extemporaneous solution to an unexpected problem.\n那是针对突发问题的临时应对办法。","s":["1675","1791"]},{"w":"extinct","d":"熄灭的，灭绝的（灭绝）（恐龙在万年前灭绝了）（许多物种因气候","f":"adj. 熄灭的，灭绝的\ngo extinct（灭绝）\nDinosaurs went extinct 65 million years ago.（恐龙在6500万年前灭绝了。）\nMany species are going extinct due to climate change.（许多物种因气候变化而灭绝。）\nbe extinct from + 地点（在某地灭绝）","s":["1791"]},{"w":"extinction","d":"灭绝名词（恐龙的灭绝发生在万年前）原因（物种因栖息地丧失而有","f":"n. 灭绝\nthe extinction of + 名词 The extinction of dinosaurs occurred 65 million years ago.（恐龙的灭绝发生在6500万年前。）\nextinction from + 原因 Species are at risk of extinction from habitat loss.（物种因栖息地丧失而有灭绝风险。）\nextinction by + 手段 The extinction by human hunting is well documented.（因人类捕猎而灭绝有充分记载。）\n\nface extinction 面临灭绝\nbe threatened with extinction 受到灭绝威胁\nbe on the brink of extinction\t处于灭绝边缘\nbe in danger of extinction\t有灭绝危险\ndrive to extinction\t导致灭绝（人为）","s":["1791"]},{"w":"former","d":"以前的；前任的；前者","f":"adj. 以前的；前任的；n. 前者","s":["1791"]},{"w":"hasty","d":"匆忙的；仓促的；轻率的；草率的","f":"adj. 匆忙的；仓促的；轻率的；草率的","s":["1675","1791"]},{"w":"immediate","d":"立即的","f":"adj. 立即的","s":["1791"]},{"w":"incur","d":"蒙受招致（招致处罚罚款）（产生费用","f":"v. 蒙受 招致。\n· Incur a penalty / fine（招致处罚/罚款）\n· Incur a charge / fee（产生费用)\n• incur sb's anger","s":["1675","1791"]},{"w":"infer","d":"推知","f":"v. 推知","s":["1675","1791"]},{"w":"instantaneous","d":"瞬间的；即可的","f":"adj. 瞬间的；即可的","s":["1675","1791"]},{"w":"interlude","d":"幕间休息；插曲","f":"n. 幕间休息；插曲","s":["1675","1791"]},{"w":"juncture","d":"关头；接合处","f":"n. 关头；接合处","s":["1675","1791"]},{"w":"lasting","d":"持久","f":"adj. 持久","s":["1791"]},{"w":"lately","d":"最近","f":"adv. 最近","s":["1791"]},{"w":"long","d":"渴望","f":"v. 渴望","  + A + with + B（用 B 注满 A）\nShe infused the party with energy.（她用活力注满了这个派对。）\n结构二（同样常见）：Infuse + B + into + A（把 B 注入 A 里）\nShe infused energy into the party.（她把活力注入了派对。）","s":["1675","1791"]},{"w":"itinerant","d":"巡回的；流动的","f":"adj. 巡回的；流动的","s":["1675","1791"]},{"w":"meander","d":"曲曲折折地流；蜿蜒，弯曲","f":"v 曲曲折折地流；蜿蜒，弯曲","s":["1675"]},{"w":"moisten","d":"弄湿，使湿润","f":"v.弄湿，使湿润","s":["1675"]},{"w":"overflow","d":"从中溢出","f":"vt.从...中溢出","s":["1675"]},{"w":"permeate","d":"扩散；渗透","f":"v.扩散；渗透","s":["1675"]},{"w":"puddle","d":"（路上的）水坑，污水坑","f":"n （路上的）水坑，污水坑","s":["1675","1925"]},{"w":"splash","d":"溅，泼溅湿；溅泼作为动词，表示液体或其他物质突然或猛烈地飞溅","f":"溅，泼 v. 溅湿；溅泼。作为动词，表示液体或其他物质突然或猛烈地飞溅或撞击其他表面，通常产生声音和水花。[ph]splashing in the pool[ph]splash hot soup when stirring it in the pot.n.溅湿声；飞溅的液体。作为名词，指由液体撞击表面所产生的声音或水花。[ph]The splash of the waves[ph]there were splashes of mud on the sidewalk","s":["1675","1925"]},{"w":"spout","d":"喷出；滔滔不绝地讲","f":"v.喷出；滔滔不绝地讲","s":["1675"]},{"w":"spray","d":"喷雾喷射，喷溅","f":"喷雾, 喷射，喷溅 n./v. [ph] spray bottle [ph] spray of water [ph] sprayed the crops","s":["1675","1925"]},{"w":"spurt","d":"喷出，涌出","f":"v. 喷出，涌出","s":["1675"]},{"w":"squirt","d":"喷射；喷出（液体）；喷流；少量液体","f":"v./n. 喷射；喷出（液体）；喷流；少量液体","s":["1675","1925"]},{"w":"submerge","d":"使浸在水中，潜水；沉没，淹没；消失","f":"v 使浸在水中，潜水；沉没，淹没；消失","s":["1675","1925"]},{"w":"synchronize","d":"同步，同时发生","f":"vt. 同步，同时发生","s":["1675","1925"]},{"w":"trickle","d":"成小股流动；细流","f":"v.成小股流动；n.细流","s":["1675","1925"]}]},{"name":"情绪与心理 Emotions & Psychology","emoji":"🧠","words":[{"w":"abashed","d":"羞愧的；局促不安的","f":"adj. 羞愧的；局促不安的","s":["1675","1791"]},{"w":"aghast","d":"惊骇（对感到惊骇）唯一且最核心的介词搭配，用极少用（惊愕地站","f":"adj. 惊骇\nbe aghast at something（对……感到惊骇）—— 唯一且最核心的介词搭配，用 at。极少用 by。\nstand aghast（惊愕地站着/呆若木鸡）—— 经典文学描写句式。\nlook / stare aghast（目瞪口呆地看着）—— 描述表情的绝佳动词","s":["1791"]},{"w":"agonize","d":"指向内心决策时译为纠结（最地道口语）或苦苦思索；指向身心痛苦","f":"v. 指向内心决策时译为 纠结（最地道口语）或 苦苦思索；指向身心痛苦时译为 受折磨 或 痛苦挣扎。\nagonize over something（因某事而纠结/痛苦）—— 最核心搭配，介词用 over，偶尔也接 about。\nagonize over a decision / choices（纠结于某个决定/某些选择）。\nagonize for hours / days（纠结了几个小时/好几天）—— 强调时间之长\nagonized expression / cry（痛苦的表情/哀嚎）—— 形容词/过去分词作定语时的用法。","s":["1791"]},{"w":"amazed","d":"惊讶的；惊奇的","f":"adj. 惊讶的；惊奇的","s":["1791"]},{"w":"anguish","d":"极致精神痛苦、内心撕裂（处于极度痛苦中）、（因而痛苦）、（精","f":"n. 极致精神痛苦、内心撕裂\nin anguish（处于极度痛苦中）、anguish over/about（因……而痛苦）、mental/emotional anguish（精神/情感上的极度痛苦）existential anguish（生存苦恼/存在性焦虑）a cry of anguish（痛苦的哭喊）、anguished look（痛苦的表情—形容词形式）","s":["1791"]},{"w":"anxious","d":"焦躁不安、忧心忡忡或极度渴望、迫不及待名词（对感到担心）、名","f":"adj. “焦躁不安、忧心忡忡”或 “极度渴望、迫不及待”\nanxious about + 名词（对……感到担心）、anxious for + 名词（替……担心）\nanxious to do（急切地想做某事）、anxious for + 名词（渴望得到……）\nanxious moment/wait（令人焦虑的时刻/等待）","s":["1791"]},{"w":"apathetic","d":"冷漠的；无动于衷的","f":"adj. 冷漠的；无动于衷的","s":["1791"]},{"w":"astonish","d":"使惊讶","f":"v. 使惊讶","s":["1791"]},{"w":"astonished","d":"惊讶的","f":"adj. 惊讶的","s":["1791"]},{"w":"astound","d":"使惊异","f":"v. 使惊异","s":["1675","1791"]},{"w":"awkward","d":"笨拙的；尴尬的","f":"adj. 笨拙的；尴尬的","s":["1791"]},{"w":"bashful","d":"害羞的，胆小的（害羞的小孩）、（腼腆的一笑）、（对做感到不好","f":"adj. 害羞的，胆小的\na bashful child（害羞的小孩）、a bashful smile（腼腆的一笑）、be bashful about doing（对做……感到不好意思） a bashful look（羞怯的神情）、bashful hesitation（因害羞而犹豫）","s":["1791"]},{"w":"behavioral pattern","d":"行为模式","f":"n. 行为模式","s":["scenario"]},{"w":"bewilder","d":"迷惑；把弄糊涂","f":"v. 迷惑；把弄糊涂","s":["1791"]},{"w":"bliss","d":"极乐至福（婚姻的幸福）、（家庭天伦之乐）、（无知是福）、（纯","f":"n. 极乐 / 至福\nwedded/marital bliss（婚姻的幸福）、domestic bliss（家庭天伦之乐）、ignorance is bliss（无知是福）、pure/sheer bliss（纯粹的极乐）\na bliss to do（做……是极大的享受）、sheer bliss（纯粹的享受）","s":["1675","1791"]},{"w":"boredom","d":"无聊厌倦（无聊死了）、（出于无聊）、（无聊感）、（排解无聊）","f":"n. 无聊 / 厌倦\ndie of boredom（无聊死了）、out of boredom（出于无聊）、a feeling of boredom（无聊感）、relieve boredom（排解无聊）\nthe boredom of daily routine（日常生活的枯燥）、the sheer boredom of the job（那份工作的极度单调）","s":["1791"]},{"w":"boring","d":"令人厌烦的；钻孔","f":"n. 令人厌烦的；钻孔","s":["1791"]},{"w":"bothersome","d":"令人厌恶的；麻烦的","f":"a.令人厌恶的；麻烦的","s":["1675"]},{"w":"brisk","d":"活泼的轻快的（轻快的步伐）、（以快速）、（麻利的动作）（生意","f":"adj. 活泼的,轻快的\na brisk walk/pace（轻快的步伐）、at a brisk speed（以快速）、brisk movement（麻利的动作）\nbrisk business（生意兴隆）、brisk sales（销售旺盛）、a brisk market（交易活跃的市场）","s":["1675","1791"]},{"w":"captivate","d":"迷住；强烈吸引","f":"v. 迷住；强烈吸引","s":["1791"]},{"w":"cheerless","d":"无精打采的，无生命力的","f":"无精打采的，无生命力的","s":["1675"]},{"w":"chill","d":"冷却放松冷淡（受寒着凉）、（清晨的寒意）、（让人脊背发凉）（","f":"v. 冷却 / 放松 / 冷淡\ncatch a chill（受寒/着凉）、the chill of the morning（清晨的寒意）、send a chill down sb's spine（让人脊背发凉）\nchill the wine（冰镇葡萄酒）、chill in the fridge（在冰箱里冷藏）\nchill out（放松点）、take a chill pill（冷静一下）、just chill（淡定/别急）\na. 冷静的、随和的、放松的、酷的（不紧张）\nShe’s a really chill teacher. （她是个很随和的老师。——老师不严、不事儿多。）\nThe music here is very chill. （这儿的音乐很舒缓/听着很放松。）\nn. 寒冷、凉意（物理上的冷，或比喻“寒意”）\nThere's a chill in the air. （空气里有股寒意。）\nA chill ran down my spine. （我脊背发凉。——一般表示害怕或激动。）","s":["1791"]},{"w":"chilly","d":"阴冷冷淡（寒冷的早晨）、（冷飕飕的风）、（感觉冷）、（变冷）","f":"adj. 阴冷 / 冷淡\na chilly morning（寒冷的早晨）、chilly wind（冷飕飕的风）、feel chilly（感觉冷）、get chilly（变冷）\na chilly welcome/reception（冷淡的接待）、a chilly stare（冷眼）、chilly relationship（冷淡的关系）、chilly tone（冷淡的语气）\na chilly silence（令人心寒的沉默）、a chilly feeling（一阵寒意）","s":["1791"]},{"w":"cognitive development","d":"认知发展","f":"n. 认知发展","s":["scenario"]},{"w":"cower","d":"畏缩；蜷缩","f":"v. 畏缩；蜷缩","s":["1675","1791"]},{"w":"crazy","d":"狂热的","f":"adj. 狂热的","s":["1791"]},{"w":"daze","d":"恍惚处于恍惚茫然状态使某人眩晕使某人茫然被某事搞得晕头转向","f":"n. 恍惚\nin a daze — 处于恍惚／茫然状态\ndaze someone — 使某人眩晕／使某人茫然\nbe dazed by something — 被某事搞得晕头转向","s":["1675","1791"]},{"w":"dazzle","d":"眩目使某人目眩使某人惊叹","f":"v. 眩目\ndazzle someone — 使某人目眩／使某人惊叹","s":["1791"]},{"w":"dejected","d":"失落的；沮丧的","f":"adj. 失落的；沮丧的","s":["1675","1791"]},{"w":"deplore","d":"强烈谴责；痛惜；哀叹","f":"v. 强烈谴责；痛惜；哀叹","s":["1675","1791"]},{"w":"derange","d":"扰乱扰乱系统计划日程使某人精神错乱失衡（形容词过去分词，极高","f":"vt. 扰乱\nderange the system / plan / schedule — 扰乱系统／计划／日程\nderange someone's mind / mental balance — 使某人精神错乱／失衡\nmentally deranged（形容词过去分词，极高频）— 精神错乱的","s":["1675","1791"]},{"w":"disarrange","d":"物理意义上的弄乱且美国人基本不用，比较过时","f":"v. (物理意义上的)弄乱(且美国人基本不用，比较过时)","s":["1675","1791"]},{"w":"dismay","d":"沮丧突然被打击到不知所措的心慌或沮丧（否定去除）（力量能力）","f":"n. 沮丧。Dismay = 突然被打击到不知所措的“心慌”或“沮丧”。Dismay = Dis（否定/去除） + May（力量/能力）（源自拉丁语 magus，意为“力量”）。\nto one's dismay — 令某人沮丧／惊慌的是 To my dismay, I realized I had lost my wallet.\nwith dismay — 沮丧地／惊慌地\nexpress / show dismay — 表示／流露出沮丧\nv.\ndismay at something — 对某事感到惊慌／沮丧\nbe dismayed to find / learn / discover something — 发现某事时感到沮丧","s":["1675","1791"]},{"w":"downcast","d":"垂头丧气的、沮丧的，但在描绘神态时，最传神的译法是低垂着眼的","f":"adj. 垂头丧气的、沮丧的，但在描绘神态时，最传神的译法是低垂着眼的或目光低垂的。\nbe / feel downcast\t感到沮丧 / 意气消沉\tHe felt downcast about the team's loss. (他对球队的失利感到沮丧。)\nlook downcast\t看起来垂头丧气的\tWhy do you look so downcast today? (你今天怎么看起来这么没精打采？)\nwith downcast eyes / gaze\t低垂着眼睛 / 目光朝下地\tShe listened with downcast eyes, saying nothing. (她低垂着眼睛听着，一言不发。)\nbecome / grow downcast\t变得沮丧起来\tHis spirits grew downcast as the rain continued. (随着雨下个不停，他的情绪变得低落起来。)","s":["1675","1791"]},{"w":"dread","d":"惧怕、极度担心或惶恐它的核心在于对即将发生的坏事感到强烈的不","f":"v.n. 惧怕、极度担心或惶恐。它的核心在于“对即将发生的坏事感到强烈的不安和恐惧”，比普通的“害怕”更具压迫感和忧虑感。\ndread doing sth.\t害怕做某事（指具体行为）\tHe dreads having to give a speech in public. (他非常害怕不得不当众演讲。)\ndread to think\t不敢想（指后果太糟，不敢想象）\tI dread to think what might happen next. (我不敢想接下来会发生什么。)\nlive in dread of (sth.)\t活在……的恐惧中（长期状态）\tThey live in dread of the next earthquake. (他们一直活在下一次地震的恐惧中。)\nhave a dread of (sth.)\t对……有强烈的恐惧\tShe has a dread of flying. (她对坐飞机有强烈的恐惧感。)","s":["1675","1791"]},{"w":"dubious","d":"半信半疑的、将信将疑的，或者形容事物时译为可疑的、靠不住的它","f":"adj. 半信半疑的、将信将疑的，或者形容事物时译为可疑的、靠不住的。它的核心在于“心里犯嘀咕，对某事拿不准、觉得不靠谱”。(这个词在美国人的脑子里，自带“一脸不信地眯起眼睛”的表情包。)\nbe dubious about (sth./doing sth.)\t对……存有疑虑 / 半信半疑\tShe is dubious about investing in such a risky project. (她对投资这么高风险的项目存有疑虑。)\ndubious of (sb.)\t不信任某人\tI'm dubious of his motives. (我怀疑他的动机。)\nsound / seem dubious\t听起来 / 看起来可疑\tThat excuse sounds dubious to me. (那个借口我听起来觉得有问题。)","s":["1791"]},{"w":"eager","d":"渴望的；热心的","f":"adj. 渴望的；热心的","s":["1791"]},{"w":"ecstasy","d":"恍惚，狂喜指极致的快乐狂喜、心醉神迷中彩票时她陷入狂喜指宗教","f":"n. 恍惚，狂喜\n指极致的快乐——“狂喜”、“心醉神迷” She was in ecstasy when she won the lottery. (中彩票时她陷入狂喜。)\n指宗教/艺术体验——“出神”、“忘我” The music sent the audience into ecstasy. (音乐让观众陷入沉醉忘我的状态。)\ngo into ecstasies over (sth.)：对……欣喜若狂（强调外露的兴奋反应）。例：She went into ecstasies over the new handbag. (她看到新包欣喜若狂。)","s":["1675","1791"]},{"w":"elation","d":"欣喜就是上头的高兴，记住搭配就能应对绝大多数场景描述感到欣喜","f":"n. 欣喜。elation 就是“上头的高兴”，记住搭配 a sense of elation 就能应对绝大多数场景。\n1. 描述“感到欣喜”的通用动词搭配\nfeel elation / experience elation：强调内心感受。\n例：I felt a rush of elation when I heard my name called.\n（听到自己的名字被叫到时，我涌上一阵欣喜。）\n2. 描述“充满或淹没于欣喜”的强化搭配\n\nbe filled with elation：充满欣喜。\nbe overcome with elation：被欣喜淹没（程度更强，常用于叙事）。\n例：She was overcome with elation as she held the trophy above her head.\n（她把奖杯举过头顶时，欣喜若狂。）\n\n3. 指明“因何而欣喜”的介词搭配\nelation at / over / about + 事件：明确指出原因。\n例：His elation at the promotion was palpable.\n（他对这次升职的欣喜之情显而易见。）\n\n4. 描述“欣喜持续时间或变化”的修饰搭配\ninitial elation（最初的欣喜）、sudden elation（突如其来的欣喜）——常用于描写“先喜后忧”的转折。\n例：Her initial elation soon gave way to anxiety.\n（她最初的欣喜很快被焦虑取代。）","s":["1675","1791"]},{"w":"embarrass","d":"使困窘","f":"v. 使困窘","s":["1791"]},{"w":"enrage","d":"激怒可以把理解为中文里的怒不可遏或暴怒，而不是简单的生气或烦","f":"vt. 激怒。可以把 enrage 理解为中文里的 “怒不可遏” 或 “暴怒”，而不是简单的“生气”或“烦躁”。\nbe enraged by / at / with sth/sb（因某事/某人被激怒）\nenrage sb（直接激怒某人）；it enrages sb that / when...（……让某人大怒）\nenrage the public / community / opposition（激怒公众/社区/反对派）","s":["1675","1925","1791"]},{"w":"enrapture","d":"陶醉艺术、音乐、表演带来的审美狂喜（绝对高频）（被陶醉）；（","f":"vt. 陶醉\n艺术、音乐、表演带来的审美狂喜（绝对高频）be enraptured by / with sth（被……陶醉）；enrapture the audience（使观众陶醉）\n自然美景、风景带来的沉醉感（文学/描写类高频）enraptured gaze / silence（陶醉的凝视/沉默）；stand enraptured（陶醉地站着）","s":["1675","1791"]},{"w":"enthral","d":"迷住对比两个单词抓住你的注意力（让你挪不开眼，但因为好看好听","f":"v. 迷住。对比两个单词：Enthrall = 抓住你的注意力（让你挪不开眼，但因为“好看/好听”）。Enrapture = 引爆你的情绪（让你高兴到飞起，因为“太美/太爽”）。\n精彩的表演、故事、演讲让人“看呆了/听入迷了”（绝对高频）be enthralled by / with sth（被……迷住）；enthrall the audience / readers（迷住观众/读者）\n令人惊叹的自然美景、天籁之音（文学/描写类）enthralled by the beauty / scenery / voice（被美景/嗓音迷住）\n神秘、奇妙或前所未见的新事物让人欲罢不能（好奇心的“陷落”）remain / stand enthralled（依然入迷地）；be completely / utterly enthralled（完全被迷住）","s":["1791"]},{"w":"enthusiasm","d":"热情","f":"n. 热情","s":["1791"]},{"w":"exasperate","d":"激怒（被某事激怒）；（对某人感到恼火）；（激怒顾客员工）（恼","f":"v. 激怒\nbe exasperated by / at sth（被某事激怒）；be exasperated with sb（对某人感到恼火）；\nexasperate customers / staff（激怒顾客/员工）an exasperated parent / teacher（恼火的家长/老师）\nlet out an exasperated sigh / groan（发出恼火的叹气/呻吟）；exasperated tone / look（恼火的语气/表情）","s":["1675","1791"]},{"w":"excitement","d":"激动；兴奋；刺激","f":"n. 激动；兴奋；刺激","s":["1791"]},{"w":"exultant","d":"欢腾的，狂欢的因（某具体事件消息）而狂喜因（胜利成就）而得意","f":"adj. 欢腾的，狂欢的\nbe exultant at 因（某具体事件/消息）而狂喜, be exultant over 因（胜利/成就）而得意洋洋","s":["1675","1791"]},{"w":"famish","d":"现在一般没人用，都是用，表示饿极了（口语夸张）（不加介词）饿","f":"v. 现在一般没人用famish，都是用famished，表示饿极了（口语夸张）。\nbe / feel famished（不加介词）\t饿极了\tI haven't eaten all day; I'm absolutely famished!（我一整天没吃东西，饿死了！）\nfamished for + 名词\t渴望得到……（引申义）\tAfter weeks in the desert, they were famished for news of home.（在沙漠里待了几周后，他们渴望得到家里的消息。）","s":["1675","1791"]},{"w":"fanaticism","d":"是（狂热者）的抽象名词形式，意为狂热、盲信、狂热主义它是一个","f":"n. 是 fanatic（狂热者） 的抽象名词形式，意为“狂热、盲信、狂热主义”。它是一个不可数名词 (U.)，几乎100% 带有贬义，指那种不理智、极端且往往危险的过度热情，尤其常用于宗教、政治或意识形态领域。\nsb's fanaticism for + 名词\nthe fanaticism of + 名词/群体\ncondemn / denounce ~, stir up / incite ~\nborder on / verge on（近乎于）：His enthusiasm borders on fanaticism.（他的热情近乎狂热。）—— 经典高分搭配！","s":["1675","1791"]},{"w":"fantasy","d":"幻想、想象、空想它有两个高频用法一是作为可数名词，指具体的幻","f":"n. “幻想、想象、空想”。它有两个高频用法：一是作为可数名词，指具体的“幻想故事、奇幻作品”（如小说、电影）；二是作为不可数名词，指“天马行空的想象活动”。它既可以是中性（创造力），也可以带有贬义（逃避现实的空想）。\nhave a fantasy of + 名词/doing\t（具体内容） ……的幻想，幻想的内容\tHe has a fantasy of becoming a millionaire.（他有一个成为百万富翁的幻想。）Her fantasy of a perfect wedding was shattered.（她对完美婚礼的幻想破灭了。）\nhave a fantasy about + 名词/doing\t（主题/对象） 关于……的幻想\tShe has fantasies about quitting her job and traveling the world.（她幻想辞职去环游世界。）\nindulge in ~ 沉溺于幻想（带贬义）， live in ~ 活在幻想中（贬义）","s":["1791"]},{"w":"ferocious","d":"凶悍、残暴，攻击性拉满本形容野兽，更常喻指激烈竞争、极端酷热","f":"adj. 凶悍、残暴，攻击性拉满。本形容野兽，更常喻指激烈竞争、极端酷热或猛烈抨击，强调“毫不留情”的狠劲。\nferocious competition（白热化竞争）\n很少接介词，一般用于形容名词。","s":["1675","1791"]},{"w":"fickle","d":"善变的、反复无常的贬义，专指感情、喜好、运气或天气的不可靠今","f":"adj. 善变的、反复无常的。100% 贬义，专指感情、喜好、运气或天气的不可靠——今天爱死，明天恨死，毫无忠诚和稳定性可言。\nbe fickle in + 领域/决定：在……方面善变（常作表语）。He is fickle in his choices.（总改变主意。）\nbe fickle to + 人/群体：对……不忠/靠不住（文学化）。Fortune is fickle to those who hesitate.（命运不眷顾犹豫者。）\nfickle heart（花心）fickle tastes（多变的品位）","s":["1791"]},{"w":"fluster","d":"使慌乱强调外在可见的慌乱表现不只是心里急，而是体现在动作和语","f":"v. 使慌乱。强调外在可见的慌乱表现——不只是“心里急”，而是体现在动作和语言上。 n. 慌乱\nfluster over (something)：因某事而慌乱。例：She flustered over the details of the presentation.（她因演示文稿的细节而慌乱。）\nfluster by (something)：被某事弄得慌乱（常用于被动语态）。例：He was flustered by all the attention.（他被众人的关注弄得慌乱。）\nin a fluster：处于慌乱状态（名词短语）。例：The maid was in a fluster because she broke a vase.（女仆因打碎花瓶而慌乱不已。）","s":["1675","1791"]},{"w":"forlorn","d":"核心意为孤苦伶仃的、凄凉的，且往往暗含成功希望极其渺茫的意味","f":"adj. 核心意为 “孤苦伶仃的、凄凉的”，且往往暗含 “成功希望极其渺茫” 的意味。\n在日常中指明知极不可能成功、但依然抱持的期望。He clung to the forlorn hope that she would come back. （他抱着一线渺茫的希望，盼她会回来。）\na forlorn attempt / effort（徒劳的、孤注一掷的尝试）强调“明知不可为而为之”的悲壮感。\nHe made a forlorn attempt to save the drowning dog in the raging river. （他在湍急的河里做了一个徒劳的尝试，想救那只狗。）\nlook / feel forlorn（看起来/感到孤苦伶仃）\nShe looked around the empty room with a forlorn expression. （她带着凄凉的表情环视着空荡荡的房间。）\nleave sb forlorn（让某人被遗弃、孤独无助）\nThe death of his pet left him utterly forlorn. （宠物的死让他极度孤寂。）\na forlorn figure（一个孤寂的身影）常用于文学描写中。\nStanding alone in the rain, he cut a forlorn figure. （他独自站在雨中，显得格外孤寂凄凉。）","s":["1791"]},{"w":"formidable","d":"令人敬畏的、强大的、难以对付的形容对手敌人令人畏惧的强大，形","f":"adj. “令人敬畏的、强大的、难以对付的”\n形容“对手/敌人” (令人畏惧的强大)，形容“困难/任务” (难以应对的艰巨)，形容“能力/品质” (令人赞叹的卓越)\npose a formidable challenge / threat to sb.（对某人构成巨大的挑战/威胁）\nfind sb/sth formidable（觉得某人/某事令人敬畏或难以招架）\nlook / seem formidable（看起来强大/令人生畏）","s":["1675","1791"]},{"w":"frenzy","d":"核心意思是极度的疯狂、狂乱或一阵强烈的爆发形容情绪失控疯狂、","f":"n. 核心意思是“极度的疯狂”、“狂乱”或“一阵强烈的爆发”。\n形容情绪失控：疯狂、极度兴奋（或愤怒）in a frenzy（处于疯狂状态）、a frenzy of excitement（一阵狂喜）\n形容群体/活动：狂热、骚动、疯狂的行动 media frenzy（媒体狂热/炒作）、feeding frenzy（原指鲨鱼抢食，现常比喻媒体或人群的疯狂追逐）。","s":["1675","1791"]},{"w":"fret","d":"的核心意思是烦恼、发愁，强调因琐事而持续地焦虑不安动词名词焦","f":"v. Fret 的核心意思是“烦恼”、“发愁”，强调因琐事而持续地焦虑不安。\n动词/名词 —— 焦虑、烦恼、发愁（最常用）fret over details（为细节纠结）、fret at the delay（为延误烦躁）。“Don't fret.”（别担心 / 别发愁。）\n名词 ——（吉他、尤克里里等弦乐器上的）品丝 The guitar's frets were worn out from years of playing.（这把吉他的品丝因多年弹奏而磨平了。）","s":["1675","1791"]},{"w":"fright","d":"惊吓；恐惧","f":"n. 惊吓；恐惧","s":["1791"]},{"w":"fury","d":"狂怒、暴怒的名词形式形容情绪状态狂怒、暴怒、盛怒（最常见）指","f":"v. “狂怒”、“暴怒”。furious的名词形式。\n1. 形容情绪状态：狂怒、暴怒、盛怒（最常见）\n指人心中燃烧着极端的怒火。\n例句：He was trembling with fury at the insult.（他因受辱而气得浑身发抖。）\n常见搭配：in a fury（处于狂怒中）、fly into a fury（突然暴跳如雷）、shake with fury（气得发抖）。\n2. 形容猛烈活动/自然现象：猛烈、狂暴、剧烈\n与形容词 furious 的第二层意思对应，形容风、雨、战争或动作的猛烈程度。\n例句：The storm raged with fury against the coast.（暴风雨狂暴地肆虐着海岸。）\n常见搭配：the fury of the elements（大自然的狂暴）、white-hot fury（白热化的激烈）。","s":["1675","1791"]},{"w":"gleeful","d":"兴高采烈的、欢欣鼓舞的，通常带有因某件具体好事（尤其是别人的","f":"adj. 兴高采烈的、欢欣鼓舞的，通常带有因某件具体好事（尤其是别人的失败或自己的小胜利）而产生的、近乎孩子气的喜悦。","s":["1675","1791"]},{"w":"gratify","d":"使高兴满意或满足（愿望需求）名词表示因而感到欣慰感受是内敛的","f":"vt.  “使...高兴/满意” 或 “满足...（愿望/需求）” \nbe gratified by / at / with + 名词：表示“因...而感到欣慰”。感受是内敛的、静态的。be gratified to do sth：表示“做某事感到欣慰”。It gratifies sb to do sth：表示“做某事令某人感到欣慰”。\nto gratify sb's curiosity 满足某人的好奇心。to gratify a whim 满足一时的心血来潮。to gratify sb's desire 满足某人的欲望。","s":["1675","1791"]},{"w":"grouchy","d":"易怒的，脾气不好的","f":"易怒的，脾气不好的","s":["1675"]},{"w":"grudge","d":"记恨怨恨、积怨对某人心怀怨恨（）吝惜、不愿给（）不情愿地承认","f":"n. 记恨\nholds a grudge 怨恨、积怨\nbear a grudge against\nhave a grudge against sb 对某人心怀怨恨\nHe grudges every penny he spends. （vt.）吝惜、不愿给\nI don't grudge him his success （vt.）不情愿地承认/给予","s":["1791"]},{"w":"harass","d":"骚扰、烦扰、不断侵扰（反复地）骚扰、烦扰某人通过不断打扰使人","f":"v. 骚扰、烦扰、不断侵扰\n（反复地）骚扰、烦扰某人 —— 通过不断打扰使人心烦或不安\n例句：She was harassed by a journalist for weeks.（她被一名记者骚扰了好几周。）\n（军队等）不断袭扰、骚扰 —— 军事上指不断攻击以削弱敌人\n例句：The enemy harassed the retreating troops all night.（敌军整夜袭扰撤退中的部队。）","s":["1675","1791"]},{"w":"homesick","d":"思家的，思乡病的","f":"思家的，思乡病的","s":["1925"]},{"w":"horror","d":"恐惧","f":"n. 恐惧","s":["1791"]},{"w":"hostile","d":"敌对的；不友好的","f":"adj. 敌对的；不友好的","s":["1791"]},{"w":"humiliate","d":"羞辱地点人群（在面前羞辱某人）（感到受辱）描述受害者的感受（","f":"v. 羞辱。\nHumiliate someone in front of + 地点/人群（在……面前羞辱某人）\nFeel humiliated（感到受辱）：描述受害者的感受。\nSuffer humiliation（遭受羞辱）：名词形式。","s":["1791"]},{"w":"impatient","d":"不耐烦的","f":"adj. 不耐烦的","s":["1791"]},{"w":"impetuous","d":"冲动鲁莽的强调容易情绪上头名词（鲁莽的年轻人）、（冲动的行为","f":"adj. 冲动鲁莽的。强调容易情绪上头。\nImpetuous + 名词：impetuous young man（鲁莽的年轻人）、impetuous act（冲动的行为）、impetuous temperament（急躁的性情）\nBe impetuous enough to do...（鲁莽到做某事）：\nHe was impetuous enough to invest all his savings in that risky scheme.（他鲁莽到把所有积蓄投进了那个高风险计划。）","s":["1675","1791"]},{"w":"incense","d":"香；香料；激怒；使愤怒","f":"n./v. 香；香料；激怒；使愤怒","s":["1675","1791"]},{"w":"inconceivable","d":"不可思议的（难以想象竟然）经典句型，后接违反常理的事（不可想","f":"adj. 不可思议的\n· It is inconceivable that...（难以想象竟然……）——经典句型，后接违反常理的事\n· Inconceivable idea / notion（不可想象的概念）\n· Practically / virtually inconceivable（实际上根本无法想象）","s":["1675","1791"]},{"w":"incredible","d":"难以相信的","f":"adj. 难以相信的","s":["1675","1791"]},{"w":"indefatigable","d":"不知疲倦的；坚韧不拔的","f":"adj. 不知疲倦的；坚韧不拔的","s":["1675","1791"]},{"w":"indifferent","d":"无所谓的日常选择（最轻松）随便、无所谓对小事没有强烈偏好情感","f":"adj. 无所谓的\n1. 日常选择（最轻松）\t“随便”、“无所谓”——对小事没有强烈偏好。\n2.  情感/人际关系（较严重贬义）\t“冷漠的”、“漠不关心的”\nbe indifferent to + 某人/某物","s":["1791"]},{"w":"indignant","d":"愤慨的；义愤的","f":"adj. 愤慨的；义愤的","s":["1675","1791"]},{"w":"inquisitive","d":"好奇的","f":"adj. 好奇的","s":["1675","1791"]},{"w":"intimidate","d":"恐吓","f":"v. 恐吓","s":["1675","1791"]},{"w":"intrude","d":"侵扰","f":"v. 侵扰","s":["1675","1791"]},{"w":"intuition","d":"直觉","f":"n. 直觉","s":["1675","1791"]},{"w":"irritable","d":"过敏的；易怒的","f":"adj. 过敏的；易怒的","s":["1791"]},{"w":"irritate","d":"激怒","f":"v. 激怒","s":["1791"]},{"w":"jealous","d":"妒忌的；猜疑的","f":"adj. 妒忌的；猜疑的",

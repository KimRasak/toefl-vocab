<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>TOEFL 学科词汇总表 (4476 词)</title>
<style>
:root {
  --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --fg:#e6e8eb;
  --muted:#8b93a1; --accent:#4c8dff; --accent2:#2a5fc0; --border:#2a2f3a;
}
@media(prefers-color-scheme:light){
  :root{--bg:#f4f6fa;--card:#fff;--card2:#eef1f6;--fg:#1a1d24;--muted:#5f6672;--accent:#2a5fc0;--accent2:#1c4499;--border:#dde2eb;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-weight:800;font-size:18px;flex:0 0 auto}
.search-wrap{
  flex:1 1 200px;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;
}
.search-wrap input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:14px}
.stats{font-size:12px;color:var(--muted);margin-top:6px}
.home-btn{
  flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--accent);
  border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;font-weight:600;white-space:nowrap;
}
main{padding:12px 16px;max-width:800px;margin:0 auto}

/* Topic nav */
.topic-nav{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
}
.topic-chip{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:5px 10px;font-size:12px;cursor:pointer;color:var(--fg);
  transition:border-color .15s;white-space:nowrap;text-decoration:none;
}
.topic-chip:hover{border-color:var(--accent)}
.topic-chip .cnt{color:var(--muted);font-size:11px;margin-left:3px}

/* Section */
.section{margin-bottom:28px}
.sec-head{
  position:sticky;top:55px;z-index:10;background:var(--bg);
  padding:10px 0 6px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.sec-emoji{font-size:22px}
.sec-title{font-weight:700;font-size:16px}
.sec-cnt{color:var(--muted);font-size:13px}
.sec-toggle{
  margin-left:auto;background:var(--card);border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;
}

/* Word list */
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;align-items:flex-start;gap:10px;
}
.witem .ww{
  font-size:16px;font-weight:600;flex:0 0 auto;min-width:100px;
  display:flex;align-items:center;gap:6px;
}
.witem .wd{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.witem .wsrc{font-size:10px;color:var(--accent);flex:0 0 auto;opacity:.6}
.widx{font-size:11px;color:var(--muted);opacity:.5;margin-right:6px;font-weight:400;font-variant-numeric:tabular-nums}
.spk-btn{
  background:none;border:0;padding:0;cursor:pointer;color:var(--accent);
  font-size:14px;display:inline-flex;align-items:center;flex:0 0 auto;
}
.spk-btn:hover{opacity:.7}

/* Expand */
.witem .full{display:none;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.witem.expanded .full{display:block}

/* Search highlight */
.witem mark{background:rgba(76,141,255,.28);color:inherit;border-radius:3px;padding:0 2px}

.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.foot{text-align:center;margin:32px 0;color:var(--muted);font-size:12px}

/* Auto-play bar */
.autobar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  box-shadow:0 -2px 12px rgba(0,0,0,.15);
  transition:transform .25s;
}
.autobar.hidden{transform:translateY(100%)}
.autobar .ab-row{display:flex;align-items:center;gap:8px;width:100%}
.autobar .ab-word{
  font-size:18px;font-weight:700;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.autobar .ab-def{
  font-size:12px;color:var(--muted);width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.autobar .ab-pos{font-size:12px;color:var(--muted);white-space:nowrap}
.autobar button{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;
  white-space:nowrap;
}
.autobar button:hover{border-color:var(--accent)}
.autobar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.autobar select,.autobar input[type=number]{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:5px 8px;font-size:12px;
}
.autobar input[type=number]{width:60px}
.ab-toggle{
  position:fixed;bottom:16px;right:16px;z-index:29;
  background:var(--accent);color:#fff;border:0;border-radius:50%;
  width:48px;height:48px;font-size:22px;cursor:pointer;
  box-shadow:0 2px 12px rgba(76,141,255,.4);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:env(safe-area-inset-bottom);
}
.ab-toggle:hover{opacity:.85}
.witem.playing{border-color:var(--accent);background:var(--accent2);background:rgba(76,141,255,.08)}
body.autobar-open{padding-bottom:100px}

/* Mark / hard words */
.mark-btn{
  background:none;border:0;padding:0;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;flex:0 0 auto;opacity:.35;
  transition:opacity .15s;
}
.mark-btn:hover{opacity:.7}
.mark-btn.marked{opacity:1}
.witem.is-hard{border-left:3px solid #f5a623}
.filter-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;
}
.filter-btn{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:5px 12px;font-size:12px;cursor:pointer;color:var(--fg);
  transition:border-color .15s;
}
.filter-btn:hover{border-color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hard-count{font-size:12px;color:var(--muted)}

/* Sync modal */
.sync-modal{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.6);align-items:center;justify-content:center;
  padding:20px;
}
.sync-modal.open{display:flex}
.sync-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px;max-width:440px;width:100%;
}
.sync-box h3{margin:0 0 12px;font-size:16px}
.sync-box input[type=password],.sync-box input[type=text]{
  width:100%;background:var(--card2);border:1px solid var(--border);
  border-radius:8px;color:var(--fg);font-size:13px;padding:10px;
  font-family:monospace;
}
.sync-box .sync-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sync-box .sync-btns button{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;
}
.sync-box .sync-btns button:hover{border-color:var(--accent)}
.sync-box .sync-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.sync-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.sync-status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:6px}
.sync-status.ok{background:rgba(52,199,89,.15);color:#34c759}
.sync-status.err{background:rgba(255,69,58,.15);color:#ff453a}
.sync-status.info{background:rgba(76,141,255,.12);color:var(--accent)}

/* Focus mode */
.focus-overlay{
  display:none;position:fixed;inset:0;z-index:25;
  background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.focus-overlay.open{display:flex}
.focus-word{font-size:clamp(32px,8vw,56px);font-weight:800;margin-bottom:12px;visibility:hidden}
.focus-def{font-size:16px;color:var(--muted);max-width:500px;line-height:1.6;margin-bottom:8px;visibility:hidden}
.focus-full{font-size:13px;color:var(--muted);max-width:500px;line-height:1.6;opacity:.7;margin-bottom:20px;word-break:break-word;white-space:pre-wrap;visibility:hidden}
.focus-overlay.revealed .focus-word,.focus-overlay.revealed .focus-def,.focus-overlay.revealed .focus-full{visibility:visible}
.focus-pos{font-size:13px;color:var(--muted);margin-bottom:20px}
.focus-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus-btns button{
  background:var(--card);border:1px solid var(--border);color:var(--fg);
  border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer;
}
.focus-btns button:hover{border-color:var(--accent)}
.focus-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.focus-mark{font-size:28px;cursor:pointer;margin-bottom:16px;opacity:.4;transition:opacity .15s}
.focus-mark.marked{opacity:1}

/* hidden */
.hidden{display:none!important}

@media(max-width:600px){
  .witem .ww{min-width:80px;font-size:15px}
  .witem .wd{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <a class="home-btn" href="../">← 首页</a>
    <span class="title">📚 学科词汇总表</span>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="搜索单词或释义..." autocomplete="off">
    </div>
  </div>
  <div class="stats" id="stats">4476 个词汇 · 45 个学科</div>
</header>
<main id="main"></main>
<div class="foot">TOEFL 学科词汇总表 · 三大词表 + 2026新场景词汇 · 按学科分组</div>

<!-- Auto-play bar -->
<button class="ab-toggle" id="abToggle" title="连播模式">▶</button>
<div class="autobar hidden" id="autobar">
  <div class="ab-row">
    <button class="primary" id="abPlayBtn">▶ 连播</button>
    <span class="ab-word" id="abWord">—</span>
    <span class="ab-pos" id="abPos"></span>
  </div>
  <div class="ab-row">
    <div class="ab-def" id="abDef">&nbsp;</div>
  </div>
  <div class="ab-row">
    <label style="font-size:12px;color:var(--muted)">起始:</label>
    <input type="number" id="abStart" min="1" value="1" title="从第几个词开始">
    <label style="font-size:12px;color:var(--muted)">间隔:</label>
    <select id="abGap">
      <option value="0">无间隔</option>
      <option value="1000" selected>1 秒</option>
      <option value="2000">2 秒</option>
      <option value="3000">3 秒</option>
      <option value="5000">5 秒</option>
    </select>
    <button class="filter-btn" id="abHardOnly">⭐ 仅难词</button>
    <button class="filter-btn" id="abFocusBtn">🎯 专注</button>
    <button id="abPrev" title="上一个">⏮</button>
    <button id="abNext" title="下一个">⏭</button>
    <button id="abClose" title="关闭">✕</button>
  </div>
</div>

<!-- Sync modal -->
<div class="sync-modal" id="syncModal" onclick="if(event.target===this)syncClose()">
  <div class="sync-box">
    <h3>☁️ 云同步难词标记</h3>
    <input type="password" id="syncToken" placeholder="粘贴 GitHub Personal Access Token..." autocomplete="off">
    <div id="syncMsg"></div>
    <div class="sync-hint">
      只需一次设置：<a href="https://github.com/settings/tokens/new?scopes=gist&description=TOEFL-vocab-sync" target="_blank" style="color:var(--accent)">👉 点此创建 Token</a>（勾选 gist 权限即可）<br>
      输入后自动创建私密 Gist 保存星标，多设备输入同一 Token 即同步。
    </div>
    <div class="sync-btns">
      <button class="primary" onclick="syncLogin()">🔗 连接</button>
      <button onclick="syncNow()">🔄 立即同步</button>
      <button onclick="syncLogout()">退出登录</button>
      <button onclick="syncClose()">关闭</button>
    </div>
  </div>
</div>

<!-- Focus mode overlay -->
<div class="focus-overlay" id="focusOverlay">
  <div class="focus-topic" id="focusTopic" style="font-size:14px;color:var(--muted);margin-bottom:16px"></div>
  <div class="focus-reveal-area" id="focusRevealArea" style="cursor:pointer;padding:20px;min-height:120px;display:flex;flex-direction:column;align-items:center">
    <div class="focus-hint" id="focusHint" style="font-size:14px;color:var(--muted);opacity:.5">👆 点击此处揭晓答案</div>
    <div class="focus-word" id="focusWord">—</div>
  </div>
  <div class="focus-mark" id="focusMark" title="标记难词">⭐</div>
  <div class="focus-def" id="focusDef"></div>
  <div class="focus-full" id="focusFull"></div>
  <div class="focus-pos" id="focusPos"></div>
  <div class="focus-btns">
    <button onclick="focusPrev()">⏮ 上一个</button>
    <button onclick="focusSpeak()">🔊 发音</button>
    <button class="primary" id="focusPlayBtn" onclick="focusTogglePlay()">▶ 连播</button>
    <button onclick="focusNext()">⏭ 下一个</button>
    <button class="filter-btn" id="focusHardBtn" onclick="focusToggleHard()">⭐ 仅难词</button>
    <button onclick="focusClose()">✕ 退出</button>
  </div>
</div>

my window. （鸟儿在我窗外叽叽喳喳地叫。）\nCrickets chirped all night long. （蟋蟀整夜唧唧地叫。）\nn.\nI heard the chirp of a sparrow. （我听到了麻雀的一声唧唧叫。）\nThe crickets' chirps kept me awake. （蟋蟀的唧唧声让我睡不着。）","s":["1675","1791"]},{"w":"clam","d":"蛤","f":"蛤","s":["1675"]},{"w":"class","d":"班；班级；课程；（生物分类）纲","f":"n. 班；班级；课程；（生物分类）纲","s":["1675"]},{"w":"coelenterate","d":"腔肠动物（如水母、海蜇、珊瑚等）","f":"n. 腔肠动物（如水母、海蜇、珊瑚等）","s":["1675"]},{"w":"coral","d":"珊瑚","f":"珊瑚","s":["1675"]},{"w":"dinosaur","d":"恐龙","f":"恐龙","s":["1675"]},{"w":"dolphin","d":"海豚","f":"n. 海豚","s":["1675","1791"]},{"w":"dormant","d":"休眠的、潜伏的或静止的核心在于暂时处于不活跃状态，但随时可能","f":"adj. 休眠的、潜伏的或静止的。核心在于“暂时处于不活跃状态，但随时可能被唤醒或恢复活力”，而不是“死了”或“废弃了”。\nlie dormant\t处于休眠/潜伏状态\tThe seeds lie dormant underground until spring. (种子在地下处于休眠状态直到春天来临。)\nremain dormant\t继续保持不活跃\tThe virus can remain dormant in the body for years. (这种病毒能在体内潜伏多年。)\na dormant volcano\t休眠火山\tThey live near a dormant volcano. (他们住在一座休眠火山附近。)\na dormant account\t休眠账户（长期无交易的账户）\tThe bank will charge a fee for dormant accounts. (银行会对休眠账户收取费用。)\ndormant period / phase\t休眠期 / 潜伏期\tAfter a long dormant period, the market suddenly rebounded. (经过漫长的沉寂期后，市场突然反弹了。)","s":["1675","1791"]},{"w":"ecologist","d":"生态学家，生态学者","f":"n.生态学家，生态学者","s":["1675"]},{"w":"ecosystem","d":"生态系统","f":"生态系统","s":["1925"]},{"w":"family","d":"家庭；家族；（生物分类）科","f":"n. 家庭；家族；（生物分类）科","s":["1675"]},{"w":"fauna","d":"动物群","f":"动物群","s":["1675"]},{"w":"finch","d":"雀科鸣禽（如燕雀、金翅雀）无动词比喻义，纯名词名气来自达尔文","f":"n. 雀科鸣禽（如燕雀、金翅雀）。无动词/比喻义，纯名词。名气99%来自达尔文雀（Darwin's finches）(进化论经典案例)。\na finch。finch species：雀类物种（学术语境）。","s":["1675","1791"]},{"w":"flock","d":"羊群；鸟群","f":"n.羊群；鸟群","s":["1675"]},{"w":"flounder","d":"挣扎（动词）挣扎、不知所措、犯难（最常见）指人在水里或泥里笨","f":"vi. 挣扎\n1. （动词）挣扎、不知所措、犯难（最常见）\n指人在水里或泥里笨拙地乱动、难以站稳，或引申为在困境中手足无措、不知该怎么办，带有“费力但可能徒劳”的意味。\n例：She was floundering in the deep end of the pool.（她在游泳池深水区挣扎。）\n\n例：The new employee floundered when asked to explain the data.（新员工被要求解释数据时不知所措。）\n2. （名词）比目鱼（一种扁平的海鱼，可食用）\n例：We had grilled flounder for dinner.（我们晚餐吃了烤比目鱼。）\nflounder in (something)：在（泥泞/水/困境）中挣扎。flounder through (something)：艰难地应付/勉强做完某事。","s":["1675","1791"]},{"w":"fluffy","d":"蓬松的的核心意思是蓬松，而毛茸茸只是它最常出现的场景之一当形","f":"adj. 蓬松的。fluffy 的核心意思是“蓬松”，而“毛茸茸”只是它最常出现的场景之一。 当形容“动物/毛发”时 ≈ 毛茸茸。当形容“非生物”时 = 蓬松。\n1. （物体）蓬松、松软、毛茸茸的（最常见）\n形容毛发、棉花、毛巾、面包等手感柔软、体积蓬起的样子。\n例：a fluffy kitten（一只毛茸茸的小猫）\n例：fluffy towels（柔软蓬松的毛巾）\n例：fluffy scrambled eggs（松软的炒蛋）\n2. （内容）轻松肤浅的、不严肃的（引申义，略带贬义）\n形容文章、电影、音乐等缺乏深度，只是娱乐消遣性质。\n例：a fluffy magazine article（一篇浅薄的杂志文章）\n\nfluffy with (something)：因某物而变得蓬松。\n例：The bread is fluffy with lots of air pockets.（面包因有许多气孔而蓬松。）\nfluffy on top / inside：某物在顶部/内部是蓬松的（强调位置）。\n例：The cake is fluffy on the inside but crispy on the outside.（蛋糕内部蓬松，但外皮酥脆。）","s":["1675","1791"]},{"w":"food chain","d":"食物链","f":"n. 食物链","s":["scenario"]},{"w":"food web","d":"食物网","f":"n. 食物网","s":["scenario"]},{"w":"fowl","d":"鸡，家禽用于超市或菜谱，法律农业海关文件，狩猎户外运动（指野","f":"n. 鸡，家禽。用于超市或菜谱，法律/农业/海关文件，狩猎/户外运动（指野鸟）。","s":["1675","1791"]},{"w":"genus","d":"属","f":"属","s":["1675"]},{"w":"gorilla","d":"大猩猩","f":"大猩猩","s":["1675"]},{"w":"greasy","d":"油腻的有物理含义，也有抽象含义可形容一个人过分殷勤、油嘴滑舌","f":"adj. 油腻的(有物理含义，也有抽象含义)。可形容一个人过分殷勤、油嘴滑舌、虚伪得让人不舒服。","s":["1675","1791"]},{"w":"gregarious","d":"（人）爱交际的、合群的、喜欢社交的（动物）群居的","f":"adj. （人）爱交际的、合群的、喜欢社交的\n（动物）群居的","s":["1675","1791"]},{"w":"herbivorous","d":"食草的","f":"食草的","s":["1675"]},{"w":"herd","d":"兽群；聚集驱赶（成群动物）","f":"n./v. 兽群；聚集/驱赶（成群动物）","s":["1675"]},{"w":"hibernate","d":"冬眠","f":"冬眠","s":["1675"]},{"w":"hide","d":"兽皮；隐藏","f":"n./v. 兽皮；隐藏","s":["1675"]},{"w":"homotherm","d":"恒温动物","f":"恒温动物","s":["1675"]},{"w":"hordes","d":"大群；成群的人或动物","f":"n. 大群；成群的人或动物","s":["1675"]},{"w":"hump","d":"驼峰隆起的包凸起（物理）和艰难的关卡（比喻）（骆驼有一个或两","f":"n. 驼峰\n“隆起的包/凸起”（物理）和“艰难的关卡”（比喻）\n“Camels have one or two humps.”（骆驼有一个或两个驼峰。）\n“Slow down, there's a hump ahead.”（减速，前面有减速带。）\nv.隆起\nhump one's back 弓起背 The cat humped its back when the dog came near.\n吃力地扛/搬/背 I've been humping these suitcases around the airport all day.”","s":["1675","1791"]},{"w":"i  饮食；日常食物；v. 节食","s":["1791"]},{"w":"dissect","d":"解剖解剖青蛙动物标本剖析论点理论报告分析文本段落","f":"v. 解剖\ndissect a frog / animal / specimen — 解剖青蛙／动物／标本\ndissect an argument / theory / report — 剖析论点／理论／报告\ndissect a text / passage — 分析文本／段落","s":["1675","1791"]},{"w":"fester","d":"化脓、溃烂（字面）；恶化、暗中酝酿（比喻极高频）特指问题不满","f":"v. 化脓、溃烂（字面）；恶化、暗中酝酿（比喻——极高频）。特指问题/不满/冲突因被忽视而愈发严重，像伤口化脓一样。\nfester in + 地点：在……（伤口/心里）化脓/恶化。Resentment festered in her heart.（怨恨在她心中加剧。）\nfester under + 表面：在……表象下恶化。Anger festered under the calm surface.（平静表象下怒火暗涌。）\nleave + 事物 + to fester：（听任/放任）……恶化（极高频固定搭配）。Don't leave the wound to fester.（别让伤口化脓。/ 别放任问题不管。）\nInstead of resolving the dispute, the management let it fester until it escalated into a major crisis.（管理层没有解决争端，而是任其恶化，直至升级为重大危机。）","s":["1675","1791"]},{"w":"feverish","d":"字面发烧的；比喻狂热的、高速的、极度兴奋焦虑的（后者占日常使","f":"adj. 字面“发烧的”；比喻“狂热的、高速的、极度兴奋/焦虑的”（后者占日常使用95%）。常形容截止日期前的匆忙、市场的躁动或情绪的高压。\n作表语 + with（因……而狂热/焦躁）：He was feverish with excitement.（兴奋得发狂。）\nfeverish activity（一片繁忙）feverish pace（飞快的速度）\nfeverish excitement（狂热的兴奋）feverish haste（火急火燎）feverish dream（狂乱的梦）\nfeverish brow（发烫的额头）feverish patient（发热病人）","s":["1675","1791"]},{"w":"fracture","d":"断开的痕迹或状态物理上或抽象意义医学上骨折、骨裂（最常用）（","f":"n. 断开的痕迹或状态。物理上或抽象意义。\n医学上：骨折、骨裂（最常用）hairline fracture（骨裂/发丝状裂纹）；open/closed fracture（开放性/闭合性骨折）。\n地质/材料学上：裂缝、裂痕、断裂面 stress fracture（应力性断裂，也常用于医学的疲劳性骨折）。","s":["1675","1791"]},{"w":"fragile","d":"脆的；体制弱的","f":"adj. 脆的；体制弱的","s":["1675","1791"]},{"w":"gash","d":"一道又深又长的伤口（通常流血很多，边缘参差不齐，需要缝针）一","f":"n. 一道又深又长的伤口（通常流血很多，边缘参差不齐，需要缝针）。\n一般用于人的伤口，也可以用于物体、墙壁、地面的长裂痕。","s":["1675","1791"]},{"w":"heal","d":"治愈；康复；愈合；弥合","f":"v. 治愈；康复；愈合；弥合","s":["1791"]},{"w":"healthful","d":"有益健康的；健康的","f":"adj. 有益健康的；健康的","s":["1791"]},{"w":"hygiene","d":"卫生、保健，指通过清洁和良好的生活习惯来预防疾病、保持健康的","f":"n. 卫生、保健，指通过清洁和良好的生活习惯来预防疾病、保持健康的行为体系。\npersonal hygiene\noral hygiene.\n“If you have insomnia, work on your sleep hygiene first.”（如果你失眠，先改善你的“睡眠卫生”（作息习惯）。）\n“The restaurant was shut down due to poor food hygiene.”（那家餐厅因食品卫生不达标被关停了。）","s":["1675","1791"]},{"w":"infectious","d":"传染的，感染性的医学病理（字面义）传染性的指通过病毒、细菌在","f":"adj. 传染的，感染性的。\n① 医学/病理（字面义）“传染性的”——指通过病毒、细菌在人与人之间传播的疾病。The flu is highly infectious.（流感具有高度传染性。）\nStay home if you have an infectious disease.（如果你有传染病，就待在家里。）\n② 情绪/人格（引申义，口语极高频！）\t“有感染力的”——指笑声、热情、乐观能迅速“传染”给周围人，让大家都跟着笑或跟着激动起来。\tShe has an infectious laugh.（她的笑声太有感染力了。——这是美国人夸人最常用的金句！）\nHis enthusiasm is infectious.（他的热情太有感染力了，搞得大家都跃跃欲试。）","s":["1675","1791"]},{"w":"infirmary","d":"医院医务室美养老院救济院","f":"医院, 医务室<美>养老院, 救济院[mean]医务室，医院，医疗所。通常指一个设备简单、规模较小的医疗机构，如校园医务室、军队医疗所或监狱医院。[st]The school infirmary provides basic medical care to students and staff[st]he injured soldiers were taken to the infirmary for treatment.[st]Inmates who require medical attention are sent to the prison infirmary.[syn]\"infirmary\"、\"clinic\"和\"medical center\" 都可以指医疗机构，但 \"infirmary\" 更常用于描述规模较小的医疗设施，特别是校园、军队或监狱等地方设立的。\"clinic\" 可以指医生的诊所或非常简单的医疗机构。而 \"medical center\" 则更普遍地指大型的医疗机构，可能提供更全面的医疗服务。","s":["1925"]},{"w":"intoxication","d":"陶醉","f":"陶醉","s":["1925"]},{"w":"invalid","d":"病弱者；伤残者；无效的；不成立的；病弱的","f":"n. 病弱者；伤残者；adj. 无效的；不成立的；病弱的","s":["1675","1791"]},{"w":"malady","d":"疾病","f":"n.疾病","s":["1675"]},{"w":"malnourished","d":"营养失调的营养不良的","f":"营养失调的 营养不良的","s":["1675"]},{"w":"morbid","d":"病态的，不正常的","f":"a.病态的，不正常的","s":["1675"]},{"w":"necrosis","d":"坏死；组织坏死","f":"n. 坏死；组织坏死","s":["1675"]},{"w":"pill","d":"药丸","f":"药丸[mean]药丸；药片。这个词用来指一种用于药物治疗的小而固定剂量的药物形式，通常是圆形的，可以口服。药丸可以是用于治疗疾病、缓解症状或提供营养的药物。 （频率：5%）[st]The doctor prescribed a daily dose of pills[st]She took a couple of pills","s":["1925"]},{"w":"prescribe","d":"开处方；规定；指示","f":"v. 开处方；规定；指示","s":["1675","1925"]},{"w":"prescribed","d":"规定的","f":"adj. 规定的[ph]prescribed medication/exercise regimen","s":["1925"]},{"w":"prescription","d":"处方；药方；（对行为的）建议；规定","f":"n. 处方；药方；（对行为的）建议；规定","s":["1675","1925"]},{"w":"pulse","d":"脉搏，脉冲","f":"n./v. 脉搏，脉冲 [ph] check the pulse [ph] pulses of electromagnetic waves","s":["1925"]},{"w":"recur","d":"重现，再来；复发","f":"重现，再来；复发[ph] tical / academic discourse — 公共话语／政治言论／学术论述\ndiscourse on / upon something — 关于某事的论述／演说 The professor gave a fascinating discourse on climate change.\nengage in discourse — 进行对话／展开交流（正式）","s":["1791"]},{"w":"divulge","d":"泄露（秘密、隐私或敏感信息）（透露细节信息）（泄露秘密）（拒","f":"vt. “泄露（秘密、隐私或敏感信息）”\ndivulge details / information（透露细节/信息）\ndivulge secrets（泄露秘密）\nrefuse to divulge（拒绝透露）—— 这是新闻里的固定用法","s":["1791"]},{"w":"elaborate","d":"精心制作；详细阐述；精心构思的","f":"adj. 精心制作；详细阐述； 精心构思的","s":["1791"]},{"w":"eloquence","d":"雄辩（或口才，侧重流畅优雅的表达能力）（口才的天赋）、（雄辩","f":"n.  “雄辩”（或 “口才”，侧重流畅优雅的表达能力）。\ngift of eloquence（口才的天赋）、power of eloquence（雄辩的力量）","s":["1791"]},{"w":"emend","d":"校订指文字性修改，日常不用（校订文本手稿段落）（修订宪法法律","f":"vt. 校订(指文字性修改，日常不用)\nemend a text / a manuscript / the passage（校订文本/手稿/段落）\nemend the constitution / legal documents（修订宪法/法律文件，此处侧重于措辞修正）","s":["1675","1791"]},{"w":"emphasize","d":"强调；着重","f":"v. 强调；着重","s":["1791"]},{"w":"entitle","d":"授予（精准对应赋予权利资格的核心动作，同时涵盖授予名称的衍生","f":"v. 授予（精准对应“赋予权利/资格”的核心动作，同时涵盖“授予名称”的衍生义）。\n法律、制度、合同赋予的“权利/资格”（绝对高频，占日常使用80%以上）be entitled to (doing) sth（有权享受/得到某物）；entitle sb to do sth（授予某人做某事的权利）\nentitle sth + 标题（将……命名为……）；a book/chapter entitled...（一本名为……的书/一章名为……的内容）\nbe entitled to compensation / benefits / ownership（有权获得赔偿/福利/所有权）","s":["1675","1791"]},{"w":"enunciate","d":"吐字戏剧课演讲课（老师的高频口头禅）（你需要把每个字咬清楚，","f":"v. 吐字\n戏剧课/演讲课（老师的高频口头禅）You need to enunciate your words so the audience in the back can hear you.（你需要把每个字咬清楚，让后排观众也能听见。）\n演讲、播音、语言学习中要求“字正腔圆”（绝对高频）enunciate (clearly / distinctly)（清晰吐字）；enunciate each word / syllable（把每个词/音节吐清楚）\n明确、正式地宣告政策、原则或理念（新闻/书面正式场景）enunciate a policy / principle / plan（阐明一项政策/原则/计划）\n特别针对“口齿不清”时的纠正或强调 enunciate vs. mumble（吐字清晰 vs. 咕哝含糊）","s":["1791"]},{"w":"exaggerate","d":"夸大；夸张","f":"v. 夸大；夸张","s":["1791"]},{"w":"excerpt","d":"摘录从完整作品中截取相对完整的一小部分，保留原貌名词用法远多","f":"n.v. 摘录。“从完整作品中截取相对完整的一小部分，保留原貌”。名词用法远多于动词。\nan excerpt from...（摘自……的摘录）；read / publish / include an excerpt（阅读/发表/收录摘录）\ntake an excerpt from 从……中选取一段节选；quote an excerpt from 引用一段摘自……的节选\na musical excerpt（音乐选段）；an excerpt from a film / soundtrack（电影/原声带片段）\nexcerpt a passage from...（从……中摘录一段）；be excerpted from...（摘自……）","s":["1675","1791"]},{"w":"exclaim","d":"（因惊讶、愤怒、兴奋等强烈情绪而）突然呼喊、大声说（多美的景","f":"v. （因惊讶、愤怒、兴奋等强烈情绪而）突然呼喊、大声说\n“What a beautiful view!” she exclaimed.（“多美的景色啊！”她喊道。）\nexclaim + that + 陈述句 She exclaimed that it was the most beautiful view she had ever seen.（她惊呼那是她见过的最美的景色。）","s":["1791"]},{"w":"fable","d":"寓言；神话或传说；无稽之谈；谎言","f":"n. 寓言；神话或传说；无稽之谈；谎言","s":["1675","1791"]},{"w":"factious","d":"好搞派系的、分裂的、易起内讧的组织组织内部搞分裂的分子（政府","f":"adj. “好搞派系的、分裂的、易起内讧的”\nfactious elements within + 组织 组织内部搞分裂的分子\tThe government is struggling to control the factious groups within the ruling party.（政府正努力控制执政党内部的好搞派系的团体。）the\nfactious disputes in + 组织\t组织内部派系纷争\tThere were factious quarrels in the committee.（委员会内部发生了派系争吵。）\nbecome/ grow/remain factious","s":["1675","1791"]},{"w":"farce","d":"滑稽剧；闹剧；荒诞可笑的事件","f":"n. 滑稽剧；闹剧；荒诞可笑的事件","s":["1675","1791"]},{"w":"flatter","d":"奉承讨好（含私心）；使更显好看（客观美化）；使荣幸人内容因奉","f":"vt. 奉承/讨好（含私心）；使更显好看（客观美化）；使荣幸。\nflatter + 人 + about/on + 内容：因……奉承。He flattered her about her cooking.（夸她做饭，未必真心。）\nflatter + 人 + into doing：甜言蜜语哄骗做……She flattered him into paying.（哄他付了钱。）\nbe flattered by：被……取悦，受宠若惊。I'm flattered by your invitation.（受宠若惊。）\nflatter oneself that：自以为是（贬）。He flatters himself that he's indispensable.（自以为不可替代。）","s":["1791"]},{"w":"gabble","d":"急促不清地说、咕噜咕噜地胡扯（动词）急促而不清楚地说、叽里咕","f":"vt. “急促不清地说”、“咕噜咕噜地胡扯”\n（动词）：急促而不清楚地说、叽里咕噜\n作动词时，常接 on/away 表示“不停地咕哝”，或接 out 表示“匆忙含混地说出”\n例句：She gabbled on for ten minutes, but I couldn't catch a word.（她叽里咕噜地说了十分钟，但我一个字都没听清。）\n例句：He gabbled out his apology and ran away.（他含混匆忙地道了歉就跑掉了。）\n（名词）：含混不清的说话声、叽叽喳喳的嘈杂声\nI could hear the low gabble of voices from the next room.（我能听到隔壁房间传来的低沉的叽叽喳喳说话声。）","s":["1791"]},{"w":"genre","d":"类型；体裁","f":"n. 类型；体裁","s":["1675","1791"]},{"w":"glossary","d":"书末或文末的术语表词汇表，","f":"n. 书末或文末的“术语表/词汇表”，","s":["1675","1791"]},{"w":"grumble","d":"低沉的、持续的隆隆声人低声嘟  recount the numbers[syn]\"recount\" 表示叙述、讲述或重新计算。与 \"narrate\" 和 \"retell\" 相似，但 \"recount\" 更强调详细地叙述或讲述一个故事、事件或经历。与 \"recompute\" 相似，但 \"recount\" 更常用于描述重新计算或复查某个数值或结果。","s":["1925"]},{"w":"refute","d":"反驳","f":"反驳 [syn]区别: \"refute\" 表示驳斥、反驳或否认。与 \"rebut\" 和 \"contradict\" 相似，但 \"refute\" 更强调提供证据或论据来证明某个主张、观点或陈述是错误的或不正确的。与 \"disprove\" 相似，但 \"refute\" 更常用于指针对某个特定主张或观点的反驳。","s":["1925"]},{"w":"reiterate","d":"重申，反复地说","f":"重申，反复地说[ph]reiterate a point/an apology/the demand","s":["1925"]},{"w":"remark","d":"评论，注释","f":"评论，注释 n. make a remark on","s":["1925"]},{"w":"remind","d":"提醒，使记得","f":"提醒，使记得","s":["1925"]},{"w":"repertoire","d":"（剧团等）常备剧目，保留剧目","f":"（剧团等）常备剧目，保留剧目[ph]a diverse repertoire of songs[ph]an impressive repertoire of Shakespearean plays[ph]musical repertoire[ph]cooking ~","s":["1925"]},{"w":"request","d":"请求，要求","f":"n./v. 请求，要求","s":["1925"]},{"w":"respond","d":"回答，反应","f":"回答，反应","s":["1925"]},{"w":"reveal","d":"展现；揭露","f":"展现；揭露","s":["1925"]},{"w":"rhetoric","d":"修辞学，辞言运用（）浮夸的言辞，夸大其词（）","f":"修辞学，辞言运用（60%）浮夸的言辞，夸大其词（40%）[st]The politician's speech was filled with persuasive rhetoric to win over the voters.[ph]exaggerated rhetoric[st]The study of rhetoric helps individuals develop effective communication skills and persuasive techniques.","s":["1925"]},{"w":"satire","d":"讽刺；讽刺文学","f":"讽刺；讽刺文学[ph]a satire on politics.[ph]a biting satire of[syn]\"satire\"、\"mockery\"、\"parody\"和\"lampoon\" 都可以指对事物进行讽刺或嘲笑。\"satire\" 是一种更广泛的文学或艺术形式，旨在通过讽刺和嘲笑来批评和揭示社会问题。\"mockery\" 强调对某人或某事进行嘲弄或讥讽。\"parody\" 是指模仿某种作品或风格，以幽默或嘲弄的方式呈现。\"lampoon\" 强调对某人或某事进行尖刻的讽刺和批评，通常是通过文学或艺术作品来实现。","s":["1675","1925"]},{"w":"satirist","d":"讽刺作家","f":"讽刺作家[syn]\"satirist\"、\"humorist\" 和 \"wit\" 都可以指具有幽默和讽刺才能的人。\"satirist\" 专指从事讽刺文学或艺术创作的人。\"humorist\" 侧重于指那些擅长制造幽默和滑稽笑话的人，不一定以讽刺为主要目标。\"wit\" 强调智慧和机智，指那些善于用聪明才智制造幽默和搞笑的人，也不一定局限于讽刺方面。","s":["1675","1925"]},{"w":"slogan","d":"标语，口号","f":"n.标语，口号","s":["1675"]},{"w":"specify","d":"明确说明；具体指定","f":"明确说明；具体指定","s":["1925"]},{"w":"succinct","d":"简明 screet inquiry / question — 谨慎的询问（避免引人注意）\ndiscreet distance / manner — 不显眼的距离／审慎的举止","s":["1675","1791"]},{"w":"discretion","d":"审慎谨慎地处理由某人自行决定酌情处理行使酌情权审慎行事做某事","f":"n. 审慎\nwith discretion 谨慎地(处理)\nat/in someone's discretion — 由某人自行决定／酌情处理\nuse / exercise discretion — 行使酌情权／审慎行事\ndiscretion in doing something — 做某事时的慎重 He showed great discretion in not revealing the client's name.（他没有透露客户姓名，表现出了极大的审慎。）","s":["1675","1791"]},{"w":"effective","d":"有效的；有影响的","f":"adj. 有效的；有影响的","s":["1791"]},{"w":"elegant","d":"雅致的","f":"adj. 雅致的","s":["1791"]},{"w":"eloquent","d":"雄辩的；有口才的","f":"adj. 雄辩的；有口才的","s":["1791"]},{"w":"energetic","d":"积极的；精力旺盛的","f":"adj. 积极的；精力旺盛的","s":["1791"]},{"w":"excellent","d":"优秀的；杰出的","f":"adj. 优秀的；杰出的","s":["1791"]},{"w":"expeditious","d":"迅速的；敏捷的","f":"adj. 迅速的；敏捷的","s":["1675","1791"]},{"w":"experienced","d":"有经验的","f":"adj. 有经验的","s":["1791"]},{"w":"exquisite","d":"精致的（精准对应工艺、品味、美感上的极高品质与细腻度，最通用","f":"adj. 精致的（精准对应“工艺、品味、美感上的极高品质与细腻度”，最通用）。\n美国学生写作文、写艺术评论、做正式演讲时用 exquisite；平时夸人和吐槽都不用。吃饭时exquisite一般用于高级餐厅。\n1. 形容物品、工艺或建筑“精美绝伦”（绝对高频，购物/旅游/评论场景）\n短语搭配：exquisite craftsmanship / workmanship（精湛的工艺）；exquisite jewelry / porcelain / furniture（精美的珠宝/瓷器/家具）\n例句：The watch is a masterpiece of exquisite craftsmanship.（这块表是精湛工艺的杰作。）\n例句：They stayed in an exquisite 18th-century palace.（他们住在一座精美的18世纪宫殿里。）\n2. 形容美食、气味或味道“极其精致/鲜美”（美食/品酒高频）\n短语搭配：exquisite flavor / taste / cuisine（精致的风味/美味/佳肴）；exquisite wine / chocolate（精品红酒/巧克力）\n例句：This restaurant is famous for its exquisite French cuisine.（这家餐厅以其精致的法式料理而闻名。）\n例句：The wine has an exquisite bouquet of berries and spices.（这款红酒散发着浆果和香料构成的精致香气。）\n3. 形容品位、审美或优雅“高雅考究”（时尚/艺术评论）\n短语搭配：exquisite taste / style / elegance（高雅的品位/风格/优雅）\n例句：She has exquisite taste in interior design.（她在室内设计方面有高雅的品位。）\n例句：Her gown was an exquisite blend of classic and modern style.（她的礼服是古典与现代风格的精致融合。）","s":["1675","1791"]},{"w":"facile","d":"轻易的、不费力的这个词的情况下带有贬义，指肤浅的、草率的、未","f":"adj. 轻易的、不费力的这个词 95% 的情况下带有贬义，指“肤浅的、草率的、未经深思熟虑的”。\nfacile + 贬义名词\t肤浅的、草率的\tThat's a facile explanation.（那是个肤浅的解释。）","s":["1675","1791"]},{"w":"faithful","d":"忠实的信徒作名词时，几乎永远以复数形式出现，表示一群忠实的信","f":"adj. 忠实的。n. 信徒 faithful 作名词时，几乎永远以复数形式 the faithful 出现，表示“一群忠实的信徒、追随者或拥护者”。它不能像 dog 那样指“一个忠实的人”（不能说 a faithful）。","s":["1791"]},{"w":"feasible","d":"切实可行的人机构对（某人机构）来说可行（这个计划对小公司来说","f":"adj. 切实可行的\nbe feasible for + 人/机构\t对（某人/机构）来说可行\tThis plan is feasible for a small company.（这个计划对小公司来说可行。）\nbe feasible to + 人\t（在某人看来）是可行的\tThe solution seems perfectly feasible to me.（这个解决方案在我看来完全可行。）\nIt is feasible to do...\t做……是可行的（最最常用！）\tIt is feasible to finish the project within a month.（一个月内完成这个项目是可行的。）\nfeasible + 名词","s":["1791"]},{"w":"firm","d":"坚挺的；结实的","f":"adj. 坚挺的；结实的","s":["1791"]},{"w":"fit","d":"适合的","f":"v. 适合的","s":["1791"]},{"w":"fitting","d":"合适的恰当的（情况是形容词）；配件试穿（名词）作形容词强调符","f":"合适的/恰当的（90%情况是形容词）；配件/试穿（名词）。作形容词强调符合场合、礼节或伦理的标准（比 appropriate 更庄重）；作名词复现于 fitting room（试衣间） 和 fittings（装置/配件）。\nsth. be fitting for sth. \nIt is fitting that... \nsth. is a fitting tribute / response / end to sb./sth. 恰当的致敬/回应/结局\nfitting tribute（恰如其分的致敬）fitting punishment/response（应得的惩罚/回应）\tThe award is a fitting tribute to his work.（实至名归。）\nclothes fitting（试穿/量身）light/plumbing fittings（灯具/水管接头）fitting room（试衣间）\tThe fittings in the kitchen need replacing.（厨房配件需更换。）","s":["1791"]},{"w":"flexible","d":"灵活的、可变通的、能适应变化的字面抽象都可用（灵活的时间安排","f":"adj. 灵活的、可变通的、能适应变化的。字面抽象都可用。\nflexible schedule（灵活的时间安排）——听力对话高频 flexible approach / strategy（灵活的方法/策略）——口语/写作常用\nUniversities are adopting more flexible admission policies to attract international students.（大学正采用更灵活的招生政策来吸引国际学生。）——阅读/写作\nMy part‑time job allows a flexible schedule, so I can adjust my study time easily.（我的兼职工作允许灵活排班，所以我能轻松调整学习时间。）——听力对话/口语","s":["1791"]},{"w":"flighty","d":"轻浮的、善变的、反复无常的（指人注意力不集中，想法或喜好经常","f":"adj. 轻浮的、善变的、反复无常的（指人注意力不集中，想法或喜好经常改变，缺乏责任心或深度）。\na flighty person（一个善变的人）flighty and unreliable（轻浮且不可靠——听力中常成对出现）","s":["1675","1791"]},{"w":"fluent","d":"流利的；流畅的","f":"adj. 流利的；流畅的","s":["1791"]},{"w":"frank","d":"坦白的；直率的","f":"adj. 坦白的；直率的","s":["1675","1791"]},{"w":"frugal","d":"节俭的、精打细算的，偏褒义","f":"adj. “节俭的、精打细算的”，偏褒义。","s":["1675","1791"]},{"w":"gallant","d":"英勇的动作战斗在方面表现英勇人对某人（通常指女性）极其殷勤有","f":"adj. 英勇的\nbe gallant in + 动作/战斗：在……方面表现英勇。\nbe gallant to / towards + 人：对某人（通常指女性）极其殷勤/有礼。\n读音\t                                 重音位置\t                侧重点\t                                                     例句感受\n/ˈɡæl.ənt/（GAL-ant）\t重音在第一音节\t侧重 “英勇的、无畏的”（战斗精神）\t    “The gallant soldier saved his comrade.”（那位英勇的士兵救了他的战友。）\n/ɡəˈlænt/（guh-LANT）\t重音在第二音节\t侧重 “对女士殷勤的、风流的”（骑士礼仪）“He was very gallant to the ladies.”（他对女士们非常殷勤。——带有“献殷勤”的意味）","s":["1675","1791"]},{"w":"gauche","d":"笨拙的、不圆滑的、缺乏社交风度的（尤其指因为不懂上流社会或正","f":"adj. 笨拙的、不圆滑的、缺乏社交风度的（尤其指因为不懂上流社会或正式场合的规矩，而显得粗俗或令人不适）","s":["1675","1791"]},{"w":"generous","d":"慷慨的；大方的","f":"adj. 慷慨的；大方的","s":["1791"]},{"w":"generously","d":"慷慨的有着给得特别足、特别大方、不抠抠搜搜的画面感点菜菜谱食","f":"adv. 慷慨的。有着“给得特别足、特别大方、不抠抠搜搜”的画面感。\n① 点菜/菜谱/食物（最高频！）\n这是美国人（尤其是吃货）最常看到或用到 generously 的地方。它专指 “分量大、用料足”。\n\n菜单描述：“A generously sized burger.”（一个分量十足的汉堡。——暗示你吃不完。）\n\n食谱步骤：“Generously season the steak with salt and pepper.”（大量地用盐和黑胡椒给牛排调味。——意思是别省盐，大胆撒！）\n\n做三明治：“Spread the mayonnaise generously.”（厚厚地抹一层蛋黄酱。）\n\n为什么美国人爱用它？ 因为美国饮食文化的核心就是“量大”。Generously 就是在告诉你：“这不是婴儿份的，这是美国份的！”\n\n② 评价“赞美/原谅”别人（人际厚道）\n当美国人在聊第三个人的品行时，generously 表示 “宽厚地、不刻薄地”。\n\n“She generously praised her rival’s performance.”\n（她宽厚地/大方地称赞了她对手的表现。——意思是她没有因为嫉妒而贬低对方，很有风度。）\n\n“He generously forgave my mistake.”\n（他宽宏大量地原谅了我的错误。）\n\n③ 慈善/捐赠（钱或时间）\n这才是字典里最标准的“慷慨解囊”。\n\n“They generously donated $1 million to the hospital.”\n（他们慷慨地向医院捐赠了100万美元。）\n“He generously volunteered his time to help.”\n（他慷慨地/大方地贡献了自己的时间来帮忙。）","s":["1791"]},{"w":"genial","d":"和蔼的通常指长辈形容人的性格（通常是长辈、领导、老派绅士）指","f":"adj. 和蔼的(通常指长辈)\n① 形容人的性格（通常是长辈、领导、老派绅士）\t指一个人宽厚、慈祥、好相处。年轻人如果被这样形容，会显得过于老成。\t“He is a genial old man who always has a kind word for everyone.”（他是个和蔼的老人，对每个人都说好话。）\n② 形容氛围/环境（聚会、谈话、天气）\t指气氛轻松愉快、不紧张。\t“We had a genial conversation over lunch.”（我们午餐时进行了一次愉快的交谈。——意味着没人拍桌子、没人冷场，宾主尽欢）\n③ 形容笑容/态度\t指宽厚的、不带任何攻击性的微笑。\t“She gave me a genial nod.”（她向我和蔼地点了点头。）","s":["1675","1791"]},{"w":"gentility","d":"有教养，文雅的核心意思是文雅、高雅，但它带有很强的社会阶层和","f":"n. 有教养，文雅\nGentility 的核心意思是 “文雅”、“高雅”，但它带有很强的 “社会阶层” 和 “出身” 色彩。\n为了帮你精准理解，我们分三个层面来看：\n1. 核心含义（品行与举止）\n指举止彬彬有礼、谈吐优雅、品味高尚，符合上层社会或受过良好教育之人的行为标准。\n例：She was noted for her grace and gentility.（她以优雅和文雅著称。）\n2. 历史与社会含义（阶级出身）\n指 “名门望族” 或 “绅士阶层” 的身份。它不仅仅指有钱，更强调“有教养的出身”（即“绅士派头”）。\n例：He came from a family of ancient gentility.（他出身于古老的名门世家。）\n3. 常见的贬义用法（重点！）\n在现代英语中，这个词经常带有 “打肿脸充胖子” 或 “附庸风雅” 的讽刺意味。指一个人家境或地位已经没落，却硬要维持表面上的体面和派头。\n例：Despite their poverty, they maintained a pretence of gentility.（尽管贫穷，他们仍硬撑着摆出一副体面人家的架子。）","s":["1675","1791"]},{"w":"genuine","d":"真实的","f":"adj. 真实的","s":["1791"]},{"w":"gracious","d":"有教养的仁慈的（好客周到的男女主人）特指那种让你宾至如归、永","f":"adj. 有教养的仁慈的\na gracious host/hostess（好客周到的男女主人）——特指那种让你宾至如归、永远及时添茶倒水的完美主人。gracious in defeat/win（败不馁/胜不骄）——体育评论高频词。输球了还大方祝贺对手，就是 gracious in defeat；赢球了不嘚瑟，就是 gracious in victory。\n雅致的、有格调的。a gracious old mansion（一栋雅致的老宅邸）；a gracious lifestyle（优雅从容的生活方式）。","s":["1675","1791"]},{"w":"grand","d":"盛大的，壮丽的宏伟的、壮丽的（宏伟的宫殿气派的入口）重大的、","f":"adj. 盛大的，壮丽的\n宏伟的、壮丽的 a grand palace / entrance（宏伟的宫殿/气派的入口）\n重大的、首要的、总的 a grand plan / strategy In the grand scheme of things, this mistake doesn't matter.（放在整个人生尺度看，这个错误不算什么。）\n一千元 I need to save five grand for the trip.","s":["1791"]},{"w":"hardheaded","d":"固执的、顽固的在托福阅读中，这个词多出现在商业、谈判、决策类","f":"adj. 固执的、顽固的。在托福阅读中，这个词多出现在商业、谈判、决策类话题中，此时多为褒义的\"务实精明\"。\n义项①：固执的、顽固的（贬义）He's too hardheaded to admit he's wrong.（他太固执，不肯承认自己错了。）\n义项②：冷静务实的、精明的（褒义/中性）We need a hardheaded businessman to handle the negotiations.（我们需要一个冷静务实的商人来处理谈判。）","s":["1675","1791"]},{"w":"hardy","d":"核心含义是耐，对人叫能吃苦耐劳，对植物叫耐寒抗冻（人动物）强","f":"adj. 核心含义是\"耐\"，对人叫\"能吃苦耐劳\"，对植物叫\"耐寒抗冻\"。\n（人/动物）强壮的、能吃苦耐劳的 —— 能在艰苦环境中生存\n例句：Hardy pioneers survived the harsh winter with little food.（吃苦耐劳的拓荒者靠很少的食物熬过了严冬。）\n（植物）耐寒的 —— 能耐受严寒天气\n例句：Roses are hardy plants that can survive frost.（玫瑰是耐寒植物，能抵御霜冻。）\n勇敢的、大胆的（较古旧用法）\n例句：A hardy band of explorers set out for the Arctic.（一支勇敢的探险队出发前往北极。）","s":["1675","1791"]},{"w":"hospitable","d":"对外友好场景一夸奖某户人家或主人（社交场合最高频）场景二形容","f":"adj. 对外友好\n场景一：夸奖某户人家或主人（社交场合最高频）\n场景二：形容一个地方或城市（对游客友好）\n场景三：职场或学术圈的“接纳”新成员","s":["1791"]},{"w":"humane","d":"人道的、仁慈的、富有同情心的动物福利与权益医疗、养老或刑事司","f":"adj. 人道的、仁慈的、富有同情心的\n动物福利与权益 We need to find a humane way to control the stray cat population.\n医疗、养老或刑事司法（对弱势群体的关怀）The nursing home provides humane care for the elderly.\n死亡方式（安乐死或死刑）The vet decided that euthanasia was the most humane option for the terminally ill dog.","s":["1675","1791"]},{"w":"imaginative","d":"富于想象的","f":"adj. 富于想象的","s":["1791"]},{"w":"impeccable","d":"字面义不会犯罪的，泛用义任何方面都挑不出毛病常用来夸赞那些通","f":"adj. 字面义“不会犯罪的”，泛用义\"任何方面都挑不出毛病\"。常用来夸赞那些通过努力或高标准达到的“零失误”状态。\nImpeccable + taste / manners / credentials（品味/礼仪/资历无可挑剔）\nImpeccable + timing（时机恰到好处 —— 指某人在绝佳时刻出现或行动）\nImpeccable + credentials / background（背景干净、履历漂亮 —— 招聘/政审常用）","s":["1791"]},{"w":"industrious","d":"勤勉的一般都形容人有主观的勤奋意愿（勤劳的员工）（勤奋的学生","f":"adj. 勤勉的。一般都形容人有主观的勤奋意愿。\nIndustrious + worker / employee（勤劳的员工）\nIndustrious + student / scholar（勤奋的学生/学者）\nIndustrious + bee / ant（忙碌的蜜蜂/蚂蚁）—— 经典固定修辞","s":["1791"]},{"w":"ingenious","d":"足智多谋的（人），或者精妙的（设计）形容人（人格特质）足智多","f":"adj. 足智多谋的（人），或者精妙的（设计）\n① 形容人（人格特质）\t“足智多谋的”、“心灵手巧的”——指这个人特别会找窍门、会做手工、会修东西。\tShe is an ingenious engineer who can fix anything.（她是个足智多谋的工程师，什么都能修。）\nThe thief was ingenious, but the police were smarter.（小偷很狡猾巧妙，但警察更聪明。——这里略带贬义，指“狡猾地聪明”）\n② 形容物/设计/方案（作品特质）\t“构思巧妙的”、“精妙的”——指机器设计、商业方案、广告创意极其巧妙。\tHe came up with an ingenious solution to the energy crisis.（他想出了一个解决能源危机的绝妙方案。）\nThe plot of that movie is ingenious.（那部电影的情节构思太精妙了。）\nAn ingenious + method / way / solution / plan（巧妙的方法/方案/计划）\nAn ingenious + device / gadget / design（精妙的装置/小工具/设计）\nIt is ingenious of someone to do...（某人做某事太有才了！）\nIt was ingenious of her to use a paperclip as a lock pick.（她居然用回形针当开锁工具，太有才了。）","s":["1791"]},{"w":"innocent","d":"清白的；幼稚的","f":"adj. 清白的；幼稚的","s":["1791"]},{"w":"intelligent","d":"聪明的","f":"adj. 聪明的","s":["1675","1791"]},{"w":"intrepid","d":"勇敢的","f":"adj. 勇敢的","s":["1675","1791"]},{"w":"invaluable","d":"极其宝贵的；无价的；不可估价的","f":"adj. 极其宝贵的；无价的；不可估价的","s":["1675","1791"]},{"w":"knowledgeable","d":"知识渊博的","f":"adj. 知识渊博的","s":["1791"]},{"w":"leading","d":"指导的；最主要的","f":"adj. 指导的；最主要的","s":["1791"]},{"w":"liberal","d":"心胸宽大的；慷慨的","f":"adj. 心胸宽大的；慷慨的","s":["1791"]},{"w":"limpid","d":"清澈的；透明的","f":"adj. 清澈的；透明的","s":["1675","1791"]},{"w":"logical","d":"合逻辑的","f":"adj. 合逻辑的","s":["1791"]},{"w":"lusty","d":"强壮的；精力充沛的","f":"adj. 强壮的；精力充沛的","s":["1675","1791"]},{"w":"meek","d":"温顺的，顺服的","f":"a.温顺的，顺服的","s":["1675"]},{"w":"meticulously","d":"小心翼翼地，细致地","f":"ad 小心翼翼地，细致地","s":["1675"]},{"w":"moderate","d":"中等的；适度的；有节制的","f":"a 中等的；适度的；有节制的","s":["1675"]},{"w":"nimble","d":"敏捷的；聪明的；敏感的","f":"adj. 敏捷的；聪明的；敏感的","s":["1675"]},{"w":"outspoken","d":"坦率直言的","f":"adj. 坦率直言的","s":["1675"]},{"w":"outstanding","d":"杰出的，显著的","f":"杰出的，显著的","s":["1925"]},{"w":"professional","d":"专业的，职业的；专业人士","f":"adj./n. 专业的，职业的；专业人士","s":["1925"]},{"w":"proficient","d":"熟练的；精通的","f":"adj. 熟练的；精通的","s":["1925"]},{"w":"profound","d":"深刻的，深奥的","f":"adj. 深刻的，深奥的","s":["1925"]},{"w":"progressive","d":"进步的；渐进的；（政策等）改革性的","f":"adj. 进步的；渐进的；（政策等）改革性的 [mean] 它描述一种朝着更好、更先进或更开放的方向发展的思想、态度、政策或行为。 [ph] progressive policies [ph] promote progressive social change","s":["1925"]},{"w":"prolific","d":"富有成果的（人）","f":"adj. 富有成果的（人） [ph] prolific composer/writer/artist","s":["1675","1925"]},{"w":"promising","d":"有前途的，有希望的","f":"adj. 有前途的，有希望的","s":["1925"]},{"w":"proper","d":"恰当的，得体的","f":"adj. 恰当的，得体的","s":["1925"]},{"w":"prudent","d":"审慎的，深谋远虑的","f":"adj. 审慎的，深谋远虑的 [ph] take a prudent approach by doing [ph]It is prudent to do","s":["1675","1925"]},{"w":"qualified","d":"合格的","f":"adj. 合格的","s":["1925"]},{"w":"rational","d":"理性的，合理的","f":"理性的，合理的","s":["1925"]},{"w":"refined","d":"优雅的；精制的","f":"优雅的；精制的","s":["1925"]},{"w":"reliab 的」「冷酷的」\n（形势、前景）严峻的、不容乐观的 The situation is grim for the refugees.\n（表情、神情）阴沉的、冷酷的、严肃的 His face was grim as he delivered the news.\n（现实、真相）残酷的、令人不快的 the grim reality of war（战争的残酷现实）","s":["1675","1791"]},{"w":"grumpy","d":"心情不好、容易发火、爱嘟囔的起床气臭脾气老头（经典形象）心情","f":"adj. 心情不好、容易发火、爱嘟囔的\nwake up grumpy\t起床气\na grumpy old man\t臭脾气老头（经典形象）\nin a grumpy mood\t心情烦躁","s":["1675","1791"]},{"w":"hoax","d":"骗局、恶作剧或谎言某人（骗某人去做某事）某人某物（骗走某人的","f":"v.n. 骗局、恶作剧或谎言。\nsth. is a hoax.\nhoax + 某人 + into doing something（骗某人去做某事）\nhoax + 某人 + out of + 某物（骗走某人的财物）","s":["1675","1791"]},{"w":"idiocy","d":"愚蠢；白痴行为；智力障碍（旧用法）","f":"n. 愚蠢；白痴行为；智力障碍（旧用法）","s":["1675","1791"]},{"w":"idiotic","d":"愚蠢的（一个愚蠢透顶的错误）（一个荒唐的想法计划）（绝对的完","f":"adj. 愚蠢的\nAn idiotic mistake（一个愚蠢透顶的错误）\nAn idiotic idea / plan（一个荒唐的想法/计划）\nAbsolutely / completely idiotic（绝对的/完全的白痴行为）——强调加强语气。","s":["1675","1791"]},{"w":"ignominious","d":"可耻的，不名誉的特指在公众面前丢脸（不光彩的惨败失败）最最最","f":"adj. 可耻的，不名誉的。特指在公众面前丢脸。\nIgnominious defeat / failure（不光彩的惨败/失败）：最最最常用，体育和政治新闻的标配。\nIgnominious end / exit（不光彩的结局/退场）：形容晚节不保。\nAn ignominious retreat（可耻的撤退）：形容大败亏输、狼狈逃窜。","s":["1675","1791"]},{"w":"ignorant","d":"无知的；不了解的","f":"adj. 无知的；不了解的","s":["1791"]},{"w":"improvident","d":"无远见的、不为未来打算的、挥霍无度的它形容一个人或一种行为只","f":"adj. “无远见的”、“不为未来打算的”、“挥霍无度的”。它形容一个人或一种行为只图眼前痛快，完全不管明天怎么办。\nImprovident + spending / habits / lifestyle（挥霍的开销/习惯/生活方式）\nImprovident + decision / policy（短视的决定/政策）\nImprovident + parent / child（不为孩子未来打算的父母/不顾未来的孩子）","s":["1675","1791"]},{"w":"imprudent","d":"轻率的；不谨慎的","f":"adj. 轻率的；不谨慎的","s":["1675","1791"]},{"w":"impudent","d":"鲁莽的（放肆的孩子学生下属）（放肆的言语顶嘴行为）（居然有脸","f":"adj. 鲁莽的\nImpudent + child / student / subordinate（放肆的孩子/学生/下属）\nImpudent + remark / reply / behavior（放肆的言语/顶嘴/行为）\nHave the impudence to do...（居然有脸做……）—— 这个名词搭配极其实用，专用于表达“他怎么敢？！”","s":["1675","1791"]},{"w":"indecent","d":"下流的（触犯了社会公共道德底线）（猥亵侵犯）刑事罪名（不雅暴","f":"adj. 下流的（触犯了社会公共道德底线）\n· Indecent assault（猥亵侵犯）——刑事罪名\n· Indecent exposure（不雅暴露）——固定法律术语\n· Indecent proposal（无礼要求）——经典文化梗（电影《桃色交易》原名）","s":["1791"]},{"w":"indolent","d":"懒懒的带有一种安于现状、不愿费劲的悠哉感，甚至带点懒洋洋的舒","f":"adj. 懒懒的。带有一种“安于现状、不愿费劲”的悠哉感，甚至带点“懒洋洋的舒适”。\nIndolent + person / youth / lifestyle（慵懒的人/青年/生活方式）\nIndolent + afternoon / summer（慵懒的下午/夏天）—— 用于文学描写，褒义或中性\nIndolent + tumor / ulcer（惰性肿瘤/缓慢发展的溃疡）—— 医学术语\nIndolent + bureaucracy / administration（懒政的官僚机构）","s":["1675","1791"]},{"w":"inept","d":"笨拙无能的最接近的中文是无能的、笨拙的、不得体的、不称职的它","f":"adj. 笨拙无能的。最接近的中文是 “无能的”、“笨拙的”、“不得体的”、“不称职的”。它描述的是：一个人极度缺乏技能或社交智商，导致做事搞砸、说话得罪人，而且常常让人觉得“这人怎么这么不靠谱”。\n主语 + be inept at + 名词/动名词\nHe is inept at dealing with people.（他不善于与人打交道。）\nShe is inept at math.（她数学极差。）","s":["1791"]},{"w":"inert","d":"惰性的、不活泼的它描述的是缺乏内在动力或能力去移动、反应或变","f":"adj. “惰性的”、“不活泼的”。它描述的是：缺乏内在动力或能力去移动、反应或变化，无论是物理上的（像一块石头）、化学上的（像惰性气体），还是精神上的（像大脑当机）。\nInert gas\t惰性气体（如氦、氖、氩）Chemically inert\t化学惰性的（不轻易发生反应）\nLie inert\t躺着不动/躺着毫无生气。描写伤员、昏迷者、极度疲惫的人。\nRemain inert\t保持呆滞/保持一动不动。\t描写受到惊吓或打击后的反应。\nbe Inert to + 外界刺激/诱惑。He was inert to all forms of temptation.","s":["1675","1791"]},{"w":"inflexible","d":"刚硬的、死板的、没得商量的（死板的规则制度政策）（固定的时间","f":"adj. 刚硬的、死板的、没得商量的\nInflexible + rules / regulations / policies（死板的规则/制度/政策）\nInflexible + schedule / deadline / approach（固定的时间表/不可改的截止日期/僵化的方法）\nRemain / stay inflexible on + 某议题（在某议题上保持强硬/不让步）\nHe remains inflexible on the salary issue.（他在薪资问题上寸步不让。）","s":["1791"]},{"w":"irresponsible","d":"不负责任的，不可靠的","f":"不负责任的，不可靠的[ph]irresponsible behavior/attitude/remarks","s":["1925"]},{"w":"lavish","d":"丰富的；浪费的","f":"adj. 丰富的；浪费的","s":["1675","1791"]},{"w":"luxurious","d":"奢侈的；豪华的","f":"adj. 奢侈的；豪华的","s":["1675","1791"]},{"w":"menial","d":"奴仆的，卑贱的","f":"adj. 奴仆的，卑贱的","s":["1675"]},{"w":"moron","d":"低能儿，白痴","f":"低能儿，白痴","s":["1675"]},{"w":"prodigal","d":"挥霍的；败家子","f":"挥霍的：spendthrift；败家子：spends freely","s":["1675"]},{"w":"rapacious","d":"贪婪的；贪得无厌的；自私的","f":"adj. 贪婪的；贪得无厌的；自私的","s":["1675"]},{"w":"reckless","d":"轻率的，鲁莽的","f":"轻率的，鲁莽的","s":["1925"]},{"w":"relentless","d":"无情的；残酷的；不间断的","f":"adj. 无情的；残酷的；不间断的","s":["1675"]},{"w":"rigid","d":"刚性的、僵硬的 otics.","s":["1791"]},{"w":"depress","d":"使沮丧","f":"v. 使沮丧","s":["1791"]},{"w":"deride","d":"嘲笑，愚弄当批评者居高临下，认为被批评对象低级、不值一提、连","f":"vt. 嘲笑，愚弄\n当批评者居高临下，认为被批评对象低级、不值一提、连被认真对待的资格都没有时，必须用 deride。\n通常用于嘲笑抽象的东西，比如批评家嘲笑思想、方式方法等。\nderide someone / something as something — 嘲笑某人／某物为…\nbe derided for something — 因某事被嘲笑","s":["1791"]},{"w":"deserve","d":"应得","f":"v. 应得","s":["1791"]},{"w":"design","d":"设计；图案；设计","f":"n. 设计；图案； v.设计","s":["1791"]},{"w":"desirable","d":"理想的非常理想的极可取的理想的结果预期的效果","f":"adj. 理想的\nhighly desirable — 非常理想的／极可取的  A quiet location near the park is highly desirable for home buyers.\ndesirable outcome / result — 理想的结果／预期的效果 The policy failed to produce the desirable outcome.","s":["1791"]},{"w":"desire","d":"想要；欲望","f":"v. 想要；欲望","s":["1791"]},{"w":"desirous","d":"最中性、书面、不带感情色彩的渴望，偏书面语渴望得到某物渴望做","f":"adj. 最“中性、书面、不带感情色彩”的渴望，偏书面语。\nbe desirous of something — 渴望得到某物\nbe desirous to do something — 渴望做某事\ndesirous of change / improvement — 渴望改变／改进","s":["1791"]},{"w":"despatch","d":"迅速处理","f":"n.迅速处理","s":["1791"]},{"w":"destine","d":"注定注定要得到前往某处注定要做某事注定伟大成功失败被命运注定","f":"vt. 注定\nbe destined for something — 注定要得到／前往某处\nbe destined to do something — 注定要做某事\nbe destined for greatness / success / failure — 注定伟大／成功／失败\nbe destined by fate / destiny — 被命运注定","s":["1791"]},{"w":"destiny","d":"命运","f":"n. 命运","s":["1791"]},{"w":"destructive","d":"破坏性的","f":"adj. 破坏性的","s":["1791"]},{"w":"detach","d":"分离将某物从某物上拆下分离使自己脱离抽身于某事或某人脱离现实","f":"vt. 分离\ndetach something from something — 将某物从某物上拆下／分离\ndetach yourself from something / someone — 使自己脱离／抽身于某事或某人\nbecome detached from reality — 脱离现实（形容词化用法）","s":["1791"]},{"w":"detached","d":"分离的；公正的","f":"adj. 分离的；公正的","s":["1791"]},{"w":"detect","d":"探测；发掘","f":"v. 探测；发掘","s":["1791"]},{"w":"determination","d":"决定；决心","f":"n. 决定；决心","s":["1791"]},{"w":"determine","d":"决定","f":"v. 决定","s":["1791"]},{"w":"deterrent","d":"威慑物或阻碍因素，指通过制造恐惧或不利后果，来阻止某人做某事","f":"n. “威慑物”或“阻碍因素”，指通过制造恐惧或不利后果，来阻止某人做某事\na deterrant to sb.","s":["1791"]},{"w":"detest","d":"憎恶","f":"v. 憎恶","s":["1791"]},{"w":"detract","d":"去掉，减损的核心意思是贬低、减损，指因某种因素，让原本好的事","f":"v. 去掉，减损\nDetract的核心意思是“贬低”、“减损”，指因某种因素，让原本好的事物在价值、美感或重要性上“打了折扣”。它几乎总是和介词 from 搭配使用（detract from）。\nThe poor lighting detracts from the building's beauty.（糟糕的照明减损了这栋建筑的美感。）——强调“本应更好，被拖后腿了”。\nThe poor lighting detracts from the building's beauty","s":["1791"]},{"w":"detriment","d":"损害的核心意思是损害、伤害，是一个正式名词，指对某事物的价值","f":"n. 损害\nDetriment的核心意思是“损害”、“伤害”，是一个正式名词，指对某事物的价值、利益或成功造成的负面削弱。它不强调“毁掉”，而是强调“拉后腿”或“带来坏处”。\nbe a detriment to. Smoking is a serious detriment to health.（吸烟对健康是严重损害。）His lack of experience was a detriment to his promotion.（经验不足是他晋升的不利因素。）\nto the detriment of...（最常用）：意为“对……造成损害/不利”。专门用来强调为了A而牺牲了B。\n  · 例句：He worked 80 hours a week, to the detriment of his health.（他每周工作80小时，损害了健康。）\nto one's detriment：意为“对某人自己不利”，通常指因自身行为而吃亏。\n  · 例句：She relied on outdated information, to her own detriment.（她依赖过时信息，最终害了自己。）\nwithout detriment to：意为“不损害……”，常用于法律或合同条款。\n  · 例句：The contract can be amended without detriment to your rights.（合同可修改，且不损害您的权利。）","s":["1791"]},{"w":"detrimental","d":"有害的偏书面正式表示对某人或某事造成负面伤害或不利影响，通常","f":"adj. 有害的(偏书面正式)。表示 “对某人或某事造成负面伤害或不利影响”，通常指长期的、严重的或累积性的损害，而不是一时的小麻烦。\ndetrimental to something — 对某事有害／不利\ndetrimental effect / impact — 有害的影响／负面冲击\nhighly / potentially detrimental — 极为有害的／潜在有害的","s":["1791"]},{"w":"devastate","d":"摧毁表示被彻底摧毁、精神上遭受毁灭性打击它既可以形容物理上的","f":"vt. 摧毁。表示 “被彻底摧毁、精神上遭受毁灭性打击”。它既可以形容物理上的“夷为平地”，也可以形容情感上的“崩溃、心碎”。\nbe devastated by something — 被某事摧毁／因某事而崩溃\ndevastate a region / economy / environment — 摧毁某地区／经济／环境\ndevastate someone emotionally — 使某人极度震惊／崩溃\ndevastating effects / consequences（形容词衍生）— 毁灭性的影响／后果","s":["1791"]},{"w":"develop","d":"发展；产生；成长","f":"v. 发展；产生；成长","s":["1791"]},{"w":"deviate","d":"偏离偏离计划日程（未经批准我们不能偏离原定计划）偏离常规标准","f":"vt. 偏离\ndeviate from the plan / schedule — 偏离计划／日程 We cannot deviate from the original plan without approval.（未经批准我们不能偏离原定计划。）\ndeviate from the norm / standard — 偏离常规／标准 His behavior often deviates from the social norm.（他的行为经常偏离社会常规。）\ndeviate from a path / course — 偏离路径／航向 The plane deviated from its course due to bad weather.（因恶劣天气，飞机偏离了航线。）","s":["1675","1791"]},{"w":"device","d":"机械；装置；设计","f":"n. 机械；装置；设计","s":["1791"]},{"w":"devise","d":"计划；发明","f":"v. 计划；发明","s":["1675","1791"]},{"w":"devoid","d":"缺乏的全然没有、空空如也缺乏某物毫无某物毫无情感毫无兴趣毫无","f":"adj. 缺乏的(全然没有、空空如也)\ndevoid of something — 缺乏某物／毫无某物\ndevoid of emotion / feeling — 毫无情感\ndevoid of interest / meaning — 毫无兴趣／毫无意义","s":["1925","1791"]},{"w":"devoted","d":"热心的","f":"adj. 热心的","s":["1791"]},{"w":"devour","d":"吞噬，风卷残云地吃狼吞虎咽地吃完如饥似渴地阅读被大火吞噬","f":"vt. 吞噬，风卷残云地吃\ndevour a meal / food — 狼吞虎咽地吃完\ndevour a book / novel — 如饥似渴地阅读\nbe devoured by fire / flames — 被大火吞噬","s":["1791"]},{"w":"dexterous","d":"灵巧的偏书面的高级词汇灵巧的双手手指擅长做某事（尤需技巧）","f":"adj. 灵巧的(偏书面的高级词汇)\ndexterous hands / fingers — 灵巧的双手／手指\ndexterous at / in doing something — 擅长做某事（尤需技巧）","s":["1791"]},{"w":"digress","d":"离题偏离主题偏离到某话题上（常用作插入语）稍微离题一下","f":"v. 离题\ndigress from the topic / subject — 偏离主题\nLet me digress for a moment to tell you an interesting story.\ndigress into something — 偏离到某话题上\nto digress briefly（常用作插入语）— 稍微离题一下","s":["1675","1791"]},{"w":"dilate","d":"使某物变宽、变大、或张开（通常指圆形或管状结构的开口）扩张瞳","f":"vt. 使某物变宽、变大、或张开（通常指圆形或管状结构的开口）\ndilate the pupils / blood vessels — 扩张瞳孔／血管\ndilate with something — 因某物而扩张／膨胀\ndilate on / upon something（正式书面语）— 详述／展开论述某话题","s":["1791"]},{"w":"dilemma","d":"左右为难；困境","f":"n. 左右为难；困境","s":["1791"]},{"w":"dim","d":"昏暗的；朦胧的","f":"adj. 昏暗的；朦胧的","s":["1675","1791"]},{"w":"diminish","d":"逐渐变小、逐渐减少","f":"v. 逐渐变小、逐渐减少","s":["1791"]},{"w":"diminutive","d":"人娇小，物体精巧","f":"adj. 人娇小，物体精巧","s":["1791"]},{"w":"dingy","d":"昏暗脏旧（昏暗破旧的房间公寓）常见于租房广告的雷区词（脏兮兮","f":"adj. 昏暗脏旧\ndingy room / apartment（昏暗破旧的房间/公寓）常见于租房广告的“雷区词”\ndingy curtains / carpet（脏兮兮发灰的窗帘/地毯）强调“原本不是这颜色，是积灰+褪色”的结果\ndingy alley / street（阴暗肮脏的小巷）","s":["1675","1791"]},{"w":"direct","d":"引导；直接的","f":"v. 引导；直接的","s":["1791"]},{"w":"disarm","d":"消解成指抽象事物，如怒火，戒备，少数情况指说服敌人放下武器（","f":"v. 消解(9成指抽象事物，如怒火，戒备，少数情况指说服敌人放下武器)\nShe disarmed his anger with a genuine apology.（她用真诚的道歉消解了他的怒火。）\nHis self-deprecating humor disarmed the entire audience.（他自嘲的幽默化解了全场观众的戒备心。）","s":["1791"]},{"w":"disarming","d":"消除敌意的有让人瞬间放下戒备的神奇魅力","f":"adj. 消除敌意的。有让人瞬间放下戒备的神奇魅力。","s":["1791"]},{"w":"disarray","d":"杂乱，混乱名词用，动词用，","f":"n. 杂乱，混乱\n名词用disarray，动词用mess up，disrupt","s":["1791"]},{"w":"disaster","d":"灾难","f":"n. 灾难","s":["1791"]},{"w":"disband","d":"解散九成情况下是解散组织委员会部队驱散抗议人群人群因缺乏资金","f":"vt. vi. 解散(九成情况下是vi.)\ndisband a group / committee / army — 解散组织／委员会／部队\ndisband the protest / crowd — 驱散抗议人群／人群\ndisband due to lack of funding / interest — 因缺乏资金／缺乏兴趣而解散","s":["1791"]},{"w":"discard","d":"丢弃","f":"v. 丢弃","s":["1791"]},{"w":"disclaim","d":"否认正式声明我与这事无关我不承担这个责任我放弃这个权利否认责","f":"v. 否认。正式声明“我与这事无关 / 我不承担这个责任 / 我放弃这个权利”。\ndisclaim responsibility / liability — 否认责任／免责声明\ndisclaim any involvement / knowledge — 否认参与／否认知情\ndisclaim ownership / interest — 放弃所有权／否认利益关系","s":["1791"]},{"w":"discount","d":"折扣","f":"n. 折扣","s":["1791"]},{"w":"discrete","d":"离散的；不相关的","f":"adj. 离散的；不相关的","s":["1675","1791"]},{"w":"disfigure","d":"毁容毁坏某人的面容外貌（她的手因事故留下的深疤而毁损了外形）","f":"v. 毁容\ndisfigure someone's face / appearance — 毁坏某人的面容／外貌\nHer hand was disfigured by the deep scars from the accident.（她的手因事故留下的深疤而毁损了外形。）\ndisfigure the landscape / environment — 破坏景观／环境美观（引申义）\ndisfigure a building / monument — 毁坏建筑／纪念碑的外观","s":["1791"]},{"w":"disgrace","d":"耻辱、丢脸、不光彩名词的使用频率远多于动词（丑闻发生后，他颜","f":"n. 耻辱、丢脸、不光彩\n名词的使用频率远多于动词\nin disgrace. He resigned in disgrace after the scandal.（丑闻发生后，他颜面扫地地辞职了。）\na disgrace to sb. That old broken fence is a disgrace to the neighborhood.（那个破旧的围栏是社区的耻辱。）\nv. 使蒙羞\ndisgrace someone / yourself — 使某人／自己丢脸\nbe disgraced for something — 因某事而蒙羞／被贬斥\ndisgraced politician / former CEO（过去分词作定语）— 身败名裂的政客／前CEO","s":["1791"]},{"w":"disgust","d":"厌恶","f":"n. 厌恶","s":["1791"]},{"w":"disinterested","d":"客观公正的（无利益冲突）公正的观察者第三方（即没有利益牵扯的","f":"adj. 客观公正的（无利益冲突）。\ndisinterested observer / party — 公正的观察者／第三方（即没有利益牵扯的中立方）\ndisinterested advice / judgment — 公正的建议／判断\ncompletely / perfectly disinterested — 完全公正的","s":["1791"]},{"w":"dismal","d":"惨淡的可以形容天气、成绩、心情、表现、前景等几乎所有让人高兴","f":"adj. 惨淡的。Dismal 可以形容天气、成绩、心情、表现、前景等几乎所有“让人高兴不起来”的事物。Dismal = Dis（否定/坏） + Mal（= Male，坏、恶）。\ndismal weather / day — 阴沉的天气／灰暗的日子\ndismal performance / record — 糟糕的表现／惨淡的记录\ndismal failure — 惨败","s":["1675","1791"]},{"w":"disparage","d":"贬低偏书面，中性客观，侧重不公正地降低价值，不带抹黑的恶意贬","f":"vt. 贬低(偏书面，中性客观，侧重“不公正地降低价值”，不带“抹黑”的恶意)\ndisparage someone's efforts / work / achievements — 贬低某人的努力／工作／成就\ndisparage someone as something — 把某人贬低为…\ndisparage the importance / value of something — 贬低某事物的重要性／价值","s":["1791"]},{"w":"dispatch","d":"调配，迅速完成某物的发送派遣等待发送延迟发送","f":"vt. 调配，迅速完成\nn.\ndispatch of something — 某物的发送／派遣 \nawait / delay the dispatch — 等待发送／延迟发送\nwith dispatch","s":["1791"]},{"w":"dispensable","d":"可有可无的（分开出去）（，称重衡量）（能的）能拿出去称重卖掉","f":"adj. 可有可无的\nDispensable = Dis（分开/出去） + Pens（= Pense，称重/衡量） + -able（能...的）→ “能拿出去称重卖掉换钱的” → “能处理掉的” → “非必需的、可有可无的”\ndispensable employee / staff — 可有可无的员工（随时可被替代或裁撤）\ndispensable details / information — 可有可无的细节／信息（非核心内容）\ndispensable item / object — 可有可无的物品（非必需品）","s":["1791"]},{"w":"displace","d":"取代被某物取代","f":"vt.取代\ndisplace sb./sth.\nbe displaced by something — 被某物取代","s":["1791"]},{"w":"dispose","d":"处理（处理掉丢弃解决）处理垃圾，销毁证据处理掉武器，（凶手试","f":"v. 处理\n（处理掉 / 丢弃 / 解决）dispose of waste / garbage / rubbish — 处理垃圾，dispose of evidence / weapons — 销毁证据／处理掉武器，The killer tried to dispose of the murder weapon.（凶手试图处理掉凶器。），dispose of a problem / issue — 解决掉问题 We need to dispose of this matter before the meeting.（我们需要在会前解决掉这件事。）\n使倾向于。“不是你在做决定，而是某种内在力量（性格、经历、环境）在无形中把你推向某个方向”。偏高级用法。\nHis kind nature disposes him to help others.（他善良的天性使他倾向于帮助他人。）\nThe protagonist's tragic past disposes him to distrust authority figures. （“主角悲惨的过去使他倾向于不信任权威人物。”）\ndispose someone to / towards（使某人倾向于 / 使有意于），dispose someone to do something — 使某人倾向于做某事，be well / favourably disposed to someone / something — 对…有好感／持赞成态度，The board is favourably disposed to our proposal.（董事会对我们的提案持赞成态度。）","s":["1791"]},{"w":"disproportionate","d":"不成比例的","f":"不成比例的 [ph] A is ~ to B","s":["1925"]},{"w":"disprove","d":"驳斥，通过提供证据或逻辑论证，证明某个说法、理论或指控是错误","f":"v. 驳斥，“通过提供证据或逻辑论证，证明某个说法、理论或指控是错误的”。\ndisprove sth. with sth. / by doing sth.\ndisprove a theory / hypothesis — 推翻／证明某理论／假设错误\ndisprove a claim / allegation — 驳斥某说法／指控\ndisprove a statement / argument — 证明某陈述／论点有误","s":["1791"]},{"w":"disrepute","d":"坏名声，不光彩","f":"坏名声，不光彩 n.[ph] sth. put sth./sb. in disrepute[ph]brought his reputation into/in disrepute[ph]bring into disrepute","s":["1925"]},{"w":"disrespect","d":"失礼，无礼","f":"失礼，无礼 n./v.[ph]show ~ to/for sb.","s":["1925"]},{"w":"disrupt","d":"扰乱是打破原有的正常秩序或流程，导致混乱或中断扰乱会议课堂活","f":"v. 扰乱。是“打破原有的正常秩序或流程”，导致混乱或中断。\ndisrupt a meeting / class / event — 扰乱会议／课堂／活动\ndisrupt the market / industry — 颠覆市场／行业（商业语境，常用于技术创新）\ndisrupt communication / supply chains — 中断通讯／供应链\ndisrupt plans / schedules — 打乱计划／日程","s":["1791"]},{"w":"dissemble","d":"掩饰通过隐藏真实感受或假装某种状态，来掩盖自己的真实意图或想","f":"vt. vi. 掩饰。 “通过隐藏真实感受或假装某种状态，来掩盖自己的真实意图或想法”。\ndissemble one's true feelings / intentions — 掩饰真实感受／意图\ndissemble about something — 对某事加以掩饰（不愿透露实情）\ndissemble one's anger / fear / anxiety — 掩饰愤怒／恐惧／焦虑。\nHe dissembled when asked about his plans, pretending he hadn't decided yet.（当被问及他的计划时，他装糊涂，假装自己还没决定。）","s":["1791"]},{"w":"disseminate","d":"传播像撒种子一样，让信息在人群中生根发芽、传播开来涉及的是抽","f":"v. 传播。像撒种子一样，让信息在人群中生根发芽、传播开来。涉及的是“抽象事物”（知识/思想），而非“实物”。强调“渗透”与“覆盖面”，而非“命令”。\nThe internet has made it easier to disseminate news worldwide.\nThe organization’s mission is to disseminate scientific knowledge to the public.\ndisseminate information / knowledge / ideas — 传播信息／知识／思想","s":["1791"]},{"w":"dissimilar","d":"不相似的，不同的与不同在某方面不同","f":"adj. 不相似的，不同的\nbe dissimilar to/from sb. /sth. 与...不同\nbe dissimilar in something 在某方面不同","s":["1791"]},{"w":"dissipate","d":"消散慢慢消散、逐渐消失、浪费掉用法一物理视觉层面（使）某物逐","f":"v. 消散。慢慢消散、逐渐消失、浪费掉。\n用法一：物理/视觉层面——（使）某物逐渐散开、消失（像雾气、云朵、热量等）。\nThe morning fog dissipated as the sun rose.（随着太阳升起，晨雾渐渐散去。）\n\n用法二：抽象/能量层面——（使）精力、时间、金钱被挥霍掉，或者情绪、争议等逐渐平息。\nHe dissipated his inheritance on parties.（他把遗产挥霍在了派对上。）\nThe crowd dissipated after the concert.（音乐会结束后，人群散去了。）","s":["1791"]},{"w":"distant","d":"远的","f":"adj. 远的","s":["1791"]},{"w":"distasteful","d":"（令人）不愉快的，讨厌的","f":"（令人）不愉快的，讨厌的","s":["1925"]},{"w":"distort","d":"歪曲（抽象义，如事实、言论）；扭曲（物理义，如形状、图像）歪","f":"vt. 歪曲（抽象义，如事实、言论）；扭曲（物理义，如形状、图像）\ndistort the truth / facts / reality — 歪曲真相／事实／现实\ndistort an image / shape / sound — 使图像／形状／声音失真","s":["1791"]},{"w":"distract","d":"分心使某人从某事上分心","f":"v. 分心\ndistract someone from something — 使某人从某事上分心","s":["1791"]},{"w":"distressed","d":"痛苦的因严重问题、危险或困境而感到极度焦虑、痛苦，并且迫切需","f":"adj. 痛苦的。 “因严重问题、危险或困境而感到极度焦虑、痛苦，并且迫切需要帮助”。\nShe was distressed to learn that her flight had been cancelled.（得知航班取消，她焦虑万分。）\nThe family was distressed over the financial crisis.（这个家庭因金融危机而深陷困境。）","s":["1791"]},{"w":"distribute","d":"分发；分送；分布","f":"v. 分发；分送；分布","s":["1791"]},{"w":"disunite","d":"分裂使团体政党运动分裂因某事而分裂（该联盟因战略上的分歧而分","f":"v. 分裂\ndisunite a group / party / movement — 使团体／政党／运动分裂\nbe disunited by something — 因某事而分裂 The alliance was disunited by disagreements over strategy.（该联盟因战略上的分歧而分裂。）\ndisunite over an issue / policy — 在某议题／政策上产生分裂（指群体内部）The committee was disunited over the proposed budget cuts.（委员会在拟议的预算削减问题上意见分裂。）","s":["1791"]},{"w":"diverge","d":"分歧与某物不同偏离某物在意见观点兴趣上存在分歧在某事上意见不","f":"vi. 分歧\ndiverge from something — 与某物不同／偏离某物\ndiverge in opinion / views / interests — 在意见／观点／兴趣上存在分歧\ndiverge on something — 在某事上意见不一","s":["1791"]},{"w":"divergent","d":"分歧的，分叉的与有分歧与不一致较少用有分歧的观点意见不同（甚","f":"adj. 分歧的，分叉的\nbe divergent from. 与...有分歧 His opinion is divergent from the majority.\nbe divergent with 与...不一致(较少用) His actions are divergent with his stated beliefs.\ndivergent views / opinions — 有分歧的观点／意见\ndivergent interests / goals — 不同（甚至相冲突）的利益／目标\ndivergent from something — 与某物不同／相悖","s":["1791"]},{"w":"diverse","d":"不同的","f":"adj. 不同的","s":["1925","1791"]},{"w":"diversify","d":"使多元化（分散投资组合）（拓展多元化进入新市场）（使产品线多","f":"v. 使多元化\ndiversify your portfolio（分散投资组合）\ndiversify into new markets（拓展/多元化进入新市场）\ndiversify product lines（使产品线多样化）","s":["1791"]},{"w":"division","d":"分开，分割","f":"分开，分割","s":["1925"]},{"w":"domestic","d":"家内的；国内的","f":"adj. 家内的；国内的","s":["1791"]},{"w":"dominant","d":"占优势的；主导的","f":"adj. 占优势的；主导的","s":["1791"]},{"w":"donate","d":"捐赠","f":"v. 捐赠","s":["1791"]},{"w":"donor","d":"捐赠者","f":"n. 捐赠者","s":["1791"]},{"w":"doom","d":"命定的；注定失败的","f":"v. 命定的；注定失败的","s":["1791"]},{"w":"doubt","d":"怀疑","f":"v. n. 怀疑","s":["1791"]},{"w":"doubtful","d":"未确定的；不可靠的","f":"adj. 未确定的；不可靠的","s":["1791"]},{"w":"drastic","d":"激烈的","f":"adj. 激烈的","s":["1675","1791"]},{"w":"drawback","d":"弊端","f":"n. 弊端","s":["1791"]},{"w":"drift","d":"漂移、漂流（）移动方向的变化（）飘移、移动（）","f":"漂移、漂流（40%）移动方向的变化（30%）飘移、移动（30%） n./v.[ph]drift of ocean currents[ph]drift of the conversation[ph]leaves drifted down[ph]boat started to drift[syn]Drift 更常用于描述物体或人无意识地随着外部力量或环境而移动或改变方向。Float 强调轻轻漂浮或飘浮在液体或空气中的移动。Glide 强调平稳地、优雅地移动或滑行，通常用于描述鸟或滑翔器的运动。Shift 指的是移动或变化位置、方向或态度，强调有意识地改变或转移。","s":["1925"]},{"w":"dual","d":"二重的；两层的","f":"adj. 二重的；两层的","s":["1675","1791"]},{"w":"due","d":"到期的或应有的指时间到了或欠款该付到期的、预定的强调截止日期","f":"adj. 到期的 或 应有的。\n1. 指“时间到了”或“欠款该付”—— “到期的”、“预定的”\n强调截止日期临近，或某事按计划应发生。\n例：The rent is due tomorrow.（房租明天到期。）\n例：The baby is due in March.（宝宝预产期在三月份。）\n\n2. 指“恰当、符合规矩或应得的”—— “应有的”、“适当的”\n强调合理、得体或按法律/道义该给的。\n例：She handled it with due care.（她以应有的谨慎处理了此事。）\n例：Give due consideration to the proposal.（给予该提案适当的考虑。）","s":["1791"]},{"w":"dumb","d":"哑的；无言的","f":"adj. 哑的；无言的","s":["1791"]},{"w":"dungeon","d":"地牢","f":"n. 地牢","s":["1791"]},{"w":"durable","d":"情况形容抗造的物品，形容经得起时间考验的关系或体系耐久的，持","f":"adj. 80%情况形容“抗造”的物品，20%形容“经得起时间考验”的关系或体系\n\n耐久的，持久的\n指物品质量——“耐用的”、“经久耐磨的”\n强调不容易坏、能扛住长期使用。\n\n例：These shoes are very durable. (这双鞋非常耐用。)\n\n指抽象关系或状态——“持久的”、“长久的”\n强调能长时间维持，不轻易断裂。\n例：Their relationship is surprisingly durable. (他们的关系出人意料地长久。)","s":["1791"]},{"w":"dusky","d":"形容光线或天色昏暗的、朦胧的那是一个暮色沉沉的傍晚形容肤色微","f":"adj. 形容光线或天色——“昏暗的”、“朦胧的”\nIt was a dusky evening. (那是一个暮色沉沉的傍晚。)\n形容肤色——“微黑的”、“黝黑的”(在美国2026年不再用于形容人，因为有歧视性质)\nHer dusky skin glowed in the sun. (她微黑的皮肤在阳光下泛着光泽。)","s":["1675","1791"]},{"w":"dwindle","d":"减少自带归零倒计时（逼近于无）自带消极的担忧情绪（令人心慌）","f":"vi. 减少\n1. 自带“归零倒计时”（逼近于无）\n2. 自带“消极的担忧情绪”（令人心慌）永远指坏事。\n3. 节奏必须是“缓慢而稳定”（不是暴跌）","s":["1791"]},{"w":"eccentric","d":"古怪的或怪僻的偏褒义或幽默，指无害且有趣的另类，甚至暗示对方","f":"adj. 古怪的或怪僻的。偏褒义或幽默，指无害且有趣的另类，甚至暗示对方有才华或高智商（如爱因斯坦的发型）。当美国人用 eccentric 时，他们其实是在“礼貌地保护”对方。这个词在美国文化中是一个“带有贵族气质的过滤器”。用它，意味着说话者在暗示：“这个人虽然怪，但怪得无害、怪得有趣、甚至怪得很有深度——绝对不是那种让人想报警的怪。”\n指人的性格/行为——“古怪的”、“异于常人的”。强调行为或穿着与众不同，但这种“怪”通常不带恶意，甚至让人觉得有趣或有个性。例：My grandfather has some eccentric habits. (我祖父有一些古怪的习惯。)\n指事物/设计——“反常的”、“独特的”指设计或风格不走寻常路，偏离常规。例：The building has an eccentric shape. (这座建筑造型很奇特。)\n物理/机械术语——“离心的”。指偏离中心的轴或运动。例：eccentric wheel (偏心轮)。","s":["1791"]},{"w":"edge","d":"边","f":"n. 边","s":["1791"]},{"w":"effect","d":"效果；印象","f":"n. 效果；印象","s":["1791"]},{"w":"effectuate","d":"实现或施行语气很正式，法律官僚书面语实现一项计划促成变革完成","f":"v. 实现或施行。语气很正式，法律/官僚书面语。\neffectuate a plan / change：实现一项计划 / 促成变革。\neffectuate payment：完成支付（银行/法律术语）。","s":["1791"]},{"w":"effuse","d":"流露（比喻义）；涌出（字面义）对赞不绝口大加赞扬用于形容热烈","f":"vt. vi. 流露（比喻义）；涌出（字面义）。\neffuse about/over sth/sb\t对...赞不绝口 / 大加赞扬。用于形容热烈谈论或赞美某人/某事。\tShe effused about her wonderful trip to Italy.\n(她滔滔不绝地谈论她那美妙的意大利之旅。)\neffuse gratitude for\t表达感激之情。\tShe effused gratitude for the help she received.\n(她对所得到的帮助表达了由衷的感激。)\neffuse praise on\t大加赞扬 / 溢美之词。\tHe effused praise on his team.\n(他对他的团队不吝赞美之词。)\neffuse warmth\t洋溢着热情。\tThe hall effuses warmth and hospitality.\n(大厅里洋溢着热情友好的气氛。)\neffuse (from)\t(从...)流出 / 散发。用于描述具体事物的流出。\tBlood effused from the wound.\n(血从伤口流出来。)","s":["1791"]},{"w":"elementary","d":"基本的；初级的","f":"adj. 基本的；初级的","s":["1791"]},{"w":"elevate","d":"提高的情况用于抽象意义，指使地位更高、质量更好、情绪更振奋职","f":"vt. 提高。90%的情况用于抽象意义，指“使地位更高、质量更好、情绪更振奋”。\n职业与社会地位（晋升、抬举）这是非常高频的使用场景，强调职位或社会阶层的向上流动。\n搭配：elevate sb to + 职位 例：He was elevated to the position of managing director.（他被提升为董事总经理。）—— 注意 elevate 比 promote 更正式，常指跃升至显赫高位。\n例：The new policy aims to elevate the status of part-time workers.（新政策旨在提升兼职员工的地位。）\n2. 质量、水平与标准（拉高、改善）用于形容将事物、服务、审美等从“还不错”推向“卓越”。搭配：elevate ... to a new / higher level 或 elevate standards / quality\n例：We need to elevate customer service to a higher standard.（我们需要将客户服务提升到更高水准。）","s":["1791"]},{"w":"elite","d":"精华；中坚","f":"n. 精华；中坚","s":["1791"]},{"w":"elucidate","d":"阐明可结合（清澈的、明晰的）记忆其含义（阐明的机制性质作用）","f":"vt. 阐明。可结合 lucid（清澈的、明晰的）记忆其含义。\nelucidate the mechanism / nature / role of sth（阐明...的机制/性质/作用）","s":["1791"]},{"w":"elude","d":"逃避追捕、追踪或危险（物理躲避）（逃避抓捕）、（躲避警察）、","f":"v. \n逃避追捕、追踪或危险（物理躲避）elude capture（逃避抓捕）、elude the police（躲避警察）、elude detection（未被发现/躲过侦查）\n记忆或理解上“想不起、弄不懂”（认知层面）elude sb（某人想不起来）、elude one's memory / grasp（超出记忆/理解范围）\n例：The name of the actor eludes me right now, but I know his face.（那位演员的名字我现在想不起来了，但我认得他的脸。）例：The deeper meaning of the poem eluded most readers.（这首诗的深层含义让大多数读者感到费解。）\nWhy she said that eludes me.（我搞不懂她为啥那么说。）The solution to this puzzle continues to elude us.（这个谜题的答案仍然难倒了我们。）","s":["1791"]},{"w":"elusive","d":"难以捉摸记忆与思维层面（话到嘴边、想不起来）第一种话到嘴边想","f":"adj. 难以捉摸\n记忆与思维层面（话到嘴边、想不起来）第一种“话到嘴边想不起来”霸占了日常口语的80%使用频率。elusive name / word / memory（想不起的名字/词/记忆）、remain elusive（依然想不起来）\n追捕与目标层面（总是扑空）elusive criminal / predator（难以追捕的罪犯/捕食者）、elusive goal / dream（难以实现的目标/梦想）\n抽象概念——“难以定义、难以描述” Beauty is an elusive concept.（美是一个难以定义的概念。） She has an elusive charm that I can't quite describe.（她有一种难以言喻的魅力。）","s":["1791"]},{"w":"emaciate","d":"使消瘦作为动词原形在当代英语中极少单独使用你几乎只会见到它的","f":"v. 使消瘦。emaciate 作为动词原形在当代英语中极少单独使用。你几乎只会见到它的过去分词形式 emaciated（作形容词），译为 “消瘦的”、“憔悴的” 或 “骨瘦如柴的”。","s":["1791"]},{"w":"emaciated","d":"瘦弱的，憔悴的的情况最严重，比更严重（严重消瘦）、（极度消瘦","f":"adj.瘦弱的，憔悴的。emaciated的情况最严重，比skinny更严重。\nseverely emaciated（严重消瘦）、extremely emaciated（极度消瘦）、visibly emaciated（明显可见的消瘦）\nemaciated by hunger / starvation / illness / disease\nemaciated body / figure（消瘦的身躯/身形）、emaciated face / cheeks（消瘦的脸庞/面颊）、emaciated limbs / legs（瘦骨嶙峋的四肢/双腿）","s":["1791"]},{"w":"embellish","d":"装饰，修饰名词装饰物装饰褒义中性润色、修饰（使表达更优美）贬","f":"v. 装饰，修饰\nembellish [名词] with [装饰物] 装饰\nembellish a story / the truth / an account 褒义/中性：润色、修饰（使表达更优美）贬义/负面：添油加醋、添枝加叶、渲染（暗示夸大或不实）\n褒义还是贬义，看“宾语”是“物”还是“事”（90%的判断依据）。中性（纯物理装饰）：宾语是具体物体或艺术品。贬义（添油加醋）：宾语是抽象信息或事实。","s":["1791"]},{"w":"embody","d":"体现作为典型代表品质人物特质她体现了优雅即她是优雅的化身作为","f":"vt. 体现\n作为“典型代表” embody [品质] / [人/物] embodies [特质] She embodies elegance. (她体现了优雅。即：她是优雅的化身。)\n作为“包含/集成” embody [一系列内容] The plan embodies many new ideas. (该计划包含了许多新想法。)","s":["1675","1791"]},{"w":"emerge","d":"出现","f":"v. 出现","s":["1791"]},{"w":"emphatic","d":"断然坚决的指对某件事表达极其鲜明的赞同或反对（压倒性的胜利斩","f":"adj. 断然坚决的\n指对某件事表达极其鲜明的赞同或反对。emphatic victory / rejection / endorsement（压倒性的胜利/斩钉截铁的拒绝/旗帜鲜明的支持）\n下命令或定规矩（家庭/职场/课堂）emphatic demand / instruction（坚决的要求/明确的指示）My boss was emphatic that we finish the report by Friday.（老板坚决要求我们周五前完成报告。）—— 意思就是“别跟我讨价还价”。The teacher gave an emphatic reminder about the deadline.（老师着重提醒了截止日期。）\n言语/态度上：断然的、坚决的 be emphatic about [sth] / an emphatic denial / reply\n显著的、压倒性的 an emphatic victory / win / success","s":["1791"]},{"w":"empty","d":"空的","f":"adj. 空的","s":["1791"]},{"w":"emulate","d":"仿效指以某人或某物为榜样，努力模仿并力求达到或超越其水平充满","f":"v. 仿效。指以某人或某物为榜样，努力模仿并力求达到或超越其水平。充满敬意、有目标性、想超越。它默认是褒义词。\n以榜样为目标：仿效 / 效法 emulate [someone] / emulate [someone's] success / example\n技术/计算机领域：仿真 / 模拟 emulate [a system / device]","s":["1791"]},{"w":"enable","d":"使能够","f":"v. 使能够","s":["1791"]},{"w":"encompass","d":"包围；环绕","f":"v. 包围；环绕","s":["1791"]},{"w":"encourage","d":"鼓励","f":"v. 鼓励","s":["1791"]},{"w":"encumber","d":"阻碍，妨碍","f":"v. 阻碍，妨碍\nbe encumbered by/with","s":["1791"]},{"w":"endanger","d":"危害","f":"v. 危害","s":["1791"]},{"w":"endeavour","d":"努力；尽力","f":"v./n. 努力；尽力","s":["1791"]},{"w":"energize","d":"供给能量；使活跃","f":"v. 供给能量；使活跃","s":["1791"]},{"w":"enervate","d":"削弱、耗尽、使萎靡","f":"v. 削弱、耗尽、使萎靡","s":["1791"]},{"w":"engender","d":"产生专门用来产生抽象的感觉、氛围或社会状态，而且是自然而然慢","f":"v. 产生\nEngender 专门用来“产生”抽象的感觉、氛围或社会状态，而且是“自然而然慢慢酝酿出来的”。","s":["1791"]},{"w":"engross","d":"使全神贯注、吸引住名词动名词（）的用法全神贯注","f":"vt. 使全神贯注、吸引住\nbe engrossed in + 名词/动名词（doing）90%的用法 全神贯注","s":["1791"]},{"w":"engrossed","d":"全神贯注的","f":"adj. 全神贯注的","s":["1791"]},{"w":"engulf","d":"吞没几乎永远用于负面、压倒性且不可抗拒的事物，主语多为自然灾","f":"vt. 吞没。几乎永远用于负面、压倒性且不可抗拒的事物，主语多为 Flames/Smoke/Water/Fear/War/Darkness。\n自然灾害（火/水/沙）：指迅速覆盖并摧毁。\nFlames engulfed the building.（火焰吞没了大楼。）\nThe flood engulfed entire villages.（洪水吞没了整个村庄。）\n负面情绪（恐惧/悲伤/焦虑）：指情绪完全占据内心。\nShe was engulfed by panic.（她被恐慌吞没。）\nA feeling of emptiness engulfed him.（空虚感吞没了他。）","s":["1791"]},{"w":"enhance","d":"增加","f":"v. 增加","s":["1791"]},{"w":"enigma","d":"谜形容某人（性格、动机、背景）极难被理解（频率最高）（对某人","f":"n. 谜\n形容某人（性格、动机、背景）极难被理解（频率最高）remain an enigma to sb（对某人来说仍是个谜）\n形容科学、历史或自然界的未解之谜 unravel / solve the enigma of sth（解开……的谜团）","s":["1791"]},{"w":"enigmatic","d":"高深莫测的美国学生只在评价艺术品、文学作品或塑造神秘人物时用","f":"adj. 高深莫测的。美国学生只在“评价艺术品、文学作品或塑造神秘人物”时用 enigmatic。\nenigmatic figure，enigmatic stranger，enigmatic smile，enigmatic remark","s":["1791"]},{"w":"enlighten","d":"启发（就某事启发告知某人）（有启发的经历讨论）；（启迪心智）","f":"vt. 启发\nenlighten sb on / about sth（就某事启发/告知某人）\nan enlightening experience / discussion（有启发的经历/讨论）；enlighten one's mind（启迪心智）\nenlighten the public / masses about sth（就某事启发公众/大众）","s":["1791"]},{"w":"enormous","d":"巨大的","f":"adj. 巨大的","s":["1791"]},{"w":"enrich","d":"丰富","f":"v. 丰富","s":["1791"]},{"w":"enslave","d":"奴役；束缚","f":"v. 奴役；束缚","s":["1791"]},{"w":"entail","d":"涉及任务、工作、项目必然需要付出某种成本或精力（日常绝对高频","f":"v. 涉及\n任务、工作、项目必然需要付出某种成本或精力（日常绝对高频）entail (doing) sth（涉及/需要做某事）This job entails a lot of patience and meticulousness.（这份工作涉及大量的耐心和细致。）\n决策、投资、行动必然伴随风险或后果（商务/警示类高频）entail risks / costs / consequences（涉及风险/成本/后果）Investing in stocks entails considerable risk.（炒股涉及相当大的风险。）\n逻辑推理中的“如果A则必然附带B”（书面/正式论述）entail that... / entail changes in...（意味着……/涉及……方面的变动）Changing the schedule entails that we inform all participants in advance.（改动时间表意味着我们要提前通知所有参与者。）","s":["1791"]},{"w":"entangle","d":"纠缠物理上的缠绕、被线网头发等缠住（本义，但实际使用占比不高","f":"vt. 纠缠\n物理上的缠绕、被线/网/头发等缠住（本义，但实际使用占比不高）become entangled in / with sth（被……缠住）\n卷入复杂、棘手或丑闻般的麻烦中（抽象用法，绝对高频）become / get entangled in sth（卷入……之中）；entangled with sb（与某人纠缠不清）\n复杂的关系、情感纠葛或暧昧不清的局面 an entangled relationship / affair（纠缠不清的关系）；emotionally entangled（情感上纠缠不清）","s":["1791"]},{"w":"entice","d":"诱惑（突出抛出诱饵、投其所好使其动心的动作）商家用优惠、折扣","f":"v. 诱惑（突出“抛出诱饵、投其所好”使其动心的动作）。\n商家用优惠、折扣、赠品吸引顾客（商业/营销绝对高频）entice sb to do / into doing sth（诱惑某人去做某事）；entice customers / buyers with...（用……诱惑顾客/买家）\n美食、香气、美景等感官刺激让人忍不住靠近或尝试 be enticed by the smell / sight of...（被……的香味/景象诱惑）；entice sb into a place（诱惑某人进入某地）\n“挖墙脚”、引诱人离开原有位置或放弃原有立场（含负面或竞争意味）entice sb away from...（把某人从……引诱走）","s":["1791"]},{"w":"entrap","d":"诱捕（精准强调设局引诱入陷阱的欺骗性动作）美国学生用这个词，","f":"v. 诱捕（精准强调“设局引诱入陷阱”的欺骗性动作）。美国学生用这个词，几乎只出现在“法律、犯罪、伦理”相关的严肃讨论中，绝不用来描述日常小麻烦。\n执法中“设局引诱”他人犯罪（法律/警匪绝对高频）entrap sb into doing sth（诱使某人做某事）；be entrapped by the police（被警方诱捕）\n物理上被困在狭小或危险的空间里（本义，但常带“无法脱身”感）be entrapped in / under sth（被困在……中/下）\n情感、关系或合同中的“套子”——明知不好却脱不了身 feel entrapped in a relationship / job / contract（感觉被困在一段关系/工作/合同里）；entrap sb into marriage / commitment（诱使某人进入婚姻/承诺）","s":["1791"]},{"w":"entrenched","d":"（权利、传统）确立的，牢固的","f":"（权利、传统）确立的，牢固的","s":["1925"]},{"w":"entry","d":"进入；入口；登记","f":"n. 进入；入口；登记","s":["1791"]},{"w":"envelop","d":"笼罩雾气、烟雾、黑暗等自然景象从四面八方包裹（绝对高频，最具","f":"vt. 笼罩\n雾气、烟雾、黑暗等自然景象从四面八方包裹（绝对高频，最具画面感）be enveloped in fog / smoke / darkness（被雾/烟/黑暗笼罩）\n寂静、神秘、忧郁等抽象氛围弥漫整个空间（文学/描写类高频）be enveloped in silence / mystery / sadness（被寂静/神秘/忧郁笼罩）\n毛毯、翅膀、外衣等物理物件的“裹覆”动作（本义，但日常较少用）envelop sb / sth in a blanket / cloak（用毯子/斗篷裹住某人/某物）","s":["1791"]},{"w":"envision","d":"想象，预想","f":"想象，预想","s":["1925"]},{"w":"equal","d":"相等的；同样的","f":"adj. 相等的；同样的","s":["1791"]},{"w":"equate","d":"等同警示他人不要把两件本质上不同的事混为一谈（日常讨论观点类","f":"vt. 等同\n警示他人不要把两件本质上不同的事混为一谈（日常讨论/观点类绝对高频）equate A with B（把A与B等同）；equate A to B（把A等同于B；稍少见，但也可用）\n在逻辑、数学或科学语境中表示“相当于/等于”（偏向量化或客观推理）equate to（相当于；常用于数值或结果的转换）\n哲学、政治或社会评论中，揭露“偷换概念”或“错误类同”（书面批判性文体）cannot / should not be equated with（不能/不应与……等同）；equate...with...is misleading（将……等同起来是误导性的）","s":["1675","1791"]},{"w":"equipment","d":"设备","f":"n. 设备","s":["1791"]},{"w":"equitable","d":"公平资源分配、税收、薪酬等按合理比例分配（经济社会政策绝对高","f":"adj. 公平\n资源分配、税收、薪酬等“按合理比例”分配（经济/社会政策绝对高频）equitable distribution / allocation（公平分配）；equitable share（公平份额）\n法律中的“公平裁决、公正对待”（法律/司法高频）equitable treatment / access / remedy（公平对待/公平准入/公平补救）；an equitable settlement（公平解决方案）\n教育、医疗、就业中的“机会公平”（公益/发展类）equitable access to education / healthcare / opportunities（公平获得教育/医疗/机会）","s":["1791"]},{"w":"equivalent","d":"相等的；等同品","f":"adj. 相等的；等同品","s":["1675","1791"]},{"w":"equivocal","d":"含糊其辞的（含糊的回应）；（对仍含糊其辞）（模棱两可的证据结","f":"adj. 含糊其辞的\nan equivocal response / answer / reply（含糊的回应）；remain equivocal on / about sth（对……仍含糊其辞）\nequivocal evidence / results / findings（模棱两可的证据/结果）","s":["1791"]},{"w":"equivocate","d":"含糊（就某事含糊其辞）；（拒绝含糊）（被发现含糊其辞）；（含","f":"vi. 含糊\nequivocate on / about sth（就某事含糊其辞）；refuse to equivocate（拒绝含糊）\nbe caught equivocating（被发现含糊其辞）；equivocate to avoid perjury（含糊其辞以避免伪证）\nstop equivocating!（别含糊了！）；equivocate instead of giving a straight answer（含糊其辞而不给爽快答案）","s":["1791"]},{"w":"erase","d":"消除","f":"v. 消除","s":["1791"]},{"w":"erode","d":"侵蚀信心、信任、权威等抽象概念的逐渐削弱（侵蚀信心信任权威）","f":"v. 侵蚀\n信心、信任、权威等抽象概念的“逐渐削弱”erode confidence / trust / authority（侵蚀信心/信任/权威）；gradually erode（逐渐侵蚀）\n货币价值、购买力、利润的“贬值/缩水”（经济/金融高频）erode purchasing power / profits / value（侵蚀购买力/利润/价值）；be eroded by inflation（被通胀侵蚀）\n土壤、岩石、海岸线的“物理风化与冲刷”（本义，地理/环境科学）","s":["1791"]},{"w":"err","d":"错误，犯错（在方面犯错）；（犯错乃人之常情）（宁可过于谨慎安","f":"vt. 错误，犯错\nerr in (doing) sth（在……方面犯错）；To err is human.（犯错乃人之常情。）\nerr on the side of caution / safety / generosity（宁可过于谨慎/安全/慷慨）When investing, it's better to err on the side of caution.（投资时，宁可过于谨慎些。）\nerr in judgment / calculation / estimation（判断/计算/估计有误）；err from the truth（偏离真相）","s":["1791"]},{"w":"erratic","d":"无常的（无常的行为情绪）；（变得愈发无常）（飘忽的驾驶移动）","f":"n. 无常的\nerratic behavior / moods（无常的行为/情绪）；become increasingly erratic（变得愈发无常）That driver is so erratic!\nerratic driving / movement（飘忽的驾驶/移动）The stock market has been erratic this week.\nerratic stock market / prices / weather patterns（无常的股市/价格/天气模式）","s":["1791"]},{"w":"erroneous","d":"错误的","f":"adj. 错误的","s":["1791"]},{"w":"erupt","d":"爆发（爆炸）指内核物理炸开（炸弹、轮胎爆胎），强调碎片四溅（","f":"vt. 爆发\nExplode（爆炸）：指内核物理炸开（炸弹、轮胎爆胎），强调“碎片四溅”。Erupt（爆发）：指内部物质向外喷射（火山喷岩浆、人喷怒火、痘痘喷脓），强调“从下往上冲破表面”。\n战争、暴力、争吵、冲突的“突然爆发”（新闻绝对高频，最常用）erupt between...（在……之间爆发）；erupt over sth（因某事而爆发）；violence / fighting / war erupts（暴力/战斗/战争爆发）\n人群爆发出笑声、掌声、欢呼声或歌声（场景描写高频）erupt into laughter / cheers / applause / song（突然爆发出大笑/欢呼/掌声/歌声）\n情绪的突然爆发（勃然大怒或放声大哭）（心理/文学描述）erupt in anger / rage / tears（勃然大怒/放声大哭）；erupt with fury（暴跳如雷）","s":["1791"]},{"w":"eschew","d":"摒弃可以是客观躲开危险（比如躲开一辆车），而是基于原则、审美","f":"vt. 摒弃。avoid 可以是客观躲开危险（比如躲开一辆车），而 eschew 是 基于原则、审美或理智判断后的“坚决不碰”——带有强烈的主观取舍色彩。\neschew + 具体食物/物质（如 sugar / meat / alcohol / processed foods）；eschew in favor of...（摒弃……而选择……）Many health experts advise eschewing processed foods in favor of whole grains.（许多健康专家建议摒弃加工食品，转而选择全谷物。）\n道德、政治立场的“拒绝采用/放弃”（新闻/正式论述高频）eschew violence / extremism / corruption（摒弃暴力/极端主义/腐败）；eschew partisan politics（摒弃党派政治）\neschew jargon / clichés / verbosity（摒弃行话/陈词滥调/冗长啰嗦）；eschew ornamentation（摒弃华丽装饰）","s":["1791"]},{"w":"essential","d":"重要的；基本的","f":"adj. 重要的；基本的","s":["1791"]},{"w":"estimate","d":"估计","f":"v. 估计","s":["1675","1791"]},{"w":"evacuate","d":"使撤离，使疏散地址或人员（撤离地区城市居民）；（强制撤离令）","f":"v. 使撤离，使疏散。evacuate + 地址或人员。\nevacuate the area / city / residents（撤离地区/城市/居民）；mandatory evacuation order（强制撤离令）；evacuate from... to...（从……撤离到……）\nevacuate civilians / troops / the wounded（撤离平民/部队/伤员）；medical evacuation / medevac（医疗后送/伤员撤离）","s":["1791"]},{"w":"evade","d":"逃避，回避法律新闻语境逃脱追捕或义务（最硬核），辩论问答语境","f":"v. 逃避，回避。 法律/新闻语境：逃脱追捕或义务（最硬核），辩论/问答语境：回避问题（最狡猾），体育/游戏语境：灵巧闪避（最生动）。\nevade responsibility / taxes / questions（逃避责任/逃税/回避问题）；evade doing sth（逃避做某事）\nevade capture / arrest / the police（躲避抓捕/逮捕/警察）；evade a blow / attack（躲开一击/攻击）\nevade regulations / sancti

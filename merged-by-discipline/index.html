/软件—— 例句：expertise with Excel\n\n3. 高频修饰词（让表达更精准）\n\n· technical/professional/medical/legal + expertise（技术/专业/医学/法律专长）\n· considerable/extensive/in-depth + expertise（大量的/广泛的/深入的专长）\n· unique/specialized + expertise（独特的/专门的专长）","s":["1675","1791"]},{"w":"explicit","d":"adj. 明确的；清楚的","f":"adj. 明确的；清楚的","s":["1791"]},{"w":"explore","d":"v. 探险；探索","f":"v. 探险；探索","s":["1791"]},{"w":"exposure","d":"n. 接触","f":"n. 接触（精准对应“暴露/接触”的核心义，最通用，尤其适用于“接触风险、信息或新事物”的高频场景）。\nexposure to + 危险源（接触/暴露于……）；occupational exposure（职业接触/暴露）\nexposure to + 新事物/文化/语言（接触……）；early exposure（早期接触）\nmedia / press coverage exposure（媒体曝光）；give / get exposure（给予/获得曝光）","s":["1791"]},{"w":"expound","d":"v. 阐述","f":"v. 阐述(比explain正式，通常长篇大论、详细展开)\n1. 详细阐述理论、观点或哲学思想（学术/政治/正式演讲绝对高频，占日常使用80%以上）\n短语搭配：expound a theory / idea / philosophy / views（阐述理论/想法/哲学/观点）；expound on / upon（就……加以详述\n例句：The professor expounded his theory of economic growth in his latest book.（教授在其新书中阐述了他的经济增长理论。）\n例句：He began to expound on the importance of personal responsibility in a free society.（他开始阐述个人责任在自由社会中的重要性。）\n\n2. 详细解读、解释法律条文或教义（法律/宗教/经典文本解读场景）\n短语搭配：expound the law / scripture / text（阐明法律/经文/文本）\n例句：The judge expounded the legal provisions governing contract disputes.（法官阐明了管辖合同纠纷的法律条款。）\n例句：The priest expounded the meaning of the ancient parable to the congregation.（牧师向会众阐明了那个古老寓言的深意。）\n\n3. “进一步展开/详细说明”的强调用法——常用于演讲或写作中的过渡\n短语搭配：allow me to expound（请允许我详细说明）；expound further / at length（进一步/详尽地阐述）\n例句：Let me expound further on the reasons behind this decision.（让我进一步阐述这一决定背后的原因。）\n例句：He expounded at length on the benefits of the new policy.（他详尽地阐述了新政策的好处。）","s":["1791"]},{"w":"extension","d":"n. 延伸","f":"n. 延伸\n1. extension of\nextension of the deadline\n截止日期的延长\nThe project is an extension of our previous research.\n这个项目是我们先前研究的延伸。\n2. by extension（固定短语，表示推论）\nShe is in charge of the department and, by extension, the entire region.\n她负责这个部门，进而也负责整个区域。\n逻辑：A成立 → 推而广之 B也成立。\n3. extension to\nThey built an extension to the house.\n他们给房子加盖了一个扩建部分。\nThe new policy is an extension to the existing framework.\n新政策是对现有框架的补充。\n二、接动词（常见搭配）\ngrant an extension — 批准延期\nrequest / ask for an extension — 申请延期\nget / receive an extension — 获得延期\nsign / agree to a contract extension — 签下/同意续约（体育、职场高频）","s":["1791"]},{"w":"extensive","d":"adj. 大量的，广泛的","f":"adj. 大量的，广泛的\n高频场景用法\n1）广泛的/大量的（修饰经历、研究、知识）：She has extensive experience in project management. 她有丰富的项目管理经验；Extensive research has been done on the topic. 关于这个课题已做了大量的研究。\n2）广阔的/大面积的（修饰土地、损害）：The fire caused extensive damage to the building. 大火对建筑造成了大面积的毁坏；The estate has extensive grounds. 这处庄园拥有广阔的庭院。\n常见搭配：extensive collection 大量收藏；extensive use 广泛使用；extensive network 庞大的网络。\n最接近的中文单词：广泛（若修饰空间/面积则取“广阔”）","s":["1791"]},{"w":"external","d":"adj. 外部的","f":"adj. 外部的","s":["1675","1791"]},{"w":"extract","d":"n. 用力拔出","f":"n. 用力拔出：take out","s":["1675"]},{"w":"extraneous","d":"adj. 外来的、无关的、非必要的","f":"adj. 外来的、无关的、非必要的\nbe extraneous to + 名词\neliminate / remove / exclude（消除、移除、排除）：强调“去掉多余的”。\n\nWe need to eliminate extraneous noise from the data.（我们需要从数据中剔除无关的噪音。）\navoid / ignore（避免、忽略）：强调“不理会多余的”。\nPlease ignore extraneous factors and focus on the core issue.（请忽略无关因素，聚焦核心问题。）\nintroduce / add（引入、添加）——常带有贬义，表示“引入了不相干的东西”。\nDon't introduce extraneous elements into the debate.（不要把不相干的元素引入辩论中。）","s":["1675","1791"]},{"w":"extricate","d":"v. 使摆脱、解救、脱身，指从困境、束缚或复杂局面中巧妙或费力地解脱出来","f":"vt. “使摆脱、解救、脱身”，指从困境、束缚或复杂局面中巧妙或费力地解脱出来。\nextricate 的核心意思是“使摆脱、解救、脱身”\nextricate oneself 使自己脱身\nextricate + 人/物 + from + 困境/束缚","s":["1791"]},{"w":"facet","d":"n. 方面，平面","f":"n. 方面，平面\nfacet + of + 复杂事物","s":["1675","1791"]},{"w":"facility","d":"n. 设施；设备；便利；熟练或天赋","f":"n. 设施；设备；便利；熟练或天赋","s":["1675","1791"]},{"w":"fallible","d":"adj. 会犯错的、可能出错的、不完美的","f":"adj. “会犯错的、可能出错的、不完美的”\nfallible in + 名词/doing\t在……方面可能出错\tHuman memory is highly fallible in recalling exact details.（人类记忆在回忆精确细节方面极其容易出错。）Even experts are fallible in their predictions.（即使是专家的预测也可能出错。）\nfallible + 人/思维/记忆/系统/方法","s":["1791"]},{"w":"familiarize","d":"v. 使熟悉、使了解","f":"v. “使熟悉、使了解”，它是一个及物动词 (vt.)。在90%的高频场景中，它都搭配反身代词（myself / yourself / oneself）使用，表示“让自己去了解/熟悉某事物”。它是一个正式、书面的动词，比口语中的 get to know 或 learn about 更显专业。\nfamiliarize oneself with + 事物\t使自己熟悉（信息/环境/规则）\tYou should familiarize yourself with the new software before the meeting.（你应在会议前让自己熟悉新软件。）\nfamiliarize + 人 + with + 事物\t使某人熟悉某事物\tThe orientation program is designed to familiarize new employees with company policies.（入职培训旨在让新员工熟悉公司政策。）","s":["1791"]},{"w":"fascinate","d":"v. 强烈吸引、迷住、使入迷，指某事物因极其有趣或迷人，让人完全被吸引住","f":"v. “强烈吸引、迷住、使入迷”，指某事物因极其有趣或迷人，让人完全被吸引住。它是一个及物动词 (vt.)，但在考试和写作中，被动语态 be fascinated by 的出现频率远高于主动语态（约 8:2）。","s":["1791"]},{"w":"fashionable","d":"adj. 流行的；时髦的","f":"adj. 流行的；时髦的","s":["1791"]},{"w":"feeble","d":"adj. 虚弱的、无力的、微弱的(贬义)","f":"adj. “虚弱的、无力的、微弱的”(贬义)。95%情况用于批评借口、论点、尝试等抽象事物——“苍白无力的、软弱的、站不住脚的”。\nfeeble in + 名词/doing\t在……方面差劲/无力\tHe is feeble in argument and easily loses debates.（他在辩论中很无力，很容易输掉。）\nThe government was feeble in its response to the crisis.（政府应对危机时表现得软弱无力。）\nfeeble excuse/reason","s":["1791"]},{"w":"feign","d":"v. 假装、佯装、伪装，指为了欺骗而故意装出某种（不真实的）感觉、状态或情绪","f":"v. “假装、佯装、伪装”，指为了欺骗而故意装出某种（不真实的）感觉、状态或情绪。\nfeign + 名词（绝对主流）\t假装（某种状态/情绪）\tShe feigned surprise when she saw the gift.（她看到礼物时装出惊讶的样子。）\nfeign + that 从句\t假装……\tHe feigned that he didn't hear me.（他假装没听见我。）—— 但不如 feign + 名词 地道。\n“Don't feign sleep. I know you're awake!”（别装睡，我知道你醒了！）\n“Don't feign ignorance.”（别装傻。）","s":["1791"]},{"w":"ferret","d":"n. 雪貂；v. 搜寻、翻找、查出","f":"n. 雪貂；v. 搜寻、翻找、查出。动词尤指彻底搜索实物，或刺探、调查情报和秘密。\n1. ferret out（及物用法，vt.）：经努力查出、搜出或找出，后面直接接宾语。\n   ferret out + 信息／事实／人\n   Journalists ferreted out the truth.（记者挖出了真相。）\n   He ferreted out the spy.（他揪出了间谍。）\n2. ferret about / around（不及物用法，vi.）：四处翻找、到处搜寻；不直接接宾语，常接地点介词短语。\n   ferret about / around + in／among／through + 地点或物品\n   She ferreted around in her bag for the keys.（她在包里翻找钥匙。）","s":["1791"]},{"w":"fervent","d":"adj. 热忱的、炽烈的","f":"adj. 热忱的、炽烈的。形容情感、信仰或支持时极高频——强调由内而外的真挚狂热，比 passionate 更专一持久，比 enthusiastic 更深沉庄重。\nfervent about + 目标/事业：对……充满热忱。She is fervent about animal rights.（热忱于动物权益。）\nfervent in + 信仰/追求：在……方面炽烈。He is fervent in his beliefs.（信仰坚定。）\n① 政治/社会议题的议论文（最最常用）\n在讨论严肃话题（如环保、平权、枪支管控）时，fervent 是提升文章档次的“必备词”。“The protesters held a fervent belief in justice.”（抗议者对正义抱有炽热的信念。）“He is a fervent supporter of renewable energy.”（他是可再生能源的狂热支持者。）\n② 宗教/哲学/文学课的讨论（表达深度虔诚）\n描述信仰、祈祷或个人信条时，用 fervent 比用 strong 有力量得多。\n“She offered a fervent prayer for her family's safety.”（她为家人的安全做了虔诚的祈祷。）“The poet's fervent love for nature is evident in his work.”（诗人对自然炽热的爱在他的作品中显而易见。）fervent supporter/believer of（……的狂热支持者/信徒）","s":["1791"]},{"w":"fetter","d":"n. 束缚、桎梏","f":"n. 束缚、桎梏。名词多用复数 fetters（枷锁/羁绊）；动词“限制/阻碍”（及物）。比喻义（传统/思想/制度）占 99%，远重于字面义（脚镣）。\nfetter + 人/物 + to + 事物：将……束缚于……。Tradition fettered him to the past.（传统将他束缚于过去。）\nbe fettered by + 束缚源：被……所困。Research is fettered by lack of funds.（因资金匮乏受阻。）\nfetters of + 抽象概念：……的枷锁（极高频固定搭配）。\nbreak the fetters of convention（打破传统的桎梏）。break/shake off fetters（挣脱桎梏）throw off fetters（摆脱枷锁）\tThey shook off the fetters of colonial rule.（挣脱殖民枷锁。）\nbe fettered by rules（被规则束缚）fettered imagination（受限的想象力）\tCreativity is often fettered by rigid rules.（创造力常被死板规则扼制。）","s":["1791"]},{"w":"feud","d":"n. 长期不和；世仇；v. 长期争斗；结怨","f":"n. 长期不和；宿怨；世仇\n指个人、家族或团体之间长期而严重的冲突，比 quarrel（一次争吵）更持久。\na feud between A and B：A 与 B 之间的长期不和／世仇\nThe feud between the two families lasted for decades.（这两个家族之间的世仇持续了几十年。）\n\nv. 长期争斗；长期不和；结怨（通常作不及物动词）\n1. feud with sb.：与某人或团体长期争斗／不和\n   The two artists have been feuding with each other for years.（这两位艺术家多年来一直不和。）\n2. feud over/about sth.：因某事长期争斗\n   The brothers feuded over control of the company.（兄弟二人因公司的控制权长期争斗。）\n3. feuding parties/families：相互争斗的各方／结仇的家族（现在分词作定语）\n   The agreement finally brought the feuding groups together.（这项协议终于让长期争斗的团体走到了一起。）","s":["1791"]},{"w":"fidelity","d":"n. 忠诚、忠实（人际关系/婚姻）；精确、逼真（信息/复制品——极高频）","f":"n. 忠诚、忠实（人际关系/婚姻）；精确、逼真（信息/复制品——极高频）。强调严格恪守承诺或一丝不差地还原，比 loyalty 更具“责任感”。\nswear fidelity to + 人/原则/原文：对……的忠诚/忠实（唯一介词）。\nHe swore fidelity to the king.（效忠国王。）\nThe translator paid great attention to fidelity to the original text.（注重忠实原文。）\nfidelity in + 领域：在某方面的忠实。fidelity in marriage（婚姻中的忠诚。）\nfidelity\t契约/细节的严格恪守\t强调“言出必行、不篡改”，用于婚姻忠诚或翻译/复制的精确。\nloyalty\t情感的站队/不离不弃\t强调“心之所向”，用于国家、政党、朋友（可转移对象）。","s":["1791"]},{"w":"figment","d":"n. 虚构之事","f":"n. 虚构之事。99% 仅存于固定搭配 a figment of one's imagination（凭空想象出来的东西），单独使用几乎绝迹。\nThe monster is just a figment of his imagination.（怪物纯属他想象出来的。）\nHis fear of failure is nothing but a figment of his imagination; he's actually quite capable.（他对失败的恐惧纯属自己瞎想，其实他能力很强。）","s":["1791"]},{"w":"final","d":"adj. 最后的","f":"adj. 最后的","s":["1791"]},{"w":"fine","d":"n. 罚金；细微的","f":"n. 罚金；细微的","s":["1791"]},{"w":"fishy","d":"adj. 可疑的、值得怀疑的","f":"adj. 可疑的、值得怀疑的。日常口语极高频，指某件事感觉不对劲、像有猫腻，而非字面“鱼的”（除非你真在描述鱼腥味）。\nfishy about + 人/事：关于……觉得可疑。\nThere's something fishy about him.（他有点不对劲。）What's fishy about this deal?（这笔交易有什么猫腻？）\nsmell fishy（最最常用）：听起来/感觉有鬼。His excuse smells fishy to me.（他的借口我听着有鬼。）\nlook / sound fishy：看起来/听上去可疑。The numbers in this report look fishy.（报告里的数字看着不对劲。）\nfind something fishy：发觉某事可疑。I find his sudden friendliness a bit fishy.（他突然的友好让我觉得有点怪。）","s":["1791"]},{"w":"fitful","d":"adj. 断断续续的、一阵阵的","f":"adj. 断断续续的、一阵阵的。专指睡眠/呼吸/努力/雨势等不连贯、总被打断的状态（贬义/负面），强调“无法持续”和“不安定”。\nfitful sleep（时睡时醒）fitful breathing（不均匀的呼吸）\tHe spent a fitful night.（一夜断断续续没睡好。）\nfitful progress（曲折的进展）fitful efforts（三分钟热度）\tThe peace talks made fitful progress.（和谈进展反复。）\nfitful rain（一阵阵的雨）fitful wind（时有时无的风）\tA fitful wind blew all night.（风刮刮停停一整夜。）","s":["1791"]},{"w":"fixed","d":"adj. 固定的","f":"adj. 固定的","s":["1791"]},{"w":"flare","d":"n./v. 突然出现的强光或火光；闪光信号；突然烧旺／爆发","f":"n./v. 突然出现的强光或火光；闪光信号；突然烧旺／爆发\n\n【到底是“火光”还是“闪光”？】\n两者都可以，关键看光源。flare 的核心不是某一种光，而是“突然变亮、强烈且通常短暂的一团光”。\n• 光来自火焰、燃烧或爆炸时，译为“火光／突然烧旺”：A flare lit up the night sky.（一团火光照亮了夜空。）\n• 只强调强光、亮光或瞬间变亮时，译为“闪光／强光”：the flare of the headlights（车头灯骤然射出的强光）。\n• 指用于求救、照明或示警的燃烧装置时，译为“信号弹／照明弹”：They fired a flare to signal for help.（他们发射信号弹求救。）\n• 指太阳表面的能量爆发现象时，solar flare 译为“太阳耀斑”。\n\n【动词及引申义】\n1. flare：突然燃烧得更旺或发出强光。The fire flared briefly.（火焰突然旺了一下。）\n2. flare up：冲突、疾病或情绪突然爆发／加剧。Violence flared up again.（暴力冲突再次爆发。）My allergies flare up in spring.（我的过敏症春天容易发作。）\n3. flare into sth.：突然发展成某种更严重的状态。The argument flared into a fight.（争论升级成了打斗。）\n4. flare out：向外展开，常形容裙摆或裤腿呈喇叭状。","s":["1675","1791"]},{"w":"flaw","d":"n. 缺点","f":"n. 缺点","s":["1791"]},{"w":"flicker","d":"v./n. 闪烁；摇曳；一闪而过；闪烁的光","f":"v./n. 闪烁；摇曳；一闪而过；闪烁的光","s":["1791"]},{"w":"flimsy","d":"adj. 单薄的","f":"adj. 单薄的\n形容具体物品——“质量差、不结实”。例：a flimsy paper bag（一个薄脆的纸袋）This bag is too flimsy.\n形容抽象事物——“站不住脚、很牵强”。例：a flimsy excuse（一个站不住脚的借口）","s":["1791"]},{"w":"flout","d":"v. 藐视","f":"v. 藐视。公开地、故意地无视或违抗（规则、法律、传统等），带有明显的“不放在眼里”的挑衅意味。它比单纯的“忽视”（ignore）程度更重，是明知故犯。\nflout (something) by (doing something)：通过某种方式藐视/违抗某事。\n例：He flouted the rules by arriving late every day.（他通过每天迟到来藐视规则。）\nflout (something) in (some context/place)：在某场合/地方公然违抗。\n例：She flouted convention in her choice of clothing.（她在着装选择上公然藐视传统。）","s":["1791"]},{"w":"foil","d":"v. 挫败；阻止；n. 金属箔；陪衬","f":"v. 挫败；阻止（尤指使计划、阴谋或企图无法成功）\nfoil a plan／plot／attempt：挫败计划／阴谋／企图\nPolice foiled an attempt to steal the painting.（警方挫败了盗窃这幅画的企图。）\n注意：foil 强调让已经策划或正在实施的行动失败；prevent 是更宽泛的“预防／阻止某事发生”。\n\nn.\n1. 金属箔；薄金属片\n   aluminum foil（铝箔；锡纸）\n   Wrap the food in foil.（用铝箔把食物包起来。）\n2. 陪衬；形成鲜明对比的人或事物\n   a foil for／to sb./sth.：某人或某物的陪衬\n   The calm character serves as a foil to his impulsive friend.（这个沉稳的人物衬托出他那位冲动的朋友。）\n3.（击剑运动中的）花剑\n\n记忆要点：动词 foil＝挫败计划；名词 foil＝金属箔，也可指通过对比突出另一方的“陪衬”。","s":["1791"]},{"w":"foment","d":"v. 煽动；挑起；助长（不满、冲突或动乱等）","f":"v. 煽动；挑起；助长（通常指负面的情绪、冲突或社会动乱）\n常用搭配：foment unrest／rebellion／conflict／dissent（煽动动乱／叛乱／冲突／异议）\nThe government's new tax policy fomented widespread unrest among urban workers.（政府的新税收政策在城市工人中激起了广泛的不满和动荡。）\nCompetition for limited resources can foment conflict between neighboring communities.（对有限资源的争夺可能会加剧相邻社区之间的冲突。）\n托福语境提示：常见于历史、政治学和社会学材料，强调某种言论、政策或社会条件逐渐促成并加剧负面局势。","s":["1791"]},{"w":"forbid","d":"v. 禁止","f":"v. 禁止","s":["1791"]},{"w":"foremost","d":"adj. 最初的，第一流的","f":"adj. 最初的，第一流的\n黄金词组：First and foremost（首先且最重要的是）形容词：the foremost + 名词（最顶尖的/首要的）foremost among + 群体（在……中尤为突出）\n用于在列举多个事物时，特别指出其中最显眼的一个。\n副词搭配：foremost among + 群体（在……中尤为突出）Foremost among the reasons for his success is his discipline.（他成功的原因中，首当其冲的是自律。）","s":["1791"]},{"w":"forestall","d":"v. 预先阻止(后接坏事)","f":"v. 预先阻止(后接坏事)\nin an attempt / effort to forestall...（为了抢先阻止……）\nThe company released a statement in an attempt to forestall negative publicity.（公司发布声明，试图抢先阻止负面舆论。）\nto forestall any possible + 名词（为了杜绝任何可能的……）\nWe have double-checked the data to forestall any possible errors.（我们已复核数据，以杜绝任何可能的错误。）\nbe designed / aimed at forestalling...（旨在预先阻止……）\nThese regulations are aimed at forestalling another financial meltdown.（这些法规旨在预防另一场金融崩溃。）\nI forestalled his argument.（我抢先堵住了他的嘴。——针对的是“他”这个人可能发起的攻击）","s":["1791"]},{"w":"foretell","d":"v. 预言","f":"v. 预言。意为“预言、预告”。它只强调 “提前告知或透露未来信息” 这个动作，不涉及是否为此做了准备（那是 foresight）或采取了行动（那是 forestall）。\n美国人把 foretell 留给“命运、神谕和古典文学”——它不是一个普通的“预测”，而是一种“带有神秘色彩的、提前宣告结局”的文学动词。\nforetell the future / the outcome：预言未来/结果 foretell one's fate / destiny：预言某人的命运 foretell a victory / defeat / disaster：预言胜利/失败/灾难 foretell the arrival / return of sth.：预言某事的到来/回归\nas was foretold（正如所预言的）—— 很地道的书面插入语\nThe storm struck, as the elders had foretold.（暴风雨来袭，正如长辈们所预言的那样。）\nit is/was foretold that...（据预言……）—— 常用被动式\nIt was foretold that a great leader would be born in that village.（据预言，那个村庄将诞生一位伟大的领袖。）be able to foretell（能够预知）\nNo one can accurately foretell the stock market's movements.（没人能准确预知股市的走向。）\nforetell + wh- 从句（预言/预知是否/何时……）\nShe couldn't foretell whether the plan would succeed.（她无法预知这个计划是否会成功。）","s":["1791"]},{"w":"formal","d":"adj. 正式的；礼仪上的","f":"adj. 正式的；礼仪上的","s":["1791"]},{"w":"forsake","d":"v. 弃","f":"vt. (舍弃/背弃)弃。字本身不带褒贬，褒贬全由宾语和动机决定。主动切断一段本已存在的依附或情义关系，通常一去不返。\nforsake one's family / friends / children。forsake one's faith / religion / beliefs。forsake one's duties / responsibilities。","s":["1791"]},{"w":"forte","d":"n. 特长、强项、拿手好戏","f":"n. 意为 “特长、强项、拿手好戏”。指的是你特别擅长、做起来得心应手的事情或技能。\n直接背的用法(Something) is my forte. 或 My forte is (something).\nsth. is sb.'s forte：某事是某人的强项 Negotiation is her forte.（谈判是她的强项。✅）Math has never been my forte.（数学从来不是我的强项。✅——非常地道的口语）","s":["1791"]},{"w":"forth","d":"adv. 向前","f":"adv. 向前。Forth 在现代英语中极少单独使用，它 99% 的情况都藏在这些固定短语里。\n1. back and forth（来回地，反复地）—— 最最最高频！He paced back and forth in the waiting room.（他在候诊室里来回踱步。）We exchanged emails back and forth.（我们反复往来邮件。）\n\n2. bring forth（产生，引起；提出）\nThe crisis brought forth the best in him.（危机激发了他最好的一面。）She brought forth a new proposal at the meeting.（她在会上提出了一项新提议。）\n\n3. set forth（出发；阐明，陈述）—— 书面语极高频\nThey set forth on their journey at dawn.（他们在黎明时出发了。）The president set forth his vision for the future.（总统阐述了他对未来的愿景。）\n\n4. put forth（提出；长出；付出努力）\nHe put forth a bold idea.（他提出了一个大胆的想法。）The trees put forth new leaves in spring.（春天树木长出新叶。）We need to put forth more effort.（我们需要付出更多努力。）\n\n5. go forth（出发；传播出去）\nGo forth and spread the good news!（去吧，去传播这个好消息！—— 很庄重/幽默的说法）\n8. hold forth（滔滔不绝地讲，长篇大论）—— 带点贬义\nHe held forth on the subject for over an hour.（他滔滔不绝地讲了这个话题一个多小时。）\n\n7. come forth（出来，涌现）\nSeveral volunteers came forth to help.（几名志愿者站出来帮忙。）","s":["1791"]},{"w":"fortify","d":"v. 加固；加强；强化；为（食品）添加营养成分","f":"v. 加固；加强；强化；为（食品）添加营养成分\n核心含义：通过增加防护、力量或所需成分，使某物更强、更有抵抗力。\n\n【1. 军事／建筑：加固，设防】\nfortify A against B：加固 A 以抵御 B\nThey fortified the town against attack.（他们加固城镇以抵御袭击。）\na fortified settlement（设防的定居点）；a heavily fortified border（戒备森严的边境）\n\n【2. 食品营养：强化，添加营养成分】\nfortify A with B：给 A 添加 B\nMilk is often fortified with vitamin D.（牛奶中经常添加维生素 D。）\nbreakfast cereals fortified with iron（添加铁的早餐麦片）\n注意：fortified wine 指酿造时加入蒸馏酒以提高酒精度的“加烈葡萄酒”，如波特酒和雪莉酒，并非“味道浓烈的酒”。\n\n【3. 抽象含义：增强意志、论点或信心】\nThe news fortified my resolve.（这个消息坚定了我的决心。）\nThese findings fortify the argument that...（这些发现加强了……这一论点。）\n\n【4. fortify oneself with sth.】\n指吃点或喝点东西来补充体力、打起精神或壮胆。\nHe fortified himself with a strong drink before the meeting.（开会前，他喝了一杯烈酒给自己壮胆。）","s":["1791"]},{"w":"fortitude","d":"n. 在长期的痛苦、危险或逆境中不屈服、不抱怨地忍耐下去的精神力量","f":"n. 在长期的痛苦、危险或逆境中不屈服、不抱怨地忍耐下去的精神力量。\n1. show / display / demonstrate great fortitude（最高频）\nShe showed remarkable fortitude in the face of her illness.\n2. bear / endure / face sth with fortitude\nHe bore the pain with quiet fortitude.\n3. have / lack the fortitude to do sth\nFew politicians have the fortitude to admit a mistake.","s":["1791"]},{"w":"fortuitous","d":"adj. 偶然发生的、巧合的，中性","f":"adj. 意为 “偶然发生的、巧合的”，中性。它描述的是纯属意外、不是人为安排或计划好的事情。\na fortuitous encounter / meeting：偶然的邂逅\na fortuitous discovery / finding：偶然的发现\nfortuitous circumstances / timing：巧合的境况/时机\n\nIt was (purely / entirely) fortuitous that...（……纯属巧合）It was purely fortuitous that we were on the same flight.（我们在同一架航班上纯属巧合。）\nby a fortuitous stroke of luck（凭着一次偶然的好运）—— 强调“运气”成分 By a fortuitous stroke of luck, I found the lost ring in the garden.（凭着一次偶然的好运，我在花园里找到了丢失的戒指。）","s":["1791"]},{"w":"fortunate","d":"adj. 幸运的","f":"adj. 幸运的","s":["1791"]},{"w":"fortune","d":"n. 财富","f":"n. 财富","s":["1791"]},{"w":"foul","d":"adj. 垃圾、厕所、臭水沟恶心的、脏臭的","f":"adj. 垃圾、厕所、臭水沟“恶心的、脏臭的”。体育“犯规的”。形容天气、心情、行为、语言，表示“糟糕透顶”。\nfoul play（最最最高频！）foul language / mouth（粗话/嘴臭）fall foul of sb/sth（触犯、与……发生冲突）cry foul（大声抗议/叫屈）","s":["1791"]},{"w":"fragment","d":"n. 碎片","f":"n. 碎片","s":["1791"]},{"w":"fragmentary","d":"adj. 碎片的，不连续的","f":"adj. 碎片的，不连续的\n形容信息、知识、证据：零碎的、不完整的（最常见）fragmentary information（零散信息）、fragmentary records（残缺的记录）。\n形容记忆、梦境：断断续续的、模糊不清的 I have only a fragmentary memory of my childhood home.（我对儿时的家只有残缺不全的记忆。）","s":["1791"]},{"w":"fragrant","d":"adj. 香的；芬芳的","f":"adj. 香的；芬芳的","s":["1791"]},{"w":"frail","d":"adj. 脆弱的和虚弱的","f":"adj. “脆弱的”和“虚弱的”。可形容身体单薄虚弱、物体/结构不坚固、性格脆弱。相比于Fragile更形容内在无力。","s":["1791"]},{"w":"framework","d":"n. 框架，构架，结构","f":"n.框架，构架，结构","s":["1675"]},{"w":"fraught","d":"adj. 充满（问题、危险）的；令人忧虑的、紧张的","f":"adj. 充满（问题、危险）的；令人忧虑的、紧张的","s":["1791"]},{"w":"fray","d":"vt. 磨损；使烦躁；vi. 磨损、散开；变得紧张；n. 争斗","f":"vt.\n1. 磨损，使边缘的线散开\n   Repeated washing had frayed the cuffs of his shirt.（反复清洗磨损了他的衬衫袖口。）\n2. 使神经紧张，使烦躁（常用被动或过去分词）\n   The constant noise frayed everyone's nerves.（持续不断的噪声使每个人都烦躁不安。）\n\nvi.\n1.（布料、绳子或边缘）磨损，散开\n   The edges of the old book cover began to fray.（旧书封面的边缘开始磨损散开。）\n2.（关系、耐心或情绪）变得紧张，开始恶化或崩溃\n   Relations between the two countries began to fray.（两国关系开始变得紧张。）\n   As the negotiations continued, tempers began to fray.（随着谈判继续，大家开始变得急躁。）\n\nn. 争斗；竞争；激烈活动\nenter／join the fray：加入争斗、竞争或激烈讨论\nSeveral smaller companies have entered the fray.（几家规模较小的公司也加入了竞争。）\n\n辨析：及物动词强调某物“使另一物磨损或使某人烦躁”；不及物动词强调事物自身“逐渐磨损、散开或恶化”。","s":["1925"]},{"w":"function","d":"n. 功能；作用；函数；活动；v. 运转；发挥作用","f":"n. 功能；作用；函数；活动；v. 运转；发挥作用","s":["1675"]},{"w":"functional","d":"adj. 功能性的，能运转的","f":"adj. 功能性的，能运转的\n1. 形容物品/机器：正常运转的、可使用的（能用）\n强调东西没坏，能完成它该干的事。这是反义词 broken（坏了） 的直接对应。\n例句：The old printer is still functional, though it's very slow.（那台旧打印机还能用，虽然很慢。）\n2. 形容设计/建筑/布局：实用性的、注重功能的（好用 > 好看）\n强调“实用至上”，不追求华丽或装饰，只为满足实际需求。\n例句：The furniture is cheap and functional rather than stylish.（这些家具便宜又实用，但并不时髦。）\n常见搭配：functional design（功能性设计）、functional clothing（实用服装）。","s":["1791"]},{"w":"fund","d":"n. 资金；基金；投资","f":"n. 资金；基金；投资","s":["1791"]},{"w":"fundamental","d":"adj. 基础的；基本的","f":"adj. 基础的；基本的","s":["1791"]},{"w":"further","d":"v. 促进；增进；更多的","f":"v. 促进；增进；更多的","s":["1791"]},{"w":"futile","d":"adj. 无意的，徒劳的","f":"adj. 无意的，徒劳的\nIt is futile to argue with him when he's drunk.（跟他喝醉了争论是没用的。）","s":["1791"]},{"w":"fuzz","d":"n. 绒毛、细毛；模糊、杂音；v. 使模糊、起毛","f":"n. 绒毛、细毛；模糊、杂音；v. 使模糊、起毛","s":["1791"]},{"w":"gainful","d":"adj. 有报酬的、能赚到钱的","f":"adj. 核心意思是“有报酬的”、“能赚到钱的”。它强调付出劳动后能获得经济收益，与“无偿”或“志愿”相对。它源自名词 gain（收益、获利）。\n它几乎只和 employment（职业）、work（工作）、occupation（职业）、pursuit（事业）等词搭配，构成固定短语。\n最经典的搭配：gainful employment（有酬职业/能挣钱的工作）\n例句：The program helps disabled people find gainful employment.（这个项目帮助残疾人找到有报酬的工作。）\n常见于法律/官方文件：这个词带有正式的书面语色彩，经常出现在移民、社保或签证相关的条款中，用以区分“合法有薪工作”和“志愿者”或“黑工”。\n例句：He must prove he is engaged in gainful activity to renew his visa.（他必须证明自己从事有酬活动才能续签签证。）","s":["1791"]},{"w":"gainsay","d":"vt. 否认；反驳；反对（某说法或事实）","f":"vt. 否认；反驳；反对（正式且较少见）\n通常作及物动词，后面直接接观点、说法、事实或人；一般不作不及物动词。\n1. gainsay a claim／fact／conclusion：否认或反驳某项主张／事实／结论\n   No one can gainsay the importance of clean water to public health.（没有人能否认清洁水源对公共健康的重要性。）\n2. gainsay sb.：反驳或反对某人（较正式或文学化）\n   Few scholars would gainsay her interpretation of the evidence.（很少有学者会反驳她对这些证据的解释。）\n3. cannot／can hardly be gainsaid：不可否认（常见于正式论述）\n   The influence of climate on agricultural development cannot be gainsaid.（气候对农业发展的影响不可否认。）\n\n托福语境提示：常见于学术论述或历史材料，可近似理解为 deny 或 contradict，但语气更正式。","s":["1791"]},{"w":"gap","d":"n. 裂口；差距","f":"n. 裂口；差距","s":["1791"]},{"w":"garnish","d":"vt. 装饰（食物）；扣押（工资等）；n. 装饰性配菜","f":"vt.\n1. 装饰食物；给食物添加装饰性配菜\n   garnish A with B：用 B 装饰 A\n   Garnish the fish with lemon slices and parsley.（用柠檬片和欧芹装饰鱼肉。）\n   The soup was garnished with fresh herbs.（汤上点缀了新鲜香草。）\n   注意：garnish 通常强调提升菜肴或饮品的外观，有时也能增添风味。\n\n2.（法律）扣押工资、银行账户中的款项等，用于偿还债务\n   garnish wages／salary／a bank account：扣押工资／薪金／银行账户款项\n   The court ordered the employer to garnish part of his wages.（法院命令雇主扣留他的部分工资用于偿债。）\n   这一含义通常由法院或法律程序执行；相关名词是 garnishment。\n\nn. 装饰性配菜；点缀物\n指放在菜肴或饮品上用于装饰、增添颜色或风味的少量食材。\nThe cocktail was served with a slice of lime as a garnish.（这杯鸡尾酒配有一片青柠作为装饰。）\n\n词性提示：表示“装饰食物”和“依法扣押”时都是及物动词，后面直接接宾语。","s":["1791"]},{"w":"gauge","d":"v. 测量标准","f":"v. 测量标准：measurement standard；判定：determine","s":["1675","1791"]},{"w":"general","d":"adj. 总的、普遍的、大致的；n. 将军","f":"adj. 总的、普遍的、大致的；n. 将军","s":["1791"]},{"w":"generalize","d":"v. 归纳；概括","f":"v. 归纳；概括","s":["1675","1791"]},{"w":"generally","d":"adv. 广泛的；一般的","f":"adv. 广泛的；一般的","s":["1791"]},{"w":"generate","d":"v. 造成","f":"v. 造成","s":["1791"]},{"w":"gibe","d":"vi. 嘲讽；讥笑；n. 嘲讽的话，挖苦","f":"vi. 嘲讽；讥笑（通过尖刻或轻蔑的话取笑某人）\ngibe at sb./sth.：嘲笑、挖苦某人或某事\nThe critics gibed at the proposal as unrealistic.（批评者嘲讽这项提议不切实际。）\nHe was often gibed at because of his unusual accent.（他经常因为不同寻常的口音而受到嘲笑。）\n词性提示：作动词时通常是不及物动词，针对的对象用 at 引出；不要直接说 gibe someone。\n\nn. 嘲讽的话；挖苦；奚落\nmake a gibe at sb./sth.：嘲讽某人或某事\na cruel／bitter／personal gibe：刻薄的／尖刻的／针对个人的讥讽\nHer remark was clearly a gibe at her opponent's lack of experience.（她的话显然是在讥讽对手缺乏经验。）\nHe ignored the crowd's gibes and continued speaking.（他没有理会人群的嘲讽，继续发言。）\n\n辨析：gibe 强调用尖刻、轻蔑的话讥讽；mock 是更宽泛的“嘲笑、模仿取笑”；jeer 常指一群人大声嘲弄或喝倒彩。\n拼写提示：表示“嘲讽”时也可拼作 jibe；但不要与另一用法 jibe with（与……一致、吻合）混淆。","s":["1791"]},{"w":"gist","d":"n. 主旨、要点、核心意思","f":"n. 主旨、要点、核心意思\nGet the gist（弄懂大意）：I didn't catch every word, but I got the gist.（我没听清每个词，但我明白大意了。）\nGive sb the gist（告诉某人要点）：Just give me the gist of the meeting.（就告诉我会议要点就行。）\nThe general/basic gist（总体梗概）：用于概括长文或冗长的发言。","s":["1791"]},{"w":"glamorous","d":"adj. 光彩照人的；富有魅力的；令人向往的","f":"adj. 光彩照人的；富有魅力的；令人向往的\n强调外表华丽、时尚、奢华，或因名望和刺激感而显得令人羡慕；不只是一般意义上的 beautiful（美丽的）。\n\n【常见用法】\n1. 形容人或外表：光彩照人的，艳丽迷人的\n   a glamorous actress／appearance（光彩照人的女演员／华丽迷人的外表）\n   She looked glamorous in the evening dress.（她穿着晚礼服，显得光彩照人。）\n2. 形容场所、活动或物品：豪华迷人的\n   a glamorous hotel／party（豪华迷人的酒店／派对）\n3. 形容职业或生活方式：看起来刺激、光鲜而令人向往的\n   Air travel was once considered glamorous.（乘飞机旅行曾被认为是一件光鲜而令人向往的事。）\n\n语感提示：glamorous 强调呈现出来的光鲜魅力，并不保证实际生活同样轻松或美好。","s":["1791"]},{"w":"glamour","d":"n. 魅力；光彩；令人向往的光鲜感","f":"n. 魅力；光彩；令人向往的光鲜感\n指时尚、财富、名望或冒险色彩带来的强烈吸引力，常含“看起来华丽迷人”的意味，不等同于单纯的 beauty（美）。\n\n【常见搭配】\n1. the glamour of sth.：某事物令人向往的魅力\n   the glamour of Hollywood／city life（好莱坞／都市生活的光鲜魅力）\n   Many young people were attracted by the glamour of the film industry.（许多年轻人被电影行业的光鲜魅力所吸引。）\n2. old Hollywood glamour：老派好莱坞式的华丽风情\n3. glamour and glitz：浮华与炫目排场，语气有时略带贬义\n4. add／bring glamour to sth.：为某事物增添魅力和光彩\n\n【拼写】\nglamour 是英式拼写，也广泛用于美式英语；glamor 是较少见的美式变体。形容词统一写作 glamorous，不写 glamourous。\n\n语感提示：glamour 可以真心赞美华丽魅力，也可以暗示这种光鲜只是表象，具体褒贬由上下文决定。","s":["1791"]},{"w":"glaring","d":"adj. 高频第一义（王牌考点）：扎眼的、触目惊心的（通常指错误、缺陷或不公平）","f":"adj. 高频第一义（王牌考点）：“扎眼的”、“触目惊心的”（通常指错误、缺陷或不公平）。\na glaring mistake/error（极其明显的错误）——比 obvious mistake 语气重得多，暗指“这种低级错误居然没人发现”。\na glaring omission（赤裸裸的遗漏）——指写报告或计划时，漏掉了最关键、最不该漏的那部分。\nglaring inequality/contradiction（触目惊心的不平等/自相矛盾）——常用于社会评论，指贫富差距等问题大得刺眼。\n高频第二义（字面意思）：刺眼的（指光线过强，让人睁不开眼）。\nthe glaring headlights（刺眼的汽车远光灯），glaring sunshine（白花花的烈日）。","s":["1791"]},{"w":"glaze","d":"v. 上釉使光滑；n. 釉料","f":"v. 上釉使光滑。“在表面糊上一层光滑东西”。\nGlazed donut（糖霜甜甜圈）——表面那层亮晶晶、黏糊糊的糖皮就是 glaze。\nHis eyes glazed over during the lecture.（他在讲座中眼神呆滞，目光涣散。）\nn. 釉料","s":["1675","1791","2026"]},{"w":"gleam","d":"v. 柔和的、反射出的、短暂闪现的光","f":"v. 柔和的、反射出的、短暂闪现的光。物理上，它是光滑表面反射的微光。眼神上，它是指眼神里的光。\n物理场景——“微光/反光”（柔和、干净、不刺眼）the gleam of polished wood（抛光木面的光泽），the gleam of moonlight on the lake（湖面上的月光）。\n眼神/表情场景——“眼里有光”（特指情绪的短暂流露）a gleam of hope（一线希望）：指绝望中突然闪现的微弱转机。a mischievous gleam in his eye（他眼中闪过一丝狡黠/调皮）：通常表示这人要搞恶作剧或憋了个鬼点子。Her eyes gleamed with pride.（她眼中闪烁着骄傲的光芒。）","s":["1675","1791"]},{"w":"glean","d":"vt. 逐渐搜集；从……中获取（信息）；拾取遗留作物","f":"vt. 逐渐搜集；从……中获取（信息、知识或事实）\n强调从多个来源、零散线索或仔细观察中一点点获得有用内容，不是普通意义上的大量收集。\n\n【常见结构】\n1. glean information／insight／evidence：搜集信息／获得见解／收集证据\n   Researchers gleaned valuable information from historical records.（研究人员从历史记录中获取了宝贵信息。）\n2. glean sth. from sth.：从某来源中提取或了解到某事\n   Much can be gleaned from the way ancient settlements were organized.（从古代聚落的组织方式中可以了解到很多信息。）\n3. glean from sth.：从某来源中搜集信息\n   The conclusions were gleaned from several independent studies.（这些结论是从多项独立研究中归纳获得的。）\n\n【本义】\n收割后拾取田地里遗留的谷穗或其他作物。\nVillagers were allowed to glean the remaining grain after the harvest.（收割后，村民获准拾取田里剩余的谷物。）\n\n辨析：collect 泛指收集；glean 强调经过耐心查找，从分散或不明显的来源中一点点获取。","s":["1791"]},{"w":"glossy","d":"adj. 表面光滑得能反光","f":"adj. “表面光滑得能反光”。\n物理场景——“光滑反光的表面”（照片纸/秀发）glossy paper/photo 特指相片纸那种滑溜溜、反光的质地。glossy hair（有光泽的秀发）\n比喻场景——“光鲜的包装/浮华的表面” a glossy image（光鲜的形象）——通常指政客或明星刻意营造的完美人设。glossy brochures（精美的宣传册）——指开发商印得天花乱坠的楼书，但房子实际可能不咋地。the glossy world of advertising（光鲜浮华的广告界）——表面光鲜亮丽，背后可能压力山大或欺骗消费者。","s":["1675","1791"]},{"w":"gorgeous","d":"adj. 极其美丽的、令人惊艳的","f":"adj. 极其美丽的、令人惊艳的。很万金油，但必须用在眼睛能看到的事情上，不能形容抽象的东西(比如个人成就)。\n形容人——“美炸了/帅翻了”\n形容景色/物品——“令人叹为观止的美”\n形容天气/感受——“爽翻了/美极了”","s":["1791"]},{"w":"grant","d":"n. 授给物；v. 授予","f":"n.授给物 v. 授予","s":["1675"]},{"w":"grievance","d":"n. 「不满」「委屈」「申诉」","f":"n. 「不满」「委屈」「申诉」\n（认为受到不公正对待而产生的）不满、委屈、怨气 She has a grievance against her boss\nfile a grievance with HR 提出申诉/投诉","s":["1791"]},{"w":"grotty","d":"adj. 邋遢的（现在没什么美国人用了）","f":"adj. 邋遢的（现在没什么美国人用了）\n（地方/物品）邋遢的、脏乱的、破旧的 The hotel was really grotty.（那家旅馆又脏又破。）\n（天气/情况）糟糕的、令人难受的 The weather's been grotty all week.\n（人）邋遢的、衣衫不整的 look grotty","s":["1791"]},{"w":"guarantee","d":"v. 确保","f":"v. 确保","s":["1791"]},{"w":"guileless","d":"adj. 天真无邪的","f":"adj. 天真无邪的\na guileless smile 纯真的微笑\nguileless honesty 毫无心机的诚实\na guileless confession（坦诚的供认/坦白）\nwith guileless simplicity\t以天真朴实的姿态","s":["1791"]},{"w":"habituate","d":"v. 使习惯于","f":"v. 使习惯于（habituate相比于get used to，前者更强调结果，后者更强调过程，前者更用于中性或负面语义，后者偏中性）\nhabituate oneself to sth / doing sth（vt.）使习惯于、使适应（通过反复经历而适应）\nbecome habituated to （vi. / 被动式）习惯于\nhabituate oneself to sth\t使自己习惯于\nbe / become habituated to sth\t习惯于……（被动式，最高频）\nhabituate to sth\t逐渐习惯（不及物用法）","s":["1791"]},{"w":"haggle","d":"v./n. 砍价","f":"v.n. 砍价。美国人只在车行、跳蚤市场和出国旅游时才用。\nhaggle with 某人 / over 或 about 某物 / for 某目标。\nCan you haggle the price down?（你能把价砍下来吗？） No haggling — fixed prices here.（这里不议价，明码标价。）","s":["1791"]},{"w":"hamper","d":"v. 阻碍；n. 篮子（美式：洗衣篮；英式：食品/野餐篮）","f":"v. 阻碍。hamper 的意思是\"碍事、添麻烦、拖慢\"，但不是\"停止\"，这是与stop，prevent的区别。\n（vt.）阻碍、妨碍（使进展变慢或受阻）The heavy snow hampered traffic.（大雪阻碍了交通。）\n（vt.）束缚、牵制（限制某人行动/自由）The tight dress hampered her movements.（紧身裙妨碍了她的行动。）\n（n.）篮子（美式：洗衣篮；英式：食品/野餐篮）\na clothes hamper（洗衣篮）a picnic hamper（野餐篮）a Christmas hamper（圣诞礼盒/食品篮）","s":["1791"]},{"w":"handicap","d":"n. 障碍；不利条件；残障；v. 妨碍；使处于不利地位","f":"n. 障碍；不利条件；残障；v. 妨碍；使处于不利地位","s":["1791"]},{"w":"handy","d":"adj. 方便的；灵巧的","f":"adj. 方便的；灵巧的","s":["1791"]},{"w":"haphazard","d":"adj. 杂乱无章的、随意的、没有计划的","f":"adj. 杂乱无章的、随意的、没有计划的\nThe books were piled on the floor in a haphazard way.（书杂乱无章地堆在地板上。）\nhaphazard manner / way（杂乱的方式）\nhaphazard growth（无序发展）\nhaphazard arrangement（随意安排）","s":["1791"]},{"w":"hardly","d":"adv. 几乎不","f":"adv. 几乎不","s":["1791"]},{"w":"harry","d":"v. 不断烦扰、骚扰；（军事上）不断袭扰","f":"v. 不断烦扰、骚扰；（军事上）不断袭扰。和harass的词义几乎重合。\n反复烦扰、不断打扰 —— 使人不得安宁\n例句：Reporters harried the politician with questions.（记者们用问题不断烦扰那位政客。）\n（军事）不断袭扰、骚扰（敌军） —— 通过频繁小规模攻击削弱敌人\n例句：The cavalry harried the enemy's supply lines.（骑兵不断袭扰敌人的补给线。）\nharry sb. with sth.（用某事不断烦扰某人）\nharry the enemy / retreating troops（袭扰敌人/撤退的部队）\nbe harried by（被……所烦扰）","s":["1791"]},{"w":"hatch","d":"v. 孵化；策划；孵出；n. 舱口；孵化","f":"v. 孵化；策划；孵出；n. 舱口；孵化","s":["1791"]},{"w":"haunt","d":"vt.（鬼魂）出没于；萦绕、困扰；常去；n. 常去的地方","f":"vt.\n1.（鬼魂）出没于某处；使某处闹鬼\n   A ghost is said to haunt the castle.（据说有鬼魂经常出没于这座城堡。）\n   The old house is believed to be haunted.（人们认为那座老房子闹鬼。）\n\n2.（记忆、想法或恐惧）长期萦绕、困扰某人\n指令人不安的事情持续留在脑海中，挥之不去。\n   The memory of the accident still haunts her.（那次事故的记忆仍萦绕在她心头。）\n   He was haunted by the fear of failure.（他一直受到失败恐惧的困扰。）\n   常见结构：sth. haunts sb.；sb. be haunted by sth.\n\n3. 经常光顾某地（较非正式或文学化）\n   Local artists used to haunt this café.（当地艺术家过去经常光顾这家咖啡馆。）\n\nn. 常去的地方；经常出没之处\na favorite／popular haunt of sb.：某人喜爱／经常光顾的地方\n   The old library was a favorite haunt of students.（那座老图书馆曾是学生们最喜欢去的地方。）","s":["1791"]},{"w":"haven","d":"n. 安全的地方、避难所 —— 指让人感到安全、可以躲避危险或麻烦的地方","f":"n. 安全的地方、避难所 —— 指让人感到安全、可以躲避危险或麻烦的地方\n例句：The small island was a haven for shipwrecked sailors.（这座小岛是遭遇海难的船员们的避难所。）\n例句：The garden is a haven of peace in the middle of the noisy city.（这座花园是喧闹城市中心一片宁静的乐土。）\n（动物的）栖息庇护地、保护区\n例句：The wetland is a haven for migratory birds.（这片湿地是候鸟的栖息庇护地。）港口、港湾（较古旧/文学用法）\n与 harbor（港口、庇护所） 意思相通。","s":["1791"]},{"w":"hazard","d":"v. 危险；公害","f":"v. 危险；公害","s":["1791"]},{"w":"hazardous","d":"adj. 危险的、有害的、有风险的","f":"adj. 危险的、有害的、有风险的\n相比于dangerous（有明确可识别风险），更正式、更技术化，常出现在科学、工业、环境、职业安全语境\n例句：Working in a coal mine is a hazardous job.（在煤矿工作是一项危险的工作。）\n例句：The mountain road is hazardous in winter.（这条山路冬天很危险。）\n有害的（健康/环境） —— 指对健康或环境有害\n例句：Smoking is hazardous to your health.（吸烟危害健康。）—— 经典例句，记住这个搭配\n例句：The factory releases hazardous chemicals into the river.（工厂向河里排放有害化学物质。）","s":["1791"]},{"w":"head","d":"n. 头；v. 向某处走去","f":"n. 头；v.向某处走去","s":["1791"]},{"w":"headstrong","d":"adj. 任性固执的、刚愎自用的","f":"adj. 任性固执的、刚愎自用的。贬义。\nheadstrong youth / young man / child（任性的年轻人/孩子），往往暗示年轻气盛、缺乏经验。","s":["1791"]},{"w":"heedless","d":"adj. 不注意的、掉以轻心的、不顾（后果）的","f":"adj. 不注意的、掉以轻心的、不顾（后果）的\nbe heedless of + 危险/警告/后果/危险/风险","s":["1791"]},{"w":"helpless","d":"adj. 无助的","f":"adj. 无助的","s":["1791"]},{"w":"hence","d":"adv. 因此；所以；从今以后；从此","f":"adv. 因此；所以；从今以后；从此","s":["1675","1791"]},{"w":"heritage","d":"n. 遗产，不可数","f":"n. 遗产，不可数。\ncultural heritage（文化遗产）：最常用，指历史文物、建筑、艺术、习俗等。\ninherit heritage（继承遗产）：虽然可搭配，但更侧重“继承”这个动作，常用于比喻，比如继承家族传统。\nprotect / preserve / conserve heritage（保护遗产）：三者都常用，preserve 侧重“保存原样”，conserve 侧重“合理利用地保护”。","s":["1791"]},{"w":"heyday","d":"n. 全盛期","f":"n. 全盛期","s":["1925"]},{"w":"highlight","d":"v. 突出显示；强调","f":"v. 突出显示；强调","s":["1925","1791"]},{"w":"hinder","d":"v. 妨碍","f":"v. 妨碍","s":["1791"]},{"w":"homogeneous","d":"adj. 同质的；均匀的","f":"adj. 同质的；均匀的","s":["1675","1791"]},{"w":"hubbub","d":"n. 人声鼎沸","f":"n. 人声鼎沸\n形容公共场所的“人声嘈杂”（最高频）I couldn't hear the announcement over the hubbub of the airport terminal.\n媒体头条或政论中的“舆论哗然 / 争议骚动”（比喻义）Cause / Create a hubbub The CEO's controversial tweet caused quite a hubbub online. \n动物或自然界的群体鸣叫（比喻义）A hubbub of birds erupted from the trees when the cat approached.","s":["1791"]},{"w":"human","d":"adj. 人类的；人性的","f":"adj. 人类的；人性的","s":["1791"]},{"w":"hypersensitive","d":"adj. 非常敏感的","f":"adj. 非常敏感的","s":["1925"]},{"w":"hypothesis","d":"n. 假设；假说","f":"n. 假设；假说","s":["1675","1925","1791"]},{"w":"i agree to some extent","d":"phr. 我在一定程度上同意","f":"phr. 我在一定程度上同意","s":["scenario"]},{"w":"i see your point but","d":"phr. 我明白你的观点，但是……","f":"phr. 我明白你的观点，但是……","s":["scenario"]},{"w":"identical","d":"adj. 同一的","f":"adj. 同一的","s":["1675","1791"]},{"w":"identify","d":"v. 认出","f":"v. 认出","s":["1791"]},{"w":"ideology","d":"n. 意识形态","f":"n. 意识形态\nPolitical ideology（政治意识形态）：最泛用的组合。\nDominant ideology（主流意识形态）：形容在社会中占统治地位的思想。\nHold / Adopt an ideology（持有/采纳某种意识形态）。\nAbandon / Reject an ideology（放弃/拒绝某种意识形态）。","s":["1675","1791","2026"]},{"w":"idiosyncrasy","d":"n.（个人或事物独有的）特质；习性；怪癖","f":"n.（个人或事物独有的）特质、习性或怪癖\n指不寻常但具有辨识度的特点，可以形容人的行为习惯，也可以形容机器、制度或文化现象的独特之处。语气不一定贬义。\n\n【常用搭配】\n• a personal／individual idiosyncrasy：个人特有的习性／怪癖\n• the idiosyncrasies of sb./sth.：某人／某事物特有的特点\n\n【托福例句】\n1. The researcher examined the linguistic idiosyncrasies of several Native American languages.（这位研究者考察了几种美洲原住民语言独有的语言特征。）\n2. The artist's idiosyncrasies became more apparent as her style developed.（随着风格逐渐成熟，这位艺术家的独特习性变得更加明显。）\n3. Understanding the idiosyncrasies of the local climate is essential for successful crop cultivation.（了解当地气候的独特特点对于农作物的成功种植至关重要。）\n4. The machine's minor idiosyncrasies made it difficult for new technicians to operate.（这台机器的一些小毛病使新技术人员难以操作。）","s":["1791"]},{"w":"ignite","d":"v. 使...燃着","f":"v. 使...燃着","s":["1791"]},{"w":"ignoble","d":"adj. 不光彩的、卑鄙的、可耻的","f":"adj. 不光彩的、卑鄙的、可耻的。书卷气极重的贬义词。\nIgnoble motives（卑鄙的动机）：最常用的组合，强调“出发点就不正”。\nIgnoble act / deed（不光彩的行为/事迹）。\nAn ignoble end / failure（不光彩的结局/失败）——形容虎头蛇尾、晚节不保。","s":["1791"]},{"w":"ignore","d":"v. 忽视","f":"v. 忽视","s":["1791"]},{"w":"illegible","d":"adj. 难以辨认的","f":"adj. 难以辨认的（90%用于手写场景）。眼睛看不清字母/笔画。比如字太草、墨水晕开。重点是“生理上”看不清。\nIllegible handwriting / signature（难以辨认的笔迹/签名）\nIllegible text / copy（无法阅读的文本/复印件）\nBecome / render something illegible（变得模糊不清 / 使……无法辨认）\n“The coffee stain rendered the address illegible.”（咖啡渍让地址变得无法辨认了。）","s":["1791"]},{"w":"illuminate","d":"v. 照亮；照明；说明","f":"v. 照亮；照明；说明","s":["1791"]},{"w":"illusion","d":"n. 幻觉","f":"n. 幻觉\nsb have the illusion that ...\nsth is an illusion","s":["1791"]},{"w":"illustrate","d":"v. 说明","f":"v. 说明","s":["1791"]},{"w":"imaginary","d":"adj. 虚构的","f":"adj. 虚构的","s":["1791"]},{"w":"imbibe","d":"v. 字面义喝液体，比喻义吸收","f":"v. 字面义喝液体，比喻义吸收。\n文学描写“小口品酒”（书面语）。","s":["1675","1791"]},{"w":"imitate","d":"v. 模仿","f":"v. 模仿","s":["1675","1791"]},{"w":"immense","d":"adj. 巨大的；无限的","f":"adj. 巨大的；无限的","s":["1791"]},{"w":"immerse","d":"v. 沉浸；给...施洗礼","f":"v. 沉浸；给...施洗礼","s":["1675","1791"]},{"w":"immobile","d":"adj. 不能移动的、固定不动的；静止的","f":"adj. 不能移动的、固定不动的；静止的","s":["1791"]},{"w":"impact","d":"v. 影响；作用；冲击","f":"v. 影响；作用；冲击","s":["1791"]},{"w":"impair","d":"v. 损害","f":"v. 损害","s":["1791"]},{"w":"impale","d":"v. 用尖物刺穿","f":"v. 用尖物刺穿。Pierce 是\"穿个孔\"，Impale 是\"穿成串后卡住，像是串烧\"。\nImpale + 宾语 + on + 刺穿的表面/物体（强调“被固定在哪里”）\nget / be impaled on + 尖锐物体(fence（篱笆）、railing（栏杆）、handlebar（自行车把）)\nThe butterfly was impaled on a pin.（蝴蝶被钉在标本针上。——强调它在针上）\nImpale + 宾语 + with + 作案工具（强调“用什么刺的”）\nHe impaled his opponent with a spear.（他用长矛刺穿了对手。——强调武器是矛）","s":["1791"]},{"w":"impart","d":"v. 传授","f":"v. 传授。把自己有的（知识、信息、特质），分给出去，让别人也拥有。\n结构一：impart + 内容 + to + 接收者（最核心，介词必须是 to）\nShe imparted her secret to her best friend.（她把秘密告诉了闺蜜。）\nThe program aims to impart practical skills to young adults.（这个项目旨在向年轻人传授实用技能。）\n结构二：impart + 内容 + 直接宾语（不说给谁听，只谈内容）\nThe book imparts a great deal of wisdom.（这本书传递了大量智慧。）\n结构三：被动语态（常用）：The information was imparted to...\nThe instructions were imparted to all staff members.（指示已传达给所有员工。）","s":["1791"]},{"w":"impartial","d":"adj. 公正的，无偏见的","f":"adj. 公正的，无偏见的。强调不带私心。\n黄金搭档一：Fair and impartial（公平且公正）—— 法律政治文本里的“固定连体婴”，就跟中文里的“公平公正”一样密不可分。\nEveryone is entitled to a fair and impartial trial.（人人有权获得公平公正的审判。）\n黄金搭档二：Impartial + 名词（修饰性极强）\nimpartial observer（公正的旁观者/观察员）\nimpartial advice（中肯的建议）","s":["1791"]},{"w":"impassioned","d":"adj. 充满激情的、慷慨激昂的","f":"adj. 充满激情的、慷慨激昂的。\n带有悲壮感和道德重量，相比于Passionate和Enthusiastic，更适用于法庭正义辩护场景。\nImpassioned + speech / address（激昂的演讲）\nImpassioned + plea / appeal（恳切的请求/呼吁）\nImpassioned + defense / argument（激烈的辩护/论点）\nImpassioned + debate / discussion（热烈的辩论 —— 注意这里通常指面红耳赤的争论，而不是和平的聊天）","s":["1791"]},{"w":"impassive","d":"adj. 面无表情的、冷漠淡然的、无动于衷的","f":"adj. “面无表情的”、“冷漠淡然的”、“无动于衷的”。(不代表内心没有感情，但是表面上看不出来)。\nRemained impassive（保持面无表情）—— 新闻标题最爱的用法\nImpassive face / expression（冷漠的脸/表情）—— 小说描写常用\nImpassive silence（冷漠的沉默）—— 指对方毫无反应，让你心里发毛","s":["1791"]},{"w":"impel","d":"v. 驱使","f":"v. 驱使。强调的是一种内在的、强烈的动力（比如良心、欲望、情感、责任感），像一股无形的力量在后面推着你，让你不得不行动起来。\n主语（往往是抽象名词）+ impel + 人 + to do（动词不定式）Necessity impelled him to take the job.","s":["1791"]},{"w":"imperative","d":"adj. 当务之急的、必须服从的、不容置疑的","f":"adj. 当务之急的、必须服从的、不容置疑的。\n结构一（满分句型）：It is imperative + that + 主语 + (should) + 动词原形\n⚠️ 重大警告：这个句型必须用虚拟语气！动词要用原形（不加 s，不加 ed）。\nIt is imperative that every employee be (注意不是 is) present at the meeting.（每位员工都必须出席会议。）\nIt is imperative that we act (不是 acts) now.（我们必须立刻行动。）\n结构二（简单实用）：It is imperative + to + 动词原形\nIt is imperative to maintain strict confidentiality.（严格保密是至关重要的。）","s":["1791"]},{"w":"impervious","d":"adj. 刀枪不入、油盐不进、滴水不漏","f":"adj. \"刀枪不入、油盐不进、滴水不漏\"。可用于物理和抽象层面。\n主语 + be impervious to + 攻击物/刺激物\nThe material is impervious to water.（这种材料防水。）\nHe is impervious to flattery.（他对奉承话无动于衷。——油盐不进）\nTeenagers often think they are impervious to danger.（青少年常觉得自己对危险免疫。——迷之自信）","s":["1791"]},{"w":"implement","d":"n. 工具","f":"n. 工具","s":["1675","1791"]},{"w":"implicit","d":"adj. 含蓄的；未明确说出的；暗含的","f":"adj. 含蓄的；未明确说出的；暗含的","s":["1675","1791"]},{"w":"imposing","d":"adj. 宏伟壮观的","f":"adj. 宏伟壮观的。可用于建筑、人物描写、旅游文学。\nImposing + figure / presence（威严的形象/强大的气场）\nImposing + building / structure / mansion（宏伟的建筑/宅邸）\nImposing + stature / height（高大的身材）\nImposing + list / task / challenge（庞大的清单/艰巨的任务）","s":["1791"]},{"w":"impressively","d":"adv. 令人印象深刻地、引人注目地","f":"adv. 令人印象深刻地、引人注目地","s":["1791"]},{"w":"impropriety","d":"n. 不当行为","f":"n. 不当行为。\nAllegations of impropriety（对不当行为的指控）—— 政客新闻必背词组\nFinancial / sexual / political impropriety（财务/性/政治上的不当行为）\nAny appearance of impropriety（任何看起来像不检点的苗头）—— 这是美式政治里的“避嫌金句”：We must avoid any appearance of impropriety.（我们必须避免任何可能引起不检点嫌疑的举动。）","s":["1791"]},{"w":"impure","d":"adj. 脏的；不纯洁的","f":"adj. 脏的；不纯洁的","s":["1791"]},{"w":"in other words","d":"phr. 换句话说","f":"phr. 换句话说","s":["scenario"]},{"w":"inborn","d":"adj. 天生的；先天的","f":"adj. 天生的；先天的","s":["1675","1791"]},{"w":"incandescent","d":"adj. 遇热发光的, 白炽的","f":"adj. 遇热发光的, 白炽的[mean]incandescent 是一个形容词，指的是发光的、白热化的或炽热的，特指物体因高温而发出明亮的光。[ph]incandescent light bulb[ph]glowed incandescent[ph]an incandescent performance","s":["1925"]},{"w":"incapacitate","d":"v. 使丧失能力、使瘫痪、使无法运作","f":"v. “使丧失能力”、“使瘫痪”、“使无法运作”。美国人在日常闲聊（比如聊天气、聊晚饭）中几乎不用。但在看新闻、读报告、玩射击游戏、或者处理法律/医疗事务时，这个词出现的频率极高。\nBe incapacitated by + 原因（被……搞垮了）\nThe soldiers were incapacitated by the tear gas.（士兵们被催泪瓦斯搞得失去了行动力。）\nBe incapacitated from + doing（失去了做某事的资格/能力）\nHis age does not incapacitate him from running the company.（他的年龄并不妨碍他管理公司。——注意这里用否定，表示“虽老但能力尚在”）","s":["1791"]},{"w":"incessant","d":"adj. 没完没了的","f":"adj. “没完没了的”\nIncessant + 烦人名词：incessant rain（雨不停）、incessant noise（噪音不断）、incessant complaints（投诉没完）、incessant questions（十万个为什么）\nThe incessant + 名词 + (动词短语)\nThe incessant barking of the dog kept me awake.（狗没完没了的叫声让我睡不着。）","s":["1791"]},{"w":"incipient","d":"adj. 初期的、刚刚开始的","f":"adj. 初期的、刚刚开始的\n选它不是因为词汇炫耀，而是因为只有它能同时表达“刚发生”+“不可逆地推进”+“通常不妙”。如果你只说 initial，听者只会问“然后呢？”；但你说 incipient，听者立刻会问“那该怎么办？”，这就是它的核心价值。\n· Incipient problem / crisis（初现端倪的问题/危机）\n· Incipient disease / infection（早期疾病/感染）\n· Incipient stage / phase（初始阶段）","s":["1791"]},{"w":"incisive","d":"adj. 尖锐的；深刻的","f":"adj. 尖锐的；深刻的","s":["1675","1791"]},{"w":"incite","d":"v. 煽动","f":"v. 煽动\n· Incite violence / riots（煽动暴力/暴乱）——新闻标题高频词\n· Incite hatred / rebellion（煽动仇恨/叛乱）\n· Incite a crowd / mob（煽动人群/暴民）","s":["1791"]},{"w":"inclined","d":"adj. 倾向的","f":"adj. 倾向的","s":["1791"]},{"w":"incoherent","d":"adj. 不连贯的","f":"adj. 不连贯的\n· Incoherent speech / rambling（语无伦次的讲话）\n· Incoherent policy / strategy（前后矛盾的政策）\n· Incoherent patient / witness（神志不清的病人/证人）","s":["1791"]},{"w":"incompetent","d":"adj. 不称职的","f":"adj. 不称职的","s":["1791"]},{"w":"incongruity","d":"n. 不和谐","f":"n. 不和谐。母语者选它，是因为它描述的不是“错误”，而是“审美或认知上的违和感”。\n· Incongruity between A and B（A与B之间的不协调）\n· Sense / element of incongruity（违和感/不协调元素）\n· Cultural / social incongruity（文化/社会层面的格格不入）","s":["1791"]},{"w":"incorruptible","d":"adj. 刚正不阿的，经得住考验的","f":"adj. 刚正不阿的，经得住考验的\n· Incorruptible judge / official / leader（刚正不阿的法官/官员/领袖）\n· Incorruptible integrity / honesty（坚不可摧的正直/诚信）","s":["1791"]},{"w":"incredulity","d":"n. 震惊的不可置信","f":"n. 震惊的不可置信\n· Stare / look at someone in incredulity（难以置信地盯着某人）\n· Raise one’s eyebrows in incredulity（怀疑地挑起眉毛）\n· A mixture of shock and incredulity（震惊与不可置信交织）","s":["1791"]},{"w":"indefinite","d":"adj. 无限期的，或者定义模糊的，不清晰的","f":"adj. 无限期的，或者定义模糊的，不清晰的\n· Indefinite detention / suspension（无限期拘留/暂停）\n· Indefinite outline / notion（模糊的轮廓/概念）","s":["1791"]},{"w":"indent","d":"v./n. 缩排；订合同","f":"v./n. 缩排；订合同","s":["1791"]},{"w":"independent variable","d":"n. 自变量","f":"n. 自变量","s":["scenario"]},{"w":"indicate","d":"v. 指示；表示","f":"v. 指示；表示","s":["1791"]},{"w":"indignity","d":"n. 侮辱","f":"n. 侮辱\nSuffer / endure / undergo an indignity（遭受屈辱）\nSubject someone to an indignity（使某人遭受屈辱）\nThe indignity of + doing something（做某事的屈辱）\nHe couldn't bear the indignity of asking his parents for money again.（他无法忍受再次向父母要钱的屈辱。）","s":["1791"]},{"w":"indomitable","d":"adj. 百折不挠的","f":"adj. 百折不挠的。\nIndomitable + spirit（不屈的精神）—— 最经典\nIndomitable + will / determination（不屈的意志/决心）\nIndomitable + courage（无畏的勇气）\nIndomitable + fighter / warrior（不屈的斗士）","s":["1791"]},{"w":"induce","d":"v. 诱发","f":"v. 诱发。主语是人的时候，表达诱使某人做某事。主语是客观事物时，表达诱发了什么事情。\nsb. Induce + sb. + to do（诱导某人做某事）\nA reward may induce children to behave well.（奖励可能会诱导孩子们表现良好。）\nInduce + 客观结果（引发某种反应/状态）\nThis chemical induces a chemical reaction.（这种化学物质会引发化学反应。）","s":["1791"]},{"w":"induction","d":"n. 归纳法,感应,就职,入门","f":"n.归纳法,感应,就职,入门","s":["1675"]},{"w":"ineligible","d":"adj. 无资格的","f":"adj. 无资格的\n结构一（最常见）：ineligible for + 名词/动名词\nHe is ineligible for the scholarship.（他没有资格申请奖学金。）\n结构二（第二高频）：ineligible to + 动词原形\nShe is ineligible to apply for citizenship.（她没有资格申请公民身份。）","s":["1791"]},{"w":"inertial","d":"adj. 惯性的；与惯性有关的","f":"adj. 惯性的；与惯性有关的\n特指与物理学中的 inertia（惯性）有关，常用于描述运动物体、参考系或导航系统。\n\n【常见搭配】\n• inertial navigation system (INS)：惯性导航系统\n• inertial reference frame／inertial frame of reference：惯性参考系\n• inertial force：惯性力\n\n【托福例句】\n1. An inertial navigation system can determine an aircraft's position without relying on external signals.（惯性导航系统无需依赖外部信号，就能确定飞机的位置。）\n2. In an inertial reference frame, an object remains at rest or in uniform motion unless acted upon by an external force.（在惯性参考系中，除非受到外力作用，物体会保持静止或匀速运动。）\n3. The spacecraft continued moving forward because of its inertial motion after the engines were turned off.（发动机关闭后，飞船由于惯性运动仍继续向前移动。）\n4. Engineers must account for inertial forces when designing a system that moves rapidly.（设计快速运动的系统时，工程师必须考虑惯性力。）","s":["1791"]},{"w":"inevitable","d":"adj. 不可避免的；必然的","f":"adj. 不可避免的；必然的","s":["1791"]},{"w":"infallible","d":"adj. 绝无差错的，永不出错的","f":"adj. “绝无差错的”，永不出错的。\n一般不用于形容人(除非是教皇)，否则会有反讽的意味。\nInstinct / Judgment / Eye（直觉/判断力/眼光）：指在某件事上，这个人准得离谱。\nInfallible + method / system / formula（万无一失的方法/系统/公式）\nInfallible + guide / test / proof（绝对可靠的指南/测试/证据）\nInfallible + memory / instinct（过目不忘的记忆力/从不出错的直觉）","s":["1791"]},{"w":"infer","d":"v. 推知","f":"v. 推知","s":["1675","1791"]},{"w":"inference","d":"n. 推论","f":"n.推论","s":["1675"]},{"w":"inflict","d":"v. 把（不愉快、痛苦或沉重的东西）强行施加给某人","f":"v. 把（不愉快、痛苦或沉重的东西）强行施加给某人。\nA（施加者） + inflict + 痛苦/伤害/惩罚 + on/upon + B（承受者）\n① 身体/战争暴力（最经典）\t“予以（重击/创伤）”\tThe bomb inflicted severe damage on the building.（炸弹对大楼造成了严重破坏。）\nHe inflicted a fatal wound on his opponent.（他给对手造成了致命伤。）\n② 心理/法律/行政（第二高频）\t“强加（痛苦、惩罚、税金）”\tThe judge inflicted a heavy fine on the company.（法官对公司处以巨额罚款。）\nDon't inflict your problems on others.（别把你的问题强加给别人。）\n③ 尴尬/社交（口语幽默用法）\t“硬要打扰、赖着不走”\tI won't inflict myself on you any longer.（我就不再打扰你了。——这是非常礼貌且地道的客套话，直译是“我不再把我自己强加给你了”）","s":["1791"]},{"w":"influential","d":"adj. 有影响的；有权势的","f":"adj. 有影响的；有权势的","s":["1791"]},{"w":"informal","d":"adj. 第一含义是非正式的，其次是随意的、不拘礼节的","f":"adj. 第一含义是“非正式的”，其次是随意的、不拘礼节的。它描述的是：一种不穿西装、不打领带、不按官方流程走的“放松状态”。\n① 服装/场合（最最经典）\t“休闲的”、“便装的”——指不用穿西装、不用打领带的场合。\tThe dress code is informal; feel free to wear jeans.（着装要求是非正式的，随意穿牛仔裤就行。）\nWe're having an informal gathering at my place.（我们在我家搞一个非正式的小聚。）\n② 语言/风格（写作口语必考）\t“口语化的”、“随意的”——指日常聊天用的词语，不用高大上的书面语。\t\"Gonna\" and \"wanna\" are informal expressions.（“Gonna”和“Wanna”是非正式表达。）\nThe tone of his email is too informal for a business proposal.（他的邮件语气对于商业提案来说太随意了。）\n③ 流程/制度（正式语境）\t“非官方的”、“不走程序的”——指没有通过正规会议或文件的讨论、协议。\tThey reached an informal agreement before signing the contract.（他们在签合同前达成了一项非正式协议。）\nLet's have an informal chat about your career plans.（咱们非正式地聊聊你的职业规划吧。）","s":["1791"]},{"w":"inherent","d":"adj. 固有的","f":"adj. 固有的","s":["1675","1791"]},{"w":"inherently","d":"adv. 内在地；固有地；天性地","f":"adv. 内在地；固有地；天性地","s":["1675"]},{"w":"initial","d":"adj. 初始的","f":"adj. 初始的","s":["1791"]},{"w":"initiate","d":"v. 开始；初始；启蒙","f":"v. 开始；初始；启蒙","s":["1675","1791"]},{"w":"inject","d":"v. 注射；注入","f":"v. 注射；注入","s":["1791"]},{"w":"injure","d":"v. 伤害；损害；损伤","f":"v. 伤害；损害；损伤","s":["1791"]},{"w":"injurious","d":"adj. 有害的，诽谤的","f":"adj. 有害的，诽谤的。“造成实际损害/不公”（正式、偏法律/道德，强调“过错方”造成了恶果）。\nBe injurious to + 名词（对...有害/有损）—— 绝对用 to！\n① 健康/生活方式（最常用）\t“对健康有害的”（比 unhealthy 更正式、更书面化）\tSmoking is injurious to health.（吸烟有害健康。——这是世界卫生组织经典用语！）\nA sedentary lifestyle is injurious to the spine.（久坐不动的生活方式对脊柱有害。）\n② 法律/言论（正式/新闻高频）\t“诽谤性的”、“损害名誉的”（指言论或报道对他人声誉造成法律层面的损害）\tThe article contained injurious accusations against the politician.（那篇文章包含了对该政客的诽谤性指控。）\nThe comments were highly injurious to his reputation.（这些评论对他的名誉造成了极大损害。）\n③ 社会/政治（严肃语境）\t“对社会/国家利益有害的”（指政策或行为损害了公共福祉）\tSuch policies are injurious to the public interest.（此类政策有损公共利益。）","s":["1791"]},{"w":"innate","d":"adj. 天生的","f":"adj. 天生的\n① 才能/天赋（最最常用）\t“天生的才能/本能”——不需要学，就是比别人敏锐。\tShe has an innate talent for music.（她有音乐天赋。——生来就会）\nHe possesses innate leadership qualities.（他具备天生的领导特质。）\n② 性格/感知（高级用法）\t“天生的感觉/恐惧/直觉”——写进基因里的反应。\tHumans have an innate fear of heights.（人类对高度有一种天生的恐惧。）\nHer innate sense of justice prevented her from staying silent.（她天生的正义感让她无法保持沉默。）\n③ 生物/医学（学术用法）\t“先天的（与后天相对）”——指生理上生来就有的特征或免疫。\tThis is an innate immune response, not an acquired one.（这是一种先天性免疫反应，而非后天获得的。）","s":["1675","1791"]},{"w":"innovation","d":"n. 改革；革新","f":"n. 改革；革新","s":["1791"]},{"w":"innumerable","d":"adj. 不计其数的","f":"adj. 不计其数的\n① 自然/宇宙（最经典画面）\t“无数的（星星/沙粒/生物）”\tThere are innumerable stars in the Milky Way.（银河系里有数不清的星星。）\nThe beach was covered in innumerable grains of sand.（海滩上覆盖着数不清的沙粒。）\n② 抽象/人生经历（文学最爱）\t“数不清的（理由/机会/回忆）”\tI have innumerable reasons to thank him.（我有数不清的理由要感谢他。）\nShe has faced innumerable challenges throughout her career.（她的职业生涯中面对过数不清的挑战。）\n③ 重复/频率（口语夸张）\t“无数次（强调次数极多）”\tI've told you innumerable times to clean your room.（我告诉过你无数次了，要打扫房间！）","s":["1791"]},{"w":"inordinate","d":"adj. 过度的","f":"adj. 过度的。它描述的是：某事物的大小、数量或强度，已经远远超过了正常、合理或预期的范围，甚至到了“违规”或“有害”的程度。Inordinate 永远带着“不应该这样、这太过分了”的负面或批判色彩。你用它的时候，心里一定在皱眉。\n① 时间/等待（最最常用）\t“过长的、超出常理的（时间）”\tWe had to wait an inordinate amount of time for the results.（我们不得不等了极其漫长的时间才拿到结果。——潜台词：等得离谱了！）\nHe spends an inordinate amount of time on social media.（他在社交媒体上花了过多的时间。）\n② 金钱/数量（经济高频）\t“过高的、巨额到失当的（花费/利润）”\tThe project consumed an inordinate share of the budget.（这个项目占用了预算中过高的一部分。）\nShe paid an inordinate price for that handbag.（她为那个手提包付了高得离谱的价格。）\n③ 情绪/欲望（心理描写）\t“过度的、极端的（骄傲/愤怒/食欲）”\tHe took an inordinate pride in his appearance.（他对自己的外表有一种过度的骄傲。——潜台词：自恋得有点病态了。）\nShe displayed an inordinate amount of anger over a minor issue.（她对一件小事表现出了过度的愤怒。）","s":["1791"]},{"w":"inquiry","d":"n. 询问；调查；探究","f":"n. 询问；调查；探究\n指为了获得信息、查明事实或深入理解某个问题而进行的提问或系统调查。比 question 更正式；比 investigation 通常更宽泛，不一定涉及执法或正式查案。\n\n【常见用法】\n1. 询问；咨询\n   make an inquiry about sth.：询问／咨询某事\n   I called the office to make an inquiry about the application process.（我打电话到办公室咨询申请流程。）\n2. 调查；正式查问\n   a government／official inquiry into sth.：政府／官方对某事的调查\n   The committee launched an inquiry into the causes of the accident.（委员会启动了对事故原因的调查。）\n3. 学术探究；研究\n   scientific／academic inquiry：科学／学术探究\n   Careful inquiry into the fossils provided evidence of how the species evolved.（对这些化石的仔细研究为该物种的进化过程提供了证据。）\n\n【常见搭配】\n• inquiry into sth.：对某事的调查／探究\n• inquiry about sth.：对某事的询问／咨询\n• in response to an inquiry：回应询问\n• further inquiry：进一步调查\n\n拼写提示：inquiry 和 enquiry 都表示“询问、调查”；inquiry 在美式英语中更常见，正式调查和学术探究中尤其常用。","s":["1791"]},{"w":"insert","d":"v. 插入","f":"v. 插入","s":["1791"]},{"w":"insignificant","d":"adj. 无关紧要的, 可忽略的, 无意义的","f":"adj. 无关紧要的, 可忽略的, 无意义的","s":["1925"]},{"w":"insinuate","d":"vt. 暗示；含沙射影；把（想法）悄悄植入","f":"vt.\n1. 暗示；含沙射影地指出（通常是不便直接说出的负面内容）\n   insinuate (that) + 从句：暗示某事\n   Are you insinuating that I was responsible for the mistake?（你是在暗示这个错误是我造成的吗？）\n   The article insinuated that the officials had accepted bribes.（这篇文章含沙射影地暗示官员收受了贿赂。）\n\n2. insinuate sth. into sth.：把某种想法、观点或影响悄悄植入某事物\n   The advertisement insinuates the idea that happiness depends on wealth.（这则广告悄悄灌输了一种观念：幸福取决于财富。）\n\n3. insinuate oneself into sth.：设法悄悄进入某个群体、圈子或职位\n   He insinuated himself into the research team.（他设法进入了那个研究团队。）\n\n词性提示：表示“暗示”和“把……植入”时都是及物用法，通常需要宾语；常见被动形式为 be insinuated。\n\n辨析：insinuate 通常暗含不友好、可疑或不便明说的意思；suggest 可以是中性的“建议／暗示”，语气没有那么强。","s":["1791"]},{"w":"inspect","d":"v. 检查；视察","f":"v. 检查；视察","s":["1791"]},{"w":"install","d":"v. 安装；设置","f":"v. 安装；设置","s":["1791"]},{"w":"instigate","d":"v. 煽动、挑起、发起","f":"v. “煽动、挑起、发起”\nInstigate + 事件/行为 instigate violence / a strike / legal proceedings\nInstigate sb to do sth（煽动某人去做某事）—— 考试高频结构 The ringleader instigated the crowd to attack the police.（头目煽动人群去攻击警察。）","s":["1791"]},{"w":"instinctive","d":"adj. 天生的；本能的","f":"adj. 天生的；本能的","s":["1675","1791"]},{"w":"institute","d":"v. 建立；n. 研究所","f":"v. 建立； n. 研究所","s":["1675","1791"]},{"w":"instrument","d":"n. 仪器；工具；乐器","f":"n. 仪器；工具；乐器","s":["1791"]},{"w":"instrumental","d":"adj. 起重要作用的；仪器的；器乐的","f":"adj. 起重要作用的；仪器的；器乐的\n\n【1. 起重要作用的；促成……的】\n常见于正式或学术语境，表示某人或某事对结果的实现发挥了关键作用。\nbe instrumental in doing sth.：在做某事中发挥重要作用\nbe instrumental in sth.：对某事的实现起关键作用\n   Her research was instrumental in developing a more effective treatment.（她的研究对开发更有效的治疗方法起了关键作用。）\n   Local farmers were instrumental in preserving the traditional irrigation system.（当地农民在保护传统灌溉系统方面发挥了重要作用。）\n\n【2. 仪器的；器械的】\n与 instrument（仪器、器械）有关。\n   instrumental analysis（仪器分析）\n   instrumental measurement（仪器测量）\n\n【3. 器乐的；乐器演奏的】\n与乐器演奏有关，或指没有人声演唱的音乐。\n   instrumental music（器乐）\n   an instrumental piece（器乐曲）\n\n辨析：instrumental in 表示“对结果起关键作用”，不是“用仪器的”；instrumental music 指“器乐”，不是“有帮助的音乐”。","s":["1791"]},{"w":"insubordinate","d":"adj. 不服从的；桀骜不驯的","f":"adj. 不服从的；桀骜不驯的","s":["1791"]},{"w":"insufferable","d":"adj. 难以忍受的","f":"adj. 难以忍受的","s":["1791"]},{"w":"insufficient","d":"adj. 不足的，不够的","f":"adj. 不足的，不够的","s":["1925"]},{"w":"insult","d":"v./n. 侮辱；凌辱","f":"v. n. 侮辱；凌辱","s":["1791"]},{"w":"insurmountable","d":"adj. 不能克服的, 不能超越的","f":"adj. 不能克服的, 不能超越的","s":["1925"]},{"w":"integral","d":"adj. 组成的，整的","f":"adj. 组成的，整的\nintegral to（对……必不可少）：强调逻辑上的必要性，缺少它整体就不完整或无法运作。\n例句：Trust is integral to any healthy relationship.（信任对任何健康的关系都不可或缺。）\nintegral part of（是……不可分割的一部分）：这是最经典的固定名词搭配，强调从属关系。\n例句：Music is an integral part of the school's curriculum.（音乐是该校课程不可分割的一部分。）","s":["1675","1791"]},{"w":"integrate","d":"v. 使结合；使进入","f":"v. 使结合；使进入","s":["1675","1791"]},{"w":"intellectual","d":"adj. 智力的","f":"adj. 智力的","s":["1791"]},{"w":"intelligence","d":"n. 智力","f":"n. 智力","s":["1675","1791"]},{"w":"intelligible","d":"adj. 可理解的","f":"adj. 可理解的\nIntelligible = “可理解的、能听懂的、清晰易懂的”\n强调的不是“内容简单”，而是信号或表达足够清晰，让听者/读者能够抓取到意思。\n例句：She was so upset that her speech was barely intelligible.（她太激动了，说话几乎听不清。）\n例句：The doctor's handwriting is not intelligible to anyone.（这位医生的字谁都看不懂。）","s":["1791"]},{"w":"intense","d":"adj. 非常的；紧张的","f":"adj. 非常的；紧张的","s":["1925","1791"]},{"w":"intensify","d":"v. 加强","f":"v. 加强\nIntensify = （使）变得更强烈、更剧烈、更尖锐（程度上的加剧，而不是数量上的增多）\n它描述的永远是强度、力度、烈度的变化，而不是数量或尺寸。\n例句：The fighting intensified overnight.（战斗在夜间加剧了。）\n例句：His anger intensified when he heard the news.（听到消息后，他的愤怒加剧了。）","s":["1791"]},{"w":"intensive","d":"adj. 集中的","f":"adj. 集中的\nIntensive = “密集的、集约的、需要高度投入的”\n它强调的是在短时间内集中大量精力、资源或活动，而不是指情感或物理上的“强烈”。\n例句：She took an intensive course in Spanish.（她上了一个西班牙语强化课程。）\n例句：The job is very intensive and requires long hours.（这份工作强度很大，需要长时间投入。）","s":["1791"]},{"w":"intercede","d":"v. 调停，调解","f":"v.调停，调解\nintercede for sb.\t为某人说情/求情\t最常用，强调受益对象\nintercede with sb.\t向某人（当权者）求情\t强调求情的对象是谁\nintercede on behalf of sb.\t代表某人说情\t正式用法，等于 intercede for\nintercede in sth.\t介入/调解某事\t强调介入的事务或争端","s":["1791"]},{"w":"intercept","d":"vt. 拦截；截获；截取","f":"vt. 在目标到达目的地之前拦住、截获或截取；通常是有意阻止其继续前进或获取其中的信息。\n\n【1. 拦截人或物】\nintercept sb./sth.：拦截某人／某物\n   The patrol intercepted the boat before it reached the island.（巡逻队在船到达岛屿前将其拦截。）\n   The defender intercepted the pass and stopped the attack.（防守队员截断传球，阻止了进攻。）\n\n【2. 截获通信或信息】\nintercept a message／call／signal：截获消息／电话／信号\n   The researchers intercepted a radio signal from the distant satellite.（研究人员截获了来自遥远卫星的无线电信号。）\n   The intelligence agency intercepted the message.（情报机构截获了这条信息。）\n\n【3. 数学：截距】\n在数学中，intercept 还可作名词，表示直线与坐标轴的交点或截距；但本词条的常见核心用法是动词“拦截、截获”。\n\n词性提示：作为“拦截、截获、截取”时通常是及物动词，后面直接接人、物、通信或信号。\n\n辨析：intercept 强调在途中截住；prevent 只表示阻止结果发生，不一定有“中途截住”的动作。","s":["1791"]},{"w":"interest","d":"n. 兴趣；利息","f":"n. 兴趣；利息","s":["1791"]},{"w":"interfere","d":"vi. 干涉；干预；妨碍；干扰","f":"vi. 干涉；干预；妨碍；干扰\ninterfere 通常是不及物动词，后面需要接介词，不能直接说 interfere something。\n\n1. interfere with sth.：干扰、妨碍某事；介入并影响某事\n   Loud construction noise interfered with the students' concentration.（嘈杂的施工噪声影响了学生的注意力。）\n   Human activity can interfere with the migration patterns of birds.（人类活动可能会干扰鸟类的迁徙模式。）\n\n2. interfere in sth.：干涉某事，插手他人的事务（通常带有负面意味）\n   The government should not interfere in the private decisions of families.（政府不应干涉家庭的私人决定。）\n\n3. interfere with sb.：打扰、妨碍某人；干涉某人的行动\n   Please do not interfere with the researchers while they are working.（研究人员工作时请不要打扰他们。）\n\n【介词辨析】\n• interfere with：强调造成妨碍、干扰或不良影响，使用最广。\n• interfere in：强调未经允许插手、干涉某事，常用于事务、决定或关系。\n• interfere：不直接接宾语；“干涉某人”通常说 interfere with sb.，不用 interfere sb.。","s":["1791"]},{"w":"interior","d":"adj. 内部","f":"adj. 内部","s":["1675","1791"]},{"w":"interject","d":"vt./vi. 插话；插入；突然加入（评论或行动）","f":"vt./vi. 插话；插入；突然加入\n指在谈话、叙述或活动进行时突然插入一句话、评论或行动；比 interrupt 更强调“插入一个具体内容”，语气不一定粗鲁。\n\n【1. 插话，突然发言】\ninterject (that) + 从句：插话说……\n   “That is not entirely accurate,” she interjected.（“那并不完全准确，”她插话说道。）\ninterject into a conversation：插入谈话\n   He interjected a question into the discussion.（他在讨论中插入了一个问题。）\n\n【2. 插入评论、问题或补充内容】\ninterject sth.：插入某个具体的评论、问题或说明（及物）\n   The professor occasionally interjected humorous remarks to keep the lecture lively.（教授偶尔插入幽默评论，使讲座保持生动。）\n\n【3. 不及物用法】\n作“插话、突然发言”时可不带宾语，常用过去式或现在分词：\n   “Wait a minute!” he interjected.（“等一下！”他突然插话道。）\n\n词性提示：interject sth. 是及物用法；interject 或 interject into sth. 可作不及物用法。名词是 interjection（感叹词；插话）。\n\n辨析：interrupt 泛指打断正在进行的事情，可能带有打扰意味；interject 通常是短暂地插入一句话或一个观点。","s":["1791"]},{"w":"intermediate","d":"adj. 中级的","f":"adj. 中级的\nIntermediate = “中间的、居中的；中级水平的”\n核心概念就是“在两端之间”，可以作形容词、名词、动词。\n例句（形容词）：She has an intermediate level of English.（她的英语是中级水平。）\n例句（名词）：I'm an intermediate in Chinese chess.（我中国象棋是中级水平。）\n例句（动词）：The teacher intermediated the dispute between the two students.（老师调停了两个学生之间的争执——正式用法，等于 mediate）","s":["1675","1791"]},{"w":"internal","d":"adj. 内在的","f":"adj. 内在的","s":["1675","1791"]},{"w":"intervene","d":"vi. 干预；介入；干涉；插入其中","f":"vi. 干预；介入；干涉；插入其中\n通常是不及物动词，表示主动介入某个过程、争端或局势，以影响结果或阻止事态继续发展。\n\n【常见介词搭配】\n1. intervene in sth.：干预、插手某事（常指事务、争端或他人关系）\n   The government intervened in the dispute to prevent further violence.（政府介入这场争端，以防止暴力进一步升级。）\n\n2. intervene between A and B：介入 A 和 B 之间，调解双方\n   A mediator intervened between the two groups.（一名调解人介入了两个团体之间的冲突。）\n\n3. intervene on behalf of sb.：代表某人出面干预／求情\n   The professor intervened on behalf of the students.（教授代表学生出面干预。）\n\n4. intervene in the process：介入过程\n   No outside force should intervene in the natural process of evolution.（不应有外部力量干预自然的进化过程。）\n\n5. intervene between two events：发生在两件事之间\n   Several years intervened between the two archaeological excavations.（两次考古发掘之间相隔了数年。）\n\n辨析：intervene in 强调主动介入；interfere in 通常含有未经允许、造成干扰的负面意味。","s":["1791"]},{"w":"intricate","d":"adj. 错综复杂的；难懂的","f":"adj. 错综复杂的；难懂的","s":["1791"]},{"w":"intrinsic","d":"adj. 本质的；本身的","f":"adj. 本质的；本身的","s":["1675","1791"]},{"w":"inure","d":"vt. 使习惯于；使适应；vi. 习惯于（inure to）","f":"vt./vi. 使习惯于；使适应；习惯于（正式，较少见）\ninure A to sth.：使 A 习惯于某种困难、痛苦或艰苦条件\nbe／become inured to sth.：习惯于、适应某种困难或不利情况（最常见）\n\n【托福例句】\n1. Repeated exposure to cold temperatures can inure the body to harsh winter conditions.（反复暴露在低温中可以使身体适应严酷的冬季环境。）\n2. Over time, field researchers became inured to the physical demands of working in remote regions.（随着时间推移，野外研究人员逐渐适应了在偏远地区工作的体力要求。）\n3. Some desert plants are inured to prolonged drought and extreme heat.（一些沙漠植物已经适应了长期干旱和极端高温。）\n4. Communities living near active volcanoes may become inured to periodic ashfall.（生活在活火山附近的社区可能会逐渐习惯周期性的火山灰降落。）\n\n词性提示：现代英语中最常见的是被动结构 be／become inured to sth.；主动结构 inure A to sth. 较正式。","s":["1791"]},{"w":"invade","d":"v. 侵入；侵犯","f":"v. 侵入；侵犯","s":["1791"]},{"w":"inverse","d":"adj. 相反的；n. 反数","f":"adj. 相反的 / n. 反数","s":["1675","1791"]},{"w":"invert","d":"v. 倒转","f":"v. 倒转","s":["1675","1791"]},{"w":"investigate","d":"v. 调查；研究","f":"v. 调查；研究","s":["1791"]},{"w":"involuntary","d":"adj. 自然而然的，无意的","f":"adj. 自然而然的，无意的","s":["1925"]},{"w":"irradiate","d":"vt. 照射；使受到辐射；使充满（光或喜悦）","f":"vt. 照射；使受到辐射；使充满（光或喜悦）\n指用光、热或其他形式的辐射照射某物，常见于科学、医学、农业和环境语境；也可引申为某种情感或气氛“洋溢、充满”。\n\n【常见结构】\nirradiate sth. with sth.：用某种光线或辐射照射某物\nirradiate sth.：照射某物；使某物受到辐射\n\n【托福例句】\n1. Scientists irradiated the seeds with low doses of radiation to determine whether the treatment would improve crop yields.（科学家用低剂量辐射照射种子，以确定这种处理是否能提高作物产量。）\n2. Medical researchers use controlled beams of radiation to irradiate cancerous tissue while minimizing damage to surrounding cells.（医学研究人员使用受控的辐射束照射癌变组织，同时尽量减少对周围细胞的损伤。）\n3. Ultraviolet light can irradiate the surface of water and help destroy certain microorganisms.（紫外线可以照射水面，并帮助杀灭某些微生物。）\n4. The young scientist's enthusiasm irradiated the entire laboratory.（这位年轻科学家的热情感染了整个实验室。）\n\n辨析：irradiate 强调用光、辐射或能量“照射”目标；illuminate 通常只表示用光照亮，shine 表示发光或反光，beam 强调光线集中而有力地射出。","s":["1925"]},{"w":"irreconcilable","d":"adj. 不可调和的；无法协调的","f":"adj. 不可调和的；无法协调的\n指两种观点、利益、要求或立场之间存在根本冲突，无法通过妥协或协调加以统一。\n\n【常见搭配】\nirreconcilable differences：不可调和的分歧\nirreconcilable conflict：不可调和的冲突\nirreconcilable with sth.：与某事物无法相容／协调\n\n【托福例句】\n1. The two political parties held irreconcilable views about the role of government in the economy.（两个政党对于政府在经济中的作用持有不可调和的观点。）\n2. The researchers found irreconcilable differences between the new data and the original theory.（研究人员发现新数据与原有理论之间存在无法调和的差异。）\n3. Farmers' demand for increased irrigation was irreconcilable with the environmentalists' goal of conserving the river.（农民增加灌溉的要求与环保人士保护河流的目标无法协调。）\n4. The conflict appeared irreconcilable until both sides agreed to share the limited resources.（在双方同意共享有限资源之前，这场冲突似乎无法调和。）\n\n辨析：irreconcilable 强调冲突根本、无法通过妥协解决；incompatible 更强调两者性质或功能上不相容。","s":["1791"]},{"w":"irrelevant","d":"adj. 离题的；无关的","f":"adj. 离题的；无关的","s":["1675","1925","1791"]},{"w":"irrepressible","d":"adj. 抑制不住的；无法遏制的","f":"adj. 抑制不住的；无法遏制的\n常形容笑声、热情、好奇心、乐观情绪等自然流露、难以压制的状态。\nThe child’s irrepressible curiosity led her to ask questions about every stage of the experiment.\n（这个孩子抑制不住的好奇心使她对实验的每个阶段都提出了问题。）\nDespite the difficult conditions, the researchers maintained an irrepressible optimism about the project’s potential.\n（尽管条件艰苦，研究人员仍对项目的潜力保持着无法遏制的乐观态度。）","s":["1791"]},{"w":"irreproachable","d":"adj. 无可指责的；无可挑剔的","f":"adj. 无可指责的；无可挑剔的\n指行为、品格、证据或表现完全正当，没有可供批评或指责之处。\nThe committee praised the scientist for her irreproachable conduct throughout the controversial investigation.\n（委员会称赞这位科学家在整个有争议的调查过程中始终保持无可指责的行为。）\nThe study’s methodology was considered irreproachable because every conclusion was supported by independently verified data.\n（这项研究的方法被认为无可挑剔，因为每个结论都有经过独立核实的数据支持。）","s":["1791"]},{"w":"irresistible","d":"adj. 无法抗拒的；极具吸引力的","f":"adj. 无法抗拒的；极具吸引力的\n既可形容诱惑或吸引力强到无法拒绝，也可形容力量、趋势等强大到无法阻挡。\nThe aroma of freshly baked bread was irresistible, even to visitors who had just finished eating.\n（刚出炉面包的香味极具诱惑力，即使是刚吃完饭的游客也无法抗拒。）\nThe spread of the new agricultural technology became irresistible once its benefits had been demonstrated.\n（新农业技术的益处得到证明后，它的推广便成为不可阻挡的趋势。）","s":["1925","1791"]},{"w":"irresolute","d":"adj. 犹豫不决的","f":"adj. 犹豫不决的","s":["1791"]},{"w":"irreverence","d":"n. 不敬；不尊重","f":"n. 不敬；不尊重\n常用于对宗教、传统、权威或庄严事物表现出不敬。\nThe archaeologist’s irreverence toward local religious traditions drew criticism from the community.\n（这位考古学家对当地宗教传统的不敬招致了社区的批评。）\nThe satirical play uses humor and irreverence to challenge the authority of the ruling class.\n（这部讽刺剧运用幽默和不敬来挑战统治阶级的权威。）","s":["1925"]},{"w":"irreverent","d":"adj. 不敬的；无礼的","f":"adj. 不敬的；无礼的","s":["1925","1791"]},{"w":"irreversible","d":"adj. 不能撤回的，不能取消的","f":"adj. 不能撤回的，不能取消的[ph]the action is irreversible","s":["1925"]},{"w":"irrevocable","d":"adj. 不可撤销的；无法改变的","f":"adj. 不可撤销的；无法改变的\n指决定、承诺、法律行为或后果一旦作出，就不能撤回或改变。\nOnce the wetlands were destroyed, the loss of many native species became irrevocable.\n（湿地一旦遭到破坏，许多本土物种的消失就变得无法挽回。）\nThe court’s final ruling made the transfer of ownership irrevocable.\n（法院的最终裁决使所有权转让变得不可撤销。）","s":["1791"]},{"w":"isolate","d":"v. 使隔离","f":"v. 使隔离","s":["1791"]},{"w":"issue","d":"n. 问题；议题；发行；期号；v. 发布；发行；流出","f":"n. 问题；议题；发行；期号；v. 发布；发行；流出","s":["1791"]},{"w":"jeopardy","d":"n. 危险；险境；受威胁的状态","f":"n. 危险；险境；受威胁的状态\n通常指某人的安全、某物的存在、计划或权利面临被损害或失去的风险。最常见于固定搭配：be in jeopardy（处于危险之中）、put/place sth. in jeopardy（使某事物陷入危险）、jeopardize sth.（危及某事物）。\nRising sea levels have placed many coastal communities in jeopardy.\n（海平面上升使许多沿海社区陷入危险。）\nWithout sufficient funding, the university’s plans to preserve the historic building could be in jeopardy.\n（如果没有足够的资金，这所大学保护这座历史建筑的计划可能会受到威胁。）\n注意：Jeopardy 也可指美国的电视问答节目，但托福阅读和听力中主要使用“危险、受威胁的状态”这一含义。","s":["1791"]},{"w":"judgement","d":"n. 判断；判决","f":"n. 判断；判决","s":["1791"]},{"w":"jumble","d":"v./n. 混杂；弄乱；混乱的一堆","f":"v./n. 混杂；弄乱；混乱的一堆\n① v. 混杂；弄乱；使……顺序混乱（及物）\n指把不同的事物、信息或顺序混在一起，使其难以辨认或理解：jumble A and B together、jumble the words/records。\nThe editor accidentally jumbled the paragraphs, making the historical sequence difficult to follow.\n（编辑不小心打乱了段落，使历史发展的顺序难以理解。）\n② v.（通常与 about/up 连用）杂乱地移动或排列；变得混乱（不及物或短语动词）\nThe fossils had been jumbled up by underground movement over thousands of years.\n（这些化石经过数千年的地下运动后被搅得杂乱无章。）\n③ n. 混乱；杂乱的一堆；混杂物\n指排列无序、难以区分的一组物品、声音、信息或思想：a jumble of sth.。\nThe excavation yielded a jumble of pottery fragments from several different periods.\n（这次发掘出了一堆来自多个不同时期的杂乱陶器碎片。）\nThe report presents a confusing jumble of statistics rather than a clear explanation of the trend.\n（这份报告呈现的是一堆令人困惑的统计数据，而不是对该趋势的清晰解释。）\n补充：jumbled 是由 jumble 派生的形容词，表示“杂乱的；顺序混乱的”，如 jumbled information（杂乱的信息）。","s":["1791"]},{"w":"junction","d":"n. 交叉点；连接处","f":"n. 交叉点；连接处","s":["1791"]},{"w":"justly","d":"adv. 公正地；合理地；正当地","f":"adv. 公正地；合理地；正当地\n表示依据事实、原则或应得的标准来判断或对待某人某事。常修饰 condemn、criticize、reward、accuse、deserve 等词。\nThe historian justly criticized the government for ignoring the environmental costs of industrial expansion.\n（这位历史学家公正地批评了政府忽视工业扩张所带来的环境代价。）\nBecause the researcher had contributed most of the original data, she was justly recognized as the project’s principal investigator.\n（由于这位研究人员贡献了大部分原始数据，她理应被认可为该项目的主要研究者。）","s":["1791"]},{"w":"keep in mind that","d":"phr. 请记住；要注意……","f":"phr. 请记住；要注意……","s":["scenario"]},{"w":"ken","d":"n. 知识范围；理解能力；视野","f":"n. 知识范围；理解能力；视野\n指一个人能够理解、认识或掌握的范围，常用于固定表达 beyond one’s ken（超出某人的理解范围）。\nThe origins of the ancient language remain beyond the ken of most modern scholars.\n（这种古代语言的起源仍然超出了大多数现代学者的理解范围。）\nThe professor explained the complex theory in simple terms so that it would not lie beyond the students’ ken.\n（教授用简单的术语解释这一复杂理论，使其不至于超出学生的理解范围。）","s":["1791"]},{"w":"kidnap","d":"v. 绑架","f":"v. 绑架","s":["1791"]},{"w":"lag","d":"n. 落后","f":"n. 落后","s":["1791"]},{"w":"land","d":"v. 着陆；降落","f":"v. 着陆；降落","s":["1791"]},{"w":"languish","d":"v. 衰弱；受苦；长期停滞或被忽视","f":"v. 衰弱；受苦；长期停滞或被忽视\n① 指人或动物因疾病、饥饿、悲伤等逐渐变得虚弱、憔悴：languish from/under sth.。\n② 指人、机构、计划或事物长期处于不利、被忽视或没有进展的状态：languish in/under sth.；languish for lack of sth.。\nAfter months of drought, the crops began to languish, threatening the region’s food supply.\n（数月干旱之后，庄稼开始枯萎衰弱，威胁到该地区的粮食供应。）\nThe proposal languished in a government office for years because no agency assumed responsibility for it.\n（由于没有机构承担责任，这项提案在政府办公室里搁置了多年。）\nThe museum’s rare collection languished in storage instead of being made available to the public.\n（博物馆的珍贵藏品长期被闲置在仓库中，而没有向公众开放。）","s":["1791"]},{"w":"layer","d":"n. 层，层次；阶层","f":"n. 层，层次；阶层","s":["1675"]},{"w":"lead","d":"v. 引导；n. 铅","f":"v. 引导；n. 铅","s":["1791"]},{"w":"leak","d":"n./v. 泄漏","f":"n. v. 泄漏","s":["1791"]},{"w":"legacy","d":"n. 遗产；遗物","f":"n. 遗产；遗物","s":["1791"]},{"w":"liaison","d":"n. 联络；联络人；合作关系；（秘密的）私情","f":"n. 联络；联络人；合作关系；（秘密的）私情\n① 联络、协调：指不同个人、群体或机构之间为交换信息、协调行动而建立的联系。常见搭配：liaison between A and B、liaison with sb./sth.。\n② 联络人、协调员：指负责沟通不同部门或组织的人，常见于正式、行政和学术语境：liaison officer。\n③ 合作或协作关系：强调不同机构为共同目标开展的协调合作。\nThe university appointed a liaison officer to coordinate communication between the researchers and the local community.\n（这所大学任命了一名联络员，负责协调研究人员与当地社区之间的沟通。）\nEffective liaison between ecologists and farmers helped the region develop more sustainable irrigation practices.\n（生态学家与农民之间的有效联络帮助该地区制定了更可持续的灌溉方法。）\n在描述个人关系时，liaison 也可指秘密的恋情或私情，但托福语境中更常考查“联络、协调、合作关系”。","s":["1791"]},{"w":"licenced","d":"adj. 有执照的；许可的","f":"adj. 有执照的；许可的","s":["1791"]},{"w":"lifesaver","d":"n. 救生者, 水难救生员","f":"n. 救生者, 水难救生员","s":["1925"]},{"w":"literate","d":"adj. 有文化的；能读写的","f":"adj. 有文化的；能读写的","s":["1791"]},{"w":"lithe","d":"adj. 柔韧轻盈的；动作灵活优雅的","f":"adj. 柔韧轻盈的；动作灵活优雅的\n形容人的身体或动作柔软、灵活、协调，通常带有轻盈、优雅的意味；也可形容树枝、植物等具有柔韧性。\nThe dancer’s lithe movements allowed her to perform the difficult sequence without losing balance.\n（舞者柔韧而轻盈的动作使她能够完成这段高难度动作而不失去平衡。）\nThe young branches are lithe enough to bend in strong winds without breaking.\n（这些嫩树枝足够柔韧，能够在强风中弯曲而不断裂。）\n辨析：lithe 强调“柔韧、轻盈且灵活”，不只是“动作快”；agile 更强调敏捷和反应迅速，supple 更强调柔软易弯曲。","s":["1791"]},{"w":"loan","d":"v. 借； 贷款","f":"v. 借； 贷款","s":["1791"]},{"w":"locate","d":"v. 找出；设置","f":"v. 找出；设置","s":["1791"]},{"w":"long-standing","d":"adj. 长期存在的","f":"adj. 长期存在的","s":["1925"]},{"w":"loose","d":"adj. 宽松的","f":"adj. 宽松的","s":["1791"]},{"w":"luminous","d":"adj. 发光的；明亮的","f":"adj. 发光的；明亮的","s":["1675","1791"]},{"w":"lurk","d":"v. 潜伏；潜藏","f":"v. 潜伏；潜藏","s":["1791"]},{"w":"luster","d":"n. 光泽；光彩","f":"n. 光泽；光彩","s":["1675","1791"]},{"w":"mainspring","d":"n. 主发条","f":"n. (钟表的)主发条","s":["1925"]},{"w":"medium","d":"n. 媒介；（常作[pl]）宣传工具；传播媒介；手段，方法","f":"n. n 媒介；（常作[pl]）宣传工具；传播媒介；手段，方法","s":["1675"]},{"w":"midst","d":"n. 中部，中间，当中","f":"n.中部，中间，当中","s":["1675"]},{"w":"mirage","d":"n. 海市蜃楼；幻想","f":"n. 海市蜃楼；幻想 [ph] a ~","s":["1925"]},{"w":"neutral","d":"adj. 中立的；中性的；n. 中立者；空挡","f":"adj. 中立的；中性的；n. 中立者；空挡","s":["1675"]},{"w":"nibble","d":"n. 小口；少量；v. 小口咬；一点点啃","f":"n. 小口；少量；v. 小口咬；一点点啃","s":["1675"]},{"w":"norm","d":"n. 规范；常态","f":"n. 规范；常态","s":["2026"]},{"w":"obscure","d":"adj. 模糊的；晦涩的；不知名的；v. 遮蔽；使难以理解","f":"adj. 模糊的；晦涩的；不知名的；v. 遮蔽；使难以理解","s":["1675"]},{"w":"offset","d":"n. 抵消（碳补偿）；v. 抵消","f":"n. 抵消（碳补偿）　v. 抵消","s":["2026"]},{"w":"one possible explanation is","d":"phr. 一种可能的解释是……","f":"phr. 一种可能的解释是……","s":["scenario"]},{"w":"opportunity","d":"n. 机会，时机","f":"n. 机会，时机","s":["1925"]},{"w":"order","d":"n. 顺序；命令；秩序；生物分类中的目；v. 命令；订购；安排","f":"n. 顺序；命令；秩序；生物分类中的目；v. 命令；订购；安排","s":["1675"]},{"w":"outcome","d":"n. 结果，结局；成果","f":"n. 结果，结局；成果","s":["1675"]},{"w":"overall","d":"adj. 全部的，全面的","f":"adj. 全部的，全面的","s":["1675"]},{"w":"parallel","d":"adj. 平行的；相似的；n. 平行线；相似之处；v. 与……相似；与……平行","f":"adj. 平行的；相似的；n. 平行线；相似之处；v. 与……相似；与……平行","s":["1675"]},{"w":"peer-reviewed","d":"adj. 经同行评审的","f":"adj. 经同行评审的","s":["scenario"]},{"w":"peerless","d":"adj. 无人可及的，无与伦比的","f":"adj. 无人可及的，无与伦比的","s":["1675"]},{"w":"perspective","d":"n. 角度，方法；透视法","f":"n.(判断事物的)角度，方法；透视法","s":["1675"]},{"w":"plumb","d":"v. 测量深度；深入探究；adj. 垂直的；adv. 完全地","f":"v. 测 },{"w":"disdain","d":"v./n. 鄙视；蔑视；不屑；轻蔑","f":"v./n. 鄙视；蔑视；不屑；轻蔑","s":["1675","1791"]},{"w":"dismay","d":"n. 沮丧","f":"n. 沮丧。Dismay = 突然被打击到不知所措的“心慌”或“沮丧”。Dismay = Dis（否定/去除） + May（力量/能力）（源自拉丁语 magus，意为“力量”）。\nto one's dismay — 令某人沮丧／惊慌的是 To my dismay, I realized I had lost my wallet.\nwith dismay — 沮丧地／惊慌地\nexpress / show dismay — 表示／流露出沮丧\nv.\ndismay at something — 对某事感到惊慌／沮丧\nbe dismayed to find / learn / discover something — 发现某事时感到沮丧","s":["1675","1791"]},{"w":"doleful","d":"adj. 悲哀的、凄惨的或忧愁的","f":"adj. 悲哀的、凄惨的或忧愁的。核心在于“写在脸上或溢于言表的忧伤”，带有浓厚的文学色彩和凄楚感。\na doleful expression / look\t愁眉苦脸 / 哀伤的表情\tHe wore a doleful expression after hearing the news. (听到消息后，他一脸愁容。)\na doleful voice / song\t凄婉的声音 / 哀怨的歌曲\tShe sang a doleful song about lost love. (她唱了一首关于失去爱情的哀怨歌曲。)\na doleful tale / story\t悲惨的故事\tHe told me a doleful tale of his misfortunes. (他给我讲了一个关于他遭遇的悲惨故事。)","s":["1675","1791"]},{"w":"double-blind","d":"adj. 双盲的","f":"adj. 双盲的","s":["2026"]},{"w":"downcast","d":"adj. 垂头丧气的、沮丧的，但在描绘神态时，最传神的译法是低垂着眼的或目光低垂的","f":"adj. 垂头丧气的、沮丧的，但在描绘神态时，最传神的译法是低垂着眼的或目光低垂的。\nbe / feel downcast\t感到沮丧 / 意气消沉\tHe felt downcast about the team's loss. (他对球队的失利感到沮丧。)\nlook downcast\t看起来垂头丧气的\tWhy do you look so downcast today? (你今天怎么看起来这么没精打采？)\nwith downcast eyes / gaze\t低垂着眼睛 / 目光朝下地\tShe listened with downcast eyes, saying nothing. (她低垂着眼睛听着，一言不发。)\nbecome / grow downcast\t变得沮丧起来\tHis spirits grew downcast as the rain continued. (随着雨下个不停，他的情绪变得低落起来。)","s":["1675","1791"]},{"w":"dread","d":"v./n. 惧怕、极度担心或惶恐","f":"v.n. 惧怕、极度担心或惶恐。它的核心在于“对即将发生的坏事感到强烈的不安和恐惧”，比普通的“害怕”更具压迫感和忧虑感。\ndread doing sth.\t害怕做某事（指具体行为）\tHe dreads having to give a speech in public. (他非常害怕不得不当众演讲。)\ndread to think\t不敢想（指后果太糟，不敢想象）\tI dread to think what might happen next. (我不敢想接下来会发生什么。)\nlive in dread of (sth.)\t活在……的恐惧中（长期状态）\tThey live in dread of the next earthquake. (他们一直活在下一次地震的恐惧中。)\nhave a dread of (sth.)\t对……有强烈的恐惧\tShe has a dread of flying. (她对坐飞机有强烈的恐惧感。)","s":["1675","1791"]},{"w":"drowsy","d":"adj. 昏昏欲睡的","f":"adj. 昏昏欲睡的","s":["1675","1791"]},{"w":"dubious","d":"adj. 半信半疑的、将信将疑的，或者形容事物时译为可疑的、靠不住的","f":"adj. 半信半疑的、将信将疑的，或者形容事物时译为可疑的、靠不住的。它的核心在于“心里犯嘀咕，对某事拿不准、觉得不靠谱”。(这个词在美国人的脑子里，自带“一脸不信地眯起眼睛”的表情包。)\nbe dubious about (sth./doing sth.)\t对……存有疑虑 / 半信半疑\tShe is dubious about investing in such a risky project. (她对投资这么高风险的项目存有疑虑。)\ndubious of (sb.)\t不信任某人\tI'm dubious of his motives. (我怀疑他的动机。)\nsound / seem dubious\t听起来 / 看起来可疑\tThat excuse sounds dubious to me. (那个借口我听起来觉得有问题。)","s":["1791"]},{"w":"eager","d":"adj. 渴望的；热心的","f":"adj. 渴望的；热心的","s":["1791"]},{"w":"ecstasy","d":"n. 恍惚，狂喜","f":"n. 恍惚，狂喜\n指极致的快乐——“狂喜”、“心醉神迷” She was in ecstasy when she won the lottery. (中彩票时她陷入狂喜。)\n指宗教/艺术体验——“出神”、“忘我” The music sent the audience into ecstasy. (音乐让观众陷入沉醉忘我的状态。)\ngo into ecstasies over (sth.)：对……欣喜若狂（强调外露的兴奋反应）。例：She went into ecstasies over the new handbag. (她看到新包欣喜若狂。)","s":["1675","1791"]},{"w":"elation","d":"n. 欣喜","f":"n. 欣喜。elation 就是“上头的高兴”，记住搭配 a sense of elation 就能应对绝大多数场景。\n1. 描述“感到欣喜”的通用动词搭配\nfeel elation / experience elation：强调内心感受。\n例：I felt a rush of elation when I heard my name called.\n（听到自己的名字被叫到时，我涌上一阵欣喜。）\n2. 描述“充满或淹没于欣喜”的强化搭配\n\nbe filled with elation：充满欣喜。\nbe overcome with elation：被欣喜淹没（程度更强，常用于叙事）。\n例：She was overcome with elation as she held the trophy above her head.\n（她把奖杯举过头顶时，欣喜若狂。）\n\n3. 指明“因何而欣喜”的介词搭配\nelation at / over / about + 事件：明确指出原因。\n例：His elation at the promotion was palpable.\n（他对这次升职的欣喜之情显而易见。）\n\n4. 描述“欣喜持续时间或变化”的修饰搭配\ninitial elation（最初的欣喜）、sudden elation（突如其来的欣喜）——常用于描写“先喜后忧”的转折。\n例：Her initial elation soon gave way to anxiety.\n（她最初的欣喜很快被焦虑取代。）","s":["1675","1791"]},{"w":"embarrass","d":"v. 使困窘","f":"v. 使困窘","s":["1791"]},{"w":"enchant","d":"v. 迷醉","f":"v. 迷醉\n使着迷 / 使陶醉（最常用）enchant [someone] / be enchanted by [something/someone]\n对…施魔法（本义，较少用）an enchanted castle / forest（被施了魔法的城堡/森林）","s":["1675","1791"]},{"w":"encoding","d":"n. 编码","f":"n.（记忆的）编码","s":["2026"]},{"w":"enrage","d":"v. 激怒","f":"v. 激怒。可以把 enrage 理解为中文里的 “怒不可遏” 或 “暴怒”，而不是简单的“生气”或“烦躁”。\nbe enraged by / at / with sth/sb（因某事/某人被激怒）\nenrage sb（直接激怒某人）；it enrages sb that / when...（……让某人大怒）\nenrage the public / community / opposition（激怒公众/社区/反对派）","s":["1675","1925","1791"]},{"w":"enrapture","d":"v. 陶醉","f":"v. 陶醉\n艺术、音乐、表演带来的审美狂喜（绝对高频）be enraptured by / with sth（被……陶醉）；enrapture the audience（使观众陶醉）\n自然美景、风景带来的沉醉感（文学/描写类高频）enraptured gaze / silence（陶醉的凝视/沉默）；stand enraptured（陶醉地站着）","s":["1675","1791"]},{"w":"enthral","d":"v. 迷住","f":"v. 迷住。对比两个单词：Enthrall = 抓住你的注意力（让你挪不开眼，但因为“好看/好听”）。Enrapture = 引爆你的情绪（让你高兴到飞起，因为“太美/太爽”）。\n精彩的表演、故事、演讲让人“看呆了/听入迷了”（绝对高频）be enthralled by / with sth（被……迷住）；enthrall the audience / readers（迷住观众/读者）\n令人惊叹的自然美景、天籁之音（文学/描写类）enthralled by the beauty / scenery / voice（被美景/嗓音迷住）\n神秘、奇妙或前所未见的新事物让人欲罢不能（好奇心的“陷落”）remain / stand enthralled（依然入迷地）；be completely / utterly enthralled（完全被迷住）","s":["1791"]},{"w":"enthusiasm","d":"n. 热情","f":"n. 热情","s":["1791"]},{"w":"exasperate","d":"v. 激怒","f":"v. 激怒\nbe exasperated by / at sth（被某事激怒）；be exasperated with sb（对某人感到恼火）；\nexasperate customers / staff（激怒顾客/员工）an exasperated parent / teacher（恼火的家长/老师）\nlet out an exasperated sigh / groan（发出恼火的叹气/呻吟）；exasperated tone / look（恼火的语气/表情）","s":["1675","1791"]},{"w":"excitement","d":"n. 激动；兴奋；刺激","f":"n. 激动；兴奋；刺激","s":["1791"]},{"w":"extrinsic motivation","d":"n. 外在动机","f":"n. 外在动机","s":["2026"]},{"w":"exultant","d":"adj. 欢腾的，狂欢的","f":"adj. 欢腾的，狂欢的\nbe exultant at 因（某具体事件/消息）而狂喜, be exultant over 因（胜利/成就）而得意洋洋","s":["1675","1791"]},{"w":"faint","d":"adj. 微弱的、模糊的；虚弱的、眩晕的；v. 昏厥、晕倒；n. 昏厥","f":"adj. 微弱的、模糊的；虚弱的、眩晕的；v. 昏厥、晕倒；n. 昏厥","s":["1675","1791"]},{"w":"famish","d":"v. 现在一般没人用","f":"v. 现在一般没人用famish，都是用famished，表示饿极了（口语夸张）。\nbe / feel famished（不加介词）\t饿极了\tI haven't eaten all day; I'm absolutely famished!（我一整天没吃东西，饿死了！）\nfamished for + 名词\t渴望得到……（引申义）\tAfter weeks in the desert, they were famished for news of home.（在沙漠里待了几周后，他们渴望得到家里的消息。）","s":["1675","1791"]},{"w":"fanatic","d":"n./adj. 狂热者、入迷者（名词），或狂热的（形容词）","f":"n.adj. “狂热者、入迷者”（名词），或“狂热的”（形容词）。但在现代英语中，它最实用、最高频的用法是作名词，尤其是放在另一个名词前面构成复合词（如 fitness fanatic），表示“对某件事痴迷到极端程度的人”。\na fitness fanatic 健身狂人 a sports fanatic 体育迷（极度狂热）\nbe fanatical about + 名词/doing 对……极度狂热（含贬义或夸张）","s":["1675","1791"]},{"w":"fanaticism","d":"n. 狂热、盲信、狂热主义","f":"n. 是 fanatic（狂热者） 的抽象名词形式，意为“狂热、盲信、狂热主义”。它是一个不可数名词 (U.)，几乎100% 带有贬义，指那种不理智、极端且往往危险的过度热情，尤其常用于宗教、政治或意识形态领域。\nsb's fanaticism for + 名词\nthe fanaticism of + 名词/群体\ncondemn / denounce ~, stir up / incite ~\nborder on / verge on（近乎于）：His enthusiasm borders on fanaticism.（他的热情近乎狂热。）—— 经典高分搭配！","s":["1675","1791"]},{"w":"fantasy","d":"n. 幻想、想象、空想","f":"n. “幻想、想象、空想”。它有两个高频用法：一是作为可数名词，指具体的“幻想故事、奇幻作品”（如小说、电影）；二是作为不可数名词，指“天马行空的想象活动”。它既可以是中性（创造力），也可以带有贬义（逃避现实的空想）。\nhave a fantasy of + 名词/doing\t（具体内容） ……的幻想，幻想的内容\tHe has a fantasy of becoming a millionaire.（他有一个成为百万富翁的幻想。）Her fantasy of a perfect wedding was shattered.（她对完美婚礼的幻想破灭了。）\nhave a fantasy about + 名词/doing\t（主题/对象） 关于……的幻想\tShe has fantasies about quitting her job and traveling the world.（她幻想辞职去环游世界。）\nindulge in ~ 沉溺于幻想（带贬义）， live in ~ 活在幻想中（贬义）","s":["1791"]},{"w":"ferocious","d":"adj. 凶悍、残暴，攻击性拉满","f":"adj. 凶悍、残暴，攻击性拉满。本形容野兽，更常喻指激烈竞争、极端酷热或猛烈抨击，强调“毫不留情”的狠劲。\nferocious competition（白热化竞争）\n很少接介词，一般用于形容名词。","s":["1675","1791"]},{"w":"feverish","d":"adj. 字面发烧的；比喻狂热的、高速的、极度兴奋/焦虑的","f":"adj. 字面“发烧的”；比喻“狂热的、高速的、极度兴奋/焦虑的”（后者占日常使用95%）。常形容截止日期前的匆忙、市场的躁动或情绪的高压。\n作表语 + with（因……而狂热/焦躁）：He was feverish with excitement.（兴奋得发狂。）\nfeverish activity（一片繁忙）feverish pace（飞快的速度）\nfeverish excitement（狂热的兴奋）feverish haste（火急火燎）feverish dream（狂乱的梦）\nfeverish brow（发烫的额头）feverish patient（发热病人）","s":["1675","1791"]},{"w":"fickle","d":"adj. 善变的、反复无常的","f":"adj. 善变的、反复无常的。100% 贬义，专指感情、喜好、运气或天气的不可靠——今天爱死，明天恨死，毫无忠诚和稳定性可言。\nbe fickle in + 领域/决定：在……方面善变（常作表语）。He is fickle in his choices.（总改变主意。）\nbe fickle to + 人/群体：对……不忠/靠不住（文学化）。Fortune is fickle to those who hesitate.（命运不眷顾犹豫者。）\nfickle heart（花心）fickle tastes（多变的品位）","s":["1791"]},{"w":"flow","d":"n. 沉浸状态（全神贯注、忘记时间）；流动","f":"n. 沉浸状态（全神贯注、忘记时间）；流动","s":["2026"]},{"w":"fluster","d":"v. 使慌乱；n. 慌乱","f":"v. 使慌乱。强调外在可见的慌乱表现——不只是“心里急”，而是体现在动作和语言上。 n. 慌乱\nfluster over (something)：因某事而慌乱。例：She flustered over the details of the presentation.（她因演示文稿的细节而慌乱。）\nfluster by (something)：被某事弄得慌乱（常用于被动语态）。例：He was flustered by all the attention.（他被众人的关注弄得慌乱。）\nin a fluster：处于慌乱状态（名词短语）。例：The maid was in a fluster because she broke a vase.（女仆因打碎花瓶而慌乱不已。）","s":["1675","1791"]},{"w":"forlorn","d":"adj. 孤苦伶仃的、凄凉的；（希望）渺茫的","f":"adj. 孤苦伶仃的、凄凉的；（希望）渺茫的","s":["1791"]},{"w":"formidable","d":"adj. 令人敬畏的、强大的、难以对付的","f":"adj. “令人敬畏的、强大的、难以对付的”\n形容“对手/敌人” (令人畏惧的强大)，形容“困难/任务” (难以应对的艰巨)，形容“能力/品质” (令人赞叹的卓越)\npose a formidable challenge / threat to sb.（对某人构成巨大的挑战/威胁）\nfind sb/sth formidable（觉得某人/某事令人敬畏或难以招架）\nlook / seem formidable（看起来强大/令人生畏）","s":["1675","1791"]},{"w":"framing effect","d":"n. 框架效应（表述方式改变选择）","f":"n. 框架效应（表述方式改变选择）","s":["2026"]},{"w":"free recall","d":"n. 自由回忆（不给提示直接回想）","f":"n. 自由回忆（不给提示直接回想）","s":["2026"]},{"w":"frenzy","d":"n. 疯狂、狂乱；一阵狂热","f":"n. 疯狂、狂乱；一阵狂热","s":["1675","1791"]},{"w":"fret","d":"v. 烦恼、发愁","f":"v. Fret 的核心意思是“烦恼”、“发愁”，强调因琐事而持续地焦虑不安。\n动词/名词 —— 焦虑、烦恼、发愁（最常用）fret over details（为细节纠结）、fret at the delay（为延误烦躁）。“Don't fret.”（别担心 / 别发愁。）\n名词 ——（吉他、尤克里里等弦乐器上的）品丝 The guitar's frets were worn out from years of playing.（这把吉他的品丝因多年弹奏而磨平了。）","s":["1675","1791"]},{"w":"fright","d":"n. 惊吓；恐惧","f":"n. 惊吓；恐惧","s":["1791"]},{"w":"fundamental attribution error","d":"n. 基本归因错误","f":"n. 基本归因错误","s":["2026"]},{"w":"fury","d":"v. 狂怒、暴怒","f":"v. “狂怒”、“暴怒”。furious的名词形式。\n1. 形容情绪状态：狂怒、暴怒、盛怒（最常见）\n指人心中燃烧着极端的怒火。\n例句：He was trembling with fury at the insult.（他因受辱而气得浑身发抖。）\n常见搭配：in a fury（处于狂怒中）、fly into a fury（突然暴跳如雷）、shake with fury（气得发抖）。\n2. 形容猛烈活动/自然现象：猛烈、狂暴、剧烈\n与形容词 furious 的第二层意思对应，形容风、雨、战争或动作的猛烈程度。\n例句：The storm raged with fury against the coast.（暴风雨狂暴地肆虐着海岸。）\n常见搭配：the fury of the elements（大自然的狂暴）、white-hot fury（白热化的激烈）。","s":["1675","1791"]},{"w":"gleeful","d":"adj. 兴高采烈的、欢欣鼓舞的","f":"adj. 兴高采烈的、欢欣鼓舞的，通常带有因某件具体好事（尤其是别人的失败或自己的小胜利）而产生的、近乎孩子气的喜悦。","s":["1675","1791"]},{"w":"gloom","d":"n. 昏暗的光线 + 压抑的情绪","f":"n. 昏暗的光线 + 压抑的情绪。\n1. 心理/氛围场景（80%出现概率）——“愁云惨淡/悲观沮丧”\n这是当代新闻、文学和美剧里的绝对高频。它描述的是一种弥漫在空气中、让人喘不过气的压抑感。\n必背黄金搭配（考试选项里看到直接选）：\neconomic gloom（经济萧条/悲观）：外刊标题高频词，指大家对钱景普遍不看好。\ndoom and gloom（悲观绝望/一片灰暗）：极其高频的固定词组，美国人口语里常说，指“前途无亮、全是坏消息”。\ncast a gloom over...（给……蒙上阴影）：指某件坏事让整个场合的气氛瞬间变沉重。\n例句：The bad news cast a gloom over the whole office.（这个坏消息给整个办公室蒙上了一层阴霾。）\n2. 物理场景（20%出现概率）——“昏暗/幽暗”\n只用来形容光线极差、看不清东西的环境，且一定带有压抑、阴森的色彩（绝不指浪漫的烛光）。\n例句：He could barely see her face in the gathering gloom.（在渐浓的暮色/昏暗里，他几乎看不清她的脸。）\n禁区：绝对不能用来形容“明亮的月光”或“温馨的台灯下”，它只能形容快天黑时、地下室、浓雾里那种让人不太舒服的暗。","s":["1675","1791"]},{"w":"gloomy","d":"adj. 阴郁的、悲观的、阴沉沉的","f":"adj. 阴郁的、悲观的、阴沉沉的\n1. 形容人的情绪/表情——“满脸愁容、郁郁寡欢”（80%出现率）\n形容一个人 gloomy，绝不是“他没买到奶茶有点不爽”，而是长期笼罩在低气压里，沉默寡言，对未来不抱希望。\n必背搭配：a gloomy expression/face（阴郁的表情/脸色）；feel gloomy（感到沮丧）。\n母语者直觉：如果美国同事说 “He's been gloomy all week.”，潜台词是“他家里可能出大事了”或“他抑郁了”，绝不仅仅是“心情不好”。这个词带有沉重的分量。\n2. 形容天气/环境——“阴暗的、黑压压的”（20%出现率）\n只形容让人不舒服的暗：乌云密布、黄昏将至、没开灯的地下室。\n例句：a gloomy winter morning（阴沉沉的冬日早晨）；a gloomy basement（昏暗压抑的地下室）。\n禁区：绝对不用来形容“浪漫的夜色”或“舒适的暗光”，必须带“冷、湿、压抑”的体感。","s":["1675","1791"]},{"w":"gratify","d":"v. 使...高兴/满意 或 满足...（愿望/需求）","f":"vt.  “使...高兴/满意” 或 “满足...（愿望/需求）” \nbe gratified by / at / with + 名词：表示“因...而感到欣慰”。感受是内敛的、静态的。be gratified to do sth：表示“做某事感到欣慰”。It gratifies sb to do sth：表示“做某事令某人感到欣慰”。\nto gratify sb's curiosity 满足某人的好奇心。to gratify a whim 满足一时的心血来潮。to gratify sb's desire 满足某人的欲望。","s":["1675","1791"]},{"w":"groupthink","d":"n. 群体思维（为求一致而不作批判）","f":"n. 群体思维（为求一致而不作批判）","s":["2026"]},{"w":"grudge","d":"n. 记恨；v. 吝惜、不愿给","f":"n. 记恨\nholds a grudge 怨恨、积怨\nbear a grudge against\nhave a grudge against sb 对某人心怀怨恨\nHe grudges every penny he spends. （vt.）吝惜、不愿给\nI don't grudge him his success （vt.）不情愿地承认/给予","s":["1791"]},{"w":"habituation","d":"n. 习惯化（反复刺激后反应减弱）","f":"n. 习惯化（反复刺激后反应减弱）","s":["2026"]},{"w":"heuristic","d":"n. 启发式（快速但不精确的判断捷径）","f":"n. 启发式（快速但不精确的判断捷径）","s":["2026"]},{"w":"homesick","d":"

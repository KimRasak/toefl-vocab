<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>TOEFL 学科词汇总表 (5013 词)</title>
<style>
:root {
  --bg:#0f1115; --card:#1a1d24; --card2:#22262f; --fg:#e6e8eb;
  --muted:#8b93a1; --accent:#4c8dff; --accent2:#2a5fc0; --border:#2a2f3a;
}
@media(prefers-color-scheme:light){
  :root{--bg:#f4f6fa;--card:#fff;--card2:#eef1f6;--fg:#1a1d24;--muted:#5f6672;--accent:#2a5fc0;--accent2:#1c4499;--border:#dde2eb;}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{
  background:var(--bg);color:var(--fg);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  min-height:100vh;padding-bottom:env(safe-area-inset-bottom);
}
header{
  position:sticky;top:0;z-index:20;background:var(--bg);
  padding:12px 16px 10px;padding-top:max(12px,env(safe-area-inset-top));
  border-bottom:1px solid var(--border);
}
.top-row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.title{font-weight:800;font-size:18px;flex:0 0 auto}
.search-wrap{
  flex:1 1 200px;display:flex;align-items:center;
  background:var(--card);border:1px solid var(--border);border-radius:10px;padding:6px 10px;
}
.search-wrap input{flex:1;border:0;outline:0;background:transparent;color:var(--fg);font-size:14px}
.stats{font-size:12px;color:var(--muted);margin-top:6px}
.home-btn{
  flex:0 0 auto;background:var(--card);border:1px solid var(--border);color:var(--accent);
  border-radius:10px;padding:6px 10px;font-size:12px;cursor:pointer;text-decoration:none;font-weight:600;white-space:nowrap;
}
main{padding:12px 16px;max-width:800px;margin:0 auto}

/* Topic nav */
.topic-nav{
  display:flex;flex-wrap:wrap;gap:6px;margin-bottom:16px;
}
.topic-chip{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:5px 10px;font-size:12px;cursor:pointer;color:var(--fg);
  transition:border-color .15s;white-space:nowrap;text-decoration:none;
}
.topic-chip:hover{border-color:var(--accent)}
.topic-chip.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.topic-chip.active .cnt{color:#fff}
.topic-chip .cnt{color:var(--muted);font-size:11px;margin-left:3px}

/* 2026 权重徽章 */
.w26{
  display:inline-flex;align-items:center;gap:3px;font-size:10px;font-weight:700;
  border-radius:6px;padding:1px 5px;margin-left:4px;white-space:nowrap;
  border:1px solid currentColor;opacity:.95;
}
.sec-w26{font-size:11px;padding:2px 7px}
.sec-note{
  font-size:11px;color:var(--muted);line-height:1.5;
  margin:-2px 0 8px;padding:6px 10px;background:var(--card);
  border:1px solid var(--border);border-left:3px solid var(--accent);border-radius:8px;
}
.sec-note b{color:var(--fg);font-weight:600}
.prio-banner{
  font-size:12px;color:var(--muted);line-height:1.6;
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 12px;margin-bottom:12px;
}
.prio-banner b{color:var(--fg)}
.prio-banner a{color:var(--accent)}

/* Section */
.section{margin-bottom:28px}
.sec-head{
  position:sticky;top:55px;z-index:10;background:var(--bg);
  padding:10px 0 6px;display:flex;align-items:center;gap:8px;
  border-bottom:1px solid var(--border);margin-bottom:8px;
}
.sec-emoji{font-size:22px}
.sec-title{font-weight:700;font-size:16px}
.sec-cnt{color:var(--muted);font-size:13px}
.sec-toggle{
  margin-left:auto;background:var(--card);border:1px solid var(--border);
  color:var(--muted);border-radius:8px;padding:3px 10px;font-size:12px;cursor:pointer;
}

/* Word list */
.wlist{display:flex;flex-direction:column;gap:6px}
.witem{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:10px 14px;display:flex;align-items:flex-start;gap:10px;
}
.witem .ww{
  font-size:16px;font-weight:600;flex:0 0 auto;min-width:100px;
  display:flex;align-items:center;gap:6px;
}
.witem .wd{font-size:13px;color:var(--muted);flex:1;line-height:1.5}
.witem .wsrc{font-size:10px;color:var(--accent);flex:0 0 auto;opacity:.6}
.widx{font-size:11px;color:var(--muted);opacity:.5;margin-right:6px;font-weight:400;font-variant-numeric:tabular-nums}
.spk-btn{
  background:none;border:0;padding:0;cursor:pointer;color:var(--accent);
  font-size:14px;display:inline-flex;align-items:center;flex:0 0 auto;
}
.spk-btn:hover{opacity:.7}

/* Expand */
.witem .full{display:none;font-size:12px;color:var(--muted);margin-top:6px;line-height:1.6;word-break:break-word;white-space:pre-wrap}
.witem.expanded .full{display:block}

/* Search highlight */
.witem mark{background:rgba(76,141,255,.28);color:inherit;border-radius:3px;padding:0 2px}

.empty{text-align:center;color:var(--muted);padding:40px;font-size:14px}
.foot{text-align:center;margin:32px 0;color:var(--muted);font-size:12px}

/* Auto-play bar */
.autobar{
  position:fixed;bottom:0;left:0;right:0;z-index:30;
  background:var(--card);border-top:1px solid var(--border);
  padding:10px 16px;padding-bottom:max(10px,env(safe-area-inset-bottom));
  display:flex;align-items:center;gap:8px;flex-wrap:wrap;
  box-shadow:0 -2px 12px rgba(0,0,0,.15);
  transition:transform .25s;
}
.autobar.hidden{transform:translateY(100%)}
.autobar .ab-row{display:flex;align-items:center;gap:8px;width:100%}
.autobar .ab-word{
  font-size:18px;font-weight:700;flex:1;min-width:0;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.autobar .ab-def{
  font-size:12px;color:var(--muted);width:100%;
  overflow:hidden;text-overflow:ellipsis;white-space:nowrap;
}
.autobar .ab-pos{font-size:12px;color:var(--muted);white-space:nowrap}
.autobar button{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 12px;font-size:13px;cursor:pointer;
  white-space:nowrap;
}
.autobar button:hover{border-color:var(--accent)}
.autobar button.primary{background:var(--accent);color:#fff;border-color:var(--accent);font-weight:600}
.autobar select,.autobar input[type=number]{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:5px 8px;font-size:12px;
}
.autobar input[type=number]{width:60px}
.ab-toggle{
  position:fixed;bottom:16px;right:16px;z-index:29;
  background:var(--accent);color:#fff;border:0;border-radius:50%;
  width:48px;height:48px;font-size:22px;cursor:pointer;
  box-shadow:0 2px 12px rgba(76,141,255,.4);
  display:flex;align-items:center;justify-content:center;
  margin-bottom:env(safe-area-inset-bottom);
}
.ab-toggle:hover{opacity:.85}
.witem.playing{border-color:var(--accent);background:var(--accent2);background:rgba(76,141,255,.08)}
body.autobar-open{padding-bottom:100px}

/* Mark / hard words */
.mark-btn{
  background:none;border:0;padding:0;cursor:pointer;font-size:14px;
  display:inline-flex;align-items:center;flex:0 0 auto;opacity:.35;
  transition:opacity .15s;
}
.mark-btn:hover{opacity:.7}
.mark-btn.marked{opacity:1}
.witem.is-hard{border-left:3px solid #f5a623}
.filter-bar{
  display:flex;align-items:center;gap:8px;margin-bottom:12px;flex-wrap:wrap;
}
.filter-btn{
  background:var(--card);border:1px solid var(--border);border-radius:10px;
  padding:5px 12px;font-size:12px;cursor:pointer;color:var(--fg);
  transition:border-color .15s;
}
.filter-btn:hover{border-color:var(--accent)}
.filter-btn.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.hard-count{font-size:12px;color:var(--muted)}

/* Sync modal */
.sync-modal{
  display:none;position:fixed;inset:0;z-index:50;
  background:rgba(0,0,0,.6);align-items:center;justify-content:center;
  padding:20px;
}
.sync-modal.open{display:flex}
.sync-box{
  background:var(--card);border:1px solid var(--border);border-radius:16px;
  padding:24px;max-width:440px;width:100%;
}
.sync-box h3{margin:0 0 12px;font-size:16px}
.sync-box input[type=password],.sync-box input[type=text]{
  width:100%;background:var(--card2);border:1px solid var(--border);
  border-radius:8px;color:var(--fg);font-size:13px;padding:10px;
  font-family:monospace;
}
.sync-box .sync-btns{display:flex;gap:8px;margin-top:14px;flex-wrap:wrap}
.sync-box .sync-btns button{
  background:var(--card2);border:1px solid var(--border);color:var(--fg);
  border-radius:8px;padding:6px 14px;font-size:13px;cursor:pointer;
}
.sync-box .sync-btns button:hover{border-color:var(--accent)}
.sync-box .sync-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.sync-hint{font-size:12px;color:var(--muted);margin-top:10px;line-height:1.6}
.sync-status{font-size:12px;margin-top:8px;padding:6px 10px;border-radius:6px}
.sync-status.ok{background:rgba(52,199,89,.15);color:#34c759}
.sync-status.err{background:rgba(255,69,58,.15);color:#ff453a}
.sync-status.info{background:rgba(76,141,255,.12);color:var(--accent)}

/* Focus mode */
.focus-overlay{
  display:none;position:fixed;inset:0;z-index:25;
  background:var(--bg);
  flex-direction:column;align-items:center;justify-content:center;
  padding:24px;text-align:center;
}
.focus-overlay.open{display:flex}
.focus-word{font-size:clamp(32px,8vw,56px);font-weight:800;margin-bottom:12px;visibility:hidden}
.focus-def{font-size:16px;color:var(--muted);max-width:500px;line-height:1.6;margin-bottom:8px;visibility:hidden}
.focus-full{font-size:13px;color:var(--muted);max-width:500px;line-height:1.6;opacity:.7;margin-bottom:20px;word-break:break-word;white-space:pre-wrap;visibility:hidden}
.focus-overlay.revealed .focus-word,.focus-overlay.revealed .focus-def,.focus-overlay.revealed .focus-full{visibility:visible}
.focus-pos{font-size:13px;color:var(--muted);margin-bottom:20px}
.focus-btns{display:flex;gap:10px;flex-wrap:wrap;justify-content:center}
.focus-btns button{
  background:var(--card);border:1px solid var(--border);color:var(--fg);
  border-radius:10px;padding:8px 16px;font-size:14px;cursor:pointer;
}
.focus-btns button:hover{border-color:var(--accent)}
.focus-btns button.primary{background:var(--accent);color:#fff;border-color:var(--accent)}
.focus-mark{font-size:28px;cursor:pointer;margin-bottom:16px;opacity:.4;transition:opacity .15s}
.focus-mark.marked{opacity:1}

/* hidden */
.hidden{display:none!important}

@media(max-width:600px){
  .witem .ww{min-width:80px;font-size:15px}
  .witem .wd{font-size:12px}
}
</style>
</head>
<body>
<header>
  <div class="top-row">
    <a class="home-btn" href="../">← 首页</a>
    <span class="title">📚 学科词汇总表</span>
    <div class="search-wrap">
      <input id="searchInput" type="text" placeholder="搜索单词或释义..." autocomplete="off">
    </div>
  </div>
  <div class="stats" id="stats">5013 个词汇 · 45 个学科</div>
</header>
<main id="main"></main>
<div class="foot">TOEFL 学科词汇总表 · 三大词表 + 2026新场景词汇 · 按学科分组</div>

<!-- Auto-play bar -->
<button class="ab-toggle" id="abToggle" title="连播模式">▶</button>
<div class="autobar hidden" id="autobar">
  <div class="ab-row">
    <button class="primary" id="abPlayBtn">▶ 连播</button>
    <span class="ab-word" id="abWord">—</span>
    <span class="ab-pos" id="abPos"></span>
  </div>
  <div class="ab-row">
    <div class="ab-def" id="abDef">&nbsp;</div>
  </div>
  <div class="ab-row">
    <label style="font-size:12px;color:var(--muted)">起始:</label>
    <input type="number" id="abStart" min="1" value="1" title="从第几个词开始">
    <button id="abJump" title="跳转到指定单词">跳转</button>
    <label style="font-size:12px;color:var(--muted)">间隔:</label>
    <select id="abGap">
      <option value="0">无间隔</option>
      <option value="1000" selected>1 秒</option>
      <option value="2000">2 秒</option>
      <option value="3000">3 秒</option>
      <option value="5000">5 秒</option>
    </select>
    <button class="filter-btn" id="abHardOnly">⭐ 仅难词</button>
    <button class="filter-btn" id="abFocusBtn">🎯 专注</button>
    <button id="abPrev" title="上一个">⏮</button>
    <button id="abNext" title="下一个">⏭</button>
    <button id="abClose" title="关闭">✕</button>
  </div>
</div>

<!-- Sync modal -->
<div class="sync-modal" id="syncModal" onclick="if(event.target===this)syncClose()">
  <div class="sync-box">
    <h3>☁️ 云同步难词标记</h3>
    <input type="password" id="syncToken" placeholder="粘贴 GitHub Personal Access Token..." autocomplete="off">
    <div id="syncMsg"></div>
    <div class="sync-hint">
      只需一次设置：<a href="https://github.com/settings/tokens/new?scopes=gist&description=TOEFL-vocab-sync" target="_blank" style="color:var(--accent)">👉 点此创建 Token</a>（勾选 gist 权限即可）<br>
      输入后自动创建私密 Gist 保存星标，多设备输入同一 Token 即同步。
    </div>
    <div class="sync-btns">
      <button class="primary" onclick="syncLogin()">🔗 连接</button>
      <button onclick="syncNow()">🔄 立即同步</button>
      <button onclick="syncLogout()">退出登录</button>
      <button onclick="syncClose()">关闭</button>
    </div>
  </div>
</div>

<!-- Focus mode overlay -->
<div class="focus-overlay" id="focusOverlay">
  <div class="focus-topic" id="focusTopic" style="font-size:14px;color:var(--muted);margin-bottom:16px"></div>
  <div class="focus-reveal-area" id="focusRevealArea" style="cursor:pointer;padding:20px;min-height:120px;display:flex;flex-direction:column;align-items:center">
    <div class="focus-hint" id="focusHint" style="font-size:14px;color:var(--muted);opacity:.5">👆 点击此处揭晓答案</div>
    <div class="focus-word" id="focusWord">—</div>
  </div>
  <div class="focus-mark" id="focusMark" title="标记难词">⭐</div>
  <div class="focus-def" id="focusDef"></div>
  <div class="focus-full" id="focusFull"></div>
  <div class="focus-pos" id="focusPos"></div>
  <div class="focus-btns">
    <button onclick="focusPrev()">⏮ 上一个</button>
    <button onclick="focusSpeak()">🔊 发音</button>
    <button class="primary" id="focusPlayBtn" onclick="focusTogglePlay()">▶ 连播</button>
    <button onclick="focusNext()">⏭ 下一个</button>
    <button class="filter-btn" id="focusHardBtn" onclick="focusToggleHard()">⭐ 仅难词</button>
    <button onclick="focusClose()">✕ 退出</button>
  </div>
</div>

身体结构；组成结构","f":"n. 解剖学；身体结构；组成结构","s":["1675"]},{"w":"antiseptic","d":"adj./n. 抗菌防腐、抑制感染","f":"adj./n. 抗菌防腐、抑制感染\napply an antiseptic（涂消毒药水）、antiseptic cream/wipe（抗菌药膏/消毒湿巾）\nantiseptic dressing（无菌敷料）、antiseptic conditions（无菌环境）\nantiseptic style（冰冷的风格）、antiseptic atmosphere（冷淡的气氛）","s":["1791"]},{"w":"bleed","d":"v. 出血；流血；渗出；n. 出血","f":"v. 出血；流血；渗出；n. 出血","s":["1791"]},{"w":"catching","d":"adj. 有传染性的；有感染力的","f":"adj. 有传染性的；有感染力的","s":["1675","1791"]},{"w":"chronic","d":"adj. 长期的；慢性的","f":"adj. 长期的；慢性的","s":["1675","1791"]},{"w":"clinic","d":"n. 诊所；门诊部；（大学的）实习课","f":"n. 诊所；门诊部；（大学的）实习课","s":["1791"]},{"w":"clot","d":"n. 凝块、血栓","f":"n. 凝块、血栓\nblood clot（血凝块/血栓）","s":["1675","1791"]},{"w":"contagious","d":"adj. 传染的","f":"adj. 传染的","s":["1675","1791"]},{"w":"cranial","d":"adj. 颅的；头骨的；颅内的","f":"adj. 颅的；头骨的；颅内的","s":["1675"]},{"w":"diagnose","d":"v. 诊断；分析","f":"v. 诊断；分析","s":["1675","1791"]},{"w":"diagnosis","d":"n. 诊断；判断","f":"n. 诊断；判断","s":["1675","1791"]},{"w":"diet","d":"n. 饮食；日常食物；v. 节食","f":"n. 饮食；日常食物；v. 节食","s":["1791"]},{"w":"dissect","d":"v. 解剖","f":"v. 解剖\ndissect a frog / animal / specimen — 解剖青蛙／动物／标本\ndissect an argument / theory / report — 剖析论点／理论／报告\ndissect a text / passage — 分析文本／段落","s":["1675","1791"]},{"w":"fester","d":"v. 化脓、溃烂（字面）；恶化、暗中酝酿（比喻——极高频）","f":"v. 化脓、溃烂（字面）；恶化、暗中酝酿（比喻——极高频）。特指问题/不满/冲突因被忽视而愈发严重，像伤口化脓一样。\nfester in + 地点：在……（伤口/心里）化脓/恶化。Resentment festered in her heart.（怨恨在她心中加剧。）\nfester under + 表面：在……表象下恶化。Anger festered under the calm surface.（平静表象下怒火暗涌。）\nleave + 事物 + to fester：（听任/放任）……恶化（极高频固定搭配）。Don't leave the wound to fester.（别让伤口化脓。/ 别放任问题不管。）\nInstead of resolving the dispute, the management let it fester until it escalated into a major crisis.（管理层没有解决争端，而是任其恶化，直至升级为重大危机。）","s":["1675","1791"]},{"w":"fracture","d":"n. 断开的痕迹或状态","f":"n. 断开的痕迹或状态。物理上或抽象意义。\n医学上：骨折、骨裂（最常用）hairline fracture（骨裂/发丝状裂纹）；open/closed fracture（开放性/闭合性骨折）。\n地质/材料学上：裂缝、裂痕、断裂面 stress fracture（应力性断裂，也常用于医学的疲劳性骨折）。","s":["1675","1791"]},{"w":"fragile","d":"adj. 脆的；体制弱的","f":"adj. 脆的；体制弱的","s":["1675","1791"]},{"w":"gash","d":"n. 一道又深又长的伤口（通常流血很多，边缘参差不齐，需要缝针）","f":"n. 一道又深又长的伤口（通常流血很多，边缘参差不齐，需要缝针）。\n一般用于人的伤口，也可以用于物体、墙壁、地面的长裂痕。","s":["1675","1791"]},{"w":"heal","d":"v. 治愈；康复；愈合；弥合","f":"v. 治愈；康复；愈合；弥合","s":["1791"]},{"w":"healthful","d":"adj. 有益健康的；健康的","f":"adj. 有益健康的；健康的","s":["1791"]},{"w":"hygiene","d":"n. 卫生；卫生学","f":"n. 卫生；卫生学","s":["1675","1791"]},{"w":"immune","d":"adj. 免除的；免疫的","f":"adj. 免除的；免疫的","s":["1675","1791"]},{"w":"infectious","d":"adj. 传染的，感染性的","f":"adj. 传染的，感染性的。\n① 医学/病理（字面义）“传染性的”——指通过病毒、细菌在人与人之间传播的疾病。The flu is highly infectious.（流感具有高度传染性。）\nStay home if you have an infectious disease.（如果你有传染病，就待在家里。）\n② 情绪/人格（引申义，口语极高频！）\t“有感染力的”——指笑声、热情、乐观能迅速“传染”给周围人，让大家都跟着笑或跟着激动起来。\tShe has an infectious laugh.（她的笑声太有感染力了。——这是美国人夸人最常用的金句！）\nHis enthusiasm is infectious.（他的热情太有感染力了，搞得大家都跃跃欲试。）","s":["1675","1791"]},{"w":"infirmary","d":"n. 医院, 医务室<美>养老院, 救济院","f":"n. 医院, 医务室<美>养老院, 救济院[mean]医务室，医院，医疗所。通常指一个设备简单、规模较小的医疗机构，如校园医务室、军队医疗所或监狱医院。[st]The school infirmary provides basic medical care to students and staff[st]he injured soldiers were taken to the infirmary for treatment.[st]Inmates who require medical attention are sent to the prison infirmary.[syn]\"infirmary\"、\"clinic\"和\"medical center\" 都可以指医疗机构，但 \"infirmary\" 更常用于描述规模较小的医疗设施，特别是校园、军队或监狱等地方设立的。\"clinic\" 可以指医生的诊所或非常简单的医疗机构。而 \"medical center\" 则更普遍地指大型的医疗机构，可能提供更全面的医疗服务。","s":["1925"]},{"w":"intoxication","d":"n. 陶醉","f":"n. 陶醉","s":["1925"]},{"w":"invalid","d":"n. 病弱者；伤残者；adj. 无效的；不成立的；病弱的","f":"n. 病弱者；伤残者；adj. 无效的；不成立的；病弱的","s":["1675","1791"]},{"w":"malady","d":"n. 疾病","f":"n.疾病","s":["1675"]},{"w":"malnourished","d":"adj. 营养失调的 营养不良的","f":"adj. 营养失调的 营养不良的","s":["1675"]},{"w":"necrosis","d":"n. 坏死；组织坏死","f":"n. 坏死；组织坏死","s":["1675"]},{"w":"physician","d":"n. 医生；内科医生","f":"n. 医生；内科医生","s":["1675"]},{"w":"pill","d":"n. 药丸","f":"n. 药丸[mean]药丸；药片。这个词用来指一种用于药物治疗的小而固定剂量的药物形式，通常是圆形的，可以口服。药丸可以是用于治疗疾病、缓解症状或提供营养的药物。 （频率：5%）[st]The doctor prescribed a daily dose of pills[st]She took a couple of pills","s":["1925"]},{"w":"prescribe","d":"v. 开处方；规定；指示","f":"v. 开处方；规定；指示","s":["1675","1925"]},{"w":"prescribed","d":"adj. 规定的","f":"adj. 规定的[ph]prescribed medication/exercise regimen","s":["1925"]},{"w":"prescription","d":"n. 处方；药方；（对行为的）建议；规定","f":"n. 处方；药方；（对行为的）建议；规定","s":["1675","1925"]},{"w":"pulse","d":"n./v. 脉搏，脉冲","f":"n./v. 脉搏，脉冲 [ph] check the pulse [ph] pulses of electromagnetic waves","s":["1925"]},{"w":"recur","d":"v. 重现，再来；复发","f":"v. 重现，再来；复发[ph]has been recurring for months[ph]sth. recurs[ph]the illness can recur periodically[syn]\"recur\" 表示再次发生、重现或回到。与 \"repeat\" 和 \"reoccur\" 相似，但 \"recur\" 更强调事物或情况在时间上间歇性地重复出现。与 \"return\" 相似，但 \"recur\" 更侧重于指某事物或情况的再次发生或重现。","s":["1675","1925"]},{"w":"rehabilitate","d":"v. 使(身体)康复；使复职；使复元","f":"v. 使(身体)康复；使复职；使复元[ph]rehabilitate after the surgery[syn]\"rehabilitate\" 表示康复、恢复或使恢复正常。与 \"restore\" 和 \"recover\" 相似，但 \"rehabilitate\" 更强调通过医疗、治疗或重建来帮助某人康复或恢复到正常的身体或心理状态。与 \"recondition\" 相似，但 \"rehabilitate\" 更常用于指人的康复过程。","s":["1925"]},{"w":"relapse","d":"n. 故态复萌，再犯","f":"n. 故态复萌，再犯：fall back","s":["1675"]},{"w":"remedy","d":"n./v. 疗法；补救办法；治疗药物；解决办法","f":"n. v. 疗法；补救办法；治疗药物；解决办法 [st]Drinking warm lemon water is a popular home remedy for sore throat.","s":["1675","1925"]},{"w":"sac","d":"n. 囊，液囊","f":"n. （生物）囊，液囊[ph]The gallbladder stores bile in a small sac.[ph]The bee collected nectar and stored it in its honey sac.[st]The surgeon carefully removed the fluid-filled sac from the patient's lung.","s":["1925"]},{"w":"sanitary","d":"adj. 卫生的，清洁的，符合卫生标准的","f":"adj. 卫生的，清洁的，符合卫生标准的。用来形容与保持环境清洁和健康有关的条件、设施或措施。[ph]maintain sanitary conditions in food handling and preparation areas.[ph]The hospital follows strict sanitary protocols[ph]promote sanitary practices in public places.","s":["1925"]},{"w":"sheath","d":"n. 鞘，外壳","f":"n. 鞘，外壳[n]套，鞘，或包裹[st]The hunter kept sth in a leather sheath on his belt.[st]The sword slid smoothly into its ornate sheath.[st]The surgeon carefully placed the scalp demnity (LOI)（赔偿保证书）——国际贸易中，货物丢了，船运公司给你开的认赔承诺书。\n· Claim for indemnity（索赔）\n· Seek / provide indemnity（寻求/提供赔偿）","s":["1675","1791"]},{"w":"indictment","d":"n. 起诉","f":"n. 起诉\n1. 法律层面（最硬核）:“刑事起诉书”、“公诉书”。\n2. 社会/道德层面（极其高频的引申义）：“（对制度、社会、人品的）强烈谴责”、“控诉”\n- 动词搭配（法律程序）：\nHand down / return / bring an indictment（大陪审团正式发布起诉书）\nFace indictment（面临起诉）\nSeal an indictment（密封起诉书，通常在嫌疑人被捕前保密）\n- 形容词搭配（程度）：\nCriminal / federal indictment（刑事/联邦起诉书）\nDamning / stinging indictment（毁灭性的/尖锐的控诉）—— 这是引申义里最地道的用法！","s":["1675","1791"]},{"w":"infringe","d":"v. 侵犯","f":"v. 侵犯。有v. 和v. 两种用法\nInfringe + copyright / patent / trademark / rule / law（侵犯版权/专利/商标/规则/法律）—— 绝对不加介词\nInfringe + on / upon + freedom / privacy / rights / sovereignty（侵犯自由/隐私/权利/主权）—— 一定要加介词！\nInfringe + on / upon + territory / space（侵入领土/空间）","s":["1675","1791"]},{"w":"interrogate","d":"v. 审问；询问","f":"v. 审问；询问","s":["1675","1791"]},{"w":"invalidate","d":"v. 使无效；证明…错误","f":"v. 使无效；证明…错误","s":["1675","1791"]},{"w":"jurisdiction","d":"n. 司法权；管辖范围","f":"n. 司法权；管辖范围","s":["1675","1791"]},{"w":"lawsuit","d":"n. 诉讼","f":"n. 诉讼","s":["1675","1925","1791"]},{"w":"legalize","d":"v. 使合法化","f":"v. 使合法化","s":["1675","1791"]},{"w":"legislate","d":"v. 立法","f":"v. 立法","s":["1675","1791"]},{"w":"legislation","d":"n. 立法","f":"n.立法","s":["1675"]},{"w":"liberate","d":"v. 解放；释放","f":"v. 解放；释放","s":["1675","1791"]},{"w":"licensed","d":"adj. 被许可的","f":"adj. 被许可的","s":["1675"]},{"w":"mandatory","d":"adj. 命令的，强制的","f":"adj. 命令的，强制的","s":["1675"]},{"w":"oath","d":"n. 誓言；宣誓","f":"n. 誓言；宣誓","s":["1675"]},{"w":"obligatory","d":"adj. 强制性的；必须履行的","f":"adj. 强制性的；必须履行的","s":["1675"]},{"w":"oblige","d":"v. 迫使；使负有义务；帮忙；满足请求","f":"v. 迫使；使负有义务；帮忙；满足请求","s":["1675"]},{"w":"penal","d":"adj. 刑罚的；刑事的；监狱的","f":"adj. 刑罚的；刑事的；监狱的","s":["1675"]},{"w":"plaintiff","d":"n. 原告","f":"n. 原告","s":["1675"]},{"w":"proscribe","d":"v. 禁止；宣布（某人）不受法律保护","f":"v. 禁止；宣布（某人）不受法律保护","s":["1675"]},{"w":"prosecute","d":"v. 起诉；检控；进行（诉讼或活动）","f":"v. 起诉；检控；进行（诉讼或活动）","s":["1675","1925"]},{"w 的","f":"adj. 正派的；体面的","s":["1791"]},{"w":"deft","d":"adj. 灵巧的；熟练的","f":"adj. 灵巧的；熟练的","s":["1675","1791"]},{"w":"delicate","d":"adj. 精巧的；脆弱的","f":"adj. 精巧的；脆弱的","s":["1791"]},{"w":"diligent","d":"adj. 勤勉的；勤奋的","f":"adj. 勤勉的；勤奋的","s":["1791"]},{"w":"diplomatic","d":"adj. 外交的；策略的","f":"adj. 外交的；策略的","s":["1675","1791"]},{"w":"discreet","d":"adj. 谨慎的","f":"adj. 谨慎的。形容人 “说话做事非常小心，不会乱传话，不会让场面尴尬，懂得保护他人隐私”。\nbe discreet about something — 对某事谨慎（不提或不张扬）\na discreet inquiry / question — 谨慎的询问（避免引人注意）\ndiscreet distance / manner — 不显眼的距离／审慎的举止","s":["1675","1791"]},{"w":"discretion","d":"n. 审慎","f":"n. 审慎\nwith discretion 谨慎地(处理)\nat/in someone's discretion — 由某人自行决定／酌情处理\nuse / exercise discretion — 行使酌情权／审慎行事\ndiscretion in doing something — 做某事时的慎重 He showed great discretion in not revealing the client's name.（他没有透露客户姓名，表现出了极大的审慎。）","s":["1675","1791"]},{"w":"effective","d":"adj. 有效的；有影响的","f":"adj. 有效的；有影响的","s":["1791"]},{"w":"efficient","d":"adj. 有效率的","f":"adj. 有效率的","s":["1675","1791"]},{"w":"elegant","d":"adj. 雅致的","f":"adj. 雅致的","s":["1791"]},{"w":"eloquent","d":"adj. 雄辩的；有口才的","f":"adj. 雄辩的；有口才的","s":["1791"]},{"w":"eminent","d":"adj. 杰出的","f":"adj. 杰出的。指在某领域中地位极高、名声显赫，且远超常人。\nan eminent [身份] / eminent [领域] scholar 形容人：卓越的 / 地位显赫的\neminent [quality] 形容品质：显著的 / 突出的","s":["1675","1791"]},{"w":"energetic","d":"adj. 积极的；精力旺盛的","f":"adj. 积极的；精力旺盛的","s":["1791"]},{"w":"excellent","d":"adj. 优秀的；杰出的","f":"adj. 优秀的；杰出的","s":["1791"]},{"w":"exemplary","d":"adj. 典范的","f":"adj. 典范的。9成是用于褒义。\n形容行为、品行、操守“堪称楷模”（绝对高频，职场/学校/道德评价） exemplary behavior / conduct / performance（模范行为/品行/表现）；exemplary leadership（典范式领导）\n形容惩戒、判决或罚款“儆戒性的”（法律/新闻专用场景，次高频但固定）exemplary punishment / damages / sentence（惩戒性处罚/惩罚性赔偿/儆戒性判决）\nexemplary quality / service / facilities（典范级质量/服务/设施）；an exemplary example of...（……的典范）","s":["1675","1791"]},{"w":"expeditious","d":"adj. 迅速的；敏捷的","f":"adj. 迅速的；敏捷的","s":["1675","1791"]},{"w":"experienced","d":"adj. 有经验的","f":"adj. 有经验的","s":["1791"]},{"w":"exquisite","d":"adj. 精致的（精准对应工艺、品味、美感上的极高品质与细腻度，最通用）","f":"adj. 精致的（精准对应“工艺、品味、美感上的极高品质与细腻度”，最通用）。\n美国学生写作文、写艺术评论、做正式演讲时用 exquisite；平时夸人和吐槽都不用。吃饭时exquisite一般用于高级餐厅。\n1. 形容物品、工艺或建筑“精美绝伦”（绝对高频，购物/旅游/评论场景）\n短语搭配：exquisite craftsmanship / workmanship（精湛的工艺）；exquisite jewelry / porcelain / furniture（精美的珠宝/瓷器/家具）\n例句：The watch is a masterpiece of exquisite craftsmanship.（这块表是精湛工艺的杰作。）\n例句：They stayed in an exquisite 18th-century palace.（他们住在一座精美的18世纪宫殿里。）\n2. 形容美食、气味或味道“极其精致/鲜美”（美食/品酒高频）\n短语搭配：exquisite flavor / taste / cuisine（精致的风味/美味/佳肴）；exquisite wine / chocolate（精品红酒/巧克力）\n例句：This restaurant is famous for its exquisite French cuisine.（这家餐厅以其精致的法式料理而闻名。）\n例句：The wine has an exquisite bouquet of berries and spices.（这款红酒散发着浆果和香料构成的精致香气。）\n3. 形容品位、审美或优雅“高雅考究”（时尚/艺术评论）\n短语搭配：exquisite taste / style / elegance（高雅的品位/风格/优雅）\n例句：She has exquisite taste in interior design.（她在室内设计方面有高雅的品位。）\n例句：Her gown was an exquisite blend of classic and modern style.（她的礼服是古典与现代风格的精致融合。）","s":["1675","1791"]},{"w":"facile","d":"adj. 轻易的、不费力的","f":"adj. 轻易的、不费力的这个词 95% 的情况下带有贬义，指“肤浅的、草率的、未经深思熟虑的”。\nfacile + 贬义名词\t肤浅的、草率的\tThat's a facile explanation.（那是个肤浅的解释。）","s":["1675","1791"]},{"w":"faithful","d":"adj. 忠实的；n. 信徒","f":"adj. 忠实的。n. 信徒 faithful 作名词时，几乎永远以复数形式 the faithful 出现，表示“一群忠实的信徒、追随者或拥护者”。它不能像 dog 那样指“一个忠实的人”（不能说 a faithful）。","s":["1791"]},{"w":"feasible","d":"adj. 切实可行的","f":"adj. 切实可行的\nbe feasible for + 人/机构\t对（某人/机构）来说可行\tThis plan is feasible for a small company.（这个计划对小公司来说可行。）\nbe feasible to + 人\t（在某人看来）是可行的\tThe solution seems perfectly feasible to me.（这个解决方案在我看来完全可行。）\nIt is feasible to do...\t做……是可行的（最最常用！）\tIt is feasible to finish the project within a month.（一个月内完成这个项目是可行的。）\nfeasible + 名词","s":["1791"]},{"w":"firm","d":"adj. 坚挺的；结实的","f":"adj. 坚挺的；结实的","s":["1791"]},{"w":"fit","d":"v. 适合的","f":"v. 适合的","s":["1791"]},{"w":"fitting","d":"adj. 合适的/恰当的；配件/试穿（名词）","f":"adj. 合适的/恰当的（90%情况是形容词）；配件/试穿（名词）。作形容词强调符合场合、礼节或伦理的标准（比 appropriate 更庄重）；作名词复现于 fitting room（试衣间） 和 fittings（装置/配件）。\nsth. be fitting for sth. \nIt is fitting that... \nsth. is a fitting tribute / response / end to sb./sth. 恰当的致敬/回应/结局\nfitting tribute（恰如其分的致敬）fitting punishment/response（应得的惩罚/回应）\tThe award is a fitting tribute to his work.（实至名归。）\nclothes fitting（试穿/量身）light/plumbing fittings（灯具/水管接头）fitting room（试衣间）\tThe fittings in the kitchen need replacing.（厨房配件需更换。）","s":["1791"]},{"w":"flexible","d":"adj. 灵活的、可变通的、能适应变化的","f":"adj. 灵活的、可变通的、能适应变化的。字面抽象都可用。\nflexible schedule（灵活的时间安排）——听力对话高频 flexible approach / strategy（灵活的方法/策略）——口语/写作常用\nUniversities are adopting more flexible admission policies to attract international students.（大学正采用更灵活的招生政策来吸引国际学生。）——阅读/写作\nMy part‑time job allows a flexible schedule, so I can adjust my study time easily.（我的兼职工作允许灵活排班，所以我能轻松调整学习时间。）——听力对话/口语","s":["1791"]},{"w":"fluent","d":"adj. 流利的；流畅的","f":"adj. 流利的；流畅的","s":["1791"]},{"w":"forthright","d":"adj. 说话直截了当、坦率无隐瞒，尤指在需要勇气的场合肯把话说出来","f":"adj. 说话直截了当、坦率无隐瞒，尤指在需要勇气的场合肯把话说出来。褒义词。\n只能修饰人、人的态度、人的言语。不能用来表示\"简单易懂的东西\"。\n1. be forthright about + 事情（最高频）\n She was forthright about her own failures.\n2. be forthright in + 名词/动名词\n He was forthright in his criticism of the policy.\n3. 定语直接修饰人或言语\n a forthright and fearless journalist / a forthright answer","s":["1675","1791"]},{"w":"frank","d":"adj. 坦白的；直率的","f":"adj. 坦白的；直率的","s":["1675","1791"]},{"w":"frugal","d":"adj. 节俭的、精打细算的，偏褒义","f":"adj. “节俭的、精打细算的”，偏褒义。","s":["1675","1791"]},{"w":"gallant","d":"adj. 英勇的","f":"adj. 英勇的\nbe gallant in + 动作/战斗：在……方面表现英勇。\nbe gallant to / towards + 人：对某人（通常指女性）极其殷勤/有礼。\n读音\t                                 重音位置\t                侧重点\t                                                     例句感受\n/ˈɡæl.ənt/（GAL-ant）\t重音在第一音节\t侧重 “英勇的、无畏的”（战斗精神）\t    “The gallant soldier saved his comrade.”（那位英勇的士兵救了他的战友。）\n/ɡəˈlænt/（guh-LANT）\t重音在第二音节\t侧重 “对女士殷勤的、风流的”（骑士礼仪）“He was very gallant to the ladies.”（他对女士们非常殷勤。——带有“献殷勤”的意味）","s":["1675","1791"]},{"w":"generous","d":"adj. 慷慨的；大方的","f":"adj. 慷慨的；大方的","s":["1791"]},{"w":"generously","d":"adv. 慷慨的","f":"adv. 慷慨的。有着“给得特别足、特别大方、不抠抠搜搜”的画面感。\n① 点菜/菜谱/食物（最高频！）\n这是美国人（尤其是吃货）最常看到或用到 generously 的地方。它专指 “分量大、用料足”。\n\n菜单描述：“A generously sized burger.”（一个分量十足的汉堡。——暗示你吃不完。）\n\n食谱步骤：“Generously season the steak with salt and pepper.”（大量地用盐和黑胡椒给牛排调味。——意思是别省盐，大胆撒！）\n\n做三明治：“Spread the mayonnaise generously.”（厚厚地抹一层蛋黄酱。）\n\n为什么美国人爱用它？ 因为美国饮食文化的核心就是“量大”。Generously 就是在告诉你：“这不是婴儿份的，这是美国份的！”\n\n② 评价“赞美/原谅”别人（人际厚道）\n当美国人在聊第三个人的品行时，generously 表示 “宽厚地、不刻薄地”。\n\n“She generously praised her rival’s performance.”\n（她宽厚地/大方地称赞了她对手的表现。——意思是她没有因为嫉妒而贬低对方，很有风度。）\n\n“He generously forgave my mistake.”\n（他宽宏大量地原谅了我的错误。）\n\n③ 慈善/捐赠（钱或时间）\n这才是字典里最标准的“慷慨解囊”。\n\n“They generously donated $1 million to the hospital.”\n（他们慷慨地向医院捐赠了100万美元。）\n“He generously volunteered his time to help.”\n（他慷慨地/大方地贡献了自己的时间来帮忙。）","s":["1791"]},{"w":"genial","d":"adj. 和蔼的(通常指长辈)","f":"adj. 和蔼的(通常指长辈)\n① 形容人的性格（通常是长辈、领导、老派绅士）\t指一个人宽厚、慈祥、好相处。年轻人如果被这样形容，会显得过于老成。\t“He is a genial old man who always has a kind word for everyone.”（他是个和蔼的老人，对每个人都说好话。）\n② 形容氛围/环境（聚会、谈话、天气）\t指气氛轻松愉快、不紧张。\t“We had a genial conversation over lunch.”（我们午餐时进行了一次愉快的交谈。——意味着没人拍桌子、没人冷场，宾主尽欢）\n③ 形容笑容/态度\t指宽厚的、不带任何攻击性的微笑。\t“She gave me a genial nod.”（她向我和蔼地点了点头。）","s":["1675","1791"]},{"w":"gentility","d":"n. 有教养，文雅","f":"n. 有教养，文雅\nGentility 的核心意思是 “文雅”、“高雅”，但它带有很强的 “社会阶层” 和 “出身” 色彩。\n为了帮你精准理解，我们分三个层面来看：\n1. 核心含义（品行与举止）\n指举止彬彬有礼、谈吐优雅、品味高尚，符合上层社会或受过良好教育之人的行为标准。\n例：She was noted for her grace and gentility.（她以优雅和文雅著称。）\n2. 历史与社会含义（阶级出身）\n指 “名门望族” 或 “绅士阶层” 的身份。它不仅仅指有钱，更强调“有教养的出身”（即“绅士派头”）。\n例：He came from a family of ancient gentility.（他出身于古老的名门世家。）\n3. 常见的贬义用法（重点！）\n在现代英语中，这个词经常带有 “打肿脸充胖子” 或 “附庸风雅” 的讽刺意味。指一个人家境或地位已经没落，却硬要维持表面上的体面和派头。\n例：Despite their poverty, they maintained a pretence of gentility.（尽管贫穷，他们仍硬撑着摆出一副体面人家的架子。）","s":["1675","1791"]},{"w":"genuine","d":"adj. 真实的","f":"adj. 真实的","s":["1791"]},{"w":"glorious","d":"adj. 光荣的，壮丽的","f":"adj. 光荣的，壮丽的\n形容成就/胜利/历史——“光辉的、荣耀的”（精神层面的崇高感）a glorious victory（辉煌的胜利）a glorious history/tradition（光辉的历史/传统）\n形容天气/景色——“阳光灿烂的、壮美的”（物理层面的极致赞美）a glorious sunset（壮丽的落日），glorious sunshine（灿烂的阳光）。\n口语里的夸张用法\"爽翻了\"What a glorious meal!（这顿饭太绝了！），I had a glorious weekend.（我过了个爽翻了的周末。）","s":["1675","1791"]},{"w":"gracious","d":"adj. 有教养的仁慈的","f":"adj. 有教养的仁慈的\na gracious host/hostess（好客周到的男女主人）——特指那种让你宾至如归、永远及时添茶倒水的完美主人。gracious in defeat/win（败不馁/胜不骄）——体育评论高频词。输球了还大方祝贺对手，就是 gracious in defeat；赢球了不嘚瑟，就是 gracious in victory。\n雅致的、有格调的。a gracious old mansion（一栋雅致的老宅邸）；a gracious lifestyle（优雅从容的生活方式）。","s":["1675","1791"]},{"w":"grand","d":"adj. 盛大的，壮丽的","f":"adj. 盛大的，壮丽的\n宏伟的、壮丽的 a grand palace / entrance（宏伟的宫殿/气派的入口）\n重大的、首要的、总的 a grand plan / strategy In the grand scheme of things, this mistake doesn't matter.（放在整个人生尺度看，这个错误不算什么。）\n一千元 I need to save five grand for the trip.","s":["1791"]},{"w":"hardheaded","d":"adj. 固执的、顽固的","f":"adj. 固执的、顽固的。在托福阅读中，这个词多出现在商业、谈判、决策类话题中，此时多为褒义的\"务实精明\"。\n义项①：固执的、顽固的（贬义）He's too hardheaded to admit he's wrong.（他太固执，不肯承认自己错了。）\n义项②：冷静务实的、精明的（褒义/中性）We need a hardheaded businessman to handle the negotiations.（我们需要一个冷静务实的商人来处理谈判。）","s":["1675","1791"]},{"w":"hardy","d":"adj. 耐，对人叫能吃苦耐劳，对植物叫耐寒抗冻","f":"adj. 核心含义是\"耐\"，对人叫\"能吃苦耐劳\"，对植物叫\"耐寒抗冻\"。\n（人/动物）强壮的、能吃苦耐劳的 —— 能在艰苦环境中生存\n例句：Hardy pioneers survived the harsh winter with little food.（吃苦耐劳的拓荒者靠很少的食物熬过了严冬。）\n（植物）耐寒的 —— 能耐受严寒天气\n例句：Roses are hardy plants that can survive frost.（玫瑰是耐寒植物，能抵御霜冻。）\n勇敢的、大胆的（较古旧用法）\n例句：A hardy band of explorers set out for the Arctic.（一支勇敢的探险队出发前往北极。）","s":["1675","1791"]},{"w":"hospitable","d":"adj. 对外友好","f":"adj. 对外友好\n场景一：夸奖某户人家或主人（社交场合最高频）\n场景二：形容一个地方或城市（对游客友好）\n场景三：职场或学术圈的“接纳”新成员","s":["1791"]},{"w":"humane","d":"adj. 人道的、仁慈的、富有同情心的","f":"adj. 人道的、仁慈的、富有同情心的\n动物福利与权益 We need to find a humane way to control the stray cat population.\n医疗、养老或刑事司法（对弱势群体的关怀）The nursing home provides humane care for the elderly.\n死亡方式（安乐死或死刑）The vet decided that euthanasia was the most humane option for the terminally ill dog.","s":["1675","1791"]},{"w":"illustrious","d":"adj. 杰出的、显赫的","f":"adj. 杰出的、显赫的\n· Illustrious career（辉煌的职业生涯）：最常用的组合，指一个人功成名就、封神退休。\n· Illustrious family / lineage（显赫的家族/血统）：强调出身高贵。\n· Illustrious achievements（杰出的成就）：往往指改变了一个领域的重大突破。","s":["1675","1791"]},{"w":"imaginative","d":"adj. 富于想象的","f":"adj. 富于想象的","s":["1791"]},{"w":"impeccable","d":"adj. 字面义不会犯罪的，泛用义任何方面都挑不出毛病","f":"adj. 字面义“不会犯罪的”，泛用义\"任何方面都挑不出毛病\"。常用来夸赞那些通过努力或高标准达到的“零失误”状态。\nImpeccable + taste / manners / credentials（品味/礼仪/资历无可挑剔）\nImpeccable + timing（时机恰到好处 —— 指某人在绝佳时刻出现或行动）\nImpeccable + credentials / background（背景干净、履历漂亮 —— 招聘/政审常用）","s":["1791"]},{"w":"industrious","d":"adj. 勤勉的","f":"adj. 勤勉的。一般都形容人有主观的勤奋意愿。\nIndustrious + worker / employee（勤劳的员工）\nIndustrious + student / scholar（勤奋的学生/学者）\nIndustrious + bee / ant（忙碌的蜜蜂/蚂蚁）—— 经典固定修辞","s":["1791"]},{"w":"ingenious","d":"adj. 足智多谋的（人），或者精妙的（设计）","f":"adj. 足智多谋的（人），或者精妙的（设计）\n① 形容人（人格特质）\t“足智多谋的”、“心灵手巧的”——指这个人特别会找窍门、会做手工、会修东西。\tShe is an ingenious engineer who can fix anything.（她是个足智多谋的工程师，什么都能修。）\nThe thief was ingenious, but the police were smarter.（小偷很狡猾巧妙，但警察更聪明。——这里略带贬义，指“狡猾地聪明”）\n② 形容物/设计/方案（作品特质）\t“构思巧妙的”、“精妙的”——指机器设计、商业方案、广告创意极其巧妙。\tHe came up with an ingenious solution to the energy crisis.（他想出了一个解决能源危机的绝妙方案。）\nThe plot of that movie is ingenious.（那部电影的情节构思太精妙了。）\nAn ingenious + method / way / solution / plan（巧妙的方法/方案/计划）\nAn ingenious + device / gadget / design（精妙的装置/小工具/设计）\nIt is ingenious of someone to do...（某人做某事太有才了！）\nIt was ingenious of her to use a paperclip as a lock pick.（她居然用回形针当开锁工具，太有才了。）","s":["1791"]},{"w":"innocent","d":"adj. 清白的；幼稚的","f":"adj. 清白的；幼稚的","s":["1791"]},{"w":"integrity","d":"n. 正值，完整性","f":"n. 正值，完整性\n① 品德层面的“正直、诚实”（指人坚守道德原则，言行一致）\n例句：He is a man of integrity.（他是个正直的人。）\n② 物理或结构层面的“完整、完好”（指物体没有缺损，或系统没有分裂）\n例句：The earthquake threatened the structural integrity of the building.（地震威胁到了大楼的结构完整性。）","s":["1675","1791"]},{"w":"intelligent","d":"adj. 聪明的","f":"adj. 聪明的","s":["1675","1791"]},{"w":"intrepid","d":"adj. 勇敢的","f":"adj. 勇敢的","s":["1675","1791"]},{"w":"invaluable","d":"adj al remark / comment — 冷嘲热讽的言论","s":["1791"]},{"w":"deceitful","d":"adj. 欺骗性的","f":"adj. 欺骗性的","s":["1675","1791"]},{"w":"deceptive","d":"adj. 欺骗性的；误导性的；造成假象的","f":"adj. 欺骗性的；误导性的；造成假象的","s":["1675","1791"]},{"w":"defiant","d":"adj. 反抗的","f":"adj. 反抗的(描述的不是普通的\"不听话\"，而是带着挑衅的、公开的反抗。)\nbe defiant of, be defiant in the face of. 反抗\ndefiant attitude / stance — 反抗的态度／对抗的姿态\nin a defiant tone / voice — 以挑衅的语气\ndefiant of authority / the rules — 反抗权威／无视规则","s":["1791"]},{"w":"designing","d":"adj. 工于心计的","f":"adj. 工于心计的\na designing woman / person — 工于心计的女人／人（含贬义）\na designing look / smile — 别有用心的一瞥／笑容\ndesigning mind / nature — 算计的头脑／天性","s":["1675","1791"]},{"w":"despicable","d":"adj. 可鄙的","f":"adj. 可鄙的\ndespicable behavior / act / crime — 可鄙的行为／行径／罪行\ndespicable coward / liar — 可鄙的懦夫／骗子\na despicable way to treat someone — 对待某人很卑劣的方式","s":["1675","1791"]},{"w":"despise","d":"v. 鄙视","f":"v. 鄙视。发自内心的极度鄙视——觉得对方“不配被当作一个平等的人来对待”。\ndespise someone / something — 鄙视某人／某物\ndespise someone for something — 因某事鄙视某人\nI despise people who bully others.\nDespise = De（向下） + Spise（= spect，看）","s":["1675","1791"]},{"w":"devious","d":"adj. 狡猾的","f":"adj. 狡猾的\nDevious 形容人时，指 “为了达到目的，不惜用欺骗、隐瞒或耍手段的方式，绝不走光明正大的路”。它也可以形容 “绕来绕去的路”（物理上的曲折）。\ndevious scheme / plan — 狡猾的计谋／诡计\ndevious means / methods — 不光彩的手段／不正当的方法\ndevious politician / character — 狡猾的政客／诡计多端的人\ndevious way of doing something — 不直截了当的做法（含耍花招之意）","s":["1675","1791"]},{"w":"dictatorial","d":"adj. 独裁的；专横的","f":"adj. 独裁的；专横的","s":["1675","1791"]},{"w":"dingy","d":"adj. 昏暗脏旧","f":"adj. 昏暗脏旧\ndingy room / apartment（昏暗破旧的房间/公寓）常见于租房广告的“雷区词”\ndingy curtains / carpet（脏兮兮发灰的窗帘/地毯）强调“原本不是这颜色，是积灰+褪色”的结果\ndingy alley / street（阴暗肮脏的小巷）","s":["1675","1791"]},{"w":"discrimination","d":"n. 歧视","f":"n. 歧视","s":["1675","1791"]},{"w":"disrespectful","d":"adj. 无礼的，轻视的","f":"adj. 无礼的，轻视的\nbe disrespectful to someone — 对某人不尊重\ndisrespectful behavior / attitude — 不尊重的行为／态度\ndisrespectful remark / comment — 不尊重的言论","s":["1675","1791"]},{"w":"dogmatic","d":"adj. 教条的，武断的","f":"adj. 教条的，武断的\nbe dogmatic attitude\t教条主义的态度 / 固执的态度\nbe dogmatic belief/views\t固执的信念 / 武断的观点\nbe dogmatic about + (sth.)\t对……固执己见","s":["1791"]},{"w":"domineering","d":"adj. 专横的、跋扈的或盛气凌人的","f":"adj. 专横的、跋扈的或盛气凌人的。、\na domineering parent / boss\t专横的家长 / 老板\tGrowing up with a domineering parent can be difficult. (在专横的家长身边长大会很辛苦。)\na domineering personality\t控制欲强的性格 / 霸道的个性\tShe has a domineering personality that puts people off. (她控制欲极强的个性让人敬而远之。)\ndomineering attitude\t盛气凌人的态度\tI don't like his domineering attitude towards his colleagues. (我不喜欢他对同事那种盛气凌人的态度。)","s":["1675","1791"]},{"w":"exacting","d":"adj. 严苛的","f":"adj. 严苛的\n形容标准、规范、质量要求“极为苛刻”exacting standards / requirements / specifications（严苛的标准/要求/规格）；exacting quality control（严苛的质量控制）\n形容任务、工作或训练“极其费神费力an exacting job / task / schedule（费力的工作/任务/行程）；physically / mentally exacting（体力上/脑力上严苛的）","s":["1675","1791"]},{"w":"extravagant","d":"adj. 奢侈的；过度的","f":"adj. 奢侈的；过度的","s":["1675","1791"]},{"w":"facetious","d":"adj. 爱开玩笑的、轻浮的、不严肃的","f":"adj. “爱开玩笑的、轻浮的、不严肃的”，但它百分之百带有贬义或警告色彩——特指在不合时宜的场合开玩笑，或把严肃的事情当儿戏。\nbe facetious about + 名词\t拿……开玩笑（不该开玩笑的事）\tPlease don't be facetious about such a serious matter.（请不要拿这么严肃的事开玩笑。）\nbe facetious with sb.\nfacetious remark（轻浮的评论）facetious person（爱耍嘴皮子的人）","s":["1675","1791"]},{"w":"fatuous","d":"adj. 愚蠢而不自知的","f":"adj. 愚蠢而不自知的\nfatuous 言语/观点/态度/情绪/行为","s":["1675","1791"]},{"w":"filthy","d":"adj. 肮脏/恶心；淫秽；极度的","f":"adj. 肮脏/恶心；淫秽；极度的。字面义外，固定习语 filthy rich（暴富）和 filthy temper（暴脾气）极高频——强调“过分到令人不适”。\n① 形容物理上的“巨脏”（最字面、最常用）\n② 形容“极其恶劣、下流”的言行（骂人专用）\n③ 形容“极度过瘾”或“极其有钱”（俚语，带褒义或夸张）“This burger is filthy good!”（这个汉堡好吃到爆！）“The bass in that song is filthy.”（那首歌的低音炸裂。——形容重低音特别猛、特别带感。）","s":["1675","1791"]},{"w":"flamboyant","d":"adj. 艳丽夺目的，炫耀的，充满装饰的","f":"adj. 艳丽夺目的，炫耀的，充满装饰的：strikingly elaborate","s":["1675"]},{"w":"flighty","d":"adj. 轻浮的、善变的、反复无常的（指人注意力不集中，想法或喜好经常改变","f":"adj. 轻浮的、善变的、反复无常的（指人注意力不集中，想法或喜好经常改变，缺乏责任心或深度）。\na flighty person（一个善变的人）flighty and unreliable（轻浮且不可靠——听力中常成对出现）","s":["1675","1791"]},{"w":"fraudulent","d":"adj. 欺诈性的或不诚实的","f":"adj. “欺诈性的”或“不诚实的”\n形容行为/活动：欺诈性的、舞弊的 fraudulent transaction（欺诈性交易）、fraudulent claim（欺诈性索赔/骗保）。\n形容文件/签名：伪造的、冒用的 fraudulent signature（伪造签名）、fraudulent documents（伪造文件）\n形容意图/计划：存心欺骗的 She made a fraudulent promise with no intention of keeping it.（她做了一个存心骗人的承诺，根本没打算兑现。）","s":["1675","1791"]},{"w":"fussy","d":"adj. 过分挑剔的、难以取悦的，或者形容东西过分讲究/花哨的","f":"adj. “过分挑剔的”、“难以取悦的”，或者形容东西“过分讲究/花哨的”。\n1. 形容人：挑剔的、过分讲究的（带轻微贬义）\n指对细节要求极其严格，甚至到了让人烦的程度。常接介词 about。\n例句：He's so fussy about his food that he won't eat anything cold.（他对食物挑剔到冷的一口都不吃。）“Don't be such a fussy eater!”（别这么挑食！）\n常见搭配：fussy eater（挑食的人）、fussy about clothes（对衣着讲究过头）。\n2. 形容设计/装饰：过分花哨的、繁琐的、杂乱的\n指东西装饰太多、细节太杂，反而显得不简洁、不大气。与你之前学的 functional（简洁实用）正好相反！\n例句：I prefer a simple design, not this fussy pattern.（我更喜欢简洁的设计，而不是这种花里胡哨的图案。）\n常见搭配：fussy details（繁琐的细节）、fussy style（过分装饰的风格）。\n3. 形容婴儿/小孩（美式口语）：烦躁不安的、爱哭闹的\n指婴儿没有明显生病迹象，但就是不舒服、哼哼唧唧或哭闹。\n例句：The baby is fussy today because she's teething.（宝宝今天很闹腾，因为她在长牙。）","s":["1675","1791"]},{"w":"gauche","d":"adj. 笨拙的、不圆滑的、缺乏社交风度的（尤其指因为不懂上流社会或正式场合的规矩","f":"adj. 笨拙的、不圆滑的、缺乏社交风度的（尤其指因为不懂上流社会或正式场合的规矩，而显得粗俗或令人不适）","s":["1675","1791"]},{"w":"greedy","d":"adj. 贪婪的","f":"adj. 贪婪的","s":["1791"]},{"w":"grim","d":"adj. 「严峻的」「阴沉的」「冷酷的」","f":"adj. 「严峻的」「阴沉的」「冷酷的」\n（形势、前景）严峻的、不容乐观的 The situation is grim for the refugees.\n（表情、神情）阴沉的、冷酷的、严肃的 His face was grim as he delivered the news.\n（现实、真相）残酷的、令人不快的 the grim reality of war（战争的残酷现实）","s":["1675","1791"]},{"w":"grouchy","d":"adj. 易怒的，脾气不好的","f":"adj. 易怒的，脾气不好的","s":["1675"]},{"w":"grumpy","d":"adj. 心情不好、容易发火、爱嘟囔的","f":"adj. 心情不好、容易发火、爱嘟囔的\nwake up grumpy\t起床气\na grumpy old man\t臭脾气老头（经典形象）\nin a grumpy mood\t心情烦躁","s":["1675","1791"]},{"w":"haughty","d":"adj. 自以为高人一等、摆出俯视姿态的傲慢的","f":"adj. 自以为高人一等、摆出俯视姿态的傲慢的。认识的人多、日常口语中说得少。\nhaughty attitude / manner / demeanor\t高傲的态度\nhaughty tone / voice\t傲慢的语调\nhaughty look / expression / gaze\t居高临下的眼神（小说高频）\nhaughty air\t傲慢的神气（with a haughty air）\nhaughty disdain","s":["1675","1791"]},{"w":"hoax","d":"v./n. 骗局、恶作剧或谎言","f":"v.n. 骗局、恶作剧或谎言。\nsth. is a hoax.\nhoax + 某人 + into doing something（骗某人去做某事）\nhoax + 某人 + out of + 某物（骗走某人的财物）","s":["1675","1791"]},{"w":"idiocy","d":"n. 愚蠢；白痴行为；智力障碍（旧用法）","f":"n. 愚蠢；白痴行为；智力障碍（旧用法）","s":["1675","1791"]},{"w":"idiotic","d":"adj. 愚蠢的","f":"adj. 愚蠢的\nAn idiotic mistake（一个愚蠢透顶的错误）\nAn idiotic idea / plan（一个荒唐的想法/计划）\nAbsolutely / completely idiotic（绝对的/完全的白痴行为）——强调加强语气。","s":["1675","1791"]},{"w":"ignominious","d":"adj. 可耻的，不名誉的","f":"adj. 可耻的，不名誉的。特指在公众面前丢脸。\nIgnominious defeat / failure（不光彩的惨败/失败）：最最最常用，体育和政治新闻的标配。\nIgnominious end / exit（不光彩的结局/退场）：形容晚节不保。\nAn ignominious retreat（可耻的撤退）：形容大败亏输、狼狈逃窜。","s":["1675","1791"]},{"w":"ignorant","d":"adj. 无知的；不了解的","f":"adj. 无知的；不了解的","s":["1791"]},{"w":"illegitimate","d":"adj. 非法的，与","f":"adj. 非法的，与illegal相比，强调缺乏正当性。","s":["1675","1791"]},{"w":"illicit","d":"adj. 暗地里偷偷干的、见不得光的违禁勾当","f":"adj. 形容暗地里偷偷干的、见不得光的违禁勾当。\nillicit drugs / substances\t违禁药品/毒品（最最常见）\nillicit affair / relationship\t奸情 / 不正当男女关系\nillicit trade / trafficking\t违禁品交易/贩卖","s":["1675","1791"]},{"w":"impertinent","d":"adj. 以前指无关的，现在指冒失的","f":"adj. 以前指\"无关的\"，现在指\"冒失的\"\nImpertinent + question / remark / comment（冒失的问题/无礼的评论）\nIt is impertinent of someone + to do...（某人做某事太冒失了）\nIt was impertinent of you to interrupt the chairman.（你打断主席讲话，太没分寸了。）","s":["1675","1791"]},{"w":"improvident","d":"adj. 无远见的、不为未来打算的、挥霍无度的","f":"adj. “无远见的”、“不为未来打算的”、“挥霍无度的”。它形容一个人或一种行为只图眼前痛快，完全不管明天怎么办。\nImprovident + spending / habits / lifestyle（挥霍的开销/习惯/生活方式）\nImprovident + decision / policy（短视的决定/政策）\nImprovident + parent / child（不为孩子未来打算的父母/不顾未来的孩子）","s":["1675","1791"]},{"w":"imprudent","d":"adj. 轻率的；不谨慎的","f":"adj. 轻率的；不谨慎的","s":["1675","1791"]},{"w":"impudent","d":"adj. 鲁莽的","f":"adj. 鲁莽的\nImpudent + child / student / subordinate（放肆的孩子/学生/下属）\nImpudent + remark / reply / behavior（放肆的言语/顶嘴/行为）\nHave the impudence to do...（居然有脸做……）—— 这个名词搭配极其实用，专用于表达“他怎么敢？！”","s":["1675","1791"]},{"w":"indecent","d":"adj. 下流的（触犯了社会公共道德底线）","f":"adj. 下流的（触犯了社会公共道德底线）\n· Indecent assault（猥亵侵犯）——刑事罪名\n· Indecent exposure（不雅暴露）——固定法律术语\n· Indecent proposal（无礼要求）——经典文化梗（电影《桃色交易》原名）","s":["1791"]},{"w":"indolent","d":"adj. 懒懒的","f":"adj. 懒懒的。带有一种“安于现状、不愿费劲”的悠哉感，甚至带点“懒洋洋的舒适”。\nIndolent + person / youth / lifestyle（慵懒的人/青年/生活方式）\nIndolent + afternoon / summer（慵懒的下午/夏天）—— 用于文学描写，褒义或中性\nIndolent + tumor / ulcer（惰性肿瘤/缓慢发展的溃疡）—— 医学术语\nIndolent + bureaucracy / administration（懒政的官僚机构）","s":["1675","1791"]},{"w":"inept","d":"adj. 笨拙无能的","f":"adj. 笨拙无能的。最接近的中文是 “无能的”、“笨拙的”、“不得体的”、“不称职的”。它描述的是：一个人极度缺乏技能或社交智商，导致做事搞砸、说话得罪人，而且常常让人觉得“这人怎么这么不靠谱”。\n主语 + be inept at + 名词/动名词\nHe is inept at dealing with people.（他不善于与人打交道。）\nShe is inept at math.（她数学极差。）","s":["1791"]},{"w":"inert","d":"adj. 惰性的、不活泼的","f":"adj. “惰性的”、“不活泼的”。它描述的是：缺乏内在动力或能力去移动、反应或变化，无论是物理上的（像一块石头）、化学上的（像惰性气体），还是精神上的（像大脑当机）。\nInert gas\t惰性气体（如氦、氖、氩）Chemically inert\t化学惰性的（不轻易发生反应）\nLie inert\t躺着不动/躺着毫无生气。描写伤员、昏迷者、极度疲惫的人。\nRemain inert\t保持呆滞/保持一动不动。\t描写受到惊吓或打击后的反应。\nbe Inert to + 外界刺激/诱惑。He was inert to all forms of temptation.","s":["1675","1791"]},{"w":"inferior","d":"adj./n. 较差的；低级的；下属；次等品","f":"adj./n. 较差的；低级的；下属；次等品","s":["1675","1791"]},{"w":"inflexible","d":"adj. 刚硬的、死板的、没得商量的","f":"adj. 刚硬的、死板的、没得商量的\nInflexible + rules / regulations / policies（死板的规则/制度/政策）\nInflexible + schedule / deadline / approach（固定的时间表/不可改的截止日期/僵化的方法）\nRemain / stay inflexible on + 某议题（在某议题上保持强硬/不让步）\nHe remains inflexible on the salary issue.（他在薪资问题上寸步不让。）","s":["1791"]},{"w":"insolent","d":"adj. 傲慢的，无理的","f":"adj. 傲慢的，无理的\nbe ~ to sb. 对...无礼","s":["1675","1791"]},{"w":"insular","d":"adj. 岛屿的；与岛屿有关的；孤立的；心胸狭隘的","f":"adj. 岛屿的；与岛屿有关的；孤立的；心胸狭隘的","s":["1675","1791"]},{"w":"irresponsible","d":"adj. 不负责任的，不可靠的","f":"adj. 不负责任的，不可靠的[ph]irresponsible behavior/attitude/remarks","s":["1925"]},{"w":"lavish","d":"adj. 丰富的；浪费的","f":"adj. 丰富的；浪费的","s":["1675","1791"]},{"w":"luxurious","d":"adj. 奢侈的；豪华的","f":"adj. 奢侈的；豪华的","s":["1675","1791"]},{"w":"malevolent","d ish","d":"v. 彻底摧毁(用于拆迁或者比赛等)","f":"v. 彻底摧毁(用于拆迁或者比赛等)","s":["1791"]},{"w":"demonstrate","d":"v. 演示；论证","f":"v. 演示；论证","s":["1675","1791"]},{"w":"demur","d":"v. 表示异议、反对；因顾虑而犹豫；n. 异议，反对","f":"v. 表示异议、反对；因顾虑而犹豫；n. 异议，反对\ndemur at / to sth — 对某事表示异议或有所顾虑\nwithout demur — 毫无异议地\nShe accepted the decision without demur. — 她毫无异议地接受了这个决定。","s":["1791"]},{"w":"denote","d":"v. 意味着、标志着","f":"v. 表示、意味着、标志着\nA red flag denotes danger.","s":["1791"]},{"w":"dense","d":"adj. 密集的","f":"adj. 密集的","s":["1791"]},{"w":"depart","d":"v. 离开，出发","f":"v. 离开，出发\ndepart from somewhere — 从某地离开／出发\ndepart for somewhere — 动身前往某地\ndepart from tradition / routine / plan — 背离传统／惯例／计划","s":["1791"]},{"w":"dependent","d":"adj. 依靠的；依赖的","f":"adj. 依靠的；依赖的","s":["1791"]},{"w":"dependent variable","d":"n. 因变量","f":"n. 因变量","s":["scenario"]},{"w":"depict","d":"v. 描写；叙述","f":"v. 描写；叙述","s":["1791"]},{"w":"deprecate","d":"v. 强烈不赞成","f":"v. 强烈不赞成\nstrongly / publicly deprecate something — 强烈反对／公开反对某事\ndeprecate the use of something — 不赞成使用某物 Many health experts deprecate the excessive use of antibiotics.","s":["1791"]},{"w":"depress","d":"v. 使沮丧","f":"v. 使沮丧","s":["1791"]},{"w":"deride","d":"v. 嘲笑，愚弄","f":"v. 嘲笑，愚弄\n当批评者居高临下，认为被批评对象低级、不值一提、连被认真对待的资格都没有时，必须用 deride。\n通常用于嘲笑抽象的东西，比如批评家嘲笑思想、方式方法等。\nderide someone / something as something — 嘲笑某人／某物为…\nbe derided for something — 因某事被嘲笑","s":["1791"]},{"w":"deserve","d":"v. 应得","f":"v. 应得","s":["1791"]},{"w":"design","d":"n. 设计；图案；v. 设计","f":"n. 设计；图案； v.设计","s":["1791"]},{"w":"desirable","d":"adj. 理想的","f":"adj. 理想的\nhighly desirable — 非常理想的／极可取的  A quiet location near the park is highly desirable for home buyers.\ndesirable outcome / result — 理想的结果／预期的效果 The policy failed to produce the desirable outcome.","s":["1791"]},{"w":"desire","d":"v. 想要；欲望","f":"v. 想要；欲望","s":["1791"]},{"w":"desirous","d":"adj. 最中性、书面、不带感情色彩的渴望，偏书面语","f":"adj. 最“中性、书面、不带感情色彩”的渴望，偏书面语。\nbe desirous of something — 渴望得到某物\nbe desirous to do something — 渴望做某事\ndesirous of change / improvement — 渴望改变／改进","s":["1791"]},{"w":"despatch","d":"n. 迅速处理","f":"n.迅速处理","s":["1791"]},{"w":"destine","d":"v. 注定","f":"v. 注定\nbe destined for something — 注定要得到／前往某处\nbe destined to do something — 注定要做某事\nbe destined for greatness / success / failure — 注定伟大／成功／失败\nbe destined by fate / destiny — 被命运注定","s":["1791"]},{"w":"destiny","d":"n. 命运","f":"n. 命运","s":["1791"]},{"w":"destructive","d":"adj. 破坏性的","f":"adj. 破坏性的","s":["1791"]},{"w":"detach","d":"v. 分离","f":"v. 分离\ndetach something from something — 将某物从某物上拆下／分离\ndetach yourself from something / someone — 使自己脱离／抽身于某事或某人\nbecome detached from reality — 脱离现实（形容词化用法）","s":["1791"]},{"w":"detached","d":"adj. 分离的；公正的","f":"adj. 分离的；公正的","s":["1791"]},{"w":"detect","d":"v. 探测；发掘","f":"v. 探测；发掘","s":["1791"]},{"w":"determination","d":"n. 决定；决心","f":"n. 决定；决心","s":["1791"]},{"w":"determine","d":"v. 决定","f":"v. 决定","s":["1791"]},{"w":"deterrent","d":"n. 威慑物或阻碍因素，指通过制造恐惧或不利后果，来阻止某人做某事","f":"n. “威慑物”或“阻碍因素”，指通过制造恐惧或不利后果，来阻止某人做某事\na deterrant to sb.","s":["1791"]},{"w":"detest","d":"v. 憎恶","f":"v. 憎恶","s":["1791"]},{"w":"detract","d":"v. 去掉，减损","f":"v. 去掉，减损\nDetract的核心意思是“贬低”、“减损”，指因某种因素，让原本好的事物在价值、美感或重要性上“打了折扣”。它几乎总是和介词 from 搭配使用（detract from）。\nThe poor lighting detracts from the building's beauty.（糟糕的照明减损了这栋建筑的美感。）——强调“本应更好，被拖后腿了”。\nThe poor lighting detracts from the building's beauty","s":["1791"]},{"w":"detriment","d":"n. 损害","f":"n. 损害\nDetriment的核心意思是“损害”、“伤害”，是一个正式名词，指对某事物的价值、利益或成功造成的负面削弱。它不强调“毁掉”，而是强调“拉后腿”或“带来坏处”。\nbe a detriment to. Smoking is a serious detriment to health.（吸烟对健康是严重损害。）His lack of experience was a detriment to his promotion.（经验不足是他晋升的不利因素。）\nto the detriment of...（最常用）：意为“对……造成损害/不利”。专门用来强调为了A而牺牲了B。\n  · 例句：He worked 80 hours a week, to the detriment of his health.（他每周工作80小时，损害了健康。）\nto one's detriment：意为“对某人自己不利”，通常指因自身行为而吃亏。\n  · 例句：She relied on outdated information, to her own detriment.（她依赖过时信息，最终害了自己。）\nwithout detriment to：意为“不损害……”，常用于法律或合同条款。\n  · 例句：The contract can be amended without detriment to your rights.（合同可修改，且不损害您的权利。）","s":["1791"]},{"w":"detrimental","d":"adj. 有害的(偏书面正式)","f":"adj. 有害的(偏书面正式)。表示 “对某人或某事造成负面伤害或不利影响”，通常指长期的、严重的或累积性的损害，而不是一时的小麻烦。\ndetrimental to something — 对某事有害／不利\ndetrimental effect / impact — 有害的影响／负面冲击\nhighly / potentially detrimental — 极为有害的／潜在有害的","s":["1791"]},{"w":"devastate","d":"v. 摧毁","f":"v. 摧毁。表示 “被彻底摧毁、精神上遭受毁灭性打击”。它既可以形容物理上的“夷为平地”，也可以形容情感上的“崩溃、心碎”。\nbe devastated by something — 被某事摧毁／因某事而崩溃\ndevastate a region / economy / environment — 摧毁某地区／经济／环境\ndevastate someone emotionally — 使某人极度震惊／崩溃\ndevastating effects / consequences（形容词衍生）— 毁灭性的影响／后果","s":["1791"]},{"w":"develop","d":"v. 发展；产生；成长","f":"v. 发展；产生；成长","s":["1791"]},{"w":"deviate","d":"v. 偏离","f":"v. 偏离\ndeviate from the plan / schedule — 偏离计划／日程 We cannot deviate from the original plan without approval.（未经批准我们不能偏离原定计划。）\ndeviate from the norm / standard — 偏离常规／标准 His behavior often deviates from the social norm.（他的行为经常偏离社会常规。）\ndeviate from a path / course — 偏离路径／航向 The plane deviated from its course due to bad weather.（因恶劣天气，飞机偏离了航线。）","s":["1675","1791"]},{"w":"device","d":"n. 机械；装置；设计","f":"n. 机械；装置；设计","s":["1791"]},{"w":"devise","d":"v. 计划；发明","f":"v. 计划；发明","s":["1675","1791"]},{"w":"devoid","d":"adj. 缺乏的(全然没有、空空如也)","f":"adj. 缺乏的(全然没有、空空如也)\ndevoid of something — 缺乏某物／毫无某物\ndevoid of emotion / feeling — 毫无情感\ndevoid of interest / meaning — 毫无兴趣／毫无意义","s":["1925","1791"]},{"w":"devoted","d":"adj. 热心的","f":"adj. 热心的","s":["1791"]},{"w":"devour","d":"v. 吞噬，风卷残云地吃","f":"v. 吞噬，风卷残云地吃\ndevour a meal / food — 狼吞虎咽地吃完\ndevour a book / novel — 如饥似渴地阅读\nbe devoured by fire / flames — 被大火吞噬","s":["1791"]},{"w":"dexterous","d":"adj. 灵巧的(偏书面的高级词汇)","f":"adj. 灵巧的(偏书面的高级词汇)\ndexterous hands / fingers — 灵巧的双手／手指\ndexterous at / in doing something — 擅长做某事（尤需技巧）","s":["1791"]},{"w":"digress","d":"v. 离题","f":"v. 离题\ndigress from the topic / subject — 偏离主题\nLet me digress for a moment to tell you an interesting story.\ndigress into something — 偏离到某话题上\nto digress briefly（常用作插入语）— 稍微离题一下","s":["1675","1791"]},{"w":"dilate","d":"v. 使某物变宽、变大、或张开（通常指圆形或管状结构的开口）","f":"v. 使某物变宽、变大、或张开（通常指圆形或管状结构的开口）\ndilate the pupils / blood vessels — 扩张瞳孔／血管\ndilate with something — 因某物而扩张／膨胀\ndilate on / upon something（正式书面语）— 详述／展开论述某话题","s":["1791"]},{"w":"dilemma","d":"n. 左右为难；困境","f":"n. 左右为难；困境","s":["1791"]},{"w":"dim","d":"adj. 昏暗的；朦胧的","f":"adj. 昏暗的；朦胧的","s":["1675","1791"]},{"w":"diminish","d":"v.（使）减少、减弱或变小；降低（重要性、价值或影响）；贬低","f":"v.（使）减少、减弱或变小；降低（重要性、价值或影响）；贬低\nThe population / supply gradually diminished. — 种群数量／供应量逐渐减少。\ndiminish the effect / risk / importance of sth — 削弱某事的效果／降低风险／降低某事的重要性\ndiminish someone's achievements — 贬低某人的成就\ndiminishing returns — 收益递减","s":["1791"]},{"w":"diminutive","d":"adj. 极小的、微小的；身材娇小的；n. 指小词、昵称形式；小型的人或物","f":"adj. 极小的、微小的；身材娇小的；n. 指小词、昵称形式；小型的人或物\na diminutive figure / plant / species — 娇小的身影／小型植物／微小物种\na diminutive form / suffix — 指小形式／指小后缀\nKitty is a diminutive of Katherine. — Kitty 是 Katherine 的昵称（指小形式）。\n注意：diminutive 强调尺寸很小，不等于“精巧”。","s":["1791"]},{"w":"direct","d":"v. 引导；直接的","f":"v. 引导；直接的","s":["1791"]},{"w":"disarm","d":"v. 消解","f":"v. 消解(9成指抽象事物，如怒火，戒备，少数情况指说服敌人放下武器)\nShe disarmed his anger with a genuine apology.（她用真诚的道歉消解了他的怒火。）\nHis self-deprecating humor disarmed the entire audience.（他自嘲的幽默化解了全场观众的戒备心。）","s":["1791"]},{"w":"disarming","d":"adj. 消除敌意的","f":"adj. 消除敌意的。有让人瞬间放下戒备的神奇魅力。","s":["1791"]},{"w":"disarray","d":"n. 杂乱，混乱","f":"n. 杂乱，混乱\n名词用disarray，动词用mess up，disrupt","s":["1791"]},{"w":"disaster","d":"n. 灾难","f":"n. 灾难","s":["1791"]},{"w":"disband","d":"v. 解散","f":"vt. v. 解散(九成情况下是vi.)\ndisband a group / committee / army — 解散组织／委员会／部队\ndisband the protest / crowd — 驱散抗议人群／人群\ndisband due to lack of funding / interest — 因缺乏资金／缺乏兴趣而解散","s":["1791"]},{"w":"discard","d":"v. 丢弃","f":"v. 丢弃","s":["1791"]},{"w":"disclaim","d":"v. 否认","f":"v. 否认。正式声明“我与这事无关 / 我不承担这个责任 / 我放弃这个权利”。\ndisclaim responsibility / liability — 否认责任／免责声明\ndisclaim any involvement / knowledge — 否认参与／否认知情\ndisclaim ownership / interest — 放弃所有权／否认利益关系","s":["1791"]},{"w":"discount","d":"n. 折扣","f":"n. 折扣","s":["1791"]},{"w":"discrete","d":"adj. 离散的；不相关的","f":"adj. 离散的；不相关的","s":["1675","1791"]},{"w":"disfigure","d":"v. 毁容","f":"v. 毁容\ndisfigure someone's face / appearance — 毁坏某人的面容／外貌\nHer hand was disfigured by the deep scars from the accident.（她的手因事故留下的深疤而毁损了外形。）\ndisfigure the landscape / environment — 破坏景观／环境美观（引申义）\ndisfigure a building / monument — 毁坏建筑／纪念碑的外观","s":["1791"]},{"w":"disgrace","d":"n. 耻辱、丢脸、不光彩；v. 使蒙羞","f":"n. 耻辱、丢脸、不光彩\n名词的使用频率远多于动词\nin disgrace. He resigned in disgrace after the scandal.（丑闻发生后，他颜面扫地地辞职了。）\na disgrace to sb. That old broken fence is a disgrace to the neighborhood.（那个破旧的围栏是社区的耻辱。）\nv. 使蒙羞\ndisgrace someone / yourself — 使某人／自己丢脸\nbe disgraced for something — 因某事而蒙羞／被贬斥\ndisgraced politician / former CEO（过去分词作定语）— 身败名裂的政客／前CEO","s":["1791"]},{"w":"disgust","d":"n. 厌恶","f":"n. 厌恶","s":["1791"]},{"w":"disinterested","d":"adj. 客观公正的（无利益冲突）","f":"adj. 客观公正的（无利益冲突）。\ndisinterested observer / party — 公正的观察者／第三方（即没有利益牵扯的中立方）\ndisinterested advice / judgment — 公正的建议／判断\ncompletely / perfectly disinterested — 完全公正的","s":["1791"]},{"w":"dismal","d":"adj. 惨淡的","f":"adj. 惨淡的。Dismal 可以形容天气、成绩、心情、表现、前景等几乎所有“让人高兴不起来”的事物。Dismal = Dis（否定/坏） + Mal（= Male，坏、恶）。\ndismal weather / day — 阴沉的天气／灰暗的日子\ndismal performance / record — 糟糕的表现／惨淡的记录\ndismal failure — 惨败","s":["1675","1791"]},{"w":"disparage","d":"v. 贬低(偏书面，中性客观，侧重不公正地降低价值，不带抹黑的恶意)","f":"v. 贬低(偏书面，中性客观，侧重“不公正地降低价值”，不带“抹黑”的恶意)\ndisparage someone's efforts / work / achievements — 贬低某人的努力／工作／成就\ndisparage someone as something — 把某人贬低为…\ndisparage the importance / value of something — 贬低某事物的重要性／价值","s":["1791"]},{"w":"dispatch","d":"v. 调配，迅速完成","f":"v. 调配，迅速完成\nn.\ndispatch of something — 某物的发送／派遣 \nawait / delay the dispatch — 等待发送／延迟发送\nwith dispatch","s":["1791"]},{"w":"dispensable","d":"adj. 可有可无的","f":"adj. 可有可无的\nDispensable = Dis（分开/出去） + Pens（= Pense，称重/衡量） + -able（能...的）→ “能拿出去称重卖掉换钱的” → “能处理掉的” → “非必需的、可有可无的”\ndispensable employee / staff — 可有可无的员工（随时可被替代或裁撤）\ndispensable details / information — 可有可无的细节／信息（非核心内容）\ndispensable item / object — 可有可无的物品（非必需品）","s":["1791"]},{"w":"displace","d":"v. 取代、替代；迫使……离开原处或家园；移动、使移位；（物理）排开（液体）","f":"v. 取代、替代；迫使……离开原处或家园；移动、使移位；（物理）排开（液体）\nNew technology may displace older methods or workers. — 新技术可能取代旧方法或工人。\nWar displaced thousands of residents. — 战争迫使数千名居民背井离乡。\nThe impact displaced the bone. — 撞击使骨头移位。\nAn object displaces its own volume of water. — 物体排开与自身体积相等的水。\n辨析：replace 强调“用一个人或物替换另一个”，语气中性；displace 强调原有者被挤走、失去位置或被迫迁离，常带竞争、压力或非自愿意味。\n结构：replace A with B = 用 B 替换 A；B displaces A / A is displaced by B = B 挤走或取代 A。","s":["1791"]},{"w":"dispose","d":"v. 处理","f":"v. 处理\n（处理掉 / 丢弃 / 解决）dispose of waste / garbage / rubbish — 处理垃圾，dispose of evidence / weapons — 销毁证据／处理掉武器，The killer tried to dispose of the murder weapon.（凶手试图处理掉凶器。），dispose of a problem / issue — 解决掉问题 We need to dispose of this matter before the meeting.（我们需要在会前解决掉这件事。）\n使倾向于。“不是你在做决定，而是某种内在力量（性格、经历、环境）在无形中把你推向某个方向”。偏高级用法。\nHis kind nature disposes him to help others.（他善良的天性使他倾向于帮助他人。）\nThe protagonist's tragic past disposes him to distrust authority figures. （“主角悲惨的过去使他倾向于不信任权威人物。”）\ndispose someone to / towards（使某人倾向于 / 使有意于），dispose someone to do something — 使某人倾向于做某事，be well / favourably disposed to someone / something — 对…有好感／持赞成态度，The board is favourably disposed to our proposal.（董事会对我们的提案持赞成态度。）","s":["1791"]},{"w":"disposition","d":"n. 性情；性格；倾向；安排或处置","f":"n. 性情；性格；倾向；安排或处置","s":["1675","1791"]},{"w":"disproportionate","d":"adj. 不成比例的","f":"adj. 不成比例的 [ph] A is ~ to B","s":["1925"]},{"w":"disprove","d":"v. 驳斥，通过提供证据或逻辑论证，证明某个说法、理论或指控是错误的","f":"v. 驳斥，“通过提供证据或逻辑论证，证明某个说法、理论或指控是错误的”。\ndisprove sth. with sth. / by doing sth.\ndisprove a theory / hypothesis — 推翻／证明某理论／假设错误\ndisprove a claim / allegation — 驳斥某说法／指控\ndisprove a statement / argument — 证明某陈述／论点有误","s":["1791"]},{"w":"disrepute","d":"n. 坏名声，不光彩","f":"n. 坏名声，不光彩 n.[ph] sth. put sth./sb. in disrepute[ph]brought his reputation into/in disrepute[ph]bring into disrepute","s":["1925"]},{"w":"disrespect","d":"n./v. 失礼，无礼","f":"n. v. 失礼，无礼 n./v.[ph]show ~ to/for sb.","s":["1925"]},{"w":"disrupt","d":"v. 扰乱","f":"v. 扰乱。是“打破原有的正常秩序或流程”，导致混乱或中断。\ndisrupt a meeting / class / event — 扰乱会议／课堂／活动\ndisrupt the market / industry — 颠覆市场／行业（商业语境，常用于技术创新）\ndisrupt communication / supply chains — 中断通讯／供应链\ndisrupt plans / schedules — 打乱计划／日程","s":["1791"]},{"w":"dissemble","d":"v. 掩饰","f":"vt. v. 掩饰。 “通过隐藏真实感受或假装某种状态，来掩盖自己的真实意图或想法”。\ndissemble one's true feelings / intentions — 掩饰真实感受／意图\ndissemble about something — 对某事加以掩饰（不愿透露实情）\ndissemble one's anger / fear / anxiety — 掩饰愤怒／恐惧／焦虑。\nHe dissembled when asked about his plans, pretending he hadn't decided yet.（当被问及他的计划时，他装糊涂，假装自己还没决定。）","s":["1791"]},{"w":"disseminate","d":"v. 传播","f":"v. 传播。像撒种子一样，让信息在人群中生根发芽、传播开来。涉及的是“抽象事物”（知识/思想），而非“实物”。强调“渗透”与“覆盖面”，而非“命令”。\nThe internet has made it easier to disseminate news worldwide.\nThe organization’s mission is to disseminate scientific knowledge to the public.\ndisseminate information / knowledge / ideas — 传播信息／知识／思想","s":["1791"]},{"w":"dissimilar","d":"adj. 不相似的，不同的","f":"adj. 不相似的，不同的\nbe dissimilar to/from sb. /sth. 与...不同\nbe dissimilar in something 在某方面不同","s":["1791"]},{"w":"dissipate","d":"v. 消散","f":"v. 消散。慢慢消散、逐渐消失、浪费掉。\n用法一：物理/视觉层面——（使）某物逐渐散开、消失（像雾气、云朵、热量等）。\nThe morning fog dissipated as the sun rose.（随着太阳升起，晨雾渐渐散去。）\n\n用法二：抽象/能量层面——（使）精力、时间、金钱被挥霍掉，或者情绪、争议等逐渐平息。\nHe dissipated his inheritance on parties.（他把遗产挥霍在了派对上。）\nThe crowd dissipated after the concert.（音乐会结束后，人群散去了。）","s":["1791"]},{"w":"distant","d":"adj. 远的","f":"adj. 远的","s":["1791"]},{"w":"distasteful","d":"adj. 不愉快的，讨厌的","f":"adj. （令人）不愉快的，讨厌的","s":["1925"]},{"w":"distort","d":"v. 歪曲（抽象义，如事实、言论）；扭曲（物理义，如形状、图像）","f":"v. 歪曲（抽象义，如事实、言论）；扭曲（物理义，如形状、图像）\ndistort the truth / facts / reality — 歪曲真相／事实／现实\ndistort an image / shape / sound — 使图像／形状／声音失真","s":["1791"]},{"w":"distract","d":"v. 分心","f":"v. 分心\ndistract someone from something — 使某人从某事上分心","s":["1791"]},{"w":"distressed","d":"adj. 痛苦的","f":"adj. 痛苦的。 “因严重问题、危险或困境而感到极度焦虑、痛苦，并且迫切需要帮助”。\nShe was distressed to learn that her flight had been cancelled.（得知航班取消，她焦虑万分。）\nThe family was distressed over the financial crisis.（这个家庭因金融危机而深陷困境。）","s":["1791"]},{"w":"distribute","d":"v. 分发；分送；分布","f":"v. 分发；分送；分布","s":["1791"]},{"w":"disunite","d":"v. 分裂","f":"v. 分裂\ndisunite a group / party / movement — 使团体／政党／运动分裂\nbe disunited by something — 因某事而分裂 The alliance was disunited by disagreements over strategy.（该联盟因战略上的分歧而分裂。）\ndisunite over an issue / policy — 在某议题／政策上产生分裂（指群体内部）The committee was disunited over the proposed budget cuts.（委员会在拟议的预算削减问题上意见分裂。）","s":["1791"]},{"w":"diverge","d":"v. 分歧","f":"v. 分歧\ndiverge from something — 与某物不同／偏离某物\ndiverge in opinion / views / interests — 在意见／观点／兴趣上存在分歧\ndiverge on something — 在某事上意见不一","s":["1791"]},{"w":"divergent","d":"adj. 分歧的，分叉的","f":"adj. 分歧的，分叉的\nbe divergent from. 与...有分歧 His opinion is divergent from the majority.\nbe divergent with 与...不一致(较少用) His actions are divergent with his stated beliefs.\ndivergent views / opinions — 有分歧的观点／意见\ndivergent interests / goals — 不同（甚至相冲突）的利益／目标\ndivergent from something — 与某物不同／相悖","s":["1791"]},{"w":"diverse","d":"adj. 多种多样的；不同的；多元的","f":"adj. 多种多样的；不同的；多元的\n常用于强调种类、背景或观点丰富：a diverse range of topics（多种多样的话题）、a culturally diverse community（文化多元的社区）、diverse perspectives（多元的观点）。","s":["1925","1791"]},{"w":"diversify","d":"v. 使多元化","f":"v. 使多元化\ndiversify your portfolio（分散投资组合）\ndiversify into new markets（拓展/多元化进入新市场）\ndiversify product lines（使产品线多样化）","s":["1791"]},{"w":"division","d":"n. 分开，分割","f":"n. 分开，分割","s":["1925"]},{"w":"domain","d":"n. 领土；领域","f":"n.领土；领域","s":["1675"]},{"w":"domestic","d":"adj. 家内的；国内的","f":"adj. 家内的；国内的","s":["1791"]},{"w":"dominant","d":"adj. 占优势的；主导的","f":"adj. 占优势的；主导的","s":["1791"]},{"w":"donate","d":"v. 捐赠","f":"v. 捐赠","s":["1791"]},{"w":"donor","d":"n. 捐赠者","f":"n. 捐赠者","s":["1791"]},{"w":"doom","d":"v. 命定的；注定失败的","f":"v. 命定的；注定失败的","s":["1791"]},{"w":"doubt","d":"v./n. 怀疑","f":"v. n. 怀疑","s":["1791"]},{"w":"doubtful","d":"adj. 怀疑的；不确定的；可疑的","f":"adj. 可形容人，也可形容事物\n1. 形容人：怀疑的，持怀疑态度的（对某事不相信或没有把握）\n   be doubtful about/of sth.：对某事持怀疑态度\n   She was doubtful about his explanation.（她对他的解释持怀疑态度。）\n2. 形容事物：不确定的，可疑的，不太可能的或不可靠的\n   The plan's success is doubtful.（这个计划能否成功还不确定。）\n   His claim is doubtful.（他的说法很可疑／不太可信。）","s":["1791"]},{"w":"drastic","d":"adj. 激烈的","f":"adj. 激烈的","s":["1675","1791"]},{"w":"drawback","d":"n. 弊端","f":"n. 弊端","s":["1791"]},{"w":"drift","d":"n./v. 漂移、漂流移动方向的变化飘移、移动","f":"n. v. 漂移、漂流（40%）移动方向的变化（30%）飘移、移动（30%） n./v.[ph]drift of ocean currents[ph]drift of the conversation[ph]leaves drifted down[ph]boat started to drift[syn]Drift 更常用于描述物体或人无意识地随着外部力量或环境而移动或改变方向。Float 强调轻轻漂浮或飘浮在液体或空气中的移动。Glide 强调平稳地、优雅地移动或滑行，通常用于描述鸟或滑翔器的运动。Shift 指的是移动或变化位置、方向或态度，强调有意识地改变或转移。","s":["1925"]},{"w":"dual","d":"adj. 二重的；两层的","f":"adj. 二重的；两层的","s":["1675","1791"]},{"w":"due","d":"adj. 到期的 或 应有的","f":"adj. 到期的 或 应有的。\n1. 指“时间到了”或“欠款该付”—— “到期的”、“预定的”\n强调截止日期临近，或某事按计划应发生。\n例：The rent is due tomorrow.（房租明天到期。）\n例：The baby is due in March.（宝宝预产期在三月份。）\n\n2. 指“恰当、符合规矩或应得的”—— “应有的”、“适当的”\n强调合理、得体或按法律/道义该给的。\n例：She handled it with due care.（她以应有的谨慎处理了此事。）\n例：Give due consideration to the proposal.（给予该提案适当的考虑。）","s":["1791"]},{"w":"dumb","d":"adj. 哑的；无言的","f":"adj. 哑的；无言的","s":["1791"]},{"w":"dungeon","d":"n. 地牢","f":"n. 地牢","s":["1791"]},{"w":"durable","d":"adj. 耐用的、持久的；n. 耐用品","f":"adj. 耐用的、持久的；n.（durables）耐用品","s":["1791"]},{"w":"duration","d":"n. 持续的时间","f":"n.持续的时间","s":["1675"]},{"w":"dusky","d":"adj. 光线或天色——昏暗的、朦胧的","f":"adj. 形容光线或天色——“昏暗的”、“朦胧的”\nIt was a dusky evening. (那是一个暮色沉沉的傍晚。)\n形容肤色——“微黑的”、“黝黑的”(在美国2026年不再用于形容人，因为有歧视性质)\nHer dusky skin glowed in the sun. (她微黑的皮肤在阳光下泛着光泽。)","s":["1675","1791"]},{"w":"dwindle","d":"v. 减少","f":"v. 减少\n1. 自带“归零倒计时”（逼近于无）\n2. 自带“消极的担忧情绪”（令人心慌）永远指坏事。\n3. 节奏必须是“缓慢而稳定”（不是暴跌）","s":["1791"]},{"w":"eccentric","d":"adj. 古怪的或怪僻的","f":"adj. 古怪的或怪僻的。偏褒义或幽默，指无害且有趣的另类，甚至暗示对方有才华或高智商（如爱因斯坦的发型）。当美国人用 eccentric 时，他们其实是在“礼貌地保护”对方。这个词在美国文化中是一个“带有贵族气质的过滤器”。用它，意味着说话者在暗示：“这个人虽然怪，但怪得无害、怪得有趣、甚至怪得很有深度——绝对不是那种让人想报警的怪。”\n指人的性格/行为——“古怪的”、“异于常人的”。强调行为或穿着与众不同，但这种“怪”通常不带恶意，甚至让人觉得有趣或有个性。例：My grandfather has some eccentric habits. (我祖父有一些古怪的习惯。)\n指事物/设计——“反常的”、“独特的”指设计或风格不走寻常路，偏离常规。例：The building has an eccentric shape. (这座建筑造型很奇特。)\n物理/机械术语——“离心的”。指偏离中心的轴或运动。例：eccentric wheel (偏心轮)。","s":["1791"]},{"w":"edge","d":"n. 边缘、边界；刀口；优势；v. 缓慢移动；给…加边","f":"n. 边缘、边界；刀口；优势；v. 缓慢移动；给…加边","s":["1791"]},{"w":"effect","d":"n. 效果；印象","f":"n. 效果；印象","s":["1791"]},{"w":"effectuate","d":"v. 实现或施行","f":"v. 实现或施行。语气很正式，法律/官僚书面语。\neffectuate a plan / change：实现一项计划 / 促成变革。\neffectuate payment：完成支付（银行/法律术语）。","s":["1791"]},{"w":"effuse","d":"v. 流露（比喻义）；涌出（字面义）","f":"vt. v. 流露（比喻义）；涌出（字面义）。\neffuse about/over sth/sb\t对...赞不绝口 / 大加赞扬。用于形容热烈谈论或赞美某人/某事。\tShe effused about her wonderful trip to Italy.\n(她滔滔不绝地谈论她那美妙的意大利之旅。)\neffuse gratitude for\t表达感激之情。\tShe effused gratitude for the help she received.\n(她对所得到的帮助表达了由衷的感激。)\neffuse praise on\t大加赞扬 / 溢美之词。\tHe effused praise on his team.\n(他对他的团队不吝赞美之词。)\neffuse warmth\t洋溢着热情。\tThe hall effuses warmth and hospitality.\n(大厅里洋溢着热情友好的气氛。)\neffuse (from)\t(从...)流出 / 散发。用于描述具体事物的流出。\tBlood effused from the wound.\n(血从伤口流出来。)","s":["1791"]},{"w":"element","d":"n. 元素","f":"n. 元素","s":["1675","1791"]},{"w":"elementary","d":"adj. 基本的；初级的","f":"adj. 基本的；初级的","s":["1791"]},{"w":"elevate","d":"v. 提高","f":"v. 提高。90%的情况用于抽象意义，指“使地位更高、质量更好、情绪更振奋”。\n职业与社会地位（晋升、抬举）这是非常高频的使用场景，强调职位或社会阶层的向上流动。\n搭配：elevate sb to + 职位 例：He was elevated to the position of managing director.（他被提升为董事总经理。）—— 注意 elevate 比 promote 更正式，常指跃升至显赫高位。\n例：The new policy aims to elevate the status of part-time workers.（新政策旨在提升兼职员工的地位。）\n2. 质量、水平与标准（拉高、改善）用于形容将事物、服务、审美等从“还不错”推向“卓越”。搭配：elevate ... to a new / higher level 或 elevate standards / quality\n例：We need to elevate customer service to a higher standard.（我们需要将客户服务提升到更高水准。）","s":["1791"]},{"w":"elite","d":"n. 精华；中坚","f":"n. 精华；中坚","s":["1791"]},{"w":"elucidate","d":"v. 阐明","f":"v. 阐明。可结合 lucid（清澈的、明晰的）记忆其含义。\nelucidate the mechanism / nature / role of sth（阐明...的机制/性质/作用）","s":["1791"]},{"w":"elude","d":"v. 躲避、逃脱（追捕）；使…想不起、令人费解","f":"v. 躲避、逃脱（追捕）；使…想不起、令人费解","s":["1791"]},{"w":"elusive","d":"adj. 难以捉摸","f":"adj. 难以捉摸\n记忆与思维层面（话到嘴边、想不起来）第一种“话到嘴边想不起来”霸占了日常口语的80%使用频率。elusive name / word / memory（想不起的名字/词/记忆）、remain elusive（依然想不起来）\n追捕与目标层面（总是扑空）elusive criminal / predator（难以追捕的罪犯/捕食者）、elusive goal / dream（难以实现的目标/梦想）\n抽象概念——“难以定义、难以描述” Beauty is an elusive concept.（美是一个难以定义的概念。） She has an elusive charm that I can't quite describe.（她有一种难以言喻的魅力。）","s":["1791"]},{"w":"emaciate","d":"v. 使消瘦","f":"v. 使消瘦。emaciate 作为动词原形在当代英语中极少单独使用。你几乎只会见到它的过去分词形式 emaciated（作形容词），译为 “消瘦的”、“憔悴的” 或 “骨瘦如柴的”。","s":["1791"]},{"w":"emaciated","d":"adj. 瘦弱的，憔悴的","f":"adj.瘦弱的，憔悴的。emaciated的情况最严重，比skinny更严重。\nseverely emaciated（严重消瘦）、extremely emaciated（极度消瘦）、visibly emaciated（明显可见的消瘦）\nemaciated by hunger / starvation / illness / disease\nemaciated body / figure（消瘦的身躯/身形）、emaciated face / cheeks（消瘦的脸庞/面颊）、emaciated limbs / legs（瘦骨嶙峋的四肢/双腿）","s":["1791"]},{"w":"embellish","d":"v. 装饰，修饰","f":"v. 装饰，修饰\nembellish [名词] with [装饰物] 装饰\nembellish a story / the truth / an account 褒义/中性：润色、修饰（使表达更优美）贬义/负面：添油加醋、添枝加叶、渲染（暗示夸大或不实）\n褒义还是贬义，看“宾语”是“物”还是“事”（90%的判断依据）。中性（纯物理装饰）：宾语是具体物体或艺术品。贬义（添油加醋）：宾语是抽象信息或事实。","s":["1791"]},{"w":"embody","d":"v. 体现","f":"v. 体现\n作为“典型代表” embody [品质] / [人/物] embodies [特质] She embodies elegance. (她体现了优雅。即：她是优雅的化身。)\n作为“包含/集成” embody [一系列内容] The plan embodies many new ideas. (该计划包含了许多新想法。)","s":["1675","1791"]},{"w":"emerge","d":"v. 出现","f":"v. 出现","s":["1791"]},{"w":"emphatic","d":"adj. 断然坚决的","f":"adj. 断然坚决的\n指对某件事表达极其鲜明的赞同或反对。emphatic victory / rejection / endorsement（压倒性的胜利/斩钉截铁的拒绝/旗帜鲜明的支持）\n下命令或定规矩（家庭/职场/课堂）emphatic demand / instruction（坚决的要求/明确的指示）My boss was emphatic that we finish the report by Friday.（老板坚决要求我们周五前完成报告。）—— 意思就是“别跟我讨价还价”。The teacher gave an emphatic reminder about the deadline.（老师着重提醒了截止日期。）\n言语/态度上：断然的、坚决的 be emphatic about [sth] / an emphatic denial / reply\n显著的、压倒性的 an emphatic victory / win / success","s":["1791"]},{"w":"empty","d":"adj. 空的","f":"adj. 空的","s":["1791"]},{"w":"emulate","d":"v. 仿效","f":"v. 仿效。指以某人或某物为榜样，努力模仿并力求达到或超越其水平。充满敬意、有目标性、想超越。它默认是褒义词。\n以榜样为目标：仿效 / 效法 emulate [someone] / emulate [someone's] success / example\n技术/计算机领域：仿真 / 模拟 emulate [a system / device]","s":["1791"]},{"w":"enable","d":"v. 使能够","f":"v. 使能够","s":["1791"]},{"w":"encompass","d":"v. 包围；环绕","f":"v. 包围；环绕","s":["1791"]},{"w":"encourage","d":"v. 鼓励","f":"v. 鼓励","s":["1791"]},{"w":"encumber","d":"v. 阻碍，妨碍","f":"v. 阻碍，妨碍\nbe encumbered by/with","s":["1791"]},{"w":"endanger","d":"v. 危害","f":"v. 危害","s":["1791"]},{"w":"endeavour","d":"v./n. 努力；尽力","f":"v./n. 努力；尽力","s":["1791"]},{"w":"energize","d":"v. 供给能量；使活跃","f":"v. 供给能量；使活跃","s":["1791"]},{"w":"enervate","d":"v. 削弱、耗尽、使萎靡","f":"v. 削弱、耗尽、使萎靡","s":["1791"]},{"w":"engender","d":"v. 产生","f":"v. 产生\nEngender 专门用来“产生”抽象的感觉、氛围或社会状态，而且是“自然而然慢慢酝酿出来的”。","s":["1791"]},{"w":"engross","d":"v. 使全神贯注、吸引住","f":"v. 使全神贯注、吸引住\nbe engrossed in + 名词/动名词（doing）90%的用法 全神贯注","s":["1791"]},{"w":"engrossed","d":"adj. 全神贯注的","f":"adj. 全神贯注的","s":["1791"]},{"w":"engulf","d":"v. 吞没","f":"v. 吞没。几乎永远用于负面、压倒性且不可抗拒的事物，主语多为 Flames/Smoke/Water/Fear/War/Darkness。\n自然灾害（火/水/沙）：指迅速覆盖并摧毁。\nFlames engulfed the building.（火焰吞没了大楼。）\nThe flood engulfed entire villages.（洪水吞没了整个村庄。）\n负面情绪（恐惧/悲伤/焦虑）：指情绪完全占据内心。\nShe was engulfed by panic.（她被恐慌吞没。）\nA feeling of emptiness engulfed him.（空虚感吞没了他。）","s":["1791"]},{"w":"enhance","d":"v. 增加","f":"v. 增加","s":["1791"]},{"w":"enigma","d":"n. 谜","f":"n. 谜\n形容某人（性格、动机、背景）极难被理解（频率最高）remain an enigma to sb（对某人来说仍是个谜）\n形容科学、历史或自然界的未解之谜 unravel / solve the enigma of sth（解开……的谜团）","s":["1791"]},{"w":"enigmatic","d":"adj. 高深莫测的","f":"adj. 高深莫测的。美国学生只在“评价艺术品、文学作品或塑造神秘人物”时用 enigmatic。\nenigmatic figure，enigmatic stranger，enigmatic smile，enigmatic remark","s":["1791"]},{"w":"enlighten","d":"v. 启发","f":"v. 启发\nenlighten sb on / about sth（就某事启发/告知某人）\nan enlightening experience / discussion（有启发的经历/讨论）；enlighten one's mind（启迪心智）\nenlighten the public / masses about sth（就某事启发公众/大众）","s":["1791"]},{"w":"enormous","d":"adj. 巨大的","f":"adj. 巨大的","s":["1791"]},{"w":"enrich","d":"v. 丰富","f":"v. 丰富","s":["1791"]},{"w":"enslave","d":"v. 奴役；束缚","f":"v. 奴役；束缚","s":["1791"]},{"w":"entail","d":"v. 涉及","f":"v. 涉及\n任务、工作、项目必然需要付出某种成本或精力（日常绝对高频）entail (doing) sth（涉及/需要做某事）This job entails a lot of patience and meticulousness.（这份工作涉及大量的耐心和细致。）\n决策、投资、行动必然伴随风险或后果（商务/警示类高频）entail risks / costs / consequences（涉及风险/成本/后果）Investing in stocks entails considerable risk.（炒股涉及相当大的风险。）\n逻辑推理中的“如果A则必然附带B”（书面/正式论述）entail that... / entail changes in...（意味着……/涉及……方面的变动）Changing the schedule entails that we inform all participants in advance.（改动时间表意味着我们要提前通知所有参与者。）","s":["1791"]},{"w":"entangle","d":"v. 纠缠","f":"v. 纠缠\n物理上的缠绕、被线/网/头发等缠住（本义，但实际使用占比不高）become entangled in / with sth（被……缠住）\n卷入复杂、棘手或丑闻般的麻烦中（抽象用法，绝对高频）become / get entangled in sth（卷入……之中）；entangled with sb（与某人纠缠不清）\n复杂的关系、情感纠葛或暧昧不清的局面 an entangled relationship / affair（纠缠不清的关系）；emotionally entangled（情感上纠缠不清）","s":["1791"]},{"w":"entice","d":"v. 诱惑（突出抛出诱饵、投其所好使其动心的动作）","f":"v. 诱惑（突出“抛出诱饵、投其所好”使其动心的动作）。\n商家用优惠、折扣、赠品吸引顾客（商业/营销绝对高频）entice sb to do / into doing sth（诱惑某人去做某事）；entice customers / buyers with...（用……诱惑顾客/买家）\n美食、香气、美景等感官刺激让人忍不住靠近或尝试 be enticed by the smell / sight of...（被……的香味/景象诱惑）；entice sb into a place（诱惑某人进入某地）\n“挖墙脚”、引诱人离开原有位置或放弃原有立场（含负面或竞争意味）entice sb away from...（把某人从……引诱走）","s":["1791"]},{"w":"entity","d":"n. 实体","f":"n. 实体","s":["1675","1791"]},{"w":"entrap","d":"v. 诱捕、使落入陷阱；诱骗","f":"v. 诱捕、使落入陷阱；诱骗","s":["1791"]},{"w":"entrenched","d":"adj. 确立的，牢固的","f":"adj. （权利、传统）确立的，牢固的","s":["1925"]},{"w":"entry","d":"n. 进入；入口；登记","f":"n. 进入；入口；登记","s":["1791"]},{"w":"envelop","d":"v. 笼罩","f":"v. 笼罩\n雾气、烟雾、黑暗等自然景象从四面八方包裹（绝对高频，最具画面感）be enveloped in fog / smoke / darkness（被雾/烟/黑暗笼罩）\n寂静、神秘、忧郁等抽象氛围弥漫整个空间（文学/描写类高频）be enveloped in silence / mystery / sadness（被寂静/神秘/忧郁笼罩）\n毛毯、翅膀、外衣等物理物件的“裹覆”动作（本义，但日常较少用）envelop sb / sth in a blanket / cloak（用毯子/斗篷裹住某人/某物）","s":["1791"]},{"w":"envision","d":"v. 想象；设想；展望","f":"v. 想象；设想；展望（尤指在头脑中构想未来的情景）\n常用结构：envision sth.；envision doing sth.；envision sb./sth. as...\nScientists envision using renewable energy to power entire cities.（科学家设想利用可再生能源为整座城市供电。）\nShe envisioned the small project as the beginning of a larger social movement.（她设想这个小项目会成为一场更大社会运动的开端。）","s":["1925"]},{"w":"equal","d":"adj. 相等的；同样的","f":"adj. 相等的；同样的","s":["1791"]},{"w":"equate","d":"v. 等同","f":"v. 等同\n警示他人不要把两件本质上不同的事混为一谈（日常讨论/观点类绝对高频）equate A with B（把A与B等同）；equate A to B（把A等同于B；稍少见，但也可用）\n在逻辑、数学或科学语境中表示“相当于/等于”（偏向量化或客观推理）equate to（相当于；常用于数值或结果的转换）\n哲学、政治或社会评论中，揭露“偷换概念”或“错误类同”（书面批判性文体）cannot / should not be equated with（不能/不应与……等同）；equate...with...is misleading（将……等同起来是误导性的）","s":["1675","1791"]},{"w":"equipment","d":"n. 设备","f":"n. 设备","s":["1791"]},{"w":"equitable","d":"adj. 公平","f":"adj. 公平\n资源分配、税收、薪酬等“按合理比例”分配（经济/社会政策绝对高频）equitable distribution / allocation（公平分配）；equitable share（公平份额）\n法律中的“公平裁决、公正对待”（法律/司法高频）equitable treatment / access / remedy（公平对待/公平准入/公平补救）；an equitable settlement（公平解决方案）\n教育、医疗、就业中的“机会公平”（公益/发展类）equitable access to education / healthcare / opportunities（公平获得教育/医疗/机会）","s":["1791"]},{"w":"equivalent","d":"adj. 等同的；等效的；n. 等同物","f":"adj. 等同的；等效的；n. 等同物\n常用搭配：be equivalent to（相当于／等同于）；the equivalent of（与……等同的人或物）\nThis qualification is equivalent to a bachelor's degree.（这项资格相当于学士学位。）\n区别：equal 强调数量、大小、程度或地位完全相同，可直接说 A equals B；equivalent 强调形式可能不同，但价值、功能、意义或效果相当，通常用 A is equivalent to B。\n例：Two halves are equal in size.（两个半块大小相等。）Cash and a gift card of the same value are not identical, but they may be equivalent in value.（现金和等值礼品卡形式不同，但价值可以相当。）","s":["1675","1791"]},{"w":"equivocal","d":"adj. 含糊其辞的","f":"adj. 含糊其辞的\nan equivocal response / answer / reply（含糊的回应）；remain equivocal on / about sth（对……仍含糊其辞）\nequivocal evidence / results / findings（模棱两可的证据/结果）","s":["1791"]},{"w":"equivocate","d":"v. 含糊","f":"v. 含糊\nequivocate on / about sth（就某事含糊其辞）；refuse to equivocate（拒绝含糊）\nbe caught equivocating（被发现含糊其辞）；equivocate to avoid perjury（含糊其辞以避免伪证）\nstop equivocating!（别含糊了！）；equivocate instead of giving a straight answer（含糊其辞而不给爽快答案）","s":["1791"]},{"w":"erase","d":"v. 消除","f":"v. 消除","s":["1791"]},{"w":"erode","d":"v. 侵蚀","f":"v. 侵蚀\n信心、信任、权威等抽象概念的“逐渐削弱”erode confidence / trust / authority（侵蚀信心/信任/权威）；gradually erode（逐渐侵蚀）\n货币价值、购买力、利润的“贬值/缩水”（经济/金融高频）erode purchasing power / profits / value（侵蚀购买力/利润/价值）；be eroded by inflation（被通胀侵蚀）\n土壤、岩石、海岸线的“物理风化与冲刷”（本义，地理/环境科学）","s":["1791"]},{"w":"err","d":"v. 错误，犯错","f":"v. 错误，犯错\nerr in (doing) sth（在……方面犯错）；To err is human.（犯错乃人之常情。）\nerr on the side of caution / safety / generosity（宁可过于谨慎/安全/慷慨）When investing, it's better to err on the side of caution.（投资时，宁可过于谨慎些。）\nerr in judgment / calculation / estimation（判断/计算/估计有误）；err from the truth（偏离真相）","s":["1791"]},{"w":"erratic","d":"adj. 反复无常的、飘忽不定的；不规律的","f":"adj. 反复无常的、飘忽不定的；不规律的","s":["1791"]},{"w":"erroneous","d":"adj. 错误的","f":"adj. 错误的","s":["1791"]},{"w":"erupt","d":"v. 爆发","f":"v. 爆发\nExplode（爆炸）：指内核物理炸开（炸弹、轮胎爆胎），强调“碎片四溅”。Erupt（爆发）：指内部物质向外喷射（火山喷岩浆、人喷怒火、痘痘喷脓），强调“从下往上冲破表面”。\n战争、暴力、争吵、冲突的“突然爆发”（新闻绝对高频，最常用）erupt between...（在……之间爆发）；erupt over sth（因某事而爆发）；violence / fighting / war erupts（暴力/战斗/战争爆发）\n人群爆发出笑声、掌声、欢呼声或歌声（场景描写高频）erupt into laughter / cheers / applause / song（突然爆发出大笑/欢呼/掌声/歌声）\n情绪的突然爆发（勃然大怒或放声大哭）（心理/文学描述）erupt in anger / rage / tears（勃然大怒/放声大哭）；erupt with fury（暴跳如雷）","s":["1791"]},{"w":"eschew","d":"v. 摒弃","f":"v. 摒弃。avoid 可以是客观躲开危险（比如躲开一辆车），而 eschew 是 基于原则、审美或理智判断后的“坚决不碰”——带有强烈的主观取舍色彩。\neschew + 具体食物/物质（如 sugar / meat / alcohol / processed foods）；eschew in favor of...（摒弃……而选择……）Many health experts advise eschewing processed foods in favor of whole grains.（许多健康专家建议摒弃加工食品，转而选择全谷物。）\n道德、政治立场的“拒绝采用/放弃”（新闻/正式论述高频）eschew violence / extremism / corruption（摒弃暴力/极端主义/腐败）；eschew partisan politics（摒弃党派政治）\neschew jargon / clichés / verbosity（摒弃行话/陈词滥调/冗长啰嗦）；eschew ornamentation（摒弃华丽装饰）","s":["1791"]},{"w":"essential","d":"adj. 重要的；基本的","f":"adj. 重要的；基本的","s":["1791"]},{"w":"estimate","d":"v. 估计","f":"v. 估计","s":["1675","1791"]},{"w":"evacuate","d":"v. 使撤离，使疏散","f":"v. 使撤离，使疏散。evacuate + 地址或人员。\nevacuate the area / city / residents（撤离地区/城市/居民）；mandatory evacuation order（强制撤离令）；evacuate from... to...（从……撤离到……）\nevacuate civilians / troops / the wounded（撤离平民/部队/伤员）；medical evacuation / medevac（医疗后送/伤员撤离）","s":["1791"]},{"w":"evade","d":"v. 逃避，回避","f":"v. 逃避，回避。 法律/新闻语境：逃脱追捕或义务（最硬核），辩论/问答语境：回避问题（最狡猾），体育/游戏语境：灵巧闪避（最生动）。\nevade responsibility / taxes / questions（逃避责任/逃税/回避问题）；evade doing sth（逃避做某事）\nevade capture / arrest / the police（躲避抓捕/逮捕/警察）；evade a blow / attack（躲开一击/攻击）\nevade regulations / sanctions / surveillance（规避监管/制裁/监控）","s":["1791"]},{"w":"evaluate","d":"v. 评价；估价","f":"v. 评价；估价","s":["1791"]},{"w":"evasion","d":"n. 逃避","f":"n. 逃避\nevasion of + 名词 逃避（责任、义务、问题、法律等）\nevasion about + 名词 His answers were full of evasions about his past.","s":["1791"]},{"w":"evasive","d":"adj. 回避的","f":"adj. 回避的\nbe evasive with sb. 对某人不托底 be evasive about sth. 对某事不直说\nan evasive answer / response / reply（含糊其辞的回答）；be evasive about sth（对……支支吾吾）\ntake evasive action（采取规避行动）；evasive driving / maneuvers（规避驾驶/机动）\nevasive tactics / behavior（规避策略/行为）；be deliberately evasive（故意回避）","s":["1791"]},{"w":"eventual","d":"adj. 最后的","f":"adj. 最后的","s":["1791"]},{"w":"evidence","d":"n. 证据；证人","f":"n. 证据；证人","s":["1791"]},{"w":"evident","d":"adj. 明显的","f":"adj. 明显的\nIt is evident that...（很明显……）；become evident（变得明显）\nbe evident from / in sth（从……中/在……方面明显可见）\nmake evident / make it evident that...（使……变得明显）","s":["1791"]},{"w":"evoke","d":"v. 唤起","f":"v. 唤起\nevoke memories of...（唤起对……的记忆）；evoke a sense of nostalgia（唤起怀旧感）\nevoke emotions / sympathy / empathy（唤起情感/同情/同理心）；evoke a strong reaction（引起强烈反应）\nevoke an image / atmosphere / the spirit of...（唤起意象/氛围/……的精神）","s":["1791"]},{"w":"evolve","d":"v. 使进化；使发展","f":"v. 使进化；使发展","s":["1675","1791"]},{"w":"exception","d":"n. 例外","f":"n. 例外","s":["1791"]},{"w":"exceptional","d":"adj. 卓越的；例外的","f":"adj. 卓越的；例外的","s":["1791"]},{"w":"excess","d":"n. 过剩","f":"n. 过剩\n数量、金额或时间“超过……” in excess of + 数字（超过……）；The car was traveling at a speed in excess of 150 miles per hour.（这辆车的行驶速度超过了每小时150英里。）\nan excess of + 名词（过量的……）\n重量、行李、热量等“超标”（旅行/健康/日常高频）excess weight / baggage / calories（超重/超重行李/多余热量）；excess fat / oil（多余脂肪/油脂）","s":["1791"]},{"w":"excessive","d":"adj. 过度的","f":"adj. 过度的\nbe excessive in sth（在某方面过分）\nexcessive drinking / spending / smoking（过度饮酒/过度消费/过度吸烟）；excessive consumption（过度消费）\nexcessive heat / noise / pressure / force（过度的高温/噪音/压力/武力）；excessive amounts of + 不可数名词（过量的……）\nexcessive punishment / regulation / control（过度的惩罚/监管/控制）；\nexcessive overtime / paperwork / bureaucracy（过度的加班/文书工作/官僚作风）","s":["1791"]},{"w":"exchange","d":"v./n. 兑换；交换","f":"v. n. 兑换；交换","s":["1791"]},{"w":"exclusion","d":"n. 除外，拒绝","f":"n. 除外，拒绝\n社交、群体或机会中的“排斥/排挤”（新闻/社会议题绝对高频）social exclusion（社会排斥）；exclusion from sth（被排除在……之外）；feel exclusion（感到被排斥）\nexclusion of + 被排除的对象 sb's exclusion from + 被禁止进入的地方/活动\tsb do sth. to the exclusion of + 被忽视的事物 不管不顾\n保险、法律或合同中的“免责/不予承保/除外条款”（商务/法律高频）exclusion clause（免责条款/除外条款）；exclusions apply（有除外/免责规定）；policy exclusions（保单免赔范围）\n为了A而排斥/牺牲B”的固定强搭配（书面/逻辑论述高频）to the exclusion of（把……排除在外；只顾……而不顾……）","s":["1675","1791"]},{"w":"exclusive","d":"adj. 排外的；独占的","f":"adj. 排外的；独占的","s":["1675","1791"]},{"w":"excuse","d":"n. 借口","f":"n. 借口","s":["1791"]},{"w":"exemplify","d":"v. 体现（精准覆盖本身就是典型范例的高频用法，同时兼顾举例说明的动作义）","f":"v. 体现（精准覆盖“本身就是典型范例”的高频用法，同时兼顾“举例说明”的动作义）。\nexemplify the challenges / spirit / commitment / trend（体现挑战/精神/承诺/趋势）\nexemplify this point / approach（例证这个观点/方法）；let me exemplify（让我举例说明）；be exemplified by...（以……为例证）\nexemplify the style / era / approach（代表该风格/时代/方法）","s":["1791"]},{"w":"exempt","d":"v./adj. 免除，被免除的","f":"v.adj. 免除，被免除的\nexempt sb/sth from + 名词\nbe exempt from + 名词","s":["1675","1791"]},{"w":"exert","d":"v. 施加","f":"v. 施加\n施加压力、影响或控制（新闻/职场绝对高频，占日常出现率60%以上）exert pressure / influence / control on sb/sth（对……施加压力/影响/控制）\n运用权力、权威或武力（政治/法律/管理场景）exert power / authority / force（行使权力/运用权威/动用武力）\n努力、尽力（反身代词用法）——固定搭配，非常高频 exert oneself / exert every effort（尽最大努力/竭尽全力）","s":["1791"]},{"w":"exhale","d":"v. 呼气","f":"v. 呼气\nexhale slowly / deeply（缓慢/深呼吸）；inhale and exhale（吸气和呼气）\nexhale carbon dioxide / smoke / vapor（呼出二氧化碳/烟雾/水汽）；exhale through the nose（用鼻子呼气）\nexhale a sigh of relief / exasperation（呼出松了一口气/恼怒的叹息）；exhale tension / stress（释放紧张/压力）","s":["1791"]},{"w":"exhaust","d":"v. 使疲倦","f":"v. 使疲倦","s":["1791"]},{"w":"exhaustive","d":"adj. 无遗漏的，彻底的，广泛的","f":"adj. 无遗漏的，彻底的，广泛的\nbe exhaustive in + 某方面. The report was exhaustive in its coverage of the issue.（这份报告对该问题的覆盖是全面彻底的。）\nbe exhaustive of + 范围. This list is exhaustive of all the possibilities.（这份清单穷尽了所有可能性。）\nThis is not an exhaustive list.\nan exhaustive search / inquiry\nexhaustive details / coverage","s":["1791"]},{"w":"exhibit","d":"v./n. 展示","f":"v.n. 展示。相比于show，更适合稍正式点的场景。\nexhibit paintings / sculptures / works 展出画作/雕塑/作品\nexhibit signs / symptoms 表现出迹象/症状（医学、心理学常用）\nexhibit behavior / traits 表现出行为/特征 She exhibited great courage during the crisis.（她在危机中表现出巨大勇气。）\nsb will exhibit at + 展会/画廊 sb exhibit in + 城市/国家\n名词搭配 an exhibit of + 作品/物品","s":["1791"]},{"w":"exist","d":"v. 生存","f":"v. 生存","s":["1791"]},{"w":"exit","d":"n. 出口；退出","f":"n. 出口；退出","s":["1791"]},{"w":"expansive","d":"adj. 广阔的、范围广的；健谈开朗的；扩张性的","f":"adj. 广阔的、范围广的；健谈开朗的；扩张性的","s":["1791"]},{"w":"expedient","d":"adj. 权宜的；n. 权宜之计","f":"adj. 权宜的\nn. 权宜之计","s":["1791"]},{"w":"expertise","d":"n. 专门知识","f":"n. 专门知识\n1. 黄金动词搭配（最核心）\n别总用“have”，试试这些更精准的词：\n\n· possess/have expertise in：拥有某领域专长（最通用）\n· bring expertise to：为某事带来专长（职场高频，强调贡献）\n· leverage expertise：利用专长（商务精英感，意为“发挥”）\n· apply expertise：应用专长（强调实践）\n· gain/develop expertise：获得/培养专长\n\n2. 必备介词（易错点）\n\n· expertise in + 领域/技能（绝大多数情况用这个）—— 正确：expertise in finance\n· expertise on + 具体话题/问题—— 例句：expertise on climate policy\n· expertise with + 工具

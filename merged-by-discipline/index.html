迫放弃原有的立场或否认，承认某事属实或承认自己失败。\nconcede defeat（承认失败、认输）After counting 95% of the votes, the opposition candidate conceded defeat and congratulated his rival.\nconcede a point / concede that...（承认某一点 / 承认……属实）","s":["1791"]},{"w":"concerted","d":"adj. 协同的","f":"adj. 协同的\nconcerted effort — 协同努力 / 共同努力\nconcerted action — 协同行动 / 一致行动\n\"Concerted\" 几乎只用作形容词，而且前面永远会跟一个名词（最常见的就是 effort/action/campaign）。它传递的潜台词是：“这不是一个人随便做做，而是有组织、有计划、大家一起上”。","s":["1675","1791"]},{"w":"concurrence","d":"n. 同时发生；同意","f":"n. 同时发生；同意","s":["1675","1791"]},{"w":"confer","d":"v. 授予，商量","f":"v. 授予，商量\nconfer a degree / title / honor on someone — 授予某人学位／头衔／荣誉\nconfer with someone (about something) — 与某人商议（某事）","s":["1675","1791"]},{"w":"confide","d":"v. 吐露","f":"v. 吐露\nconfide in someone about sth.— 向某人吐露心声（信任对方）\nconfide something to someone — 向某人吐露某事（秘密）\nHe confided to me that... 他私下和我说","s":["1791"]},{"w":"confine","d":"n. 限制；边界","f":"n. 限制；边界","s":["1791"]},{"w":"congenial","d":"adj. 投缘的，合得来的","f":"adj. 投缘的，合得来的\ncongenial company / companion — 投缘的同伴\ncongenial atmosphere / surroundings — 宜人的环境\ncongenial to someone — 适合某人／合某人心意","s":["1675","1791"]},{"w":"congregate","d":"v. 聚集","f":"v. 聚集\ncongregate in / around something — 聚集在…周围 / 里面\ncongregate at a place — 聚集在某地","s":["1791"]},{"w":"congruity","d":"n. 契合","f":"n. 契合\ncongruity between A and B — A与B之间的契合／一致\ncongruity with something — 与某物的相符／协调\nlack of congruity — 缺乏一致性","s":["1675","1791"]},{"w":"consensus","d":"n. 一致","f":"n. 一致","s":["1675","1791"]},{"w":"consort","d":"n. 配偶；v. 交往","f":"n. 配偶\nconsort of someone — 某人的配偶（尤指君主配偶）\nprince consort — 女王丈夫／亲王（女王配偶）\nv. 交往\nconsort with someone — 与某人厮混／交往（常带贬义） He was known to consort with criminals and gangsters.\nin consort with someone — 与某人联合／协同（正式）","s":["1791"]},{"w":"conspire","d":"v. 阴谋，密谋","f":"v. 阴谋，密谋\nconspire to do something — 密谋做某事\nconspire against someone — 密谋对付某人\nconspire with someone — 与某人合谋","s":["1675","1791"]},{"w":"contend","d":"v. 竞争，主张","f":"v. 竞争，主张\ncontend for something — 争夺某物\ncontend with something / someone — 应对／对付（困境或对手）\ncontend that... — 主张／声称……（正式）","s":["1791"]},{"w":"cooperation","d":"n. 合作；协作","f":"n. 合作；协作","s":["1791"]},{"w":"correspond","d":"v. 符合，协调；通信","f":"v. 符合，协调；通信","s":["1925"]},{"w":"courtship","d":"n. 求偶行为","f":"n. 求偶行为","s":["2026"]},{"w":"delegate","d":"n. 代表","f":"n. 代表","s":["1675","1791"]},{"w":"derivative","d":"adj. 派生的；衍生的；缺乏创意的；n. 派生物；导数","f":"adj. 派生的；衍生的；缺乏创意的；n. 派生物；导数","s":["1675"]},{"w":"devote","d":"v. 投入于，献身","f":"v. 投入于，献身","s":["1925"]},{"w":"devotion","d":"n. 献身","f":"n. 献身\ndevotion to duty / work / family — 对职责／工作／家庭的献身\ndevotion to a cause / religion / ideals — 对事业／信仰／理想的忠诚","s":["1791"]},{"w":"disciple","d":"n. 门徒","f":"n. 门徒。“某位大师、领袖或思想家的忠实追随者，不仅学习其教义，还帮助传播其思想”。\na disciple of someone — 某人的门徒／追随者\nloyal / faithful disciple — 忠诚的门徒\ndisciple of a religion / ideology — 某宗教／意识形态的信徒","s":["1675","1791"]},{"w":"discord","d":"n. 不和谐","f":"n. 不和谐","s":["1675","1791"]},{"w":"dominate","d":"v. 统治；支配；控制","f":"v. 统治；支配；控制","s":["1675","1791"]},{"w":"empathy","d":"n. 共情","f":"n. 共情","s":["2026"]},{"w":"endorse","d":"v. 背书；支持；赞同","f":"v. 背书；支持；赞同","s":["1791"]},{"w":"entertain","d":"v. 招待；娱乐","f":"v. 招待；娱乐","s":["1791"]},{"w":"escort","d":"v. 护送","f":"v. 护送","s":["1791"]},{"w":"esteem","d":"n. 尊敬","f":"n. 尊敬\nself-esteem（自尊/自尊心）；high / low self-esteem（高/低自尊）；boost / damage one's self-esteem（提升/伤害自尊心）\nhold sb/sth in high / great esteem（对……推崇备至）；be held in high esteem by sb（受到……的高度尊重）","s":["1675","1791"]},{"w":"exclude","d":"v. 把....排除在外","f":"v. 把....排除在外","s":["1675","1791"]},{"w":"exploit","d":"v. 开发；剥削","f":"v. 开发；剥削","s":["1791"]},{"w":"foe","d":"n. 敌人 语气偏文学化、戏剧化，发音简短，容易押韵","f":"n. 敌人 语气偏文学化、戏剧化，发音简短，容易押韵。\na foe of / to sth.","s":["1791"]},{"w":"fraternal","d":"adj. 兄弟的 或 兄弟般的","f":"adj. “兄弟的” 或 “兄弟般的”\n形容感情/关系：兄弟般的、友好的，fraternal love（手足之爱）、fraternal spirit（兄弟情谊/团队精神）。\n形容组织/社团：兄弟会的、共济会的，fraternal organization \n医学/生物学上（考点）：异卵双生的（非同卵）","s":["1675","1791"]},{"w":"furnish","d":"v. 供应,提供;装备,布置","f":"v.供应,提供;装备,布置","s":["1675"]},{"w":"gossip","d":"n. 闲话；v. 聊八卦","f":"n. 闲话\n①（不可数名词/动词）关于他人私事的闲言碎语、八卦；②（可数名词）爱嚼舌根的人（八卦精）。\n休闲社交（中性偏娱乐）：Office gossip / Celebrity gossip（办公室八卦/明星花边）。\n传播行为（动词搭配）：Spread gossip（传播流言）。\n贬义定性（强烈负面）：Malicious gossip / Idle gossip（恶意的闲话/无聊的嚼舌根）。\nv. 聊八卦 gossip about sth./sb.","s":["1791"]},{"w":"harass","d":"v. 骚扰、烦扰、不断侵扰","f":"v. 骚扰、烦扰、不断侵扰\n（反复地）骚扰、烦扰某人 —— 通过不断打扰使人心烦或不安\n例句：She was harassed by a journalist for weeks.（她被一名记者骚扰了好几周。）\n（军队等）不断袭扰、骚扰 —— 军事上指不断攻击以削弱敌人\n例句：The enemy harassed the retreating troops all night.（敌军整夜袭扰撤退中的部队。）","s":["1675","1791"]},{"w":"implicate","d":"v. 牵连","f":"v. 牵连。把某人/某物卷进（通常是不好的）事情里。\n结构一（最常用）：implicate + 人 + in + 坏事/案件\nThe investigation implicated the mayor in the bribery scandal.（调查显示市长与受贿丑闻有牵连。）\n结构二（被动，极其高频）：be implicated in + 坏事\nThree employees were implicated in the data breach.（三名员工被牵连进数据泄露事件。）","s":["1675","1791"]},{"w":"incompatible","d":"adj. 不兼容的","f":"adj. 不兼容的","s":["1675","1791"]},{"w":"incongruous","d":"adj. 不协调的","f":"adj. 不协调的。incongruity的形容词。\n· Incongruous with...（与……格格不入）\n· Incongruous sight / figure / element（突兀的景象/身影/元素）","s":["1675","1791"]},{"w":"intimacy","d":"n. 熟悉；亲近","f":"n. 熟悉；亲近","s":["1675","1791"]},{"w":"intimate","d":"adj. 亲密的；v. 暗示","f":"adj. 亲密的；v. 暗示","s":["1675","1791"]},{"w":"intimidate","d":"v. 恐吓","f":"v. 恐吓","s":["1675","1791"]},{"w":"kinship","d":"n. 亲属关系","f":"n. 亲属关系","s":["2026"]},{"w":"mutual","d":"adj. 相互的，共有的","f":"adj.相互的，共有的","s":["1675"]},{"w":"nurture","d":"n. 养育；培养；v. 养育；培育；促进","f":"n. 养育；培养；v. 养育；培育；促进","s":["1675"]},{"w":"patron","d":"n. 赞助人；资助者","f":"n. 赞助人；资助者","s":["2026"]},{"w":"pledge","d":"n. 誓言，保证；v. 使发誓","f":"n.誓言，保证；v.使发誓","s":["1675"]},{"w":"provision","d":"n. 供应，供应品","f":"n. 供应，供应品","s":["1675","1925"]},{"w":"proximity","d":"n. 接近，[数]邻近；接近；接近度，距离；亲近","f":"n. 接近，[数]邻近；接近；接近度，距离；亲近","s":["1675"]},{"w":"render","d":"v. 给予，提供","f":"v. 给予，提供[st]The company rendered excellent customer service.[st]render assistance to sb.[ph]render a verdict of guilty","s":["1675","1925"]},{"w":"repel","d":"v. 击退，驱逐","f":"v. 击退，驱逐[ph]repel an enemy/insects/negative energy[syn]\"Repel\"强调击退、抵制或驱逐，以防止或抵御某种攻击、入侵或威胁。\"Resist\"侧重于抵抗外部的力量、压力或攻击，以保持自身的独立、权益或原则。\"Deter\"着重于通过威慑或威胁来阻止或抑制某人或某物的行为或意图，通常涉及对未来行动的预防措施。","s":["1925"]},{"w":"replenish","d":"v. 补充、再装满","f":"v. 补充、再装满","s":["1675","1925"]},{"w":"respect","d":"n. 尊敬，敬重","f":"n. 尊敬，敬重","s":["1925"]},{"w":"respective","d":"adj. 分别的，各自的","f":"adj. 分别的，各自的","s":["1675","1925"]},{"w":"rival","d":"v. 比得上，与...相匹敌","f":"v. 比得上，与...相匹敌 v.[ph]rival each other in their efforts[ph]rival those of the most experienced professionals[syn]Rival、competitor、adversary 和 compete 都表示竞争对手或竞争。它们用于描述在竞争中相互对抗或竞争的个体或团体。Rival 是最常用的词汇，强调在竞争中与其他人或组织相对抗，可以用于形容在商业、体育或其他领域的竞争。Competitor 侧重于与其他个体或团体在某一方面的竞争，通常用于商业竞争或比赛。Adversary 指对手或敌手，侧重于敌对或敌对立场，常用于形容比赛或竞争中的对手。Compete 是一个动词，表示参加竞争或争夺，描述了参与竞争或比赛的行为。","s":["1925"]},{"w":"rivalry","d":"n. 竞争；敌对状态","f":"n. 竞争；敌对状态 n.[ph]intense rivalry between the two companies/political parties;passionate rivalry among the fans;[syn]Rivalry、competition、contention 和 conflict 都表示竞争、对抗或敌对关系。它们用于描述不同个体或团体之间的争夺、对抗或敌对的状态。Rivalry 是最常用的词汇，强调在竞争中的敌对或竞争关系，通常用于形容长期、激烈的竞争，也可指公司、运动队或个人之间的竞争。Competition 指竞争或比赛，侧重于在某种资源、荣誉或目标上的竞争。Contention 指争夺或争议，强调在观点、权力或地位上的竞争。Conflict 是一个更广泛的词汇，表示冲突、对抗或战争，指不同利益或意见之间的冲突，也可以包含暴力或敌对的情况。","s":["1925"]},{"w":"seduce","d":"v. 勾引，诱惑","f":"v. 勾引，诱惑[ph]tried to seduce her with his charm and compliments[ph]seduce sb. into doing sth.[syn]tempt，但它们之间的区别在于，seduce更强调使用诱惑或欺骗手段来引诱，特别是在性方面，而tempt则指尝试引诱某人做某事，可以涵盖更广泛的诱惑行为。","s":["1925"]},{"w":"solidarity","d":"n. 团结，团结一致","f":"n. 团结，团结一致[mean]这个词指的是人们在共同目标、利益或原则下团结在一起的状态或行为。通常指在困难、挑战或不公正情况下，人们通过共同努力和支持来实现共同的目标。[ph]showed remarkable solidarity[ph]demonstrate solidarity[ph]promote global peace and solidarity","s":["1925"]},{"w":"spouse","d":"n. 配偶","f":"n. 配偶","s":["1675"]},{"w":"submit","d":"v. 提交；呈递；屈服；服从","f":"v. 提交；呈递；屈服；服从","s":["1925"]},{"w":"subordinate","d":"adj. 从属的、次要的；n. 下属、部下；v. 使从属、使次要于","f":"adj. 从属的、次要的；n },{"w":"exalt","d":"v. 颂扬","f":"v. 颂扬。实用中 形容词 exalted 比动词本身更常见，尤其是在描述职位高、情绪高的语境。极易与 exult（欢欣鼓舞）拼写混淆。\nexalt the virtues / values of...（颂扬……的美德/价值）；exalt sb/sth as...（推崇……为……）\nbe exalted to a position / rank（被提升到……职位/等级）；exalt the spirit / mind（升华精神/心智）\nan exalted position / status / rank（崇高的地位/身份/等级）；in an exalted mood / spirits（兴高采烈/情绪高昂）","s":["1675","1791"]},{"w":"exalted","d":"adj. 崇高的、高贵的、兴高采烈的","f":"adj. 崇高的、高贵的、兴高采烈的\nan exalted position / rank / status（显赫的地位/军衔/身份）；be elevated to an exalted office（被提升至高位）\nexalted ideals / virtues / principles（崇高的理想/美德/原则）；the most exalted form of art（最高尚的艺术形式）\nin an exalted mood / state / spirits（情绪高昂/处于兴奋状态）","s":["1675","1791"]},{"w":"extol","d":"v. 高度赞扬、颂扬、极力赞美","f":"v. 高度赞扬、颂扬、极力赞美 \n写作时：只有当你讨论的主题是 “美德、精神、伟人、价值观” 这类抽象且宏大的概念时，才用 extol。口语中：99% 的情况不要用，除非你在故意模仿总统演讲，或者在开玩笑。\nextol + 抽象名词 He extolled the virtues of a healthy diet.（他极力称赞健康饮食的好处。）\nextoll sb. for sth. 因某原因赞扬某人\nbe extolled as sth. 被赞扬为","s":["1675","1791"]},{"w":"feat","d":"n. 功绩，壮举","f":"n. 功绩，壮举\na feat of + 抽象名词\t……方面的壮举（展现某种素质）\tBuilding the bridge was a feat of engineering.（建这座桥是一项工程壮举。）\nachieve / accomplish a feat\t完成一项壮举\tShe achieved the feat of winning two Olympic golds.（她实现了赢得两枚奥运金牌的壮举。）\nno mean feat\t绝非易事（黄金习语）\tGetting everyone to agree was no mean feat.（让所有人达成一致绝非易事。）\naccomplish / achieve / perform / pull off the feat of","s":["1675","1791"]},{"w":"grandeur","d":"n. 庄严，伟大","f":"n. 庄严，伟大","s":["1675"]},{"w":"hilarious","d":"adj. 极其好笑的、令人捧腹大笑的","f":"adj. 极其好笑的、令人捧腹大笑的\n狂赞喜剧、段子或电影（高频）吐槽朋友或自己的糗事（日常社交）反讽/挖苦（特定语气）","s":["1675","1791"]},{"w":"hilarity","d":"n. 欢闹","f":"n. 欢闹\n“Hilarity ensues.”（随之而来的是爆笑/欢闹场面。）“I slipped on the banana peel, and hilarity ensued.”（我踩到香蕉皮摔了一跤，接下来就是全场爆笑。）\nsheer hilarity（纯粹的爆笑场面）\nmoments of hilarity（欢闹时刻）","s":["1675","1791"]},{"w":"homage","d":"n. 致敬、崇敬、尊崇","f":"n. （公开的）致敬、崇敬、尊崇。彩蛋。\nPay homage to + 某人/某作品","s":["1675","1791","2026"]},{"w":"prestige","d":"n. 威望；声望；adj. 有威望的；名牌的","f":"n. 威望；声望；adj. 有威望的；名牌的","s":["1675" 丁点/让步(常用于否定句)","f":"v. 移动一丁点/让步(常用于否定句)\nwon't budge（一动也不动）、refuse to budge（拒绝挪动）、budge an inch（挪动一英寸）、can't budge it（推不动它）\nrefuse to budge on + 议题（在某事上拒绝让步）、budge from one's position（偏离自己的立场）、won't budge an inch（寸步不让）","s":["1791"]},{"w":"butt","d":"n. 臀部 / 末端 / 笑柄目标","f":"n. 臀部 / 末端 / 笑柄目标\nget off your butt（别懒着/行动起来）、fall on one's butt（摔个屁股蹲儿）、a kick in the butt（当头一棒/鞭策）\ncigarette butt（烟蒂）、rifle butt（枪托）、butt of the handle（手柄末端）","s":["1791"]},{"w":"chafe","d":"v. 摩擦 / 恼火 / 焦躁","f":"v. 摩擦 / 恼火 / 焦躁\nchafe the skin（擦伤皮肤）、a collar that chafes（磨脖子的衣领）、my heel is chafed(脚踝被磨到了)、chafe against each other（互相摩擦）\nchafe at the restrictions（对限制感到恼火）、chafe under the boss's control（对上司的控制感到不满）、chafe against the rules（抵触规则）","s":["1675","1791"]},{"w":"choke","d":"v. 意思①：窒息、呛到、噎住（物理意义）；n. 窒息、呛住（医学/生理语境）","f":"v. \n意思①：窒息、呛到、噎住（物理意义）\n这是最基础、最字面的意思，表示喉咙被东西卡住导致呼吸困难。\nI choked on a piece of bread. （我被一块面包噎到了。）\nShe was choking and couldn't breathe. （她当时在窒息，无法呼吸。）\n意思②：因紧张/压力而\"掉链子\"、\"发挥失常\"（这是美国中学生高频使用的隐喻义）\n在体育比赛、考试、表演、甚至跟喜欢的人说话时，因为紧张而表现不佳，就用\"choke\"。\nHe totally choked during the final exam. （他期末考试彻底考砸了，因为太紧张。）\nThe team choked in the last minute and lost the game. （这支队伍最后一分钟崩盘，输掉了比赛。）\nI was about to ask her out, but I choked. （我本来要约她出去，但关键时刻怂了/说不出口。）\nn. 窒息、呛住（医学/生理语境）\nShe was choking and couldn't breathe. （她当时在窒息，无法呼吸。）\nHe died of a choke. （他死于窒息。）—— 但这种说法很少，更常用 choking。","s":["1791"]},{"w":"chop","d":"n. 砍；排骨","f":"n. 砍；排骨","s":["1675","1791"]},{"w":"chuckle","d":"v. 咯咯的笑","f":"v. 咯咯的笑","s":["1675","1791"]},{"w":"cleanse","d":"v. 使清洁","f":"v. 使清洁\ncleanse your skin / face\t深层清洁皮肤/面部\ndeep cleanse\t深层清洁\ncleanse the cut 清洗伤口","s":["1675","1791"]},{"w":"clinch","d":"v. 敲定、最终达成、锁定（胜局）","f":"v. 敲定、最终达成、锁定（胜局）\nclinch a deal（敲定一笔交易）和 clinch an agreement（最终达成协议）","s":["1675","1791"]},{"w":"cling","d":"v. 紧紧抓住、依附、黏着","f":"v. 紧紧抓住、依附、黏着\ncling to something（紧紧抓住某物），cling together（互相紧紧抱在一起）\ncling to sb.(离不开/黏住某人)","s":["1791"]},{"w":"clip","d":"n. 夹子；修剪；v. 夹住；修剪","f":"n. 夹子；修剪 / v. 夹住；修剪","s":["1675","1791"]},{"w":"clutch","d":"v. 紧紧抓住、攥住、猛然揪住","f":"v. 紧紧抓住、攥住、猛然揪住。侧重 “因紧张、害怕或不想失去，而死死攥住”。它带有强烈的情绪色彩（焦虑、渴望）。\nclutch something / clutch at something（紧紧抓住某物）\nclutch at straws（抓救命稻草，指绝望中不切实际的尝试）","s":["1675","1791"]},{"w":"crash","d":"n./v. 撞碎","f":"n. v. 撞碎","s":["1791"]},{"w":"creep","d":"v. 匍匐前进；悄悄地移动","f":"v.匍匐前进；悄悄地移动","s":["1675"]},{"w":"crush","d":"v. 榨；挤；压碎","f":"v. 榨；挤；压碎","s":["1791"]},{"w":"dab","d":"v./n. 轻触；涂抹","f":"v./n. 轻触；涂抹","s":["1675","1791"]},{"w":"dart","d":"v. 猛冲","f":"v. 猛冲\ndart across / through / into somewhere — 猛冲过／穿过／冲进某处\ndart a glance / look at someone — 飞快地瞥某人一眼\ndart in and out — 快速地进进出出","s":["1675","1791"]},{"w":"dodge","d":"v. 躲闪或躲避；n. 诡计、花招 It'","f":"v. 躲闪或躲避。八成情况是物理上的躲闪，少数情况指躲避抽象概念。\n身体上的“躲闪” (动词/名词) A quick dodge saved him. (一个快速的躲闪救了他。)\n抽象意义上的“回避” (动词) She always dodges difficult questions. (她总是回避难题。)\nn. 指“诡计”、“花招” It's just a tax dodge. (这只是一个避税的花招。)","s":["1791"]},{"w":"drag","d":"v. 拖动","f":"v. 拖动","s":["1791"]},{"w":"drip","d":"n./v. 滴落、滴水滴水声","f":"n. v. 滴落、滴水（70%）滴水声（30%)[v.]water dripped from the faucet; rain dripped from the leaves[n.]the constant drip from the ceiling; She could hear the soothing drip of water in the fountain.","s":["1925"]},{"w":"embrace","d":"v. 拥抱；欣然接受（变化、观念）；包含、涵盖；n. 拥抱","f":"v. 拥抱；欣然接受（变化、观念）；包含、涵盖；n. 拥抱","s":["1791"]},{"w":"erect","d":"v. 建设；直立","f":"v. 建设；直立","s":["1675","1791"]},{"w":"escape","d":"v. 避免；逃避","f":"v. 避免；逃避","s":["1791"]},{"w":"explode","d":"v. 爆炸","f":"v. 爆炸","s":["1791"]},{"w":"flay","d":"v. 严厉批评、痛斥；剥皮","f":"v. 严厉批评、痛斥；剥皮","s":["1675","1791"]},{"w":"flee","d":"v. 逃跑","f":"v. 逃跑。如果你只是“想跑”，用 flee；如果你“跑成功了”，用 escape。\nflee from + 地点（从某地逃离）\nflee to + 地点（逃往某地）\nflee + 直接宾语（表示逃离某物，较正式）","s":["1791"]},{"w":"flip","d":"v. 弹；投；翻滚","f":"v. 弹；投；翻滚","s":["1791"]},{"w":"footbeat","d":"n. 脚步声；脚步节拍","f":"n. 脚步声；脚步节拍","s":["1675"]},{"w":"frown","d":"v. 皱眉，反对","f":"v. 皱眉，反对\nfrown at + 人\t对某人皱眉（表示不满、疑惑或警告）\nfrown on / upon + 行为/事物\t不赞成、反对、看不惯（极其高频的抽象用法！）","s":["1791"]},{"w":"gasp","d":"v. 带有强烈情绪或生理冲击的剧烈吸气动作","f":"vt. v. 带有强烈情绪或生理冲击的“剧烈吸气动作”\ngasp at + 人或事\t对……倒吸一口凉气（惊讶/震惊）\t“Everyone gasped at the stunning view.”（所有人都被那壮丽景色惊得倒吸一口凉气。）\ngasp for + 空气/呼吸\t拼命喘气/呼吸困难\t“The runner was gasping for breath.”（跑步者正在大口喘气。）\ngasp with + 情绪\t因某种情绪而倒吸气\t“She gasped with surprise.”（她惊讶得倒吸一口气。）\nto the last gasp：直到最后一口气（拼死挣扎）。\nthe last gasp of winter：冬天最后的余威（快要结束时的最后一股寒流）。","s":["1675","1791"]},{"w":"gaze","d":"n. 凝视","f":"n. 凝视","s":["1791"]},{"w":"glide","d":"v. 滑行或滑翔","f":"v. 滑行或滑翔。把 glide 想象成你开车时，在高速上不踩油门，让车挂空挡靠惯性往前溜的那一段。而 skate 是你从启动到刹车踩死的整个过程。\n物理层面：平滑地、不费力地移动（在空中或水面上）The eagle glided across the sky without flapping its wings.\n抽象/比喻层面：悄然、顺畅地过渡或行动 She glided into the room without anyone noticing her.","s":["1791"]},{"w":"gnaw","d":"v. 啮，咬","f":"v. 啮，咬\n字面，描述动物或人用门牙反复、费力地咬坚硬的东西。gnaw on a bone（啃骨头），gnaw through the rope（咬断绳子）。\n比喻，“（情绪/感受）折磨、困扰”。gnaw at one's conscience/heart（侵蚀良心/折磨内心）：Guilt gnawed at him.（内疚感折磨着他。）gnawing hunger（持续的饥饿感/饥肠辘辘）：指胃里那种一阵阵、让人发慌的饿，比 hungry 强烈得多。gnawing anxiety/doubt（挥之不去的焦虑/疑虑）：指像牙疼一样持续不断、无法忽略的担心。","s":["1675","1791"]},{"w":"grab","d":"v. 攫取；抓住","f":"v. 攫取；抓住","s":["1791"]},{"w":"grasp","d":"v./n. 理解","f":"v. n. 理解","s":["1791"]},{"w":"grind","d":"v. 磨（反复摩擦碾压）；n. 苦差事、单调乏味的工作（口语、新闻高频）","f":"v. 磨（反复摩擦碾压）\n（vt.）磨碎、碾碎（把固体磨成粉末/颗粒）grind coffee beans / grind wheat into flour（磨咖啡豆 / 把小麦磨成面粉）\n（vt.）磨利、磨光、打磨（工具、表面）grind a knife / grind lenses（磨刀 / 磨镜片——光学玻璃加工）\n（vi.）苦干、埋头苦干（口语高频）grind away at sth / grind through sth\n（n.）苦差事、单调乏味的工作（口语、新闻高频）the daily grind（日常的苦差/乏味的例行公事）","s":["1791"]},{"w":"grip","d":"v. 紧握；n. 控制、支配（对权力、局势的掌控）","f":"v. 紧握\n（vt.）紧握、抓紧（用手或工具抓住不放）She gripped my arm tightly.（她紧紧抓住我的手臂。）\n（vt.）吸引住、深深打动（抓住注意力/情感）The novel gripped me from the first page.\n（n.）控制、支配（对权力、局势的掌控）He has a firm grip on the company.","s":["1675","1791"]},{"w":"grope","d":"v./n. 摸索","f":"v.n. 摸索\ngrope for sth\t摸索找；搜肠刮肚地想。（引申义）苦苦探寻、试探（找答案、措辞、方向）\n（vt.，负面）猥亵、乱摸（性骚扰语境，现代英语中常用）sexual groping allegations\ngrope one's way 摸索着前进","s":["1791"]},{ v. 休会；延期","s":["1791"]},{"w":"adolescent","d":"n. 青少年","f":"n. 青少年[st]The adolescent was excited about starting high school and making new friends[st]The book explores the challenges and experiences of adolescent life","s":["1925"]},{"w":"adventure","d":"n. 冒险，冒险的经历","f":"n. 冒险，冒险的经历","s":["1925"]},{"w":"advice","d":"n. 建议；忠告","f":"n. 建议；忠告","s":["1791"]},{"w":"advisable","d":"adj. 明智的","f":"adj. 明智的\nIt is advisable to do something（做某事是明智的）—— 最经典句式，议论文开头利器。\ndeem it advisable（认为……是妥当的）—— 极其正式的书面语（如法律文书、董事会纪要）。\nperfectly / highly advisable（非常可取/极为明智）—— 加强语气。","s":["1791"]},{"w":"affection","d":"n. 爱，情感","f":"n.爱，情感\nhave/show affection for someone/something（对……怀有喜爱/感情）—— 最核心搭配，介词用 for。\n\nwin/earn someone's affection（赢得某人的好感/芳心）—— 书面语常用，比“win one's heart”更含蓄。\n\ndeep/genuine affection（深厚的/真挚的情意）。","s":["1791"]},{"w":"affectionate","d":"adj. 挚爱的，亲切的","f":"adj. 挚爱的，亲切的\nbe affectionate with someone（对某人很亲昵/深情）—— 介词用 with。\nan affectionate hug/kiss/greeting（深情的拥抱/亲吻/问候）。\nwarm and affectionate（温暖而深情）—— 经典组合，常用来形容人的性格或家庭氛围。","s":["1791"]},{"w":"afflicting","d":"adj. 令人痛苦的；折磨人的","f":"adj. 令人痛苦的；折磨人的","s":["1791"]},{"w":"affluence","d":"n. 富裕","f":"n. 富裕\ngrowing / rising affluence（日益增长的富裕/富足）\na society of affluence（富裕社会）\nmaterial affluence（物质富足）\naffluence and influence（财富与权势）","s":["1791"]},{"w":"affluent","d":"adj. 富裕的","f":"adj.富裕的\naffluent neighbourhood / suburb（富人区/高档郊区）。\naffluent middle class（富裕的中产阶层）","s":["1791"]},{"w":"agitate","d":"v. 物理上译为 搅动/摇动；心理上译为 使焦虑/使不安；社会上译为 鼓动/煽动","f":"v. 物理上译为 搅动/摇动；心理上译为 使焦虑/使不安；社会上译为 鼓动/煽动。\nagitate the mixture / liquid（搅动混合物/液体）—— 实验操作常用。\nbe agitated about / by something（因某事而焦虑不安）—— 心理层面，介词用 about/by，常用被动语态。\nagitate for / against something（鼓吹/呼吁支持某事 / 反对某事）—— 社会层面，固定介词用 for/against。\nagitated state（焦躁不安的状态）—— 形容词形式的高频词组。","s":["1791"]},{"w":"alien","d":"n. 外来的、不属于这个圈子的或相异的","f":"n. “外来的”、“不属于这个圈子的”或“相异的”\nalien invasion（外星人入侵）、hostile alien（敌对的外星生物）\nillegal alien（非法移民/非法外侨——美式法律术语）、alien resident（外籍居民）\nalien environment（陌生环 赞美的；免费赠送的","s":["1791"]},{"w":"comply","d":"v. 遵守、服从、遵从","f":"vi. “遵守、服从、遵从”\ncomply with + 规则/法律/要求/标准\ncomply with the terms / conditions / contract（遵守条款/条件/合同）","s":["1791"]},{"w":"comprehend","d":"v. 理解","f":"v. 理解","s":["1791"]},{"w":"conference","d":"n. 会议；讨论会","f":"n. 会议；讨论会","s":["1791"]},{"w":"confidence","d":"n. 信心","f":"n. 信心","s":["1791"]},{"w":"connivance","d":"n. 默许","f":"n. 默许\nwith the connivance of someone — 在某人的默许下\nsb's connivance in something — 对某事的纵容／默许\nact with connivance — 暗中伙同纵容行事","s":["1791"]},{"w":"connive","d":"v. 纵容；共谋","f":"v. 纵容；共谋","s":["1791"]},{"w":"conversion","d":"n. 变换，转化","f":"n. 变换，转化","s":["1925"]},{"w":"cottonwood","d":"n. [植]三叶杨,棉白杨","f":"n. [植]三叶杨,棉白杨","s":["1925"]},{"w":"crayon","d":"n. 蜡笔、彩笔及其绘画","f":"n. 蜡笔、彩笔及其绘画","s":["1925"]},{"w":"craze","d":"n. 狂热","f":"n. 狂热","s":["1925"]},{"w":"crew","d":"n. 船员","f":"n. 船员","s":["1791"]},{"w":"customs","d":"n. 进口税；海关","f":"n. 进口税；海关","s":["1925"]},{"w":"dangle","d":"v. 悬垂","f":"v. 悬垂\ndangle from something — 从某处悬垂下来 A bunch of keys dangled from his belt.\ndangle in front of someone — 在某人面前晃荡／悬垂 She dangled her earrings in front of the baby to amuse him.\ndangle something before / in front of someone — 用某物吊某人胃口／诱惑某人 The company dangled a promotion in front of him to keep him from quitting.","s":["1791"]},{"w":"despoiler","d":"n. 掠夺者","f":"n. 掠夺者","s":["1925"]},{"w":"dialect","d":"n. 方言；土语；地方话","f":"n. 方言；土语；地方话","s":["1791"]},{"w":"dignify","d":"v. 使尊严；使显贵","f":"v. 使尊严；使显贵","s":["1791"]},{"w":"dignity","d":"n. 尊严","f":"n. 尊严","s":["1791"]},{"w":"discern","d":"v. 辨明","f":"v. 辨明。(用眼睛或脑子，从不太清晰、不太明显的事物中，分辨出某个细节或真相)。\ndiscern the difference / distinction — 辨别差异／区分\ndiscern something from something — 从某物中辨别出某物\ndiscern between A and B — 在A与B之间加以辨别","s":["1791"]},{"w":"discernible","d":"adj. 可察觉的","f":"adj. 可察觉的\nclearly / easily discernible — 清晰可辨的／易于辨认的\nbarely / scarcely discernible — 几乎不可辨的／难以察觉的\ndiscernible difference / distinction — 可辨别的差异／区别","s":["1791"]},{"w":"down-hearted","d":"adj. 灰心丧气的、意志消沉的或心灰意冷的","f":"adj. 灰心丧气的、意志消沉的或心灰意冷的。\nfeel / be downhearted\t感到消沉 / 灰心\tShe felt downhearted after her application was rejected. (申请被拒后，她感到非常消沉。)\nget / become downhearted\t变得灰心起来\tHe got downhearted when he saw the huge amount of work ahead. (看到眼前堆积如山的工作时，他变得灰心起来。)\ndownhearted about (sth.)\t对……感到灰心\tThere's no reason to be downhearted about the future. (没有理由对未来感到灰心。)","s":["1791"]},{"w":"driftwood","d":"n. 漂流木","f":"n. 漂流木[ph]pieces of driftwood[ph]used/gathered driftwood[syn]Driftwood 是特指被水流漂移而来的木材或树木的残余部分。它通常是被海洋、河流或湖泊的水流冲刷、漂浮和带来的木材。Floatwood 和 washed-up wood 可以作为 driftwood 的同义词，都指的是漂流木。","s":["1925"]},{"w":"dripstone","d":"n. 滴水石","f":"n. 滴水石 cn.[syn]Dripstone、stalactite 和 stalagmite 都是指洞穴中的石灰石沉积物。它们都是由于滴水中的矿物质沉积形成的。然而，它们在洞穴中的形成位置和方式不同。Stalactite 是从洞穴顶部悬挂下来的石灰石柱，由滴落的矿物质形成；而 stalagmite 是从地面上升的石灰石柱，由地面上的滴水沉积形成。Dripstone 这个词汇通常用作较为泛指的概念，可包含 stalactite 和 stalagmite。","s":["1925"]},{"w":"equestrian","d":"n./v. 骑马的, (古罗马)市民特权阶层成员的, 骑士阶层的","f":"n. v. 骑马的, (古罗马)市民特权阶层成员的, 骑士阶层的 n./v.","s":["1925"]},{"w":"exotic","d":"adj. 外来的；有异国风味的","f":"adj. 外来的；有异国风味的","s":["1675","1791"]},{"w":"fictitious","d":"adj. 虚构的","f":"adj. 虚构的。编造的、虚假的。特指为欺骗而虚设的细节（姓名/账户），比 imaginary 更具“造假”色彩，法律/金融语境极高频。\ndismiss as fictitious：认为是编造的（不予采信）。\nHis claim was dismissed as fictitious.（他的说法被认定是编造的。）\nuse a fictitious name/address for + 目的：用假名/假地址做……。","s":["1791"]},{"w":"fireproof","d":"adj. 耐火的，防火的","f":"adj. 耐火的，防火的","s":["1925"]},{"w":"flashy","d":"adj. 浮华的","f":"adj. 浮华的[mean]\"flashy\" 是一个形容词，表示浮华的、炫耀的、花哨的，通常用来形容外表或行为过于引人注目、夸张或过分显眼的事物。[ph]flashy car[ph]The restaurant's decor was a bit too flashy for my taste[ph]Despite his flashy appearance","s":["1925"]},{"w":"flavour","d":"n. 风味；口味；v. 给…调味","f":"n. 风味；口味 / v. 给…调味","s":["1791"]},{"w":"fluorescent","d":"adj. 荧光的, 莹光的","f":"adj. 荧光的, 莹光的[mean]fluorescent 是一个常见的词汇，通常用于描述物体发出荧光或指荧光灯这种光源。[st]The room was illuminated by the soft glow of fluorescent lights.[ph]have a fluorescent property[ph]stylish fluorescent dress","s":["1925"]},{"w":"flyspeck","d":"n. 蝇粪留下的污点, 污点","f":"n. 蝇粪留下的污点, 污点[mean]名词含义： 蒙蔽的地方；蒙蔽性错误。作为名词，指文本、文件或其他材料中的小错误或蒙蔽，可能是由于疏忽或细节问题引起的。也可以用来形容瑕疵或微小的错误。 （频率：较少见）[ph]it had a few flyspecks[ph]a few minor flyspecks动词含义： 搜索错误；找出问题。作为动词，指仔细搜索、查找错误或问题，尤其是那些细小的、容易被忽视的错误。 （频率：较少见）[ph]flyspecked the text[ph]flyspecking the layout of the magazine","s":["1925"]},{"w":"forage","d":"n./v. 草料","f":"n. v. 草料 n. [ph]a large quantity of forage v. 觅食 [ph] forage for","s":["1925"]},{"w":"foray","d":"n. 突袭","f":"n. 突袭 [ph]make a foray into jungle/industry [ph] foray into sth.","s":["1925"]},{"w":"frisky","d":"adj. 活泼的，欢闹的","f":"adj. 活泼的，欢闹的[mean]frisky 是一个形容词，通常用来形容动物或人活泼、欢快、调皮或兴奋的状态。[st]The puppy was feeling frisky and ran around the backyard[ph]frisky children playing tag[syn]Frisky、playful、lively 和 mischievous 都表示活泼、欢快或调皮。它们通常用于描述动物或人的行为、性格或状态。Frisky 强调活泼、欢快和有趣的状态，特别适用于形容动物的活跃玩耍。Playful 侧重于嬉戏、玩耍和有趣的行为，可以用于形容孩子或动物的欢乐玩耍。Lively 表示充满生气和活力，可用于形容人、动物或场景的生动和活跃。Mischievous 强调有点调皮、淘气和捣蛋，通常用于形容孩子或动物的捣蛋行为。","s":["1925"]},{"w":"frowzy","d":"adj. 不整洁的，臭的","f":"adj. 不整洁的，臭的。冷门超纲单词，记得意思就行。\n① 形容人/外表：“邋遢的、蓬头垢面的、不修边幅的”（衣服皱巴巴，头发乱糟糟）\n② 形容空气/房间：“闷浊的、有霉味的、空气不流通的”（像一间很久没人开窗的地下室）。","s":["1791"]},{"w":"frustrate","d":"v. 破坏，挫败","f":"v. 破坏，挫败\n1. 针对计划/努力：阻挠、妨碍、使失败\n指外部因素干扰，让某个计划或努力无法成功。\n例句：The bad weather frustrated our plans for a picnic.（恶劣天气阻挠了我们野餐的计划。）\n常见搭配：frustrate an attempt（挫败一次尝试）、frustrate a proposal（阻挠一项提议）。\n2. 针对人（更常用）：使沮丧、使灰心、让某人抓狂\n指因为愿望落空或事情不顺利，让人产生烦躁、失望的无力感。这是日常生活中最高频的用法。\n例句：It frustrates me when people are late for meetings.（开会有人迟到时，这让我很抓狂/沮丧。）\n常见搭配：feel frustrated（感到受挫）、get frustrated with（对...感到灰心）。","s":["1791"]},{"w":"furious","d":"adj. 狂怒的，狂暴的","f":"adj. 狂怒的，狂暴的。furious表达的生气程度远高于angry和mad。\nbe furious with + 人：I was furious with myself for making that mistake.（我对自己犯那个错气疯了。）\nbe furious about/at + 事：She is furious about the decision.（她对这个决定极其愤怒。）\nat a furious speed. 以飞快的速度(行驶)","s":["1791"]},{"w":"grateful","d":"adj. 感谢的","f":"adj. 感谢的","s":["1791"]},{"w":"gratitude","d":"n. 感激；感谢","f":"n. 感激；感谢","s":["1791"]},{"w":"grieve","d":"v. 感到悲痛、哀悼（尤其因亲人离世）","f":"v. \n（vi.）感到悲痛、哀悼（尤其因亲人离世）grieve for / over / about + 人或事\n（vt.）使悲伤、使痛心（书面语、正式用法）It grieves me to say this, but...（这样说让我很难过，但是……）\ngrieve at the loss of sb\t因失去某人而悲痛","s":["1791"]},{"w":"grieved","d":"adj. 伤心的","f":"adj. 伤心的\n感到悲痛、哀悼 She grieved for months after losing her dog.（她失去狗后悲痛了好几个月。）\n悲痛的、伤心的 be grieved at / by / over sth 因……而悲伤","s":["1791"]},{"w":"harsh","d":"adj. 严酷的、严厉的、刺耳的","f":"adj. 严酷的、严厉的、刺耳的\n（环境/气候）严酷的、恶劣的\n例句：The expedition had to survive the harsh Arctic winter.（探险队必须在严酷的北极寒冬中生存下来。）\n例句：Plants that grow in harsh environments must be adaptable.（生长在严酷环境中的植物必须具有适应力。）\n（批评/惩罚）严厉的、苛刻的\n例句：The judge imposed a harsh sentence.（法官作出了严厉的判决。）\n例句：He received harsh criticism for his mistakes.（他因错误受到了严厉的批评。）\n（声音/光线）刺耳的、刺眼的\n例句：The harsh light of the deser sun made it hard to see.（沙漠刺眼的阳光让人难以看清东西。）\n例句：Her voice sounded harsh and unfriendly.（她的声音听起来刺耳且不友好。）\n（化学品等）刺激性强的、伤皮肤的\n例句：This soap is too harsh for sensitive skin.（这款肥皂对敏感皮肤刺激性太强。）","s":["1675","1791"]},{"w":"hatred","d":"n. 深切的、长期的、强烈的憎恨","f":"n. 深切的、长期的、强烈的憎恨\nfeel/harbor/develop hatred of sth./ for sb./ towards sb.","s":["1791"]},{"w":"hearsay","d":"n. 传闻、道听途说；(法律) 传闻证据","f":"n. 传闻、道听途说；(法律) 传闻证据","s":["1791"]},{"w":"hesitate","d":"v. 犹豫；踌躇；含糊","f":"v. 犹豫；踌躇；含糊","s":["1791"]},{"w":"hideous","d":"adj. 骇人听闻的，丑恶的","f":"adj. 骇人听闻的，丑恶的\n表达审美灾难 hideous dress/sweater（丑爆的裙子/毛衣）、hideous wallpaper（丑出天际的墙纸）、hideous curtains（辣眼睛的窗帘）、hideous haircut（糟糕的发型）。\n形容天气、路况和“糟心局面”（占比约30%） hideous traffic（堵到怀疑人生）、hideous weather（鬼天气）、hideous commute（通勤简直噩梦）、hideous quarterly report（季度报表难看得没法看）。","s":["1791"]},{"w":"hoarse","d":"adj. （声音）沙哑的、嘶哑的(是该语义的通用单词)","f":"adj.（声音）沙哑的、嘶哑的(是该语义的通用单词)\nHoarse voice（沙哑的嗓音）：最通用。\n“I woke up with a hoarse voice this morning.”（我今早起来嗓子哑了。）\nHoarse throat（沙哑的喉咙/喉咙发紧发哑）：虽然语法上“喉咙”本身不会“嘶哑”，但美国人非常习惯这么说，等同于“喉咙不舒服导致声音变了”。\n“I have a hoarse throat from yelling at the game.”（我在比赛时喊得嗓子都哑了。）\nHoarse whisper（沙哑的耳语/气音）：形容那种费力挤出声音的感觉。\n“He could only manage a hoarse whisper.”（他只能勉强发出嘶哑的耳语声。）","s":["1791"]},{"w":"hovercraft","d":"n. 气垫船","f":"n. 气垫船","s":["1925"]},{"w":"howl","d":"v./n. 嚎叫、呼啸或高声呼喊","f":"v.n. （长而响亮的）嚎叫、呼啸或高声呼喊\n动物的嚎叫（最原始的含义）howl at. The wolves howled at the moon all night.\n人的情绪宣泄（大笑、痛哭或大喊）howl with laughter. The comedian had the whole audience howling with laughter.\n自然界的呼啸（风声或暴风雨）The wind howled outside the cabin all night","s":["1791"]},{"w":"humorous","d":"adj. 幽默的","f":"adj. 幽默的","s":["1791"]},{"w":"hunger","d":"n. 饥饿；渴望","f":"n. 饥饿；渴望","s":["1791"]},{"w":"hustle","d":"v./n. 催促；推搡；忙碌","f":"v./n. 催促；推搡；忙碌","s":["1791"]},{"w":"idiot","d":"n. 白痴；傻子","f":"n. 白痴；傻子","s":["1791"]},{"w":"idol","d":"n. 偶像","f":"n. 偶像","s":["1791"]},{"w":"ignorance","d":"n. 无知","f":"n. 无知","s":["1791"]},{"w":"impulsive","d":"adj. 易冲动的,任性的","f":"adj. 易冲动的,任性的。一个人不经过大脑思考，纯粹因为“突然想”就立刻行动。\nImpulsive + decision / purchase / behavior（冲动的决定/购买/行为）\nImpulsive + person / nature / child（冲动的人/天性/孩子）\nOn an impulsive whim（一时兴起）—— She called him on an impulsive whim.（她一时兴起给他打了电话。）","s":["1791"]},{"w":"industrial","d":"adj. 工业的","f":"adj. 工业的","s":["1791"]},{"w":"infect","d":"v. 传染；感染","f":"v. 传染；感染","s":["1791"]},{"w":"insane","d":"adj. 发狂；精神错乱的","f":"adj. 发狂；精神错乱的","s":["1791"]},{"w":"intersected","d":"v. 相交；交叉；adj. 相交的；交叉的","f":"v. 相交；交叉；adj. 相交的；交叉的","s":["1925"]},{"w":"intersection","d":"n. 十字路口, 交叉点","f":"n. 十字路口, 交叉点[mean]Intersection是一个名词，表示两个或多个物体、线条或路径相交或交叉的地方。[ph]busy intersection downtown[ph]intersection of the two rivers[ph]intersection of art and politics","s":["1925"]},{"w":"intoxicate","d":"v. 使陶醉；使中毒","f":"v. 使陶醉；使中毒","s":["1675","1791"]},{"w":"inviting","d":"adj. 诱人的；引人注目的","f":"adj. 诱人的；引人注目的","s":["1791"]},{"w":"loath","d":"adj. 不情愿的；不愿意的","f":"adj. 不情愿的；不愿意的","s":["1791"]},{"w":"loathe","d":"v. 厌恶；憎恶","f":"v. 厌恶；憎恶","s":["1791"]},{"w":"lottery","d":"n. 彩票；碰运气的事","f":"n. 彩票；碰运气的事","s":["1791"]},{"w":"lure","d":"v. 诱惑","f":"v. 诱惑","s":["1791"]},{"w":"matchstick","d":"n. 火柴杆","f":"n. 火柴杆","s":["1925"]},{ const GIST_KEY = 'merged_gist_sync';
const GIST_DESC = 'TOEFL-vocab-hard-words-sync';
let gistToken = '', gistId = '';

function gistLoadCreds() {
  try {
    const s = JSON.parse(localStorage.getItem(GIST_KEY) || '{}');
    gistToken = s.token || '';
    gistId = s.gistId || '';
  } catch(e) {}
}
function gistSaveCreds() {
  try { localStorage.setItem(GIST_KEY, JSON.stringify({ token: gistToken, gistId })); } catch(e) {}
}

function syncMsg(text, cls) {
  const el = document.getElementById('syncMsg');
  el.className = 'sync-status ' + (cls || 'info');
  el.textContent = text;
}

function syncOpen() {
  document.getElementById('syncModal').classList.add('open');
  const inp = document.getElementById('syncToken');
  inp.value = gistToken;
  document.getElementById('syncMsg').textContent = '';
  if (gistToken && gistId) syncMsg('已连接 · Gist ID: ' + gistId.slice(0,8) + '...', 'ok');
}
function syncClose() {
  document.getElementById('syncModal').classList.remove('open');
}

async function gistFetch(url, opts) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'token ' + gistToken, 'Accept': 'application/vnd.github.v3+json', ...(opts?.headers || {}) },
  });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0,100));
  return res.json();
}

async function gistFindExisting() {
  const gists = await gistFetch('https://api.github.com/gists?per_page=100');
  return gists.find(g => g.description === GIST_DESC);
}

async function gistCreate() {
  return gistFetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: GIST_DESC,
      public: false,
      files: { 'hard-words.json': { content: JSON.stringify([...hardWords]) } }
    })
  });
}

async function gistPush() {
  if (!gistToken || !gistId) return;
  try {
    await gistFetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'hard-words.json': { content: JSON.stringify([...hardWords]) } } })
    });
  } catch(e) { console.warn('Gist push failed:', e); }
}

async function gistPull() {
  if (!gistToken || !gistId) return;
  try {
    const g = await gistFetch('https://api.github.com/gists/' + gistId);
    const content = g.files['hard-words.json']?.content;
    if (content) {
      const arr = JSON.parse(content);
      if (Array.isArray(arr)) {
        arr.forEach(w => { if (typeof w === 'string') hardWords.add(w); });
        saveHard();
      }
    }
  } catch(e) { console.warn('Gist pull failed:', e); }
}

async function syncLogin() {
  const inp = document.getElementById('syncToken');
  const token = inp.value.trim();
  if (!token) { syncMsg('请先粘贴 Token', 'err'); return; }
  gistToken = token;
  syncMsg('连接中...', 'info');
  try {
    // Verify token
    await gistFetch('https://api.github.com/user');
    // Find existing Gist
    const existing = await gistFindExisting();
    if (existing) {
      gistId = existing.id;
      gistSaveCreds();
      syncMsg('已找到已有同步 Gist，正在拉取...', 'info');
      await gistPull();
      render(searchInput.value);
      syncMsg('✅ 同步成功！已合并 ' + hardWords.size + ' 个难词', 'ok');
    } else {
      syncMsg('创建同步 Gist...', 'info');
      const g = await gistCreate();
      gistId = g.id;
      gistSaveCreds();
      syncMsg('✅ 已连接！' + hardWords.size + ' 个难词已上传', 'ok');
    }
  } catch(e) {
    gistToken = ''; gistId = '';
    syncMsg('❌ 连接失败: ' + e.message, 'err');
  }
}

async function syncNow() {
  if (!gistToken || !gistId) { syncMsg('请先连接', 'err'); return; }
  syncMsg('同步中...', 'info');
  try {
    await gistPull();
    await gistPush();
    render(searchInput.value);
    syncMsg('✅ 同步完成！共 ' + hardWords.size + ' 个难词', 'ok');
  } catch(e) {
    syncMsg('❌ 同步失败: ' + e.message, 'err');
  }
}

function syncLogout() {
  gistToken = ''; gistId = '';
  localStorage.removeItem(GIST_KEY);
  document.getElementById('syncToken').value = '';
  syncMsg('已退出', 'info');
}

let audioEl = null;
let audioRequestId = 0;
const ttsPreferred = new Map();   // word -> url that actually played
function ttsUrls(word) {
  const cached = ttsPreferred.get(word);
  const w = encodeURIComponent(word);
  const youdaoUs = "https://dict.youdao.com/dictvoice?audio=" + w + "&type=2";
  // The UK recording is clearer for ken; keep the standard US recording for other words.
  const preferred = word === "ken"
    ? "https://dict.youdao.com/dictvoice?audio=" + w + "&type=1"
    : youdaoUs;
  const chain = [preferred];
  if (cached) return [cached].concat(chain.filter(u => u !== cached));
  return chain;
}
function playChain(word, requestId, done) {
  const urls = ttsUrls(word);
  let index = 0;
  const next = () => {
    if (requestId !== audioRequestId) return;
    if (index >= urls.length) {
      audioEl = null;
      done();
      return;
    }
    const url = urls[index++];
    const audio = new Audio(url);
    audioEl = audio;
    audio.onerror = next;
    audio.onended = () => {
      if (requestId !== audioRequestId) return;
      audioEl = null;
      done();
    };
    audio.onplaying = () => { ttsPreferred.set(word, url); };
    audio.play().catch(next);
  };
  next();
}
function stopAudio() {
  audioRequestId++;
  if (audioEl) {
    audioEl.onerror = null; audioEl.onended = null; audioEl.onplaying = null;
    try { audioEl.pause(); audioEl.currentTime = 0; } catch(e) {}
    audioEl = null;
  }
}
function speak(word) {
  const clean = word.replace(/['’]/g, "'");
  stopAudio();
  if (!clean) return;
  playChain(clean, audioRequestId, () => {});
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp('(' + esc + ')', 'gi'), '<mark>$1</mark>');
}

  // 2026 权重说明
  if (!q) {
    html += `<div class="prio-banner">🔥 <b>徽章＝2026 真实考场权重</b>：数字是该学科在 2026 改版后 237 条去重讲座话题（29 个考试日）里的占比。`
      + `<b>艺术 23.2%</b> 居首，<b>经济商业 10.1%</b>（旧格式仅 3.0%），而<b>天文只剩 1.7%</b>（旧格式 11.1%）。`
      + `🎓 对话·公告类不参与讲座统计，但自适应低分支<b>只有</b>对话和公告，属全员必备。`
      + `🆕 标签 = 从 2026 真题话题反推出来的新增术语（本表 ${TOTAL_2026} 词）。`
      + `口径与样本局限见仓库内 <code>2026听力学科场景占比-2026-09-02.md</code>。</div>`;
  }

  // Topic nav
  html += '<div class="topic-nav">';
  view.forEach(({ t, i }) => {
    if (!topicPass(t)) return;
    const filtered = wordFilter(t.words);
    if (filtered.length > 0) {
      const badge = t.w26 != null
        ? `<span class="w26" style="color:${t.tierColor}">${t.tierEmoji}${t.w26}%</span>`
        : (t.tierEmoji ? `<span class="w26" style="color:${t.tierColor}">${t.tierEmoji}</span>` : '');
      const topicKey = t.emoji + ' ' + t.name.split(' ')[0];
      const topicActive = typeof abTopic !== 'undefined' && abTopic === topicKey;
      html += `<a class="topic-chip${topicActive ? ' active' : ''}" href="#sec${i}" onclick="selectAbTopic(${JSON.stringify(topicKey)},event)" title="${topicActive ? '取消该话题范围' : '只连播该话题'}">${t.emoji} ${t.name.split(' ')[0]}<span class="cnt">${filtered.length}</span>${badge}</a>`;
    }
  });
  html += '</div>';

  view.forEach(({ t, i: ti }) => {
    if (!topicPass(t)) return;
    const items = wordFilter(t.words);
    if (items.length === 0) return;
    totalShown += items.length;

    const isCollapsed = collapsed[ti] && !q;
    const secBadge = t.w26 != null
      ? `<span class="w26 sec-w26" style="color:${t.tierColor}">${t.tierEmoji} 2026 讲座 ${t.w26}%</span>`
      : `<span class="w26 sec-w26" style="color:${t.tierColor}">${t.tierEmoji} ${t.tier}</span>`;
    html += `<div class="section" id="sec${ti}">`;
    html += `<div class="sec-head">`;
    html += `<span class="sec-emoji">${t.emoji}</span>`;
    html += `<span class="sec-title">${escHtml(t.name)}</span>`;
    html += secBadge;
    html += `<span class="sec-cnt">${items.length} 词</span>`;
    html += `<button class="sec-toggle" onclick="toggleSec(${ti})">${isCollapsed ? '展开' : '折叠'}</button>`;
    html += `</div>`;
    if (t.note && t.tier !== '通用') {
      const newTag = t.n2026 > 0 ? ` · 本组含 <b>${t.n2026}</b> 个 2026 真题词` : '';
      html += `<div class="sec-note"><b>${t.tier}</b>｜${escHtml(t.note)}${newTag}</div>`;
    }

    if (!isCollapsed) {
      html += '<div class="wlist">';
      items.forEach(w => {
        const srcBadge = w.s.join('+');
        const isHard = hardWords.has(w.w);
        const gIdx = WORD_IDX[w.w];
        const is2026 = w.s.indexOf('2026') >= 0;
        html += `<div class="witem${isHard ? ' is-hard' : ''}" onclick="this.classList.toggle('expanded')">`;
        html += `<div class="ww"><span class="widx">${gIdx + 1}</span>${highlight(w.w, q)}${is2026 ? '<span class="w26" style="color:#ff6b4a" title="2026 真实考场讲座话题反推出的术语">🆕</span>' : ''}<button class="spk-btn" onclick="event.stopPropagation();speak('${w.w}')" title="发音">🔊</button><button class="mark-btn${isHard ? ' marked' : ''}" onclick="toggleHard('${w.w}',event)" title="${isHard ? '取消标记' : '标记为难词'}">⭐</button></div>`;
        html += `<div class="wd">${highlight(w.d, q)}</div>`;
        html += `<div class="wsrc">${srcBadge}</div>`;
        if (w.f) {
          html += `<div class="full">${highlight(w.f, q)}</div>`;
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  if (totalShown === 0) {
    html += `<div class="empty">${showHardOnly ? '还没有标记难词，点击单词旁 ⭐ 标记' : (show2026Only || showHighYieldOnly ? '当前筛选下没有词汇，试着关掉 🆕 / 🔥 筛选' : '未找到匹配的单词')}</div>`;
  }

  mainEl.innerHTML = html;
  statsEl.textContent = q
    ? `找到 ${totalShown} 个词汇`
    : showHardOnly
      ? `⭐ ${totalShown} 个难词`
      : show2026Only || showHighYieldOnly
        ? `当前筛选 ${totalShown} 个词汇`
        : `5013 个词汇 · 45 个学科 · 🆕 614 个 2026 真题词`;
}

function toggleSec(idx) {
  collapsed[idx] = !collapsed[idx];
  render(searchInput.value);
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => render(searchInput.value), 200);
});

// ─── Build indexes ───
const ALL_WORDS = [];
const WORD_TOPIC = {};
const WORD_IDX = {};
DATA.forEach(t => t.words.forEach(w => {
  WORD_IDX[w.w] = ALL_WORDS.length;
  ALL_WORDS.push(w);
  WORD_TOPIC[w.w] = t.emoji + ' ' + t.name.split(' ')[0];
}));

let abTopic = null;
render('');

// ─── Auto-play ───

let abPlaying = false, abIdx = 0, abToken = 0, abHardOnly = false;
function abGetList() {
  let list = abTopic ? ALL_WORDS.filter(w => WORD_TOPIC[w.w] === abTopic) : ALL_WORDS;
  return abHardOnly ? list.filter(w => hardWords.has(w.w)) : list;
}
let abWake = null, abTimer = null;
const abBar = document.getElementById('autobar');
const abToggleBtn = document.getElementById('abToggle');
const abPlayBtn = document.getElementById('abPlayBtn');
const abWordEl = document.getElementById('abWord');
const abPosEl = document.getElementById('abPos');
const abDefEl = document.getElementById('abDef');
const abStartInput = document.getElementById('abStart');
const abGapSel = document.getElementById('abGap');

// Load saved position
const AB_KEY = 'merged_autoplay';
function abLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(AB_KEY) || '{}');
    if (s.idx >= 0 && s.idx < ALL_WORDS.length) abIdx = s.idx;
    if (s.gap) abGapSel.value = String(s.gap);
  } catch(e) {}
}
function abSave() {
  try {
    localStorage.setItem(AB_KEY, JSON.stringify({ idx: abIdx, gap: parseInt(abGapSel.value) }));
  } catch(e) {}
}

function speakAsync(word) {
  return new Promise(resolve => {
    const clean = word.replace(/['’]/g, "'");
    if (!clean) { resolve(); return; }
    stopAudio();
    playChain(clean, audioRequestId, resolve);
  });
}

function sleepCancelable(ms) {
  return new Promise(resolve => {
    abWake = resolve;
    abTimer = setTimeout(resolve, ms);
  });
}

function abScrollToCurrent() {
  const playing = document.querySelector('.witem.playing');
  if (playing) playing.scrollIntoView({ behavior: 'smooth', block: 'center' });
}

function abUpdateUI() {
  const list = abGetList();
  const w = list[abIdx];
  abPlayBtn.textContent = abPlaying ? '⏸ 暂停' : '▶ 连播';
  abToggleBtn.textContent = abPlaying ? '⏸' : '▶';
  abWordEl.textContent = w ? w.w : '—';
  abDefEl.textContent = w ? (w.d || w.f || '') : '';
  abPosEl.textContent = list.length ? (abIdx + 1) + '/' + list.length : '0/0';
  abStartInput.value = list.length ? abIdx + 1 : 0;
  document.getElementById('abHardOnly').classList.toggle('active', abHardOnly);

  // Highlight current word in list
  document.querySelectorAll('.witem.playing').forEach(el => el.classList.remove('playing'));
  if (w) {
    const items = document.querySelectorAll('.witem');
    items.forEach(el => {
      const ww = el.querySelector('.ww');
      if (ww && ww.textContent.replace(/🔊|⭐/g,'').trim() === w.w) {
        el.classList.add('playing');
      }
    });
  }
}

async function abLoop() {
  const token = ++abToken;
  while (abPlaying && token === abToken) {
    const list = abGetList();
    if (!list.length) { abStop(); return; }
    if (abIdx >= list.length) {
      abIdx = 0; abSave(); abStop();
      return;
    }
    abUpdateUI();
    const playing = document.querySelector('.witem.playing');
    if (playing) playing.scrollIntoView({ behavior: 'smooth', block: 'center' });

    await speakAsync(list[abIdx].w);
    if (!abPlaying || token !== abToken) return;

    const gap = parseInt(abGapSel.value, 10) || 0;
    if (gap) {
      await sleepCancelable(gap);
      if (!abPlaying || token !== abToken) return;
    }

    abIdx++; abSave(); abUpdateUI();
    if (abIdx >= abGetList().length) continue;
  }
}

function abStart() {
  if (abPlaying) return;
  const list = abGetList();
  if (!list.length) { return; }
  if (abIdx >= list.length) abIdx = 0;
  abPlaying = true;
  abUpdateUI();
  abLoop();
}

function abStop() {
  abPlaying = false;
  abToken++;
  if (abTimer) { clearTimeout(abTimer); abTimer = null; }
  if (abWake) { const w = abWake; abWake = null; w(); }
  if (audioEl) { try { audioEl.pause(); } catch(e) {} audioEl.onended = null; audioEl.onerror = null; }
  abUpdateUI();
}

// Toggle bar visibility
abToggleBtn.onclick = () => {
  const show = abBar.classList.contains('hidden');
  abBar.classList.toggle('hidden', !show);
  document.body.classList.toggle('autobar-open', show);
  abToggleBtn.style.display = show ? 'none' : '';
  if (show) abUpdateUI();
};

abPlayBtn.onclick = () => { abPlaying ? abStop() : abStart(); };

abWordEl.onclick = () => {
  abScrollToCurrent();
};

document.getElementById('abClose').onclick = () => {
  abStop();
  abBar.classList.add('hidden');
  document.body.classList.remove('autobar-open');
  abToggleBtn.style.display = '';
};

document.getElementById('abPrev').onclick = () => {
  if (abIdx > 0) { abIdx--; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

document.getElementById('abNext').onclick = () => {
  const list = abGetList();
  if (abIdx < list.length - 1) { abIdx++; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

function abJumpToInput() {
  const list = abGetList();
  const v = parseInt(abStartInput.value, 10);
  if (!Number.isInteger(v) || v < 1 || v > list.length) {
    abUpdateUI();
    return;
  }
  abIdx = v - 1;
  abSave();
  if (abPlaying) { abStop(); abStart(); }
  else {
    abUpdateUI();
    abScrollToCurrent();
  }
}

// Mobile keyboards often do not reliably trigger change, so support both
// an explicit button and the Enter key in addition to blur/change.
document.getElementById('abJump').onclick = abJumpToInput;
abStartInput.onchange = abJumpToInput;
abStartInput.onkeydown = (e) => {
  if (e.key === 'Enter') {
    e.preventDefault();
    abJumpToInput();
    abStartInput.blur();
  }
};

abGapSel.onchange = () => { abSave(); };

document.getElementById('abHardOnly').onclick = () => {
  abHardOnly = !abHardOnly;
  abIdx = 0; abSave();
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

function selectAbTopic(topicKey, event) {
  if (event) event.preventDefault();
  abTopic = abTopic === topicKey ? null : topicKey;
  abIdx = 0;
  abSave();
  if (abPlaying) { abStop(); abStart(); }
  render(searchInput.value);
  abUpdateUI();
  const section = [...document.querySelectorAll('.section')].find(el => {
    const title = el.querySelector('.sec-title');
    return title && (el.querySelector('.sec-emoji')?.textContent + ' ' + title.textContent.split(' ')[0]) === topicKey;
  });
  if (section) section.scrollIntoView({ behavior: 'smooth', block: 'start' });
}

// Click a word's speaker button to set autoplay position
mainEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.spk-btn');
  if (!btn) return;
  const word = btn.getAttribute('onclick')?.match(/speak\('([^']+)'\)/)?.[1];
  if (!word) return;
  const list = abGetList();
  const idx = list.findIndex(w => w.w === word);
  if (idx >= 0) {
    abIdx = idx; abSave(); abUpdateUI();
  }
});

abLoad();
abUpdateUI();

// ─── Focus mode ───
let focusOpen = false;
const focusOverlay = document.getElementById('focusOverlay');
const focusWordEl = document.getElementById('focusWord');
const focusDefEl = document.getElementById('focusDef');
const focusFullEl = document.getElementById('focusFull');
const focusPosEl = document.getElementById('focusPos');
const focusMarkEl = document.getElementById('focusMark');
const focusPlayBtn = document.getElementById('focusPlayBtn');

function focusUpdateUI(keepRevealed) {
  const list = abGetList();
  const w = list[abIdx];
  focusWordEl.textContent = w ? w.w : '—';
  focusDefEl.textContent = w ? (w.d || '') : '';
  focusFullEl.textContent = w ? (w.f && w.f !== w.d ? w.f : '') : '';
  focusPosEl.textContent = list.length ? (abIdx + 1) + ' / ' + list.length : '';
  document.getElementById('focusTopic').textContent = w ? (WORD_TOPIC[w.w] || '') : '';
  focusMarkEl.classList.toggle('marked', w ? hardWords.has(w.w) : false);
  focusPlayBtn.textContent = abPlaying ? '⏸ 暂停' : '▶ 连播';
  document.getElementById('focusHardBtn').classList.toggle('active', abHardOnly);
  if (!keepRevealed) {
    focusOverlay.classList.remove('revealed');
    document.getElementById('focusHint').style.display = '';
  }
}

function focusEnter() {
  focusOpen = true;
  focusOverlay.classList.add('open');
  document.querySelector('header').style.display = 'none';
  mainEl.style.display = 'none';
  document.querySelector('.foot').style.display = 'none';
  abBar.style.display = 'none';
  abToggleBtn.style.display = 'none';
  focusUpdateUI();
}

function focusClose() {
  focusOpen = false;
  focusOverlay.classList.remove('open');
  document.querySelector('header').style.display = '';
  mainEl.style.display = '';
  document.querySelector('.foot').style.display = '';
  abBar.style.display = '';
  abBar.classList.remove('hidden');
  document.body.classList.add('autobar-open');
  abUpdateUI();
}

function focusSpeak() {
  const list = abGetList();
  const w = list[abIdx];
  if (w) speak(w.w);
}

function focusPrev() {
  if (abIdx > 0) { abIdx--; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

function focusNext() {
  const list = abGetList();
  if (abIdx < list.length - 1) { abIdx++; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

function focusTogglePlay() {
  abPlaying ? abStop() : abStart();
  focusUpdateUI();
}

focusMarkEl.onclick = () => {
  const list = abGetList();
  const w = list[abIdx];
  if (w) {
    if (hardWords.has(w.w)) hardWords.delete(w.w); else hardWords.add(w.w);
    saveHard();
    focusUpdateUI();
  }
};

document.getElementById('abFocusBtn').onclick = () => { focusEnter(); };

// Reveal only on a genuine click. A drag is reserved for selecting/copying text.
const focusRevealArea = document.getElementById('focusRevealArea');
let focusPointerDown = null;
focusRevealArea.addEventListener('pointerdown', (e) => {
  focusPointerDown = { x: e.clientX, y: e.clientY };
});
focusRevealArea.addEventListener('click', (e) => {
  const selection = window.getSelection();
  const moved = focusPointerDown && Math.hypot(e.clientX - focusPointerDown.x, e.clientY - focusPointerDown.y) > 6;
  focusPointerDown = null;
  if (moved || (selection && !selection.isCollapsed)) return;
  const revealed = focusOverlay.classList.toggle('revealed');
  document.getElementById('focusHint').style.display = revealed ? 'none' : '';
});

function focusToggleHard() {
  abHardOnly = !abHardOnly;
  abIdx = 0; abSave();
  document.getElementById('focusHardBtn').classList.toggle('active', abHardOnly);
  document.getElementById('abHardOnly').classList.toggle('active', abHardOnly);
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

// Update focus UI when autoplay advances
const _origAbUpdateUI = abUpdateUI;
abUpdateUI = function() {
  _origAbUpdateUI();
  if (focusOpen) focusUpdateUI();
};

// Keyboard shortcuts in focus mode
document.addEventListener('keydown', (e) => {
  if (!focusOpen) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); focusPrev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); focusNext(); }
  else if (e.key === ' ') { e.preventDefault(); focusTogglePlay(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); focusSpeak(); }
  else if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    const revealed = focusOverlay.classList.toggle('revealed');
    document.getElementById('focusHint').style.display = revealed ? 'none' : '';
  }
  else if (e.key === 'Escape') { focusClose(); }
});
</script>
</body>
</html>

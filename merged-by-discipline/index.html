 of sentimental words[syn]emotional，但它们之间的区别在于，sentimental更强调对情感有强烈的感知和反应，常常带有怀旧和感伤的情感色彩，而emotional更一般地指涉及各种情绪和感情的。","s":["1675","1925"]},{"w":"sentimentalism","d":"感情主意，感情用事指的是感伤主义，是一种文学或艺术风格或态度","f":"感情主意，感情用事[n]指的是感伤主义，是一种文学或艺术风格或态度，强调对情感、感情和个人经历的强烈表达和赋予作品深情的情感色彩。[st]The novel is characterized by its sentimentalism[st]The paintings of that era are often criticized for their excessive sentimentalism","s":["1925"]},{"w":"serene","d":"平静的，安详的用于形容宁静的、平和的或安详的，指一个地方、氛","f":"平静的，安详的[adj]用于形容宁静的、平和的或安详的，指一个地方、氛围或人的状态表现出平静和宁静。[ph]absolutely serene[ph]a serene spot[syn]calm，但它们之间的区别在于，serene更强调宁静和平和，常常含有一种令人感到安详和舒适的感觉，而calm则更一般地指缺乏紧张或动荡。","s":["1675","1925"]},{"w":"shock","d":"震动，震惊","f":"震动，震惊[ph]was a shock to sb.[st]The patient went into shock after the traumatic incident.","s":["1925"]},{"w":"sinister","d":"恶意的；凶兆的，不祥的","f":"a.恶意的；凶兆的，不祥的","s":["1675"]},{"w":"solemn","d":"严肃的；庄严的，隆重的","f":"严肃的；庄严的，隆重的[ph]solemn ceremony[ph]exchange solemn vows","s":["1925"]},{"w":"solicitous","d":"热切的，挂念的","f":"adj．热切的，挂念的","s":["1675"]},{"w":"solitude","d":"孤独；独处","f":"孤独；独处 n.[ph]peaceful solitude of the mountains[ph]moments of solitude by the lake[ph]seek solitude","s":["1925"]},{"w":"startle","d":"使吓一跳，使大吃一惊","f":"使吓一跳，使大吃一惊：frighten or surprise","s":["1675"]},{"w":"striking","d":"引人注目的，明显的","f":"a.引人注目的，明显的","s":["1675","1925"]},{"w":"suspense","d":"悬念，不确定；挂念","f":"n.悬念，不确定；挂念","s":["1675","1925"]},{"w":"tedious","d":"因冗长而沉闷、乏味的","f":"a.因冗长而沉闷、乏味的","s":["1675","1925"]},{"w":"temperament","d":"气质，性情","f":"气质，性情","s":["1675"]},{"w":"terrify","d":"使恐怖，使惊吓","f":"使恐怖，使惊吓","s":["1925"]},{"w":"timid","d":"胆怯的，羞怯的","f":"胆怯的，羞怯的","s":["1925"]},{"w":"torment","d":"痛苦折磨","f":"n.痛苦 vt.折磨","s":["1675"]},{"w":"torturous","d":"折磨人的，痛苦的","f":"adj. 折磨人的，痛苦的","s":["1675"]},{"w":"touchy","d":"敏感的，易发脾气的","f":"a.敏感的，易发脾气的","s":["1675"]},{"w":"tranquil","d":"宁静的，安静的","f":"宁静的，安静的","s":["1925"]},{"w":"trepidation","d":"恐惧，惶恐","f":"n.恐惧，惶恐","s":["1675"]},{"w":"triumph","d":"胜利","f":"胜利","s":["1925"]},{"w":"uncanny","d":"不可思议的，异乎寻常的","f":"a.不可思议的，异乎寻常的","s":["1675"]},{"w":"uproar","d":"骚动；喧嚣；哗然","f":"n. 骚动；喧嚣；哗然","s":["1675"]},{"w":"upset","d":"心烦意乱的","f":"心烦意乱的","s":["1925"]},{"w":"vex","d":"使烦恼恼怒","f":"vt.使烦恼,恼怒","s":["1675"]},{"w":"weary","d":"疲倦的；厌倦的","f":"疲倦的；厌倦的","s":["1925"]}]},{"name":"社会关系 Social Relations","emoji":"🤝","words":[{"w":"accommodate","d":"容纳；适应；提供住宿","f":"v. 容纳；适应；提供住宿","s":["1675","1791"]},{"w":"acquaintance","d":"相识的人","f":"n. 相识的人 [ph] have some acquaintance with[syn]\"acquaintance\" 和 \"associate\"、\"contact\"、\"connection\" 都指的是人际关系中的认识或联系。然而，\"acquaintance\" 更强调我们认识但不太熟悉的人，常用于形容浅显的关系。\"associate\" 强调与某人有密切关系，通常指的是工作、业务或社交上的伙伴。\"contact\" 强调与某人建立或保持沟通和联系。\"connection\" 则指的是我们认识的人或机构，有某种联系或关联。","s":["1925"]},{"w":"alliance","d":"联盟，同盟（与结成联盟万能动作搭配）（战略联盟商务会议高频词","f":"n. 联盟，同盟\nForm/enter into an alliance (with)（与……结成联盟——万能动作搭配）\nStrategic alliance（战略联盟——商务会议高频词）\nIn alliance with（与……联合/联手——用于描述状态）","s":["1791"]},{"w":"ally","d":"盟友结盟","f":"n. 盟友 / v. 结盟","s":["1791"]},{"w":"amend","d":"修正；改进（法律、文件）","f":"v. 修正；改进（法律、文件）","s":["1791"]},{"w":"antagonism","d":"主动敌对、刻意对抗（与之间的对抗）、（对的敌意）（药物拮抗作","f":"n. 主动敌对、刻意对抗\nantagonism between A and B（A与B之间的对抗）、antagonism toward(s) sb/sth（对……的敌意）\ndrug antagonism（药物拮抗作用）、competitive antagonism（竞争性拮抗）\ncentral antagonism（核心矛盾冲突）","s":["1791"]},{"w":"antagonist","d":"对立角色、反派、对抗者（主要反派）、（邪恶的反派）（政敌）、","f":"n. 对立角色、反派、对抗者\nmain/primary antagonist（主要反派）、villainous antagonist（邪恶的反派）\npolitical antagonist（政敌）、formidable antagonist（强劲的对手）\nmuscle antagonist（拮抗肌）、drug antagonist（药物拮抗剂）","s":["1791"]},{"w":"appeal","d":"呼吁；上诉；吸引","f":"v./n. 呼吁；上诉；吸引","s":["1791"]},{"w":"appoint","d":"任命；指定；约定","f":"v. 任命；指定；约定","s":["1791"]},{"w":"associate","d":"联合；伙伴","f":"v. 联合；伙伴","s":["1791"]},{"w":"association","d":"协会；关联","f":"n. 协会；关联","s":["1791"]},{"w":"betray","d":"背叛；泄露","f":"v. 背叛；泄露","s":["1925","1791"]},{"w":"blame","d":"谴责","f":"v. 谴责","s":["1791"]},{"w":"chide","d":"轻责温和责备偏老派名词（因而责备某人）、（自责）、（温和地责","f":"v. 轻责 / 温和责备(偏老派)\n 调的的形容词（与格格不入）（突兀的景象身影元素）","f":"adj. 不协调的。incongruity的形容词。\n· Incongruous with...（与……格格不入）\n· Incongruous sight / figure / element（突兀的景象/身影/元素）","s":["1675","1791"]},{"w":"intimacy","d":"熟悉；亲近","f":"n. 熟悉；亲近","s":["1675","1791"]},{"w":"intimate","d":"亲密的；暗示","f":"adj. 亲密的；v. 暗示","s":["1675","1791"]},{"w":"mutual","d":"相互的，共有的","f":"adj.相互的，共有的","s":["1675"]},{"w":"provision","d":"供应，供应品","f":"n. 供应，供应品","s":["1675","1925"]},{"w":"render","d":"给予，提供","f":"给予，提供[st]The company rendered excellent customer service.[st]render assistance to sb.[ph]render a verdict of guilty","s":["1675","1925"]},{"w":"repel","d":"击退，驱逐","f":"击退，驱逐[ph]repel an enemy/insects/negative energy[syn]\"Repel\"强调击退、抵制或驱逐，以防止或抵御某种攻击、入侵或威胁。\"Resist\"侧重于抵抗外部的力量、压力或攻击，以保持自身的独立、权益或原则。\"Deter\"着重于通过威慑或威胁来阻止或抑制某人或某物的行为或意图，通常涉及对未来行动的预防措施。","s":["1925"]},{"w":"respect","d":"尊敬，敬重","f":"尊敬，敬重","s":["1925"]},{"w":"respective","d":"分别的，各自的","f":"adj. 分别的，各自的","s":["1675","1925"]},{"w":"rival","d":"比得上，与相匹敌","f":"比得上，与...相匹敌 v.[ph]rival each other in their efforts[ph]rival those of the most experienced professionals[syn]Rival、competitor、adversary 和 compete 都表示竞争对手或竞争。它们用于描述在竞争中相互对抗或竞争的个体或团体。Rival 是最常用的词汇，强调在竞争中与其他人或组织相对抗，可以用于形容在商业、体育或其他领域的竞争。Competitor 侧重于与其他个体或团体在某一方面的竞争，通常用于商业竞争或比赛。Adversary 指对手或敌手，侧重于敌对或敌对立场，常用于形容比赛或竞争中的对手。Compete 是一个动词，表示参加竞争或争夺，描述了参与竞争或比赛的行为。","s":["1925"]},{"w":"rivalry","d":"竞争；敌对状态","f":"竞争；敌对状态 n.[ph]intense rivalry between the two companies/political parties;passionate rivalry among the fans;[syn]Rivalry、competition、contention 和 conflict 都表示竞争、对抗或敌对关系。它们用于描述不同个体或团体之间的争夺、对抗或敌对的状态。Rivalry 是最常用的词汇，强调在竞争中的敌对或竞争关系，通常用于形容长期、激烈的竞争，也可指公司、运动队或个人之间的竞争。Competition 指竞争或比赛，侧重于在某种资源、荣誉或目标上的竞争。Contention 指争夺或争议，强调在观点、权力或地位上的竞争。Conflict 是一个更广泛的词汇，表示冲突、对抗或战争，指不同利益或意见之间的冲突，也可以包含暴力或敌对的情况。","s":["1925"]},{"w":"seduce","d":"勾引，诱惑","f":"勾引，诱惑[ph]tried to seduce her with his charm and compliments[ph]seduce sb. into doing sth.[syn]tempt，但它们之间的区别在于，seduce更强调使用诱惑或欺骗手段来引诱，特别是在性方面，而tempt则指尝试引诱某人做某事，可以涵盖更广泛的诱惑行为。 试、表演、甚至跟喜欢的人说话时，因为紧张而表现不佳，就用\"choke\"。\nHe totally choked during the final exam. （他期末考试彻底考砸了，因为太紧张。）\nThe team choked in the last minute and lost the game. （这支队伍最后一分钟崩盘，输掉了比赛。）\nI was about to ask her out, but I choked. （我本来要约她出去，但关键时刻怂了/说不出口。）\nn. 窒息、呛住（医学/生理语境）\nShe was choking and couldn't breathe. （她当时在窒息，无法呼吸。）\nHe died of a choke. （他死于窒息。）—— 但这种说法很少，更常用 choking。","s":["1791"]},{"w":"chuckle","d":"咯咯的笑","f":"v. 咯咯的笑","s":["1675","1791"]},{"w":"cling","d":"紧紧抓住、依附、黏着（紧紧抓住某物），（互相紧紧抱在一起）离","f":"vi. 紧紧抓住、依附、黏着\ncling to something（紧紧抓住某物），cling together（互相紧紧抱在一起）\ncling to sb.(离不开/黏住某人)","s":["1791"]},{"w":"clutch","d":"紧紧抓住、攥住、猛然揪住侧重因紧张、害怕或不想失去，而死死攥","f":"v. 紧紧抓住、攥住、猛然揪住。侧重 “因紧张、害怕或不想失去，而死死攥住”。它带有强烈的情绪色彩（焦虑、渴望）。\nclutch something / clutch at something（紧紧抓住某物）\nclutch at straws（抓救命稻草，指绝望中不切实际的尝试）","s":["1675","1791"]},{"w":"crash","d":"撞碎","f":"n. v. 撞碎","s":["1791"]},{"w":"creep","d":"匍匐前进；悄悄地移动","f":"v.匍匐前进；悄悄地移动","s":["1675"]},{"w":"crush","d":"榨；挤；压碎","f":"v. 榨；挤；压碎","s":["1791"]},{"w":"dab","d":"轻触；涂抹","f":"v./n. 轻触；涂抹","s":["1675","1791"]},{"w":"dart","d":"猛冲猛冲过穿过冲进某处飞快地瞥某人一眼快速地进进出出","f":"v. 猛冲\ndart across / through / into somewhere — 猛冲过／穿过／冲进某处\ndart a glance / look at someone — 飞快地瞥某人一眼\ndart in and out — 快速地进进出出","s":["1675","1791"]},{"w":"dodge","d":"躲闪或躲避八成情况是物理上的躲闪，少数情况指躲避抽象概念身体","f":"v. 躲闪或躲避。八成情况是物理上的躲闪，少数情况指躲避抽象概念。\n身体上的“躲闪” (动词/名词) A quick dodge saved him. (一个快速的躲闪救了他。)\n抽象意义上的“回避” (动词) She always dodges difficult questions. (她总是回避难题。)\nn. 指“诡计”、“花招” It's just a tax dodge. (这只是一个避税的花招。)","s":["1791"]},{"w":"drag","d":"拖动","f":"v. 拖动","s":["1791"]},{"w":"drip","d":"滴落、滴水（）滴水声（","f":"滴落、滴水（70%）滴水声（30%)[v.]water dripped from the faucet; rain dripped from the leaves[n.]the constant drip from the ceiling; She could hear the soothing drip of water in the fountain.","s":["1925"]},{"w":"embrace","d":"物理动作拥抱抽象行为欣然接受包含我们应该欣然接受挑战该报告涵","f":"vt. \n物理动作：拥抱 embrace [someone] \n抽象行为：欣然接受 / 包含 embrace [change / new ideas / diversity / technology] We should embrace challenges. (我们应该欣然接受挑战。) The report embraces all aspects of the problem. (该报告涵盖/包含了该问题的所有方面。)","s":["1791"]},{"w":"erect","d":"建设；直立","f":"v. 建设；直立","s":["1675","1791"]},{"w":"escape","d":"避免；逃避","f":"v. 避免；逃避","s":["1791"]},{"w":"explode","d":"爆炸","f":"v. 爆炸","s":["1791"]},{"w":"flee","d":"逃跑如果你只是想跑，用；如果你跑成功了，用地点（从某地逃离）","f":"v. 逃跑。如果你只是“想跑”，用 flee；如果你“跑成功了”，用 escape。\nflee from + 地点（从某地逃离）\nflee to + 地点（逃往某地）\nflee + 直接宾语（表示逃离某物，较正式）","s":["1791"]},{"w":"flip","d":"弹；投；翻滚","f":"v. 弹；投；翻滚","s":["1791"]},{"w":"footbeat","d":"脚步声；脚步节拍","f":"n. 脚步声；脚步节拍","s":["1675"]},{"w":"frown","d":"皱眉，反对人对某人皱眉（表示不满、疑惑或警告）行为事物不赞成","f":"v. 皱眉，反对\nfrown at + 人\t对某人皱眉（表示不满、疑惑或警告）\nfrown on / upon + 行为/事物\t不赞成、反对、看不惯（极其高频的抽象用法！）","s":["1791"]},{"w":"gasp","d":"带有强烈情绪或生理冲击的剧烈吸气动作人或事对倒吸一口凉气（惊","f":"vt. vi. 带有强烈情绪或生理冲击的“剧烈吸气动作”\ngasp at + 人或事\t对……倒吸一口凉气（惊讶/震惊）\t“Everyone gasped at the stunning view.”（所有人都被那壮丽景色惊得倒吸一口凉气。）\ngasp for + 空气/呼吸\t拼命喘气/呼吸困难\t“The runner was gasping for breath.”（跑步者正在大口喘气。）\ngasp with + 情绪\t因某种情绪而倒吸气\t“She gasped with surprise.”（她惊讶得倒吸一口气。）\nto the last gasp：直到最后一口气（拼死挣扎）。\nthe last gasp of winter：冬天最后的余威（快要结束时的最后一股寒流）。","s":["1675","1791"]},{"w":"gaze","d":"凝视","f":"n. 凝视","s":["1791"]},{"w":"glide","d":"滑行或滑翔把想象成你开车时，在高速上不踩油门，让车挂空挡靠惯","f":"v. 滑行或滑翔。把 glide 想象成你开车时，在高速上不踩油门，让车挂空挡靠惯性往前溜的那一段。而 skate 是你从启动到刹车踩死的整个过程。\n物理层面：平滑地、不费力地移动（在空中或水面上）The eagle glided across the sky without flapping its wings.\n抽象/比喻层面：悄然、顺畅地过渡或行动 She glided into the room without anyone noticing her.","s":["1791"]},{"w":"gnaw","d":"啮，咬字面，描述动物或人用门牙反复、费力地咬坚硬的东西（啃骨","f":"v. 啮，咬\n字面，描述动物或人用门牙反复、费力地咬坚硬的东西。gnaw on a bone（啃骨头），gnaw through the rope（咬断绳子）。\n比喻，“（情绪/感受）折磨、困扰”。gnaw at one's conscience/heart（侵蚀良心/折磨内心）：Guilt gnawed at him.（内疚感折磨着他。）gnawing hunger（持续的饥饿感/饥肠辘辘）：指胃里那种一阵阵、让人发慌的饿，比 hungry 强烈得多。gnawing anxiety/doubt（挥之不去的焦虑/疑虑）：指像牙疼一样持续不断、无法忽略的担心。","s":["1675","1791"]},{"w":"grab","d":"攫取；抓住","f":"v. 攫取；抓住","s":["1791"]},{"w":"grasp","d":"理解","f":"v. n. 理解","s":["1791"]},{"w":"grind","d":"磨（反复摩擦碾压）（）磨碎、碾碎（把固体磨成粉末颗粒）（磨咖","f":"v. 磨（反复摩擦碾压）\n（vt.）磨碎、碾碎（把固体磨成粉末/颗粒）grind coffee beans / grind wheat into flour（磨咖啡豆 / 把小麦磨成面粉）\n（vt.）磨利、磨光、打磨（工具、表面）grind a knife / grind lenses（磨刀 / 磨镜片——光学玻璃加工）\n（vi.）苦干、埋头苦干（口语高频）grind away at sth / grind through sth\n（n.）苦差事、单调乏味的工作（口语、新闻高频）the daily grind（日常的苦差/乏味的例行公事）","s":["1791"]},{"w":"grip","d":"紧握（）紧握、抓紧（用手或工具抓住不放）（她紧紧抓住我的手臂","f":"v. 紧握\n（vt.）紧握、抓紧（用手或工具抓住不放）She gripped my arm tightly.（她紧紧抓住我的手臂。）\n（vt.）吸引住、深深打动（抓住注意力/情感）The novel gripped me from the first page.\n（n.）控制、支配（对权力、局势的掌控）He has a firm grip on the company.","s":["1675","1791"]},{"w":"grope","d":"摸索摸索找；搜肠刮肚地想（引申义）苦苦探寻、试探（找答案、措","f":"v.n. 摸索\ngrope for sth\t摸索找；搜肠刮肚地想。（引申义）苦苦探寻、试探（找答案、措辞、方向）\n（vt.，负面）猥亵、乱摸（性骚扰语境，现代英语中常用）sexual groping allegations\ngrope one's way 摸索着前进","s":["1791"]},{"w":"halt","d":"停止，踌躇","f":"v. 停止，踌躇 n. come to a halt","s":["1791"]},{"w":"handle","d":"操纵","f":"v. 操纵","s":["1791"]},{"w":"harness","d":"名词马具、挽具（这匹马配上了新挽具）动词（高频）利用、驾驭（","f":"名词：马具、挽具 The horse was fitted with a new harness.（这匹马配上了新挽具。）\n动词（TOEFL 高频）：利用、驾驭（自然力/资源）\nharness作为动词有驾驭的含义，这是它与utility等单词主要的区别。harness 只能搭配\"能量型\"宾语——power、energy、wind、solar、potential、talent、creativity、the crowd（harness the wisdom of the crowd 众包金句）、AI。你绝不会说 harness a pencil、harness a fact——笔和事实没有\"野性的力量\"值得驯服。\nEngineers have found new ways to harness solar energy.（工程师找到了利用太阳能的新方法。）\nThe dam was built to harness the power of the river.（修建水坝是为了利用河流的水力。）\n动词：套上挽具；控制住\n例句：The farmer harnessed the oxen to the plow.（农夫把牛套上犁。）","s":["1791"]},{"w":"hasten","d":"含义加速、催促；急忙赶往偏书面、正式的词，日常口语中很少用当","f":"含义：加速、催促；急忙赶往。偏\"书面、正式\"的词，日常口语中很少用。\n当你想表达\"促成、使提前发生\"（而不是\"自己跑得快\"），并且场合偏正式（新闻、演讲、书面），hasten 是不可替代的——近义词要么语域不对（hurry/speed up 太口语），要么语义范围不对（expedite 只指流程，accelerate 只指速度）。另外，\"hasten to add\" 这类固定搭配本身没有可替换的同义说法。\nHe's a great teacher — I hasten to add, and a good friend.\nThe scandal hastened his resignation.（丑闻加速了他的辞职。）\nSmoking hastens death.\nA vaccine could hasten the region's economic recovery.","s":["1791"]},{"w":"haul","d":"动词费力地拖、拉、搬运（重物）（他们费劲地把沙发搬上三层楼）","f":"动词：费力地拖、拉、搬运（重物）They hauled the sofa up three flights of stairs.（他们费劲地把沙发搬上三层楼。） Trucks haul goods across the country.（卡车在全国各地运输货物。）\n名词：一次收获/大批所得 The fishermen brought in a big haul.（渔获颇丰）Police found a haul of drugs worth millions.（查获价值数百万的毒品）","s":["1675","1791"]},{"w":"heave","d":"用力举起；托","f":"v. 用力举起；托","s":["1675","1791"]},{"w":"hike","d":"上升户外徒步远足（名词动词）（去远足），（去徒步），（去走一","f":"n. 上升 v. \n户外徒步 / 远足（名词 & 动词）go on a hike（去远足），go hiking（去徒步），take a hike（去走一走）。\n（价格的）突然上涨 / 猛增（名词 & 动词）pay hike（薪资上涨），rent hike（房租暴涨），rate hike（利率上调/加息），price hike（物价飞涨）。","s":["1791"]},{"w":"hurl","d":"猛投，猛冲","f":"v. 猛投，猛冲","s":["1675","1791"]},{"w":"jerk","d":"急拉；抽搐","f":"v. 急拉；抽搐","s":["1675","1791"]},{"w":"jolt","d":"震动；颠簸","f":"v./n. 震动；颠簸","s":["1675","1791"]},{"w":"lash","d":"鞭打","f":"v. 鞭打","s":["1791"]},{"w":"launch","d":"发射；透射；发动；使升空","f":"v. 发射；透射；发动；使...升空","s":["1791"]},{"w":"limp","d":"蹒跚；瘸着走","f":"v. 蹒跚；瘸着走","s":["1791"]},{"w":"outfit","d":"全套服装","f":"全套服装","s":["1675"]},{"w":"peck","d":"啄；啄击少量","f":"v./n. 啄；啄击/少量","s":["1675"]},{"w":"plunge","d":"投入，穿入，进入；俯冲","f":"v.投入，穿入，进入；俯冲","s":["1675"]},{"w":"posture","d":"姿势","f":"姿势","s":["1675"]},{"w":"propel","d":"推进，促进","f":"推进，促进 [ph] propel sb. to do [st] The strong wind propelled the sailboat across the lake.","s":["1925"]},{"w":"punch","d":"重击","f":"n./v. 重击","s":["1925"]},{"w":"quiver","d":"颤抖，抖动","f":"颤抖，抖动","s":["1675"]},{"w":"rattle","d":"拨浪鼓；格格声；使发出格格声，使震颤","f":"n./v. 拨浪鼓；格格声；使发出格格声，使震颤 [ph]The rattle of the train wheels","s":["1925"]},{"w":"recoil","d":"弹回，反冲","f":"弹回，反冲 n./v. [st]The loud noise made him recoil in fear. [ph]gun's recoil [syn]\"recoil\" 表示后退、退缩或畏缩，通常是因为惊恐、厌恶或痛苦。与 \"flinch\" 和 \"shrink\" 相似，但 \"recoil\" 更强调因恐惧或厌恶而产生的反应。与 \"startle\" 相似，但 \"recoil\" 更强调因突然或意外的刺激而产生的后退或畏缩。","s":["1675","1925"]},{"w":"rip","d":"撕裂、剥离（）撕开、划开（）","f":"撕裂、剥离（60%）撕开、划开（40%）v.[ph]rip the paper, ripped the branches off the trees, accidentally ripped her dress[syn]Rip、tear、rend 和 slash 都表示撕裂、剥离或撕开。它们描述了物体的受损或被力量分离的过程。Rip 是最常用的词汇，可以用于描述轻微或较大范围的撕裂或剥离。Tear 和 rend 强调用力或外力引起的剧烈撕裂，通常用于形容材料、纸张或织物的撕裂。Slash 指的是用利器或锋利物切开或划开，通常用于形容利器或刀具的动作。","s":["1925"]},{"w":"roam","d":"漫游、漫步（）流浪、游荡（）","f":"漫游、漫步（50%）流浪、游荡（50%）v.[ph]roam the streets of the old city;roam around the park[syn]Roam、wander、stroll 和 wander around 都表示漫游、漫步、流浪或游荡。它们用于描述在某地或某个区域里自由地漫步或移动。Roam 是最常用的词汇，用于形容在广泛区域内漫游或漫步，强调自由的移动。Wander 也指漫步或游荡，但可能强调更随意、无目的性的移动。Stroll 强调悠闲、轻松的漫步，通常用于描述在公园、街道或城市等地方的闲逛。Wander around 表示在某地周围漫步或游荡，强调周围的环境和地点。","s":["1925"]},{"w":"roll","d":"滚动、转动（）滚、滚动前进（）","f":"滚动、转动（30%）滚、滚动前进（20%）","s":["1925"]},{"w":"rotate","d":"旋转；转动；轮换","f":"旋转；转动；轮换","s":["1925"]},{"w":"shatter","d":"表示使破碎、粉碎或破裂成碎片","f":"表示使破碎、粉碎或破裂成碎片[ph]shattered into pieces[st]The loud explosion caused the windows to shatter[st]His dreams were shattered[syn]与 \"shatter\" 意思最接近的同义词是 \"smash\"。它们的区别在于，\"shatter\" 强调物体或结构被突然且严重地打碎或粉碎，而 \"smash\" 则可以描述更一般的物体破坏或破碎的情况。","s":["1925"]},{"w":"shear","d":"剪，修剪，剪切表示剪切、剪断或剪下","f":"剪，修剪，剪切[v]表示剪切、剪断或剪下[st]shear off[ph]shear the tops of trees[ph]shear sth with a saw[syn]与 \"shear\" 意思最接近的同义词是 \"cut\"。它们的区别在于，\"shear\" 通常用于描述通过剪切、剪断或剪下来获得新的形状或剪辑物体，而 \"cut\" 则更常用且广泛，可以用于形容更广泛的剪切、切割或裁剪的情况。","s":["1925"]},{"w":"shift","d":"移动，改变位置或方向","f":"n./v. 移动，改变位置或方向 [ph] The shift in sth. [ph] make a shift","s":["1925"]},{"w":"shuffle","d":"洗牌","f":"洗牌[mean]动词 \"shuffle\" 的使用频率约为 70%。 名词 \"shuffle\" 的使用频率约为 30%。v.[st]He shuffled his feet as he walked, lost in thought. （翻译：他走路时拖着脚，陷入了沉思。）[ph]shuffle the deck[ph]shuffled the desks移动桌子n.[ph]walked with a slight shuffle[st]The dealer performed a shuffle of the cards[ph]sth. caused a bit of a shuffle among sb.","s":["1925"]},{"w":"skip","d":"跳","f":"跳 v.","s":["1925"]},{"w":"slide","d":"（使）滑动，（使）滑行","f":"（使）滑动，（使）滑行 v.[ph]slide down the hill","s":["1925"]},{"w":"slip","d":"片，纸片","f":"片，纸片","s":["1925"]},{"w":"slump","d":"猛然落下，暴跌","f":"v．猛然落下，暴跌","s":["1675"]},{"w":"spew","d":"呕吐；大量喷出","f":"v.呕吐；大量喷出","s":["1675"]},{"w":"sprawl","d":"蔓延；伸 icted by war（饱经战乱的国家）—— 书面语极简好词。","s":["1675","1791"]},{"w":"apt","d":"恰当的；易于的；聪明的","f":"adj. 恰当的；易于…的；聪明的","s":["1675","1791"]},{"w":"auspice","d":"前兆","f":"n.前兆","s":["1675"]},{"w":"bask","d":"享受温暖沉浸（荣耀）（晒太阳）、（享受温暖）、（在海滩上晒太","f":"vt. 享受温暖 / 沉浸（荣耀）\nbask in the sun/sunshine（晒太阳）、bask in the warmth（享受温暖）、bask on the beach（在海滩上晒太阳）\nbask in reflected glory（沾光/沉浸在他人的荣耀中）、bask in the spotlight/attention（沉浸在聚光灯下/众人的关注中）、bask in the admiration（沉浸在赞美中）","s":["1675","1791"]},{"w":"calamity","d":"重大灾难深重苦难","f":"n. 重大灾难 / 深重苦难","s":["1675","1791"]},{"w":"carnage","d":"大屠杀；残杀","f":"n. 大屠杀；残杀","s":["1675","1791"]},{"w":"casualty","d":"伤亡者；伤亡人数；事故受害者","f":"n. 伤亡者；伤亡人数；事故受害者","s":["1675","1791"]},{"w":"contemptuous","d":"轻蔑的轻蔑的一瞥一笑对某人某事不屑一顾轻蔑的语气言论","f":"adj. 轻蔑的\ncontemptuous glance / smile — 轻蔑的一瞥／一笑\ncontemptuous of someone / something — 对某人／某事不屑一顾\ncontemptuous tone / remark — 轻蔑的语气／言论","s":["1675","1791"]},{"w":"cosmetics","d":"化工化妆品（的复数）；装饰品用化妆品打扮（的三单形式）","f":"n. [化工] 化妆品（cosmetic的复数）；装饰品v. 用化妆品打扮（cosmetic的三单形式）","s":["1675"]},{"w":"defunct","d":"已故的；已废止的；不再运作的","f":"adj. 已故的；已废止的；不再运作的","s":["1675","1791"]},{"w":"demise","d":"终结","f":"n. 终结","s":["1675","1791"]},{"w":"disastrous","d":"灾难性的；悲惨的","f":"adj. 灾难性的；悲惨的","s":["1675","1791"]},{"w":"doleful","d":"悲哀的、凄惨的或忧愁的核心在于写在脸上或溢于言表的忧伤，带有","f":"adj. 悲哀的、凄惨的或忧愁的。核心在于“写在脸上或溢于言表的忧伤”，带有浓厚的文学色彩和凄楚感。\na doleful expression / look\t愁眉苦脸 / 哀伤的表情\tHe wore a doleful expression after hearing the news. (听到消息后，他一脸愁容。)\na doleful voice / song\t凄婉的声音 / 哀怨的歌曲\tShe sang a doleful song about lost love. (她唱了一首关于失去爱情的哀怨歌曲。)\na doleful tale / story\t悲惨的故事\tHe told me a doleful tale of his misfortunes. (他给我讲了一个关于他遭遇的悲惨故事。)","s":["1675","1791"]},{"w":"doze","d":"打盹儿、打瞌睡或小睡打瞌睡、不知不觉睡着了（最常用短语）我昨","f":"v.n. 打盹儿、打瞌睡或小睡\ndoze off\t打瞌睡、不知不觉睡着了（最常用短语）\tI dozed off in front of the TV last night. (我昨晚在电视机前打瞌睡睡着了。)\ndoze away\t在瞌睡中度过（时间）\tHe dozed away the entire afternoon. (他整个下午都在瞌睡中度过。)\nhave / take a doze\t打个盹儿\tWhy don't you have a doze while I prepare dinner? (我准备晚饭时，你何不打个盹儿？)\nbe dozing\t正在打瞌睡\tThe teacher caught him dozing in class. (老师抓到他正在课堂上打瞌睡。)\nsink into a doze\t渐渐迷糊过去，进入半睡状态\tShe sank into a doze on the sofa. (她在沙发上渐渐迷糊过去了。)","s":["1675","1791"]},{"w":"drowsy","d":"昏昏欲睡的","f":"adj. 昏昏欲睡的","s":["1675","1791"]},{"w":"estimable","d":"可敬的建议不要用这个词，只是阅读理解用如果你想在作文里表达令","f":"adj. 可敬的。\n建议不要用这个词，只是阅读理解用。如果你想在作文里表达“令人钦佩的”，请务必用 admirable；如果在演讲开头称呼贵宾，用 esteemed。而estimable像是在单方面评价对方“有潜力变好”。\n形容某人的品格、成就或职业操守“值得钦佩”（绝对高频，尤用于书面赞扬）an estimable scholar / colleague / opponent（一位可敬的学者/同事/对手）；a man of estimable character（品格可敬的人）\n形容努力、贡献或目标“值得称颂 / 值得肯定”（评价类正式语境）an estimable achievement / contribution / record（可敬的成就/贡献/记录）；an estimable goal / cause（值得称颂的目标/事业）","s":["1675","1791"]},{"w":"expire","d":"失效，断气核心意思（两条主线）有效期结束（最常用）证件、合同","f":"v. 失效，断气\n1. 核心意思（两条主线）\n\n· 有效期结束（最常用）：证件、合同、会员、优惠券、食品不再有效。\n· 呼吸停止/逝世（正式/医学用语）：指“断气”，日常较少用，影视或正式新闻中出现。\n\n2. 高频时态与介词（考点）\n\n· expires on + 具体某天（My passport expires on May 1st.）\n· expires in + 时间段（Your trial expires in 3 days.）\n· expired（过去分词作形容词）：表示“已过期的”，比“is not valid”更简洁（Your license is expired.）","s":["1675","1791"]},{"w":"fateful","d":"决定性的；宿命的","f":"adj. 决定性的；宿命的","s":["1675","1791"]},{"w":"foresee","d":"预知","f":"v. 预知","s":["1675","1791"]},{"w":"foresight","d":"远见或先见之明有远见去做某事他们有投资新技术的先见之明缺乏远","f":"n. “远见”或“先见之明”\nhave the foresight to do sth.：有远见去做某事 They had the foresight to invest in new technology. (他们有投资新技术的先见之明。)\nlack of foresight：缺乏远见  He was later criticised for his lack of foresight. (他后来因缺乏远见而受到批评。)\nshow / display / demonstrate foresight：展现/显示出远见 The company showed great foresight by investing in renewable energy. (该公司通过投资可再生能源展现了巨大的远见。)","s":["1675","1791"]},{"w":"fussy","d":"过分挑剔的、难以取悦的，或者形容东西过分讲究花哨的形容人挑剔","f":"adj. “过分挑剔的”、“难以取悦的”，或者形容东西“过分讲究/花哨的”。\n1. 形容人：挑剔的、过分讲究的（带轻微贬义）\n指对细节要求极其严格，甚至到了让人烦的程度。常接介词 about。\n例句：He's so fussy about his food that he won't eat anything cold.（他对食物挑剔到冷的一口都不吃。）“Don't be such a fussy eater!”（别这么挑食！）\n常见搭配：fussy eater（挑食的人）、fussy about clothes（对衣着讲究过头）。\n2. 形容设计/装饰：过分花哨的、繁琐的、杂乱的\n指东西装饰太多、细节太杂，反而显得不简洁、不大气。与你之前学的 functional（简洁实用）正好相反！\n例句：I prefer a simple design, not this fussy pattern.（我更喜欢简洁的设计，而不是这种花里胡哨的图案。）\n常见搭配：fussy details（繁琐的细节）、fussy style（过分装饰的风格）。\n3. 形容婴儿/小孩（美式口语）：烦躁不安的、爱哭闹的\n指婴儿没有明显生病迹象，但就是不舒服、哼哼唧唧或哭闹。\n例句：The baby is fussy today because she's teething.（宝宝今天很闹腾，因为她在长牙。）","s":["1675","1791"]},{"w":"guise","d":"外观，装束（）伪装、假扮的外表（掩盖真实身份）（）幌子、借口","f":"n. 外观，装束\nin the guise of （n.）伪装、假扮的外表（掩盖真实身份）\nunder the guise of （n.）幌子、借口（用冠冕堂皇的外表掩盖真实目的）\nin a new guise （n.）外表、外在形式 The idea reappeared in a new guise decades later.（这个想法几十年后以新的形式重新出现。）","s":["1675","1791"]},{"w":"haughty","d":"自以为高人一等、摆出俯视姿态的傲慢的认识的人多、日常口语中说","f":"adj. 自以为高人一等、摆出俯视姿态的傲慢的。认识的人多、日常口语中说得少。\nhaughty attitude / manner / demeanor\t高傲的态度\nhaughty tone / voice\t傲慢的语调\nhaughty look / expression / gaze\t居高临下的眼神（小说高频）\nhaughty air\t傲慢的神气（with a haughty air）\nhaughty disdain","s":["1675","1791"]},{"w":"holocaust","d":"大屠杀；浩劫","f":"n. 大屠杀；浩劫","s":["1675","1791"]},{"w":"imminent","d":"即将来临的（时间紧迫）（迫在眉睫的危险威胁）最最常用的军事紧","f":"adj. 即将来临的（时间紧迫）\n· Imminent danger / threat（迫在眉睫的危险/威胁）：最最常用的军事/紧急组合。\n· Imminent arrival / departure（即将到达/出发）。\n· Imminent collapse / failure（即将崩盘/失败）。","s":["1675","1791"]},{"w":"insolent","d":"傲慢的，无理的对无礼","f":"adj. 傲慢的，无理的\nbe ~ to sb. 对...无礼","s":["1675","1791"]},{"w":"lethal","d":"致命的","f":"adj. 致命的","s":["1675","1791"]},{"w":"lull","d":"歇息使平静；使安静","f":"n.歇息vt. 使平静；使安静","s":["1675"]},{"w":"mishap","d":"不幸之事灾祸厄运","f":"n.不幸之事,灾祸,厄运","s":["1675"]},{"w":"ordeal","d":"严峻考验，痛苦经验","f":"n.严峻考验，痛苦经验","s":["1675"]},{"w":"overbearing","d":"傲慢的","f":"傲慢的","s":["1675"]},{"w":"perspective","d":"判断事物的角度，方法；透视法","f":"n.(判断事物的)角度，方法；透视法","s":["1675"]},{"w":"prediction","d":"预言，预报","f":"n. 预言，预报","s":["1675"]},{"w":"presumptuous","d":"放肆的，冒昧的；傲慢的","f":"放肆的，冒昧的：overstepping bounds；傲慢的：feeling of superiority","s":["1675"]},{"w":"prospective","d":"未来的；预期的预期；展望","f":"adj. 未来的；预期的n. 预期；展望","s":["1675"]},{"w":"provident","d":"深谋远虑的；节俭的","f":"a.深谋远 s":["1675","1791"]},{"w":"defraud","d":"诈骗；欺诈","f":"v. 诈骗；欺诈","s":["1675","1791"]},{"w":"delude","d":"欺骗常用于自欺欺人","f":"vt. 欺骗(常用于自欺欺人)","s":["1675","1791"]},{"w":"embezzle","d":"监守自盗偏法律专业术语这个单词几乎只用于财务、会计和法律的正","f":"vt. 监守自盗(偏法律专业术语)\n这个单词几乎只用于财务、会计和法律的正式语境中，描述白领犯罪（White-collar crime）。它和普通的 steal（偷窃） 最大的区别在于：偷窃是陌生人偷偷拿走，而挪用是“家贼”利用信任拿走。\nembezzle [金钱数额] from [机构/人]（从...挪用...）\nembezzle public / company / government funds（挪用公共/公司/政府资金）\nembezzle money / assets / property（侵吞钱财/资产/财产）","s":["1675","1791"]},{"w":"extort","d":"敲诈、勒索、强逼物品人机构从某人某处敲诈（钱财信息等）用法","f":"vt. 敲诈、勒索、强逼\nextort + 物品 + from + 人/机构\t从某人/某处敲诈（钱财/信息等）(90%用法)","s":["1675","1791"]},{"w":"fabricate","d":"制造、建造的情况都取其引申义捏造、伪造、编造（谎言、证据、数","f":"vt. “制造、建造”。90% 的情况都取其引申义——“捏造、伪造、编造”（谎言、证据、数据等）\nfabricate + 虚假信息\t捏造、伪造\tHe fabricated the whole story.（他编造了整个故事。）\nfabricate + 物品 + from/out of + 材料\t用……制造（成品）\tThe part is fabricated from steel.（这个零件是用钢制造的。）","s":["1675","1791"]},{"w":"forge","d":"锻造，伪造含义一正面锻造精心打造（高级、积极词汇）突飞猛进稳","f":"v. 锻造，伪造\n含义一：正面——“锻造 / 精心打造”（高级、积极词汇）forge ahead (with sth.)：突飞猛进 / 稳步推进（非常地道的短语，不管是否遇到困难都坚定前行）\n含义二：负面——“伪造 / 假冒”（法律、犯罪语境）forge a signature / passport / ID：伪造签名/护照/身份证","s":["1675","1791"]},{"w":"fraud","d":"欺骗诈骗罪、欺骗行为（信用卡诈骗）、（选举舞弊）、（保险欺诈","f":"un. cn. 欺骗\n诈骗罪、欺骗行为 credit card fraud（信用卡诈骗）、electoral fraud（选举舞弊）、insurance fraud（保险欺诈）。\n可数名词（具体事件）：骗局、诡计 The scheme turned out to be a complete fraud.（这个计划原来完全是个骗局。）\n可数名词（指人或物）：骗子、冒牌货、赝品 That so-called psychic is a fraud.（那个所谓的通灵师是个骗子。）","s":["1675","1791"]},{"w":"fraudulent","d":"欺诈性的或不诚实的形容行为活动欺诈性的、舞弊的（欺诈性交易）","f":"adj. “欺诈性的”或“不诚实的”\n形容行为/活动：欺诈性的、舞弊的 fraudulent transaction（欺诈性交易）、fraudulent claim（欺诈性索赔/骗保）。\n形容文件/签名：伪造的、冒用的 fraudulent signature（伪造签名）、fraudulent documents（伪造文件）\n形容意图/计划：存心欺骗的 She made a fraudulent promise with no intention of keeping it.（她做了一个存心骗人的承诺，根本没打算兑现。）","s":["1675","1791"]},{"w":"gangster","d":"匪徒；歹徒","f":"n. 匪徒；歹徒","s":["1675","1791"]},{"w":"homicide","d":"杀人；杀人罪；杀人案件","f":"n. 杀人；杀人罪；杀人案件","s":["1675","1791"]},{"w": 91"]},{"w":"con`tract","d":"收缩，感染","f":"v. 收缩，感染","s":["1791"]},{"w":"conference","d":"会议；讨论会","f":"n. 会议；讨论会","s":["1791"]},{"w":"confidence","d":"信心","f":"n. 信心","s":["1791"]},{"w":"connivance","d":"默许在某人的默许下对某事的纵容默许暗中伙同纵容行事","f":"n. 默许\nwith the connivance of someone — 在某人的默许下\nsb's connivance in something — 对某事的纵容／默许\nact with connivance — 暗中伙同纵容行事","s":["1791"]},{"w":"connive","d":"纵容；共谋","f":"v. 纵容；共谋","s":["1791"]},{"w":"conversion","d":"变换，转化","f":"变换，转化","s":["1925"]},{"w":"cottonwood","d":"植三叶杨棉白杨","f":"[植]三叶杨,棉白杨","s":["1925"]},{"w":"crayon","d":"蜡笔、彩笔及其绘画","f":"蜡笔、彩笔及其绘画","s":["1925"]},{"w":"craze","d":"狂热","f":"狂热","s":["1925"]},{"w":"crew","d":"船员","f":"n. 船员","s":["1791"]},{"w":"customs","d":"进口税；海关","f":"进口税；海关","s":["1925"]},{"w":"dangle","d":"悬垂从某处悬垂下来在某人面前晃荡悬垂用某物吊某人胃口诱惑某人","f":"v. 悬垂\ndangle from something — 从某处悬垂下来 A bunch of keys dangled from his belt.\ndangle in front of someone — 在某人面前晃荡／悬垂 She dangled her earrings in front of the baby to amuse him.\ndangle something before / in front of someone — 用某物吊某人胃口／诱惑某人 The company dangled a promotion in front of him to keep him from quitting.","s":["1791"]},{"w":"despoiler","d":"掠夺者","f":"掠夺者","s":["1925"]},{"w":"dialect","d":"方言；土语；地方话","f":"n. 方言；土语；地方话","s":["1791"]},{"w":"dignify","d":"使尊严；使显贵","f":"v. 使尊严；使显贵","s":["1791"]},{"w":"dignity","d":"尊严","f":"n. 尊严","s":["1791"]},{"w":"discerm","d":"辨明用眼睛或脑子，从不太清晰、不太明显的事物中，分辨出某个细","f":"v. 辨明。(用眼睛或脑子，从不太清晰、不太明显的事物中，分辨出某个细节或真相)。\ndiscern the difference / distinction — 辨别差异／区分\ndiscern something from something — 从某物中辨别出某物\ndiscern between A and B — 在A与B之间加以辨别","s":["1791"]},{"w":"discernible","d":"可察觉的清晰可辨的易于辨认的几乎不可辨的难以察觉的可辨别的差","f":"adj. 可察觉的\nclearly / easily discernible — 清晰可辨的／易于辨认的\nbarely / scarcely discernible — 几乎不可辨的／难以察觉的\ndiscernible difference / distinction — 可辨别的差异／区别","s":["1791"]},{"w":"down-hearted","d":"灰心丧气的、意志消沉的或心灰意冷的感到消沉灰心申请被拒后，她","f":"adj. 灰心丧气的、意志消沉的或心灰意冷的。\nfeel / be downhearted\t感到消沉 / 灰心\tShe felt downhearted after her application was rejected. (申请被拒后，她感到非常消沉。)\nget / become downhearted\t变得灰心起来\tHe got downhearted when he saw the huge amount of work ahead. (看到眼前堆积如山的工作时，他变得灰心起来。)\ndownhearted about (sth.)\t对……感到灰心\tThere's no reason to be downhearted about the future. (没有理由对未来感到灰心。)","s":["1791"]},{"w":"driftwood","d":"漂流木","f":"漂流木[ph]pieces of driftwood[ph]used/gathered driftwood[syn]Driftwood 是特指被水流漂移而来的木材或树木的残余部分。它通常是被海洋、河流或湖泊的水流冲刷、漂浮和带来的木材。Floatwood 和 washed-up wood 可以作为 driftwood 的同义词，都指的是漂流木。","s":["1925"]},{"w":"dripstone","d":"滴水石","f":"滴水石 cn.[syn]Dripstone、stalactite 和 stalagmite 都是指洞穴中的石灰石沉积物。它们都是由于滴水中的矿物质沉积形成的。然而，它们在洞穴中的形成位置和方式不同。Stalactite 是从洞穴顶部悬挂下来的石灰石柱，由滴落的矿物质形成；而 stalagmite 是从地面上升的石灰石柱，由地面上的滴水沉积形成。Dripstone 这个词汇通常用作较为泛指的概念，可包含 stalactite 和 stalagmite。","s":["1925"]},{"w":"equestrian","d":"骑马的古罗马市民特权阶层成员的骑士阶层的","f":"骑马的, (古罗马)市民特权阶层成员的, 骑士阶层的 n./v.","s":["1925"]},{"w":"exotic","d":"外来的；有异国风味的","f":"adj. 外来的；有异国风味的","s":["1675","1791"]},{"w":"fictitious","d":"虚构的编造的、虚假的特指为欺骗而虚设的细节（姓名账户），比更","f":"adj. 虚构的。编造的、虚假的。特指为欺骗而虚设的细节（姓名/账户），比 imaginary 更具“造假”色彩，法律/金融语境极高频。\ndismiss as fictitious：认为是编造的（不予采信）。\nHis claim was dismissed as fictitious.（他的说法被认定是编造的。）\nuse a fictitious name/address for + 目的：用假名/假地址做……。","s":["1791"]},{"w":"fireproof","d":"耐火的，防火的","f":"耐火的，防火的","s":["1925"]},{"w":"flashy","d":"浮华的","f":"浮华的[mean]\"flashy\" 是一个形容词，表示浮华的、炫耀的、花哨的，通常用来形容外表或行为过于引人注目、夸张或过分显眼的事物。[ph]flashy car[ph]The restaurant's decor was a bit too flashy for my taste[ph]Despite his flashy appearance","s":["1925"]},{"w":"flavour","d":"风味；口味给调味","f":"n. 风味；口味 / v. 给…调味","s":["1791"]},{"w":"fluorescent","d":"荧光的莹光的","f":"荧光的, 莹光的[mean]fluorescent 是一个常见的词汇，通常用于描述物体发出荧光或指荧光灯这种光源。[st]The room was illuminated by the soft glow of fluorescent lights.[ph]have a fluorescent property[ph]stylish fluorescent dress","s":["1925"]},{"w":"flyspeck","d":"蝇粪留下的污点污点","f":"蝇粪留下的污点, 污点[mean]名词含义： 蒙蔽的地方；蒙蔽性错误。作为名词，指文本、文件或其他材料中的小错误或蒙蔽，可能是由于疏忽或细节问题引起的。也可以用来形容瑕疵或微小的错误。 （频率：较少见）[ph]it had a few flyspecks[ph]a few minor flyspecks动词含义： 搜索错误；找出问题。作为动词，指仔细搜索、查找错误或问题，尤其是那些细小的、容易被忽视的错误。 （频率：较少见）[ph]flyspecked the text[ph]flyspecking the layout of the magazine","s":["1925"]},{"w":"forage","d":"草料","f":"草料 n. [ph]a large quantity of forage v. 觅食 [ph] forage for","s":["1925"]},{"w":"foray","d":"突袭","f":"突袭 [ph]make a foray into jungle/industry [ph] foray into sth.","s":["1925"]},{"w":"frisky","d":"活泼的，欢闹的","f":"活泼的，欢闹的[mean]frisky 是一个形容词，通常用来形容动物或人活泼、欢快、调皮或兴奋的状态。[st]The puppy was feeling frisky and ran around the backyard[ph]frisky children playing tag[syn]Frisky、playful、lively 和 mischievous 都表示活泼、欢快或调皮。它们通常用于描述动物或人的行为、性格或状态。Frisky 强调活泼、欢快和有趣的状态，特别适用于形容动物的活跃玩耍。Playful 侧重于嬉戏、玩耍和有趣的行为，可以用于形容孩子或动物的欢乐玩耍。Lively 表示充满生气和活力，可用于形容人、动物或场景的生动和活跃。Mischievous 强调有点调皮、淘气和捣蛋，通常用于形容孩子或动物的捣蛋行为。","s":["1925"]},{"w":"frowzy","d":"不整洁的，臭的冷门超纲单词，记得意思就行形容人外表邋遢的、蓬","f":"adj. 不整洁的，臭的。冷门超纲单词，记得意思就行。\n① 形容人/外表：“邋遢的、蓬头垢面的、不修边幅的”（衣服皱巴巴，头发乱糟糟）\n② 形容空气/房间：“闷浊的、有霉味的、空气不流通的”（像一间很久没人开窗的地下室）。","s":["1791"]},{"w":"frustrate","d":"破坏，挫败针对计划努力阻挠、妨碍、使失败指外部因素干扰，让某","f":"v. 破坏，挫败\n1. 针对计划/努力：阻挠、妨碍、使失败\n指外部因素干扰，让某个计划或努力无法成功。\n例句：The bad weather frustrated our plans for a picnic.（恶劣天气阻挠了我们野餐的计划。）\n常见搭配：frustrate an attempt（挫败一次尝试）、frustrate a proposal（阻挠一项提议）。\n2. 针对人（更常用）：使沮丧、使灰心、让某人抓狂\n指因为愿望落空或事情不顺利，让人产生烦躁、失望的无力感。这是日常生活中最高频的用法。\n例句：It frustrates me when people are late for meetings.（开会有人迟到时，这让我很抓狂/沮丧。）\n常见搭配：feel frustrated（感到受挫）、get frustrated with（对...感到灰心）。","s":["1791"]},{"w":"furious","d":"狂怒的，狂暴的表达的生气程度远高于和人（我对自己犯那个错气疯","f":"adj. 狂怒的，狂暴的。furious表达的生气程度远高于angry和mad。\nbe furious with + 人：I was furious with myself for making that mistake.（我对自己犯那个错气疯了。）\nbe furious about/at + 事：She is furious about the decision.（她对这个决定极其愤怒。）\nat a furious speed. 以飞快的速度(行驶)","s":["1791"]},{"w":"grateful","d":"感谢的","f":"adj. 感谢的","s":["1791"]},{"w":"gratitude","d":"感激；感谢","f":"n. 感激；感谢","s":["1791"]},{"w":"grieve","d":"（）感到悲痛、哀悼（尤其因亲人离世）人或事（）使悲伤、使痛心","f":"v. \n（vi.）感到悲痛、哀悼（尤其因亲人离世）grieve for / over / about + 人或事\n（vt.）使悲伤、使痛心（书面语、正式用法）It grieves me to say this, but...（这样说让我很难过，但是……）\ngrieve at the loss of sb\t因失去某人而悲痛","s":["1791"]},{"w":"grieved","d":"伤心的感到悲痛、哀悼（她失去狗后悲痛了好几个月）悲痛的、伤心","f":"adj. 伤心的\n感到悲痛、哀悼 She grieved for months after losing her dog.（她失去狗后悲痛了好几个月。）\n悲痛的、伤心的 be grieved at / by / over sth 因……而悲伤","s":["1791"]},{"w":"harsh","d":"严酷的、严厉的、刺耳的（环境气候）严酷的、恶劣的例句（探险队","f":"adj. 严酷的、严厉的、刺耳的\n（环境/气候）严酷的、恶劣的\n例句：The expedition had to survive the harsh Arctic winter.（探险队必须在严酷的北极寒冬中生存下来。）\n例句：Plants that grow in harsh environments must be adaptable.（生长在严酷环境中的植物必须具有适应力。）\n（批评/惩罚）严厉的、苛刻的\n例句：The judge imposed a harsh sentence.（法官作出了严厉的判决。）\n例句：He received harsh criticism for his mistakes.（他因错误受到了严厉的批评。）\n（声音/光线）刺耳的、刺眼的\n例句：The harsh light of the deser sun made it hard to see.（沙漠刺眼的阳光让人难以看清东西。）\n例句：Her voice sounded harsh and unfriendly.（她的声音听起来刺耳且不友好。）\n（化学品等）刺激性强的、伤皮肤的\n例句：This soap is too harsh for sensitive skin.（这款肥皂对敏感皮肤刺激性太强。）","s":["1675","1791"]},{"w":"hatred","d":"深切的、长期的、强烈的憎恨","f":"n. 深切的、长期的、强烈的憎恨\nfeel/harbor/develop hatred of sth./ for sb./ towards sb.","s":["1791"]},{"w":"hearsay","d":"（不可数名词）传闻、道听途说（法官拒绝将该证词作为传闻证据采","f":"n. hearsay（不可数名词）：传闻、道听途说\nThe judge refused to admit the testimony as hearsay.（法官拒绝将该证词作为传闻证据采信。）\nI don't trust that story; it's just hearsay.（我不信那个说法，纯属道听途说。）","s":["1791"]},{"w":"hesitate","d":"犹豫；踌躇；含糊","f":"v. 犹豫；踌躇；含糊","s":["1791"]},{"w":"hideous","d":"骇人听闻的，丑恶的表达审美灾难（丑爆的裙子毛衣）、（丑出天际","f":"adj. 骇人听闻的，丑恶的\n表达审美灾难 hideous dress/sweater（丑爆的裙子/毛衣）、hideous wallpaper（丑出天际的墙纸）、hideous curtains（辣眼睛的窗帘）、hideous haircut（糟糕的发型）。\n形容天气、路况和“糟心局面”（占比约30%） hideous traffic（堵到怀疑人生）、hideous weather（鬼天气）、hideous commute（通勤简直噩梦）、hideous quarterly report（季度报表难看得没法看）。","s":["1791"]},{"w":"hoarse","d":"（声音）沙哑的、嘶哑的是该语义的通用单词（沙哑的嗓音）最通用","f":"adj.（声音）沙哑的、嘶哑的(是该语义的通用单词)\nHoarse voice（沙哑的嗓音）：最通用。\n“I woke up with a hoarse voice this morning.”（我今早起来嗓子哑了。）\nHoarse throat（沙哑的喉咙/喉咙发紧发哑）：虽然语法上“喉咙”本身不会“嘶哑”，但美国人非常习惯这么说，等同于“喉咙不舒服导致声音变了”。\n“I have a hoarse throat from yelling at the game.”（我在比赛时喊得嗓子都哑了。）\nHoarse whisper（沙哑的耳语/气音）：形容那种费力挤出声音的感觉。\n“He could only manage a hoarse whisper.”（他只能勉强发出嘶哑的耳语声。）","s":["1791"]},{"w":"hovercraft","d":"气垫船","f":"气垫船","s":["1925"]},{"w":"howl","d":"（长而响亮的）嚎叫、呼啸或高声呼喊动物的嚎叫（最原始的含义）","f":"v.n. （长而响亮的）嚎叫、呼啸或高声呼喊\n动物的嚎叫（最原始的含义）howl at. The wolves howled at the moon all night.\n人的情绪宣泄（大笑、痛哭或大喊）howl with laughter. The comedian had the whole audience howling with laughter.\n自然界的呼啸（风声或暴风雨）The wind howled outside the cabin all night","s":["1791"]},{"w":"humorous","d":"幽默的","f":"adj. 幽默的","s":["1791"]},{"w":"hunger","d":"饥饿；渴望","f":"n. 饥饿；渴望","s":["1791"]},{"w":"hustle","d":"催促；推搡；忙碌","f":"v./n. 催促；推搡；忙碌","s":["1791"]},{"w":"idiot","d":"白痴；傻子","f":"n. 白痴；傻子","s":["1791"]},{"w":"idol","d":"偶像","f":"n. 偶像","s":["1791"]},{"w":"ignorance","d":"无知","f":"n. 无知","s":["1791"]},{"w":"impulsive","d":"易冲动的任性的一个人不经过大脑思考，纯粹因为突然想就立刻行动","f":"adj. 易冲动的,任性的。一个人不经过大脑思考，纯粹因为“突然想”就立刻行动。\nImpulsive + decision / purchase / behavior（冲动的决定/购买/行为）\nImpulsive + person / nature / child（冲动的人/天性/孩子）\nOn an impulsive whim（一时兴起）—— She called him on an impulsive whim.（她一时兴起给他打了电话。）","s":["1791"]},{"w":"industrial","d":"工业的","f":"adj. 工业的","s":["1791"]},{"w":"infect","d":"传染；感染","f":"v. 传染；感染","s":["1791"]},{"w":"insane","d":"发狂；精神错乱的","f":"adj. 发狂；精神错乱的","s":["1791"]},{"w":"intersected","d":"相交；交叉；相交的；交叉的","f":"v. 相交；交叉；adj. 相交的；交叉的","s":["1925"]},{"w":"intersection","d":"十字路口交叉点","f":"十字路口, 交叉点[mean]Intersection是一个名词，表示两个或多个物体、线条或路径相交或交叉的地方。[ph]busy intersection downtown[ph]intersection of the two rivers[ph]intersection of art and politics","s":["1925"]},{"w":"intoxicate","d":"使陶醉；使中毒","f":"v. 使陶醉；使中毒","s":["1675","1791"]},{"w":"inviting","d":"诱人的；引人注目的","f":"adj. 诱人的；引人注目的","s":["1791"]},{"w":"loath","d":"不情愿的；不愿意的","f":"adj. 不情愿的；不愿意的","s":["1791"]},{"w":"loathe","d":"厌恶；憎恶","f":"v. 厌恶；憎恶","s":["1791"]},{"w":"lottery","d":"彩票；碰运气的事","f":"n. 彩票；碰运气的事","s":["1791"]},{"w":"lure","d":"诱惑","f":"v. 诱惑","s":["1791"]},{"w":"matchstick","d":"火柴杆","f":"火柴杆","s":["1925"]},{"w":"neurotran const mainEl = document.getElementById('main');
const searchInput = document.getElementById('searchInput');
const statsEl = document.getElementById('stats');

let collapsed = {};
let hardWords = new Set();
let showHardOnly = false;
const HARD_KEY = 'merged_hard_words';

function loadHard() {
  try { hardWords = new Set(JSON.parse(localStorage.getItem(HARD_KEY) || '[]')); } catch(e) { hardWords = new Set(); }
}
function saveHard() {
  try { localStorage.setItem(HARD_KEY, JSON.stringify([...hardWords])); } catch(e) {}
}
function toggleHard(word, e) {
  e.stopPropagation();
  if (hardWords.has(word)) hardWords.delete(word); else hardWords.add(word);
  saveHard();
  render(searchInput.value);
}
loadHard();

// ─── Cloud Sync via GitHub Gist ───
const GIST_KEY = 'merged_gist_sync';
const GIST_DESC = 'TOEFL-vocab-hard-words-sync';
let gistToken = '', gistId = '';

function gistLoadCreds() {
  try {
    const s = JSON.parse(localStorage.getItem(GIST_KEY) || '{}');
    gistToken = s.token || '';
    gistId = s.gistId || '';
  } catch(e) {}
}
function gistSaveCreds() {
  try { localStorage.setItem(GIST_KEY, JSON.stringify({ token: gistToken, gistId })); } catch(e) {}
}

function syncMsg(text, cls) {
  const el = document.getElementById('syncMsg');
  el.className = 'sync-status ' + (cls || 'info');
  el.textContent = text;
}

function syncOpen() {
  document.getElementById('syncModal').classList.add('open');
  const inp = document.getElementById('syncToken');
  inp.value = gistToken;
  document.getElementById('syncMsg').textContent = '';
  if (gistToken && gistId) syncMsg('已连接 · Gist ID: ' + gistId.slice(0,8) + '...', 'ok');
}
function syncClose() {
  document.getElementById('syncModal').classList.remove('open');
}

async function gistFetch(url, opts) {
  const res = await fetch(url, {
    ...opts,
    headers: { 'Authorization': 'token ' + gistToken, 'Accept': 'application/vnd.github.v3+json', ...(opts?.headers || {}) },
  });
  if (!res.ok) throw new Error(res.status + ' ' + (await res.text()).slice(0,100));
  return res.json();
}

async function gistFindExisting() {
  const gists = await gistFetch('https://api.github.com/gists?per_page=100');
  return gists.find(g => g.description === GIST_DESC);
}

async function gistCreate() {
  return gistFetch('https://api.github.com/gists', {
    method: 'POST',
    headers: { 'Content-Type': 'application/json' },
    body: JSON.stringify({
      description: GIST_DESC,
      public: false,
      files: { 'hard-words.json': { content: JSON.stringify([...hardWords]) } }
    })
  });
}

async function gistPush() {
  if (!gistToken || !gistId) return;
  try {
    await gistFetch('https://api.github.com/gists/' + gistId, {
      method: 'PATCH',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ files: { 'hard-words.json': { content: JSON.stringify([...hardWords]) } } })
    });
  } catch(e) { console.warn('Gist push failed:', e); }
}

async function gistPull() {
  if (!gistToken || !gistId) return;
  try {
    const g = await gistFetch('https://api.github.com/gists/' + gistId);
    const content = g.files['hard-words.json']?.content;
    if (content) {
      const arr = JSON.parse(content);
      if (Array.isArray(arr)) {
        arr.forEach(w => { if (typeof w === 'string') hardWords.add(w); });
        saveHard();
      }
    }
  } catch(e) { console.warn('Gist pull failed:', e); }
}

async function syncLogin() {
  const inp = document.getElementById('syncToken');
  const token = inp.value.trim();
  if (!token) { syncMsg('请先粘贴 Token', 'err'); return; }
  gistToken = token;
  syncMsg('连接中...', 'info');
  try {
    // Verify token
    await gistFetch('https://api.github.com/user');
    // Find existing Gist
    const existing = await gistFindExisting();
    if (existing) {
      gistId = existing.id;
      gistSaveCreds();
      syncMsg('已找到已有同步 Gist，正在拉取...', 'info');
      await gistPull();
      render(searchInput.value);
      syncMsg('✅ 同步成功！已合并 ' + hardWords.size + ' 个难词', 'ok');
    } else {
      syncMsg('创建同步 Gist...', 'info');
      const g = await gistCreate();
      gistId = g.id;
      gistSaveCreds();
      syncMsg('✅ 已连接！' + hardWords.size + ' 个难词已上传', 'ok');
    }
  } catch(e) {
    gistToken = ''; gistId = '';
    syncMsg('❌ 连接失败: ' + e.message, 'err');
  }
}

async function syncNow() {
  if (!gistToken || !gistId) { syncMsg('请先连接', 'err'); return; }
  syncMsg('同步中...', 'info');
  try {
    await gistPull();
    await gistPush();
    render(searchInput.value);
    syncMsg('✅ 同步完成！共 ' + hardWords.size + ' 个难词', 'ok');
  } catch(e) {
    syncMsg('❌ 同步失败: ' + e.message, 'err');
  }
}

function syncLogout() {
  gistToken = ''; gistId = '';
  localStorage.removeItem(GIST_KEY);
  document.getElementById('syncToken').value = '';
  syncMsg('已退出', 'info');
}

// Auto-push on hard word changes
const _origSaveHard = saveHard;
saveHard = function() {
  _origSaveHard();
  if (gistToken && gistId) {
    clearTimeout(saveHard._t);
    saveHard._t = setTimeout(gistPush, 2000);
  }
};

// Auto-pull on page load
gistLoadCreds();
if (gistToken && gistId) {
  gistPull().then(() => render(searchInput.value)).catch(() => {});
}

let audioEl = null;
let audioRequestId = 0;
function ttsUrls(word) {
  const w = encodeURIComponent(word);
  // Use one fixed source/voice. Falling back to type=1 or Google can make
  // consecutive clicks sound different (US/UK or different TTS voices).
  return ["https://dict.youdao.com/dictvoice?audio=" + w + "&type=2"];
}
function stopAudio() {
  audioRequestId++;
  if (audioEl) {
    audioEl.onerror = null; audioEl.onended = null;
    try { audioEl.pause(); audioEl.currentTime = 0; } catch(e) {}
    audioEl = null;
  }
}
function speak(word) {
  const clean = word.replace(/['']/g, "'");
  stopAudio();
  if (!clean) return;
  const requestId = audioRequestId;
  const urls = ttsUrls(clean);
  const audio = new Audio(urls[0]);
  audioEl = audio;
  audio.onerror = () => { if (requestId === audioRequestId) audioEl = null; };
  audio.onended = () => { if (requestId === audioRequestId) audioEl = null; };
  audio.play().catch(() => { if (requestId === audioRequestId) audioEl = null; });
}

function escHtml(s) {
  return s.replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;');
}

function highlight(text, q) {
  if (!q) return escHtml(text);
  const esc = q.replace(/[.*+?^${}()|[\]\\]/g, '\\$&');
  return escHtml(text).replace(new RegExp('(' + esc + ')', 'gi'), '<mark>$1</mark>');
}

function render(query) {
  const q = (query || '').trim().toLowerCase();
  let html = '';
  let totalShown = 0;
  const hardCnt = hardWords.size;

  // Filter bar
  html += '<div class="filter-bar">';
  html += `<button class="filter-btn${showHardOnly ? ' active' : ''}" onclick="showHardOnly=!showHardOnly;render(searchInput.value)">⭐ 仅看难词</button>`;
  html += `<span class="hard-count">已标记 ${hardCnt} 个难词</span>`;
  html += `<button class="filter-btn" onclick="syncOpen()">☁️ 云同步</button>`;
  if (hardCnt > 0) {
    html += `<button class="filter-btn" onclick="if(confirm('确定清空所有难词标记？')){hardWords.clear();saveHard();showHardOnly=false;render(searchInput.value)}">清空标记</button>`;
  }
  html += '</div>';

  // Topic nav
  html += '<div class="topic-nav">';
  DATA.forEach((t, i) => {
    let filtered = t.words;
    if (q) filtered = filtered.filter(w => w.w.includes(q) || w.d.includes(q) || w.f.toLowerCase().includes(q));
    if (showHardOnly) filtered = filtered.filter(w => hardWords.has(w.w));
    if (filtered.length > 0) {
      html += `<a class="topic-chip" href="#sec${i}">${t.emoji} ${t.name.split(' ')[0]}<span class="cnt">${filtered.length}</span></a>`;
    }
  });
  html += '</div>';

  DATA.forEach((t, ti) => {
    let items = t.words;
    if (q) items = items.filter(w => w.w.includes(q) || w.d.includes(q) || w.f.toLowerCase().includes(q));
    if (showHardOnly) items = items.filter(w => hardWords.has(w.w));
    if (items.length === 0) return;
    totalShown += items.length;

    const isCollapsed = collapsed[ti] && !q;
    html += `<div class="section" id="sec${ti}">`;
    html += `<div class="sec-head">`;
    html += `<span class="sec-emoji">${t.emoji}</span>`;
    html += `<span class="sec-title">${escHtml(t.name)}</span>`;
    html += `<span class="sec-cnt">${items.length} 词</span>`;
    html += `<button class="sec-toggle" onclick="toggleSec(${ti})">${isCollapsed ? '展开' : '折叠'}</button>`;
    html += `</div>`;

    if (!isCollapsed) {
      html += '<div class="wlist">';
      items.forEach(w => {
        const srcBadge = w.s.join('+');
        const isHard = hardWords.has(w.w);
        const gIdx = WORD_IDX[w.w];
        html += `<div class="witem${isHard ? ' is-hard' : ''}" onclick="this.classList.toggle('expanded')">`;
        html += `<div class="ww"><span class="widx">${gIdx + 1}</span>${highlight(w.w, q)}<button class="spk-btn" onclick="event.stopPropagation();speak('${w.w}')" title="发音">🔊</button><button class="mark-btn${isHard ? ' marked' : ''}" onclick="toggleHard('${w.w}',event)" title="${isHard ? '取消标记' : '标记为难词'}">⭐</button></div>`;
        html += `<div class="wd">${highlight(w.d, q)}</div>`;
        html += `<div class="wsrc">${srcBadge}</div>`;
        if (w.f) {
          html += `<div class="full">${highlight(w.f, q)}</div>`;
        }
        html += '</div>';
      });
      html += '</div>';
    }
    html += '</div>';
  });

  if (totalShown === 0) {
    html += `<div class="empty">${showHardOnly ? '还没有标记难词，点击单词旁 ⭐ 标记' : '未找到匹配的单词'}</div>`;
  }

  mainEl.innerHTML = html;
  statsEl.textContent = q
    ? `找到 ${totalShown} 个词汇`
    : showHardOnly
      ? `⭐ ${totalShown} 个难词`
      : `4476 个词汇 · 45 个学科`;
}

function toggleSec(idx) {
  collapsed[idx] = !collapsed[idx];
  render(searchInput.value);
}

let debounceTimer;
searchInput.addEventListener('input', () => {
  clearTimeout(debounceTimer);
  debounceTimer = setTimeout(() => render(searchInput.value), 200);
});

// ─── Build indexes ───
const ALL_WORDS = [];
const WORD_TOPIC = {};
const WORD_IDX = {};
DATA.forEach(t => t.words.forEach(w => {
  WORD_IDX[w.w] = ALL_WORDS.length;
  ALL_WORDS.push(w);
  WORD_TOPIC[w.w] = t.emoji + ' ' + t.name.split(' ')[0];
}));

render('');

// ─── Auto-play ───

let abPlaying = false, abIdx = 0, abToken = 0, abHardOnly = false;
function abGetList() { return abHardOnly ? ALL_WORDS.filter(w => hardWords.has(w.w)) : ALL_WORDS; }
let abWake = null, abTimer = null;
const abBar = document.getElementById('autobar');
const abToggleBtn = document.getElementById('abToggle');
const abPlayBtn = document.getElementById('abPlayBtn');
const abWordEl = document.getElementById('abWord');
const abPosEl = document.getElementById('abPos');
const abDefEl = document.getElementById('abDef');
const abStartInput = document.getElementById('abStart');
const abGapSel = document.getElementById('abGap');

// Load saved position
const AB_KEY = 'merged_autoplay';
function abLoad() {
  try {
    const s = JSON.parse(localStorage.getItem(AB_KEY) || '{}');
    if (s.idx >= 0 && s.idx < ALL_WORDS.length) abIdx = s.idx;
    if (s.gap) abGapSel.value = String(s.gap);
  } catch(e) {}
}
function abSave() {
  try {
    localStorage.setItem(AB_KEY, JSON.stringify({ idx: abIdx, gap: parseInt(abGapSel.value) }));
  } catch(e) {}
}

function speakAsync(word) {
  return new Promise(resolve => {
    const clean = word.replace(/['']/g, "'");
    if (!clean) { resolve(); return; }
    stopAudio();
    const requestId = audioRequestId;
    const audio = new Audio(ttsUrls(clean)[0]);
    audioEl = audio;
    const finish = () => {
      if (requestId === audioRequestId) audioEl = null;
      resolve();
    };
    audio.onended = finish;
    audio.onerror = finish;
    audio.play().catch(finish);
  });
}

function sleepCancelable(ms) {
  return new Promise(resolve => {
    abWake = resolve;
    abTimer = setTimeout(resolve, ms);
  });
}

function abUpdateUI() {
  const list = abGetList();
  const w = list[abIdx];
  abPlayBtn.textContent = abPlaying ? '⏸ 暂停' : '▶ 连播';
  abToggleBtn.textContent = abPlaying ? '⏸' : '▶';
  abWordEl.textContent = w ? w.w : '—';
  abDefEl.textContent = w ? (w.d || w.f || '') : '';
  abPosEl.textContent = list.length ? (abIdx + 1) + '/' + list.length : '0/0';
  abStartInput.value = list.length ? abIdx + 1 : 0;
  document.getElementById('abHardOnly').classList.toggle('active', abHardOnly);

  // Highlight current word in list
  document.querySelectorAll('.witem.playing').forEach(el => el.classList.remove('playing'));
  if (w) {
    const items = document.querySelectorAll('.witem');
    items.forEach(el => {
      const ww = el.querySelector('.ww');
      if (ww && ww.textContent.replace(/🔊|⭐/g,'').trim() === w.w) {
        el.classList.add('playing');
      }
    });
  }
}

async function abLoop() {
  const token = ++abToken;
  while (abPlaying && token === abToken) {
    const list = abGetList();
    if (!list.length) { abStop(); return; }
    if (abIdx >= list.length) {
      abIdx = 0; abSave(); abStop();
      return;
    }
    abUpdateUI();
    const playing = document.querySelector('.witem.playing');
    if (playing) playing.scrollIntoView({ behavior: 'smooth', block: 'center' });

    await speakAsync(list[abIdx].w);
    if (!abPlaying || token !== abToken) return;

    const gap = parseInt(abGapSel.value, 10) || 0;
    if (gap) {
      await sleepCancelable(gap);
      if (!abPlaying || token !== abToken) return;
    }

    abIdx++; abSave(); abUpdateUI();
    if (abIdx >= abGetList().length) continue;
  }
}

function abStart() {
  if (abPlaying) return;
  const list = abGetList();
  if (!list.length) { return; }
  if (abIdx >= list.length) abIdx = 0;
  abPlaying = true;
  abUpdateUI();
  abLoop();
}

function abStop() {
  abPlaying = false;
  abToken++;
  if (abTimer) { clearTimeout(abTimer); abTimer = null; }
  if (abWake) { const w = abWake; abWake = null; w(); }
  if (audioEl) { try { audioEl.pause(); } catch(e) {} audioEl.onended = null; audioEl.onerror = null; }
  abUpdateUI();
}

// Toggle bar visibility
abToggleBtn.onclick = () => {
  const show = abBar.classList.contains('hidden');
  abBar.classList.toggle('hidden', !show);
  document.body.classList.toggle('autobar-open', show);
  abToggleBtn.style.display = show ? 'none' : '';
  if (show) abUpdateUI();
};

abPlayBtn.onclick = () => { abPlaying ? abStop() : abStart(); };

document.getElementById('abClose').onclick = () => {
  abStop();
  abBar.classList.add('hidden');
  document.body.classList.remove('autobar-open');
  abToggleBtn.style.display = '';
};

document.getElementById('abPrev').onclick = () => {
  if (abIdx > 0) { abIdx--; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

document.getElementById('abNext').onclick = () => {
  const list = abGetList();
  if (abIdx < list.length - 1) { abIdx++; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

abStartInput.onchange = () => {
  const list = abGetList();
  const v = parseInt(abStartInput.value, 10);
  if (v >= 1 && v <= list.length) {
    abIdx = v - 1; abSave();
    if (abPlaying) { abStop(); abStart(); }
    else abUpdateUI();
  }
};

abGapSel.onchange = () => { abSave(); };

document.getElementById('abHardOnly').onclick = () => {
  abHardOnly = !abHardOnly;
  abIdx = 0; abSave();
  if (abPlaying) { abStop(); abStart(); }
  else abUpdateUI();
};

// Click a word's speaker button to set autoplay position
mainEl.addEventListener('click', (e) => {
  const btn = e.target.closest('.spk-btn');
  if (!btn) return;
  const word = btn.getAttribute('onclick')?.match(/speak\('([^']+)'\)/)?.[1];
  if (!word) return;
  const list = abGetList();
  const idx = list.findIndex(w => w.w === word);
  if (idx >= 0) {
    abIdx = idx; abSave(); abUpdateUI();
  }
});

abLoad();
abUpdateUI();

// ─── Focus mode ───
let focusOpen = false;
const focusOverlay = document.getElementById('focusOverlay');
const focusWordEl = document.getElementById('focusWord');
const focusDefEl = document.getElementById('focusDef');
const focusFullEl = document.getElementById('focusFull');
const focusPosEl = document.getElementById('focusPos');
const focusMarkEl = document.getElementById('focusMark');
const focusPlayBtn = document.getElementById('focusPlayBtn');

function focusUpdateUI(keepRevealed) {
  const list = abGetList();
  const w = list[abIdx];
  focusWordEl.textContent = w ? w.w : '—';
  focusDefEl.textContent = w ? (w.d || '') : '';
  focusFullEl.textContent = w ? (w.f && w.f !== w.d ? w.f : '') : '';
  focusPosEl.textContent = list.length ? (abIdx + 1) + ' / ' + list.length : '';
  document.getElementById('focusTopic').textContent = w ? (WORD_TOPIC[w.w] || '') : '';
  focusMarkEl.classList.toggle('marked', w ? hardWords.has(w.w) : false);
  focusPlayBtn.textContent = abPlaying ? '⏸ 暂停' : '▶ 连播';
  document.getElementById('focusHardBtn').classList.toggle('active', abHardOnly);
  if (!keepRevealed) {
    focusOverlay.classList.remove('revealed');
    document.getElementById('focusHint').style.display = '';
  }
}

function focusEnter() {
  focusOpen = true;
  focusOverlay.classList.add('open');
  document.querySelector('header').style.display = 'none';
  mainEl.style.display = 'none';
  document.querySelector('.foot').style.display = 'none';
  abBar.style.display = 'none';
  abToggleBtn.style.display = 'none';
  focusUpdateUI();
}

function focusClose() {
  focusOpen = false;
  focusOverlay.classList.remove('open');
  document.querySelector('header').style.display = '';
  mainEl.style.display = '';
  document.querySelector('.foot').style.display = '';
  abBar.style.display = '';
  abBar.classList.remove('hidden');
  document.body.classList.add('autobar-open');
  abUpdateUI();
}

function focusSpeak() {
  const list = abGetList();
  const w = list[abIdx];
  if (w) speak(w.w);
}

function focusPrev() {
  if (abIdx > 0) { abIdx--; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

function focusNext() {
  const list = abGetList();
  if (abIdx < list.length - 1) { abIdx++; abSave(); }
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

function focusTogglePlay() {
  abPlaying ? abStop() : abStart();
  focusUpdateUI();
}

focusMarkEl.onclick = () => {
  const list = abGetList();
  const w = list[abIdx];
  if (w) {
    if (hardWords.has(w.w)) hardWords.delete(w.w); else hardWords.add(w.w);
    saveHard();
    focusUpdateUI();
  }
};

document.getElementById('abFocusBtn').onclick = () => { focusEnter(); };

// Reveal only on a genuine click. A drag is reserved for selecting/copying text.
const focusRevealArea = document.getElementById('focusRevealArea');
let focusPointerDown = null;
focusRevealArea.addEventListener('pointerdown', (e) => {
  focusPointerDown = { x: e.clientX, y: e.clientY };
});
focusRevealArea.addEventListener('click', (e) => {
  const selection = window.getSelection();
  const moved = focusPointerDown && Math.hypot(e.clientX - focusPointerDown.x, e.clientY - focusPointerDown.y) > 6;
  focusPointerDown = null;
  if (moved || (selection && !selection.isCollapsed)) return;
  const revealed = focusOverlay.classList.toggle('revealed');
  document.getElementById('focusHint').style.display = revealed ? 'none' : '';
});

function focusToggleHard() {
  abHardOnly = !abHardOnly;
  abIdx = 0; abSave();
  document.getElementById('focusHardBtn').classList.toggle('active', abHardOnly);
  document.getElementById('abHardOnly').classList.toggle('active', abHardOnly);
  if (abPlaying) { abStop(); abStart(); }
  focusUpdateUI();
}

// Update focus UI when autoplay advances
const _origAbUpdateUI = abUpdateUI;
abUpdateUI = function() {
  _origAbUpdateUI();
  if (focusOpen) focusUpdateUI();
};

// Keyboard shortcuts in focus mode
document.addEventListener('keydown', (e) => {
  if (!focusOpen) return;
  if (e.key === 'ArrowLeft' || e.key === 'ArrowUp') { e.preventDefault(); focusPrev(); }
  else if (e.key === 'ArrowRight' || e.key === 'ArrowDown') { e.preventDefault(); focusNext(); }
  else if (e.key === ' ') { e.preventDefault(); focusTogglePlay(); }
  else if (e.key === 's' || e.key === 'S') { e.preventDefault(); focusSpeak(); }
  else if (e.key === 'Enter' || e.key === 'r' || e.key === 'R') {
    e.preventDefault();
    const revealed = focusOverlay.classList.toggle('revealed');
    document.getElementById('focusHint').style.display = revealed ? 'none' : '';
  }
  else if (e.key === 'Escape') { focusClose(); }
});
</script>
</body>

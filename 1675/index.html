function esc(s){ return String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c])); }
function hi(text, q){
  if(!q) return esc(text);
  const idx = text.toLowerCase().indexOf(q.toLowerCase());
  if(idx < 0) return esc(text);
  return esc(text.slice(0,idx)) + "<mark>" + esc(text.slice(idx,idx+q.length)) + "</mark>" + esc(text.slice(idx+q.length));
}

// 发音：优先有道词典美音，失败自动降级到 Google 合成语音
function playWord(word, btn){
  const clean = word.replace(/'/g, "").replace(/^[^A-Za-z]+/, "").replace(/[^A-Za-z-].*$/, "");
  if(!clean){ toast("无法播放：" + word); return; }
  const url = "https://dict.youdao.com/dictvoice?audio=" + encodeURIComponent(clean) + "&type=2";
  if(audioEl){
    audioEl.onerror = null; audioEl.onended = null;
    audioEl.pause();
  } else {
    audioEl = new Audio();
  }
  let fallback = false;
  audioEl.onerror = () => {
    if(fallback) return;
    fallback = true;
    audioEl.src = "https://translate.google.com/translate_tts?ie=UTF-8&tl=en&client=tw-ob&q=" + encodeURIComponent(clean);
    audioEl.play().catch(() => {});
  };
  audioEl.onended = () => {
    if(btn){ btn.classList.remove("playing"); }
  };
  audioEl.src = url;
  if(btn) btn.classList.add("playing");
  audioEl.play().catch(() => {
    if(btn) btn.classList.remove("playing");
    if(!fallback){ audioEl.onerror && audioEl.onerror(); }
  });
}

function filtered(){
  if(!query) return WORDS;
  const q = query.toLowerCase();
  return WORDS.filter(([w,m]) => w.toLowerCase().includes(q) || m.toLowerCase().includes(q));
}

function render(){
  const arr = filtered();
  const tp = Math.max(1, Math.ceil(arr.length / perPage));
  if(page > tp) page = tp;
  if(page < 1) page = 1;
  totalPagesEl.textContent = tp;
  $("jump").value = page;
  const start = (page-1)*perPage;
  const slice = arr.slice(start, start+perPage);
  if(slice.length === 0){
    list.innerHTML = '<div class="empty">没有匹配的单词</div>';
  } else {
    list.innerHTML = slice.map(([w,m], i) => {
      const idx = start + i + 1;
      return '<div class="item"><div class="w">'+ idx +'. '+ hi(w, query) +
             '<button class="wbtn" type="button" data-word="' + esc(w) + '" title="播放发音" aria-label="播放 ' + esc(w) + '">' + SPEAKER_SVG + '</button></div>' +
             '<div class="m">'+ hi(m, query) +'</div></div>';
    }).join("");
  }
  pageInfo.textContent = page + ' / ' + tp + ' (共 ' + arr.length + ' 词)';
  $("prevBtn").disabled = page <= 1;
  $("nextBtn").disabled = page >= tp;
  if(!query){
    try {
      localStorage.setItem("wb:start", String(start));
      localStorage.setItem("wb:perPage", String(perPage));
    } catch(e){}
  }
}

function toast(msg){ const t=$("toast"); t.textContent=msg; t.classList.add("show"); setTimeout(()=>t.classList.remove("show"), 1600); }

$("prevBtn").onclick = () => { if(page>1){ page--; render(); window.scrollTo(0,0);} };
$("nextBtn").onclick = () => { const tp=Math.ceil(filtered().length/perPage); if(page<tp){ page++; render(); window.scrollTo(0,0);} };
$("goBtn").onclick = () => {
  const v = parseInt($("jump").value, 10);
  const tp = Math.ceil(filtered().length/perPage);
  if(isNaN(v) || v<1 || v>tp){ toast("页码超出范围"); return; }
  page = v; render(); window.scrollTo(0,0);
};
$("jump").addEventListener("keydown", e => { if(e.key==="Enter") $("goBtn").click(); });
$("perPage").onchange = e => { perPage = parseInt(e.target.value,10); page=1; render(); };
$("search").oninput = e => { query = e.target.value.trim(); page=1; render(); };

  const f = e.target.files[0];
  if(!f) return;
  const r = new FileReader();
  r.onload = () => {
    try {
      const text = r.result;
      const lines = text.split(/\r?\n/);
      const parsed = [];
      for(let raw of lines){
        const line = raw.replace(/\s+$/,"");
        if(!line.trim()) continue;
        let parts = line.split("\t");
        if(parts.length < 2){
          const m2 = line.match(/^(\S.*?)\s{2,}(.*)$/);
          parts = m2 ? [m2[1], m2[2]] : [line, ""];
        }
        const w = parts[0].trim();
        const m = (parts[1]||"").trim();
        if(w) parsed.push([w, m]);
      }
      if(parsed.length === 0){ toast("未解析到单词"); return; }
      WORDS = parsed; page=1; query=""; $("search").value="";
      render(); toast("已导入 " + parsed.length + " 个单词");
    } catch(err){ toast("导入失败"); }
  };
  r.readAsText(f, "utf-8");
  e.target.value = "";
};

// keyboard nav
document.addEventListener("keydown", e => {
  if(e.target.tagName === "INPUT") return;
  if(e.key === "ArrowLeft") $("prevBtn").click();
  else if(e.key === "ArrowRight") $("nextBtn").click();
});

try {
  const savedPerPage = parseInt(localStorage.getItem("wb:perPage"), 10);
  if(!isNaN(savedPerPage) && [10,20,30,50,100].includes(savedPerPage)){
    perPage = savedPerPage;
    $("perPage").value = String(savedPerPage);
  }
  const savedStart = parseInt(localStorage.getItem("wb:start"), 10);
  if(!isNaN(savedStart) && savedStart >= 0){
    page = Math.floor(savedStart / perPage) + 1;
  }
  render();
}
catch(err){
  document.getElementById("list").innerHTML =
    '<div class="empty">加载出错：' + (err && err.message ? err.message : err) +
    '<br>请重新下载最新版 HTML。</div>';
}
</script>
</body>
</html>

<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<meta name="theme-color" content="#0f1115">
<title>TOEFL 单词本</title>
<style>
  :root {
    --bg: #0f1115; --card: #1a1d24; --card2: #22262f; --fg: #e6e8eb;
    --muted: #8b93a1; --accent: #4c8dff; --accent2: #2a5fc0; --border: #2a2f3a;
  }
  @media (prefers-color-scheme: light) {
    :root { --bg:#f4f6fa; --card:#ffffff; --card2:#eef1f6; --fg:#1a1d24; --muted:#5f6672; --accent:#2a5fc0; --accent2:#1c4499; --border:#dde2eb; }
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html,body { margin:0; padding:0; }
  body {
    background: var(--bg); color: var(--fg);
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
    min-height: 100vh; min-height: 100dvh;
    padding-bottom: env(safe-area-inset-bottom);
  }
  .wrap { max-width: 560px; margin: 0 auto; padding: 48px 20px 32px; }
  .hero { text-align: center; margin-bottom: 36px; }
  .hero h1 { font-size: 26px; font-weight: 800; margin: 0 0 8px; }
  .hero p { margin: 0; color: var(--muted); font-size: 14px; }
  .cards { display: flex; flex-direction: column; gap: 16px; }
  .card {
    display: flex; align-items: center; gap: 16px;
    background: var(--card); border: 1px solid var(--border);
    border-radius: 16px; padding: 20px;
    text-decoration: none; color: inherit;
    transition: border-color .15s ease, transform .15s ease;
  }
  .card:hover { border-color: var(--accent); transform: translateY(-2px); }
  .card:active { transform: scale(.98); }
  .badge {
    flex: 0 0 auto; width: 56px; height: 56px; border-radius: 14px;
    display: flex; align-items: center; justify-content: center;
    font-size: 28px;
  }
  .badge.b1791 { background: rgba(76,141,255,.16); }
  .badge.b1675 { background: rgba(52,199,123,.16); }
  .card .body { flex: 1 1 auto; min-width: 0; }
  .card .name { font-size: 18px; font-weight: 700; }
  .card .desc { font-size: 13px; color: var(--muted); margin-top: 4px; line-height: 1.5; }
  .card .go { flex: 0 0 auto; font-size: 16px; color: var(--muted); }
  .foot { text-align: center; margin-top: 40px; color: var(--muted); font-size: 12px; }
</style>
</head>
<body>
<div class="wrap">
  <div class="hero">
    <h1>📚 TOEFL 单词本</h1>
    <p>点击卡片进入对应单词表 · 单词旁 🔊 可听发音</p>
  </div>
  <div class="cards">
    <a class="card" id="c1791" href="https://kimrasak.github.io/toefl-vocab/">
      <div class="badge b1791">📘</div>
      <div class="body">
        <div class="name">1791 词版</div>
        <div class="desc">带发音 · 原词表</div>
      </div>
      <div class="go">→</div>
    </a>
    <a class="card" id="c1675" href="https://kimrasak.github.io/toefl-vocab/1675/">
      <div class="badge b1675">📗</div>
      <div class="body">
        <div class="name">1675 词版</div>
        <div class="desc">带发音 · 原词表</div>
      </div>
      <div class="go">→</div>
    </a>
  </div>
  <div class="foot">点击单词旁喇叭按钮即可播放美式发音</div>
</div>
</body>
</html>
